name: Reuse verified public Python dependencies
description: Cache pinned public packages independently of private data and models.
inputs:
  enabled:
    description: Prepare dependencies unless this is a dependency-free readback.
    default: 'true'
  profile:
    description: runtime or parser; both retain the existing exact package pins.
    default: runtime
  prewarm-base-key:
    description: Optional exact same-day encrypted base; preparation never authorizes inference.
    default: ''
  checkpoint-key:
    description: Exact future critical checkpoint that must independently authenticate later.
    default: ''
  encryption-secret:
    description: Existing state passphrase, scoped to authenticated base preparation.
    default: ''
outputs:
  prewarm-base-key:
    description: Exact base key only after complete authenticated restoration.
    value: ${{ steps.prepared-base.outputs.base_key }}
runs:
  using: composite
  steps:
    - name: Locate the immutable public helpers
      shell: bash
      run: echo "G11_PUBLIC_RUNTIME_HELPERS=${GITHUB_ACTION_PATH}/../../../scripts" >> "${GITHUB_ENV}"
    - name: Bind packages to the exact runner and interpreter
      if: inputs.enabled == 'true'
      id: identity
      shell: bash
      env:
        G11_PUBLIC_PROFILE: ${{ inputs.profile }}
      run: python3 "${G11_PUBLIC_RUNTIME_HELPERS}/public_python_runtime_v1.py" identity --profile "${G11_PUBLIC_PROFILE}"
    - name: Restore only the exact public environment
      if: inputs.enabled == 'true'
      id: restored
      continue-on-error: true
      uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
      with:
        path: ${{ steps.identity.outputs.path }}
        key: ${{ steps.identity.outputs.key }}
    - name: Validate the optional exact preparation identity
      if: inputs.prewarm-base-key != ''
      shell: bash
      env:
        PREWARM_BASE_KEY: ${{ inputs.prewarm-base-key }}
        CHECKPOINT_KEY: ${{ inputs.checkpoint-key }}
      run: |
        python3 - <<'PY'
        import os,sys
        sys.path.insert(0,os.environ['G11_PUBLIC_RUNTIME_HELPERS'])
        from encrypt_runtime_state_v1 import prewarm_identity
        prewarm_identity(os.environ['PREWARM_BASE_KEY'],os.environ['CHECKPOINT_KEY'])
        PY
    - name: Restore only the exact optional encrypted preparation base
      if: inputs.prewarm-base-key != ''
      id: prewarm-cache
      uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
      with:
        path: .relay-cache/state.tgz.gpg
        key: ${{ inputs.prewarm-base-key }}
    - name: Authenticate and completely restore the preparation base
      if: inputs.prewarm-base-key != '' && steps.prewarm-cache.outputs.cache-hit == 'true'
      id: prepared-base
      shell: bash
      env:
        PREWARM_BASE_KEY: ${{ inputs.prewarm-base-key }}
        CHECKPOINT_KEY: ${{ inputs.checkpoint-key }}
        STATE_PASSPHRASE: ${{ inputs.encryption-secret }}
      run: |
        python3 - <<'PY'
        import os,sys
        sys.path.insert(0,os.environ['G11_PUBLIC_RUNTIME_HELPERS'])
        from encrypt_runtime_state_v1 import prepare_warm_base
        key=prepare_warm_base(os.environ['PREWARM_BASE_KEY'],os.environ['CHECKPOINT_KEY'],
            secret=(os.environ['STATE_PASSPHRASE']+'\n').encode(),folder=os.environ['RUNNER_TEMP'],
            cipher='.relay-cache/state.tgz.gpg')
        with open(os.environ['GITHUB_OUTPUT'],'a') as output:output.write('base_key='+key+'\n')
        PY
    - name: Validate or rebuild pinned packages
      if: inputs.enabled == 'true'
      shell: bash
      env:
        G11_PUBLIC_PROFILE: ${{ inputs.profile }}
      run: python3 "${G11_PUBLIC_RUNTIME_HELPERS}/public_python_runtime_v1.py" prepare --profile "${G11_PUBLIC_PROFILE}"
    - name: Save public dependencies before private code runs
      if: inputs.enabled == 'true' && steps.restored.outputs.cache-hit != 'true'
      continue-on-error: true
      uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830
      with:
        path: ${{ steps.identity.outputs.path }}
        key: ${{ steps.identity.outputs.key }}
