name: Reuse verified public Python dependencies
description: Cache pinned public packages independently of private data and models.
inputs:
  enabled:
    description: Prepare dependencies unless this is a dependency-free readback.
    default: 'true'
  profile:
    description: runtime or parser; both retain the existing exact package pins.
    default: runtime
runs:
  using: composite
  steps:
    - name: Locate the immutable public helpers
      shell: bash
      run: echo "G11_PUBLIC_RUNTIME_HELPERS=${GITHUB_ACTION_PATH}/../../../scripts" >> "${GITHUB_ENV}"
    - name: Bind packages to the exact runner and interpreter
      if: inputs.enabled == 'true'
      id: identity
      shell: bash
      env:
        G11_PUBLIC_PROFILE: ${{ inputs.profile }}
      run: python3 "${G11_PUBLIC_RUNTIME_HELPERS}/public_python_runtime_v1.py" identity --profile "${G11_PUBLIC_PROFILE}"
    - name: Restore only the exact public environment
      if: inputs.enabled == 'true'
      id: restored
      continue-on-error: true
      uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
      with:
        path: ${{ steps.identity.outputs.path }}
        key: ${{ steps.identity.outputs.key }}
    - name: Validate or rebuild pinned packages
      if: inputs.enabled == 'true'
      shell: bash
      env:
        G11_PUBLIC_PROFILE: ${{ inputs.profile }}
      run: python3 "${G11_PUBLIC_RUNTIME_HELPERS}/public_python_runtime_v1.py" prepare --profile "${G11_PUBLIC_PROFILE}"
    - name: Save public dependencies before private code runs
      if: inputs.enabled == 'true' && steps.restored.outputs.cache-hit != 'true'
      continue-on-error: true
      uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830
      with:
        path: ${{ steps.identity.outputs.path }}
        key: ${{ steps.identity.outputs.key }}
