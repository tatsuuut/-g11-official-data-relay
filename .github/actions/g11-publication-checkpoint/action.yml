name: Verify encrypted publication checkpoint
description: Retain and read back existing encrypted state before exposing its saved LOCKs.
inputs:
  cache-key:
    description: Existing published-state prefix with a unique run and attempt suffix.
    required: true
outputs:
  ready:
    description: True only after an exact cache hit and byte comparison.
    value: ${{ steps.verified.outputs.ready }}
runs:
  using: composite
  steps:
    - name: Record encrypted publication checkpoint digest
      shell: bash
      run: sha256sum .relay-cache/state.tgz.gpg > .relay-output/publication-state.sha256
    - name: Save complete encrypted state before publication
      uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830
      with:
        path: .relay-cache/state.tgz.gpg
        key: ${{ inputs.cache-key }}
    - name: Read back complete encrypted publication checkpoint
      id: readback
      continue-on-error: true
      uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
      with:
        path: .relay-cache/state.tgz.gpg
        key: ${{ inputs.cache-key }}
        fail-on-cache-miss: true
    - name: Wait for exact checkpoint visibility
      if: steps.readback.outputs.cache-hit != 'true'
      shell: bash
      run: sleep 3
    - name: Retry exact encrypted checkpoint readback
      if: steps.readback.outputs.cache-hit != 'true'
      id: readback-retry
      continue-on-error: true
      uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
      with:
        path: .relay-cache/state.tgz.gpg
        key: ${{ inputs.cache-key }}
        fail-on-cache-miss: true
    - name: Wait for final exact checkpoint readback
      if: steps.readback.outputs.cache-hit != 'true' && steps.readback-retry.outputs.cache-hit != 'true'
      shell: bash
      run: sleep 7
    - name: Final exact encrypted checkpoint readback
      if: steps.readback.outputs.cache-hit != 'true' && steps.readback-retry.outputs.cache-hit != 'true'
      id: readback-final
      continue-on-error: true
      uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
      with:
        path: .relay-cache/state.tgz.gpg
        key: ${{ inputs.cache-key }}
        fail-on-cache-miss: true
    - name: Verify encrypted publication checkpoint bytes
      id: verified
      shell: bash
      env:
        CACHE_HIT: ${{ steps.readback.outputs.cache-hit == 'true' || steps.readback-retry.outputs.cache-hit == 'true' || steps.readback-final.outputs.cache-hit == 'true' }}
      run: |
        set -euo pipefail
        test "${CACHE_HIT}" = "true"
        sha256sum -c .relay-output/publication-state.sha256
        echo 'ready=true' >> "${GITHUB_OUTPUT}"
        echo 'G11_PUBLICATION_STATE_READBACK=PASS'
