name: Verify encrypted publication checkpoint
description: Retain and read back existing encrypted state before exposing its saved LOCKs.
inputs:
  cache-key:
    description: Existing published-state prefix with a unique run and attempt suffix.
    required: true
  wild4-day:
    description: Optional current LIVE day; start the independently verifying WILD4 worker after the full save.
    required: false
    default: ""
  warm-day:
    description: Prepare the saved warm continuation feed during its verified full checkpoint transfer.
    required: false
    default: ""
  encrypt-full:
    description: Complete ordinary full encryption after the verified compact dispatch.
    required: false
    default: "false"
  encryption-secret:
    description: Existing checkpoint passphrase, scoped to the encryption step.
    required: false
    default: ""
  prewarm:
    description: Optional sent/attempted preparation dispatch; do not post the same compact handoff twice.
    default: ''
  allow-compact:
    description: Accept a fully verified base and remote delta before the later complete backup.
    default: 'false'
  capture-stage:
    description: Independently saved critical or warm capture target.
    default: 'critical'
outputs:
  ready:
    description: True only after complete remote compact proof or full exact byte readback.
    value: ${{ steps.compact-verified.outputs.ready || steps.verified.outputs.ready }}
  full-ready:
    description: True only after complete full checkpoint exact byte readback.
    value: ${{ steps.verified.outputs.ready }}
  wild4-sent:
    description: True only when the exact-checkpoint WILD4 dispatch was accepted.
    value: ${{ steps.wild4-compact.outputs.sent || steps.wild4-dispatch.outputs.sent || steps.wild4-fallback.outputs.sent }}
  wild4-attempted:
    description: Retain an ambiguous dispatch without immediately posting it twice.
    value: ${{ steps.wild4-compact.outputs.attempted || steps.wild4-dispatch.outputs.attempted || steps.wild4-fallback.outputs.attempted }}
runs:
  using: composite
  steps:
    - name: Identify a complete reconstruction checkpoint
      id: compact
      if: inputs.wild4-day != ''
      shell: bash
      run: python3 scripts/encrypt_runtime_state_v1.py --compact-ready '${{ inputs.cache-key }}' --capture-stage '${{ inputs.capture-stage }}'
    - name: Save authenticated replacements and complete inventories
      id: compact-save
      if: steps.compact.outputs.key != ''
      continue-on-error: true
      uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830
      with:
        path: ${{ inputs.capture-stage == 'warm' && '.relay-output/warm-delta.tgz.gpg' || '.relay-output/early-delta.tgz.gpg' }}
        key: ${{ steps.compact.outputs.key }}
    - name: Read back the exact compact checkpoint
      id: compact-readback
      if: steps.compact-save.outcome == 'success' && steps.compact.outputs.key != ''
      continue-on-error: true
      uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
      with:
        path: ${{ inputs.capture-stage == 'warm' && '.relay-output/warm-delta.tgz.gpg' || '.relay-output/early-delta.tgz.gpg' }}
        key: ${{ steps.compact.outputs.key }}
        fail-on-cache-miss: true
    - name: Start WILD4 from a verified full reconstruction before large backup transfer
      id: wild4-compact
      if: steps.compact-readback.outputs.cache-hit == 'true'
      continue-on-error: true
      shell: bash
      run: >-
        python3 -S scripts/warm_publication_orchestrator_v1.py handoff
        --day '${{ inputs.wild4-day }}' --key '${{ inputs.cache-key }}'
        --capture-stage '${{ inputs.capture-stage }}' --prewarm '${{ inputs.prewarm }}'
    - name: Verify complete compact publication reconstruction
      id: compact-verified
      if: inputs.allow-compact == 'true' && steps.compact-readback.outputs.cache-hit == 'true'
      continue-on-error: true
      shell: bash
      env:
        G11_PRIVATE_REPO_TOKEN: ${{ inputs.encryption-secret }}
      run: >-
        python3 -S scripts/compact_publication_checkpoint_v1.py verify
        --checkpoint-key '${{ inputs.cache-key }}'
        --readback-hit '${{ steps.compact-readback.outputs.cache-hit }}'
        --capture-stage '${{ inputs.capture-stage }}'
    - name: Keep warm failure on the ordinary later full checkpoint path
      if: inputs.capture-stage == 'warm' && steps.compact-verified.outputs.ready != 'true'
      shell: bash
      run: exit 1
    - name: Encrypt the complete state before full backup and canonical publication
      if: inputs.encrypt-full == 'true' && steps.compact-verified.outputs.ready != 'true'
      shell: bash
      env:
        G11_PRIVATE_REPO_TOKEN: ${{ inputs.encryption-secret }}
      run: |
        set -euo pipefail
        jq -e '.CRITICAL.CRITICAL_CHECKPOINT_STATUS == "PASS"' .relay-output/result.json >/dev/null
        exec 3<<<"${G11_PRIVATE_REPO_TOKEN}"
        python3 scripts/encrypt_runtime_state_v1.py --state-root .relay-state --output .relay-cache/state.tgz.gpg
        exec 3<&-
        test -s .relay-cache/state.tgz.gpg
    - name: Record encrypted publication checkpoint digest
      if: steps.compact-verified.outputs.ready != 'true'
      shell: bash
      run: sha256sum .relay-cache/state.tgz.gpg > .relay-output/publication-state.sha256
    - name: Prepare current feed during complete checkpoint transfer
      if: steps.compact-verified.outputs.ready != 'true' && ((inputs.encrypt-full == 'true' && inputs.wild4-day != '') || inputs.warm-day != '')
      shell: bash
      continue-on-error: true
      env:
        PREPARE_DAY: ${{ inputs.wild4-day || inputs.warm-day }}
      run: |
        set -euo pipefail
        if [ -n '${{ inputs.warm-day }}' ]; then
          test "${{ inputs.cache-key }}" = "g11-state-v4-published-${PREPARE_DAY}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-checkpoint"
        else
          test "${{ inputs.cache-key }}" = "g11-state-v4-critical-${PREPARE_DAY}-${GITHUB_RUN_ID}"
        fi
        # The final publisher takes the same lock before falling back, including
        # when a slow preparation is still writing derived projection files.
        env -u GH_TOKEN -u GITHUB_TOKEN -u G11_PRIVATE_REPO_TOKEN -u ACTIONS_ID_TOKEN_REQUEST_TOKEN \
          flock -n .relay-output/critical-prepared.lock timeout -k 2s 30s \
          python3 -S scripts/critical_saved_publication_v1.py --day "${PREPARE_DAY}" --prepare-feed \
          </dev/null >.relay-output/critical-prepared.log 2>&1 &
    - name: Save complete encrypted state before publication
      if: steps.compact-verified.outputs.ready != 'true'
      uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830
      with:
        path: .relay-cache/state.tgz.gpg
        key: ${{ inputs.cache-key }}
    - name: Check exact saved checkpoint visibility without downloading
      id: wild4-visible
      if: steps.compact-verified.outputs.ready != 'true' && inputs.wild4-day != '' && steps.wild4-compact.outputs.attempted != 'true'
      continue-on-error: true
      uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
      with:
        path: .relay-cache/state.tgz.gpg
        key: ${{ inputs.cache-key }}
        lookup-only: true
    - name: Start independently verified WILD4 worker after checkpoint save
      id: wild4-dispatch
      if: inputs.wild4-day != '' && steps.wild4-visible.outputs.cache-hit == 'true' && steps.wild4-compact.outputs.attempted != 'true'
      continue-on-error: true
      shell: bash
      env:
        OPERATIONAL_DATE: ${{ inputs.wild4-day }}
        CHECKPOINT_KEY: ${{ inputs.cache-key }}
        DISPATCH_STAGE: DURING_READBACK
      run: |
        set -euo pipefail
        [[ "${OPERATIONAL_DATE}" =~ ^20[0-9]{2}-[0-9]{2}-[0-9]{2}$ ]]
        [[ "${GITHUB_RUN_ID}" =~ ^[0-9]+$ ]]
        test "${CHECKPOINT_KEY}" = "g11-state-v4-critical-${OPERATIONAL_DATE}-${GITHUB_RUN_ID}"
        sha256sum -c .relay-output/publication-state.sha256
        jq -e '.CRITICAL.CRITICAL_CHECKPOINT_STATUS == "PASS"' .relay-output/result.json >/dev/null
        if ! jq -e '(.CRITICAL.LAST_TIMELY_SOURCE_COUNT > 0 or (if ((.CRITICAL.LAST_TIMELY_ALTERNATE_MARKET_COUNT // 0) | type) == "number" then (.CRITICAL.LAST_TIMELY_ALTERNATE_MARKET_COUNT // 0) > 0 and (.CRITICAL.LAST_TIMELY_ALTERNATE_MARKET_COUNT // 0) == ((.CRITICAL.LAST_TIMELY_ALTERNATE_MARKET_COUNT // 0) | floor) else false end))' .relay-output/result.json >/dev/null; then
          echo 'WILD4_EARLY_HANDOFF=NO_NEW_INPUT'
          exit 0
        fi
        # The child restores this exact key and verifies GPG, the complete store
        # digest, day, run and daily authority before inference. The parent's
        # independent readback gate below still controls canonical publication.
        echo 'attempted=true' >> "${GITHUB_OUTPUT}"
        timeout --signal=TERM --kill-after=2s 12s gh workflow run 364923281 \
          -f mode=wild4 -f operational_date="${OPERATIONAL_DATE}" \
          -f predeadline_checkpoint_key="${CHECKPOINT_KEY}"
        echo 'sent=true' >> "${GITHUB_OUTPUT}"
        echo "WILD4_EARLY_HANDOFF=DISPATCH_ACCEPTED_${DISPATCH_STAGE}"
    - name: Read back complete encrypted publication checkpoint
      id: readback
      if: steps.compact-verified.outputs.ready != 'true'
      continue-on-error: true
      uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
      with:
        path: .relay-cache/state.tgz.gpg
        key: ${{ inputs.cache-key }}
        fail-on-cache-miss: true
    - name: Wait for exact checkpoint visibility
      if: steps.compact-verified.outputs.ready != 'true' && steps.readback.outputs.cache-hit != 'true'
      shell: bash
      run: sleep 3
    - name: Retry exact encrypted checkpoint readback
      if: steps.compact-verified.outputs.ready != 'true' && steps.readback.outputs.cache-hit != 'true'
      id: readback-retry
      continue-on-error: true
      uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
      with:
        path: .relay-cache/state.tgz.gpg
        key: ${{ inputs.cache-key }}
        fail-on-cache-miss: true
    - name: Wait for final exact checkpoint readback
      if: steps.compact-verified.outputs.ready != 'true' && steps.readback.outputs.cache-hit != 'true' && steps.readback-retry.outputs.cache-hit != 'true'
      shell: bash
      run: sleep 7
    - name: Final exact encrypted checkpoint readback
      if: steps.compact-verified.outputs.ready != 'true' && steps.readback.outputs.cache-hit != 'true' && steps.readback-retry.outputs.cache-hit != 'true'
      id: readback-final
      continue-on-error: true
      uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
      with:
        path: .relay-cache/state.tgz.gpg
        key: ${{ inputs.cache-key }}
        fail-on-cache-miss: true
    - name: Verify encrypted publication checkpoint bytes
      id: verified
      if: steps.compact-verified.outputs.ready != 'true'
      shell: bash
      env:
        CACHE_HIT: ${{ steps.readback.outputs.cache-hit == 'true' || steps.readback-retry.outputs.cache-hit == 'true' || steps.readback-final.outputs.cache-hit == 'true' }}
      run: |
        set -euo pipefail
        test "${CACHE_HIT}" = "true"
        sha256sum -c .relay-output/publication-state.sha256
        echo 'ready=true' >> "${GITHUB_OUTPUT}"
        echo 'G11_PUBLICATION_STATE_READBACK=PASS'
    - name: Start WILD4 after verified delayed checkpoint visibility
      id: wild4-fallback
      if: inputs.wild4-day != '' && steps.verified.outputs.ready == 'true' && steps.wild4-visible.outputs.cache-hit != 'true' && steps.wild4-compact.outputs.attempted != 'true'
      continue-on-error: true
      shell: bash
      env:
        OPERATIONAL_DATE: ${{ inputs.wild4-day }}
        CHECKPOINT_KEY: ${{ inputs.cache-key }}
        DISPATCH_STAGE: AFTER_DELAYED_VISIBILITY
      run: |
        set -euo pipefail
        [[ "${OPERATIONAL_DATE}" =~ ^20[0-9]{2}-[0-9]{2}-[0-9]{2}$ ]]
        [[ "${GITHUB_RUN_ID}" =~ ^[0-9]+$ ]]
        test "${CHECKPOINT_KEY}" = "g11-state-v4-critical-${OPERATIONAL_DATE}-${GITHUB_RUN_ID}"
        sha256sum -c .relay-output/publication-state.sha256
        jq -e '.CRITICAL.CRITICAL_CHECKPOINT_STATUS == "PASS"' .relay-output/result.json >/dev/null
        if ! jq -e '(.CRITICAL.LAST_TIMELY_SOURCE_COUNT > 0 or (if ((.CRITICAL.LAST_TIMELY_ALTERNATE_MARKET_COUNT // 0) | type) == "number" then (.CRITICAL.LAST_TIMELY_ALTERNATE_MARKET_COUNT // 0) > 0 and (.CRITICAL.LAST_TIMELY_ALTERNATE_MARKET_COUNT // 0) == ((.CRITICAL.LAST_TIMELY_ALTERNATE_MARKET_COUNT // 0) | floor) else false end))' .relay-output/result.json >/dev/null; then
          echo 'WILD4_EARLY_HANDOFF=NO_NEW_INPUT'
          exit 0
        fi
        # The child restores this exact key and verifies GPG, the complete store
        # digest, day, run and daily authority before inference. The parent's
        # independent readback gate below still controls canonical publication.
        echo 'attempted=true' >> "${GITHUB_OUTPUT}"
        timeout --signal=TERM --kill-after=2s 12s gh workflow run 364923281 \
          -f mode=wild4 -f operational_date="${OPERATIONAL_DATE}" \
          -f predeadline_checkpoint_key="${CHECKPOINT_KEY}"
        echo 'sent=true' >> "${GITHUB_OUTPUT}"
        echo "WILD4_EARLY_HANDOFF=DISPATCH_ACCEPTED_${DISPATCH_STAGE}"

