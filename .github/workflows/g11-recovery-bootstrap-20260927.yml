name: G11 2026-09-27 relay recovery bootstrap

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/g11-recovery-bootstrap-20260927.yml
  workflow_dispatch:

permissions:
  actions: write
  contents: read

jobs:
  dispatch-current-predeadline:
    runs-on: ubuntu-24.04
    steps:
      - name: Dispatch guarded current-day PREDEADLINE recovery
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh workflow run g11-free-runner.yml \
            --repo "${GITHUB_REPOSITORY}" \
            --ref main \
            -f phase=predeadline \
            -f operational_date=2026-09-27
