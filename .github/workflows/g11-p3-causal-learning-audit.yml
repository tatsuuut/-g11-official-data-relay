name: P3 original-input cause learning audit
on:
  pull_request:
    branches: [main]
    paths: ['.github/workflows/g11-p3-causal-learning-audit.yml']
permissions:
  contents: read
concurrency:
  group: p3-causal-learning-20261117
  cancel-in-progress: false
jobs:
  audit:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'codex/p3-causal-learning-20261117'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: .relay-cache/state.tgz.gpg
          key: g11-state-v4-published-2026-11-16-cause-audit-unused
          restore-keys: |
            g11-state-v4-published-2026-11-16-
            g11-state-v4-critical-2026-11-16-
          fail-on-cache-miss: true
      - name: Extract disposable saved state
        env:
          G11_PRIVATE_REPO_TOKEN: ${{secrets.G11_PRIVATE_REPO_TOKEN}}
        run: |
          set -euo pipefail
          exec 3<<<"${G11_PRIVATE_REPO_TOKEN}"
          gpg --batch --yes --pinentry-mode loopback --passphrase-fd 3 --decrypt --output "${RUNNER_TEMP}/p3-cause-state.tgz" .relay-cache/state.tgz.gpg
          exec 3<&-
          python3 - <<'PY'
          import os,pathlib,sys
          sys.path.insert(0,'scripts')
          from extract_runtime_state_v1 import extract_complete_state
          root=pathlib.Path(os.environ['RUNNER_TEMP'])
          extract_complete_state(root/'p3-cause-state.tgz',root/'p3-cause-audit')
          PY
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: ${{secrets.PRIVATE_SOURCE_REPO}}
          ref: 341fc234f2bd743136fa5a1cbbb51c9bd9fe8e83
          token: ${{secrets.G11_PRIVATE_REPO_TOKEN}}
          path: candidate
          persist-credentials: false
      - name: Install fixed explanation dependencies
        run: python3 -m pip install --disable-pip-version-check --no-input 'catboost==1.2.8' 'lxml==6.1.1'
      - name: Test isolated research selectors
        working-directory: candidate
        env:
          PYTHONPATH: .
        run: python3 g11/research/p3_causal_learning_v1/20261117/test_audit_causal_learning.py
      - name: Explain original inputs and evaluate frozen-output alternatives
        working-directory: candidate
        env:
          PYTHONPATH: .
        run: |
          python3 g11/research/p3_causal_learning_v1/20261117/audit_causal_learning.py \
            --state "${RUNNER_TEMP}/p3-cause-audit" \
            --cohort g11/research/p3_causal_learning_v1/20261117/cohort.json \
            --calibration g11/research/p3_causal_learning_v1/20261117/head_calibration.json \
            --output "${RUNNER_TEMP}/p3-causal-learning-report.json"
      - name: Encrypt observations to research recipient
        run: |
          cat > "${RUNNER_TEMP}/p3-cause-recipient.pem" <<'CERT'
          -----BEGIN CERTIFICATE-----
          MIIENTCCAp2gAwIBAgIUCRLFcShG+12HviAxmw2BNEswto0wDQYJKoZIhvcNAQEL
