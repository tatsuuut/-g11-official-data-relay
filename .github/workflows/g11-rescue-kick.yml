name: G11 rescue kick

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/g11-rescue-kick.yml

permissions:
  actions: write
  contents: read

jobs:
  dispatch-rescue:
    runs-on: ubuntu-24.04
    steps:
      - name: Dispatch production predeadline rescue
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl --fail-with-body --silent --show-error \
            -X POST \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/g11-free-runner.yml/dispatches" \
            -d '{"ref":"main","inputs":{"phase":"predeadline","operational_date":"2026-09-14"}}'
