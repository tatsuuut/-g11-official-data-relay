name: paired Mashiro P3 saved comparison contract
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/g11-mashiro-p3-bridge-audit.yml'
      - '.github/workflows/g11-isolated-live-research.yml'
      - 'scripts/*mashiro_p3_bridge*'
      - 'scripts/isolated_research_runner_v1.py'
      - 'scripts/research_state_isolation_v1.py'
  push:
    branches: [main]
    paths:
      - '.github/workflows/g11-mashiro-p3-bridge-audit.yml'
      - '.github/workflows/g11-isolated-live-research.yml'
      - 'scripts/*mashiro_p3_bridge*'
      - 'scripts/isolated_research_runner_v1.py'
      - 'scripts/research_state_isolation_v1.py'
permissions:
  contents: read
  actions: read
concurrency:
  group: g11-mashiro-p3-paired-contract-${{github.ref}}
  cancel-in-progress: true
jobs:
  paired-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      TZ: Asia/Tokyo
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Checkout the fixed paired comparison and original frozen validators
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: tatsuuut/boat-brain-lab
          ref: 067e539db5df5176fde9d0dc68b3844f0c3282ce
          token: ${{secrets.G11_PRIVATE_REPO_TOKEN}}
          path: .g11-mashiro-bridge
          persist-credentials: false
          sparse-checkout: |
            g11/research/mashiro_p3_bridge_v1
            g11/research/mashiro_fixed_v1
            g11/growth_p3/v1_1/mashiro_tactical_research_v1.py
            g11/growth_p3/v1_1/test_mashiro_tactical_research_v1.py
            g11/growth_p3/v1_1/mashiro_v4_shadow_v1.py
            g11/growth_p3/v1_1/tactical_forward_v1.py
            g11/growth_p3/v1_1/head_selection_diagnostics_v1.py
            g11/canonical/official_pipeline.py
          sparse-checkout-cone-mode: false
      - name: Verify existing and new definitions, same points, missing evidence and finance
        env:
          PYTHONPATH: .g11-mashiro-bridge
        run: python3 -S -m unittest g11.research.mashiro_p3_bridge_v1.test_observer g11.growth_p3.v1_1.test_mashiro_tactical_research_v1 -v
      - name: Verify paired output isolation and original research handover
        run: |
          python3 -S -m unittest discover -s scripts -p test_mashiro_p3_bridge_v1.py -v
          python3 -S -m unittest discover -s scripts -p test_research_state_isolation_v1.py -v
      - name: Select an existing saved input checkpoint; never acquire official data
        id: source
        env:
          GH_TOKEN: ${{github.token}}
        run: python3 -S scripts/critical_saved_publication_v1.py --day 2026-11-16 --select-restore
      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: .relay-cache/state.tgz.gpg
          key: ${{steps.source.outputs.cache_key}}
          fail-on-cache-miss: true
      - name: Authenticate a disposable checkpoint
        env:
          G11_PRIVATE_REPO_TOKEN: ${{secrets.G11_PRIVATE_REPO_TOKEN}}
        run: |
          set -euo pipefail
          exec 3<<<"${G11_PRIVATE_REPO_TOKEN}"
          python3 -S scripts/isolated_research_runner_v1.py decode --destination .paired-input-audit
          exec 3<&-
          rm -f .relay-cache/state.tgz.gpg
      - name: Restore the already-authorized frozen source without prediction
        run: python3 -S scripts/daily_runtime_bootstrap_v1.py prepare --state-root .paired-input-audit --operational-date 2026-11-16 --phase predeadline --source-root .g11-private
      - name: Audit saved real P3 pairs without writing, regenerating or publishing
        run: python3 -S scripts/mashiro_p3_bridge_v1.py --mode audit --state-root .paired-input-audit --study-root .g11-mashiro-bridge --fixed-root .g11-mashiro-bridge --day 2026-11-16 --source-checkpoint '${{steps.source.outputs.cache_key}}'
