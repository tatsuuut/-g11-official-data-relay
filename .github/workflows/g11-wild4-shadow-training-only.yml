name: G11 WILD4 isolated temperature candidate validation
run-name: WILD4-temperature-V3-${{ github.sha }}

on:
  push:
    branches: [codex/wild4-temperature-v3-validation-20261012]
    paths: [.github/workflows/g11-wild4-shadow-training-only.yml]

permissions:
  actions: read
  contents: read

concurrency:
  group: g11-wild4-temperature-v3-validation
  cancel-in-progress: false

jobs:
  validate-frozen-model:
    if: github.repository_id == '1367703708' && github.ref == 'refs/heads/codex/wild4-temperature-v3-validation-20261012'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONUNBUFFERED: '1'
      TZ: Asia/Tokyo
    steps:
      - name: Checkout exact private V2 validation candidate
        id: source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: tatsuuut/boat-brain-lab
          ref: 836bdbbaf8401b0441baa037af3e6fc4c70c2ed5
          token: ${{ secrets.G11_PRIVATE_REPO_TOKEN }}
          path: .g11-private
          persist-credentials: false
      - name: Reuse existing public GET transport
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: 538868ba95cd4bb439ccd4c6fd98fe2a4a01a73d
          path: .g11-transport
          persist-credentials: false
      - name: Retrieve exact existing frozen encrypted artifact
        id: artifact
        uses: actions/download-artifact@v4
        with:
          name: g11-wild4-frozen-shadow-candidate-encrypted
          run-id: 37080452963
          github-token: ${{ github.token }}
          path: .candidate-encrypted
      - name: Retrieve exact already calibrated encrypted candidate
        id: calibrated
        uses: actions/download-artifact@v4
        with:
          name: g11-wild4-temperature-v3-candidate-encrypted-38194510075
          run-id: 38194510075
          github-token: ${{ github.token }}
          path: .calibrated-encrypted
      - name: Read completed dates from existing current encrypted snapshot
        id: prior-state
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: .relay-cache/state.tgz.gpg
          key: g11-state-v4-2026-10-12-lifecycle-validation-no-exact-match
          restore-keys: |
            g11-state-v4-published-2026-10-12-
      - name: Retrieve exact existing current immutable ledger for read-only compatibility
        uses: actions/download-artifact@v4
        with:
          name: g11-wild4-20261012-future-oos-locks-encrypted
          run-id: 38200539890
          github-token: ${{ github.token }}
          path: .current-ledger
      - name: Decrypt using existing authority inside runner only
        id: decrypt
        env:
          STATE_PASSPHRASE: ${{ secrets.G11_PRIVATE_REPO_TOKEN }}
        run: |
          set -euo pipefail
          test -n "${STATE_PASSPHRASE}"
          python3 - <<'PY'
          import hashlib,pathlib
          p=pathlib.Path('.candidate-encrypted/g11-wild4-candidate.tgz.gpg')
          assert hashlib.sha256(p.read_bytes()).hexdigest()=='8158a651d81796166ed528d355e65628f832d0bf77cc56fb7c209f1067a77ae6','ENCRYPTED_ARTIFACT_IDENTITY'
          PY
          exec 3<<<"${STATE_PASSPHRASE}"
          gpg --batch --yes --pinentry-mode loopback --passphrase-fd 3 --decrypt \
            --output "${RUNNER_TEMP}/candidate.tgz" .candidate-encrypted/g11-wild4-candidate.tgz.gpg
          exec 3<&-
          exec 3<<<"${STATE_PASSPHRASE}"
          gpg --batch --yes --pinentry-mode loopback --passphrase-fd 3 --decrypt \
            --output "${RUNNER_TEMP}/completed-calibration.tgz" .calibrated-encrypted/calibrated-candidate.tgz.gpg
          exec 3<&-
          if [ -s .relay-cache/state.tgz.gpg ]; then
            exec 3<<<"${STATE_PASSPHRASE}"
            gpg --batch --yes --pinentry-mode loopback --passphrase-fd 3 --decrypt \
              --output "${RUNNER_TEMP}/completed-state.tgz" .relay-cache/state.tgz.gpg
            exec 3<&-
          fi
          exec 3<<<"${STATE_PASSPHRASE}"
          gpg --batch --yes --pinentry-mode loopback --passphrase-fd 3 --decrypt \
            --output "${RUNNER_TEMP}/current-ledger.tgz" .current-ledger/future-locks.tgz.gpg
          exec 3<&-
          python3 - <<'PY'
          import os,pathlib,tarfile
          root=pathlib.Path(os.environ['RUNNER_TEMP'])
          for name,dest in [('candidate.tgz',root),('completed-calibration.tgz',root),('completed-state.tgz',root/'completed-state'),('current-ledger.tgz',root)]:
              archive=root/name
              if not archive.exists(): continue
              dest.mkdir(exist_ok=True)
              with tarfile.open(archive,'r:gz') as handle:
                  members=handle.getmembers()
                  assert members,'EMPTY_ARCHIVE'
                  for member in members:
                      p=pathlib.PurePosixPath(member.name)
                      assert not p.is_absolute() and '..' not in p.parts and not member.issym() and not member.islnk(),'UNSAFE_ARCHIVE'
                      assert member.isfile() or member.isdir(),'UNSAFE_MEMBER_TYPE'
                  handle.extractall(dest,filter='data')
          (root/'g11-wild4-calibrated-candidate').rename(root/'g11-wild4-completed-calibration')
          PY
          chmod -R a-w "${RUNNER_TEMP}/g11-wild4-candidate" "${RUNNER_TEMP}/g11-wild4-completed-calibration"
          if [ -d "${RUNNER_TEMP}/completed-state" ]; then chmod -R a-w "${RUNNER_TEMP}/completed-state"; fi
      - name: Install existing pinned evaluation backend
        id: backend
        run: python3 -m pip install --disable-pip-version-check --no-input catboost==1.2.8
      - name: Validate real artifact lifecycle without training or new predictions
        id: validation
        env:
          G11_TRANSPORT_ROOT: ${{ github.workspace }}/.g11-transport/scripts
        working-directory: .g11-private
        run: |
          set -euo pipefail
          python3 -m unittest g11.wild_pack.v1.test_wild4_lifecycle_v1
          python3 -m g11.wild_pack.v1.wild4_lifecycle_secure_validation_v1 \
            --original "${RUNNER_TEMP}/g11-wild4-candidate" \
            --calibrated "${RUNNER_TEMP}/g11-wild4-completed-calibration" \
            --safe-output "${RUNNER_TEMP}/safe-results" \
            --ledger "${RUNNER_TEMP}/g11-wild4-future-locks" \
            --state "${RUNNER_TEMP}/completed-state"
      - name: Write sanitized execution status
        if: always()
        env:
          SOURCE_OUTCOME: ${{ steps.source.outcome }}
          ARTIFACT_OUTCOME: ${{ steps.artifact.outcome }}
          DECRYPT_OUTCOME: ${{ steps.decrypt.outcome }}
          VALIDATION_OUTCOME: ${{ steps.validation.outcome }}
        run: |
          python3 - <<'PY'
          import os,json,pathlib
          root=pathlib.Path(os.environ['RUNNER_TEMP'])/'safe-results';root.mkdir(exist_ok=True)
          fields=['SOURCE_OUTCOME','ARTIFACT_OUTCOME','DECRYPT_OUTCOME','VALIDATION_OUTCOME']
          result={k:os.environ.get(k,'unknown') for k in fields}
          result.update(RUN_ID=os.environ['GITHUB_RUN_ID'],SOURCE_COMMIT=os.environ['GITHUB_SHA'],
              PRODUCTION_MUTATED=False,PRODUCTION_ADOPTED=False,MODEL_WEIGHT_TRAINING=False)
          (root/'runtime-status.json').write_text(json.dumps(result,sort_keys=True,indent=2)+'\n')
          PY
      - name: Upload aggregate evidence and hashes only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: g11-wild4-temperature-v3-validation-results-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/safe-results/lifecycle-validation.json
            ${{ runner.temp }}/safe-results/projection-compatibility.json
            ${{ runner.temp }}/safe-results/validated-lifecycle-fixture.json
            ${{ runner.temp }}/safe-results/calibration-parameters.json
            ${{ runner.temp }}/safe-results/runtime-status.json
            ${{ runner.temp }}/safe-results/validation-failure.json
          if-no-files-found: error
          retention-days: 30
