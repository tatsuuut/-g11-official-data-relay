      - name: Inventory CURRENT P3 immutable historical snapshots
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib,json,re
          from collections import Counter
          from datetime import datetime,timezone
          from pathlib import Path
          race_re=re.compile(r"\d{8}-\d{2}-(?:0[1-9]|1[0-2])")
          days={}; totals=Counter()
          for dayroot in sorted(Path(".audit/states").glob("2026-*")):
              day=dayroot.name; roots=list(dayroot.rglob("snapshots"))
              if not roots: days[day]={"status":"NO_SNAPSHOT_ROOT"}; continue
              root=max(roots,key=lambda p:sum(1 for _ in p.rglob("*.json")))
              counts=Counter(); p3rows=[]; sidecars=0
              for stage in ("morning","predeadline"):
                  d=root/stage
                  if not d.is_dir(): continue
                  for path in sorted(d.glob("*.json")):
                      try: raw=path.read_bytes(); env=json.loads(raw)
                      except Exception: counts["MALFORMED"]+=1; continue
                      payload=env.get("PAYLOAD") if isinstance(env,dict) else None
                      if not isinstance(payload,dict): continue
                      if payload.get("SCHEMA")=="G11_P3_TRIFECTA_CONFIDENCE_PROSPECTIVE_EVIDENCE_V1": sidecars+=1
                      status=payload.get("STATUS")
                      if not (payload.get("LOGIC_ID")=="CURRENT_GROWTH_P3" or (isinstance(status,str) and status.startswith("CURRENT_GROWTH_P3"))): continue
                      race=payload.get("RACE_ID"); snap=payload.get("SNAPSHOT")
                      if not isinstance(race,str) or not race_re.fullmatch(race): continue
                      points=payload.get("PRODUCTION_POINTS"); conf=payload.get("TRIFECTA_CONFIDENCE")
                      embedded=isinstance(conf,dict); rawp=conf.get("RAW_SET_PROBABILITY") if embedded else None
                      key=f"{snap}_{points}_{'RAW' if rawp is not None else 'NO_RAW'}"; counts[key]+=1; totals[key]+=1
                      p3rows.append({"race":race,"snapshot":snap,"points":points,
                        "prediction_at":payload.get("PREDICTION_AT"),"bet_sha":payload.get("BET_ARTIFACT_SHA"),
                        "snapshot_sha256":hashlib.sha256(raw).hexdigest(),"raw":rawp,
                        "confidence_status":conf.get("CONFIDENCE_STATUS") if embedded else None,
                        "confidence_rule_version":conf.get("CONFIDENCE_RULE_VERSION") if embedded else None,
                        "p3_version":conf.get("P3_VERSION") if embedded else payload.get("LOGIC_VERSION"),
                        "pl120_version":conf.get("PL120_VERSION") if embedded else None,
                        "result_input_used":(payload.get("RESEARCH_PACKET") or {}).get("RESULT_INPUT_USED") if isinstance(payload.get("RESEARCH_PACKET"),dict) else None,
                        "scores_present":isinstance(payload.get("SCORES"),list) and len(payload.get("SCORES"))==6,
                        "bets":payload.get("PRODUCTION_BETS")})
              days[day]={"status":"PASS","snapshot_root":str(root),"counts":dict(counts),
                "sidecars":sidecars,"p3_record_count":len(p3rows),"records":p3rows}
          report={"schema":"G11_P3_CONFIDENCE_HISTORICAL_IMMUTABLE_INVENTORY_V2",
            "observed_at_utc":datetime.now(timezone.utc).replace(microsecond=0).isoformat(),
            "days":days,"totals":dict(totals),"restored_days":sorted(days),
            "production_mutated":False,"cache_saved":False}
          Path(".audit/history.json").write_text(json.dumps(report,ensure_ascii=False,sort_keys=True,indent=2)+"\n",encoding="utf-8")
          print(json.dumps({d:{k:v for k,v in x.items() if k!="records"} for d,x in days.items()},ensure_ascii=False,sort_keys=True))
          PY

      - name: Persist historical inventory on research branch only
        env:
          EVIDENCE_PATH: research-evidence/p3-confidence-historical-immutable-inventory-v2.json
        run: |
          set -euo pipefail
          content="$(base64 -w0 .audit/history.json)"
          existing_sha="$(gh api "repos/${GITHUB_REPOSITORY}/contents/${EVIDENCE_PATH}?ref=research/p3-confidence-history-audit-v2" --jq .sha 2>/dev/null || true)"
          args=(--method PUT -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28"
            -f "message=Record historical immutable P3 confidence inventory"
            -f "content=${content}" -f "branch=research/p3-confidence-history-audit-v2")
          if [ -n "${existing_sha}" ]; then args+=( -f "sha=${existing_sha}" ); fi
          gh api "repos/${GITHUB_REPOSITORY}/contents/${EVIDENCE_PATH}" "${args[@]}" >/dev/null
