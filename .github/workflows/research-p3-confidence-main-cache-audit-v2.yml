name: research P3 confidence historical cache inventory

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/research-p3-confidence-main-cache-audit-v2.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  inventory:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout research branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Prepare read-only audit workspace
        run: mkdir -p .audit/states .relay-cache

      - name: List available runtime cache keys
        run: |
          set -euo pipefail
          gh api --paginate "repos/${GITHUB_REPOSITORY}/actions/caches?per_page=100" \
            --jq '.actions_caches[] | select(.key | startswith("g11-state")) | [.key,.ref,.created_at,.last_accessed_at] | @tsv' \
            > .audit/cache-keys.tsv
          cat .audit/cache-keys.tsv
          python3 - <<'PY'
          import json
          from pathlib import Path
          rows=[]
          for line in Path(".audit/cache-keys.tsv").read_text().splitlines():
              if not line: continue
              key,ref,created,last=line.split("\t")
              rows.append({"key":key,"ref":ref,"created_at":created,"last_accessed_at":last})
          Path(".audit/cache-keys.json").write_text(json.dumps(rows,indent=2)+"\n")
          PY
          content="$(base64 -w0 .audit/cache-keys.json)"
          existing_sha="$(gh api "repos/${GITHUB_REPOSITORY}/contents/research-evidence/p3-confidence-cache-keys-v2.json?ref=research/p3-confidence-history-audit-v2" --jq .sha 2>/dev/null || true)"
          args=(--method PUT -f "message=Record available G11 runtime cache keys" -f "content=${content}" -f "branch=research/p3-confidence-history-audit-v2")
          if [ -n "${existing_sha}" ]; then args+=( -f "sha=${existing_sha}" ); fi
          gh api "repos/${GITHUB_REPOSITORY}/contents/research-evidence/p3-confidence-cache-keys-v2.json" "${args[@]}" >/dev/null

      - name: Record audit start on research branch
        run: |
          set -euo pipefail
          printf '{"status":"STARTED","run_id":"%s","sha":"%s"}\n' "${GITHUB_RUN_ID}" "${GITHUB_SHA}" > /tmp/confidence-audit-start.json
          content="$(base64 -w0 /tmp/confidence-audit-start.json)"
          existing_sha="$(gh api "repos/${GITHUB_REPOSITORY}/contents/research-evidence/p3-confidence-main-cache-audit-start.json?ref=research/p3-confidence-history-audit-v2" --jq .sha 2>/dev/null || true)"
          args=(--method PUT -f "message=Record confidence audit start" -f "content=${content}" -f "branch=research/p3-confidence-history-audit-v2")
          if [ -n "${existing_sha}" ]; then args+=( -f "sha=${existing_sha}" ); fi
          gh api "repos/${GITHUB_REPOSITORY}/contents/research-evidence/p3-confidence-main-cache-audit-start.json" "${args[@]}" >/dev/null

      - name: Restore 2026-09-20 encrypted state
        id: cache0
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: .relay-cache/state.tgz.gpg
          key: g11-state-v2-2026-09-20-35518938053
          fail-on-cache-miss: false

      - name: Extract 2026-09-20 state if present
        env:
          G11_PRIVATE_REPO_TOKEN: ${{ secrets.G11_PRIVATE_REPO_TOKEN }}
        run: |
          set -euo pipefail
          if [ ! -s .relay-cache/state.tgz.gpg ]; then
            echo "CACHE_MISS:2026-09-20"
            exit 0
          fi
          mkdir -p ".audit/states/2026-09-20"
          exec 3<<<"${G11_PRIVATE_REPO_TOKEN}"
          gpg --batch --yes --pinentry-mode loopback --passphrase-fd 3 \
            --decrypt --output "${RUNNER_TEMP}/2026-09-20.tgz" .relay-cache/state.tgz.gpg
          exec 3<&-
          python3 - "${RUNNER_TEMP}/2026-09-20.tgz" ".audit/states/2026-09-20" <<'PY'
          import pathlib,sys,tarfile
          root=pathlib.Path(sys.argv[2])
          with tarfile.open(sys.argv[1],"r:gz") as a:
              ms=a.getmembers()
              if not ms or any(pathlib.PurePosixPath(m.name).is_absolute() or ".." in pathlib.PurePosixPath(m.name).parts or m.issym() or m.islnk() for m in ms):
                  raise SystemExit("UNSAFE_ARCHIVE")
              a.extractall(root,filter="data")
          PY
          rm -f .relay-cache/state.tgz.gpg

