      - name: Classify verified 9/29 confidence locks against official FINAL
        run: |
          set -euo pipefail
          test -d .audit/states/2026-09-29
          curl --fail-with-body --silent --show-error --location \
            "${G11_APP_ORIGIN}/api/g11-feed?date=2026-09-29" \
            --output .audit/feed-2026-09-29.json
          python3 - <<'PY'
          import hashlib,json,math
          from collections import Counter,defaultdict
          from datetime import datetime
          from pathlib import Path

          feed=json.loads(Path(".audit/feed-2026-09-29.json").read_text())
          if not (feed.get("operational_date_jst")=="2026-09-29"
                  and feed.get("stage")=="NIGHT"
                  and feed.get("counts",{}).get("results")==144
                  and feed.get("counts",{}).get("pending")==0):
              raise SystemExit("FINAL_FEED_NOT_CLOSED")
          by={r["key"]:r for r in feed["races"]}
          roots=list(Path(".audit/states/2026-09-29").rglob("snapshots"))
          if not roots: raise SystemExit("SNAPSHOT_ROOT")
          root=max(roots,key=lambda p:sum(1 for _ in p.rglob("*.json")))
          buckets=defaultdict(Counter)
          reasons=Counter(); records=0; special=0
          raw_values=defaultdict(list)
          feed_source=feed.get("source")
          for stage_dir,stage in (("morning","MORNING"),("predeadline","LIVE")):
              d=root/stage_dir
              if not d.is_dir(): continue
              for path in d.glob("*.json"):
                  raw=path.read_bytes()
                  try: env=json.loads(raw)
                  except Exception: continue
                  p=env.get("PAYLOAD") if isinstance(env,dict) else None
                  if not isinstance(p,dict) or p.get("SNAPSHOT")!=stage: continue
                  status=p.get("STATUS")
                  if not (p.get("LOGIC_ID")=="CURRENT_GROWTH_P3"
                          or (isinstance(status,str) and status.startswith("CURRENT_GROWTH_P3"))):
                      continue
                  race=p.get("RACE_ID")
                  if race not in by: reasons["NO_FINAL_RACE_BINDING"]+=1; continue
                  points=p.get("PRODUCTION_POINTS")
                  conf=p.get("TRIFECTA_CONFIDENCE")
                  if points==8:
                      special+=1; reasons["SPECIAL_FIXED_8"]+=1; continue
                  if points not in (3,5,7):
                      reasons["WRONG_POINTS"]+=1; continue
                  records+=1; unit=f"{stage}_{points}"; row=by[race]
                  deadline=row.get("deadline_jst"); locked=p.get("PREDICTION_AT")
                  checks={
                    "EMBEDDED_CONFIDENCE":isinstance(conf,dict),
                    "RAW_FINITE":isinstance(conf,dict) and type(conf.get("RAW_SET_PROBABILITY")) in (int,float)
                      and math.isfinite(conf["RAW_SET_PROBABILITY"]) and 0<=conf["RAW_SET_PROBABILITY"]<=1,
                    "BET_ORDER_BINDING":isinstance(conf,dict) and conf.get("PRODUCTION_BET_ORDER")==p.get("PRODUCTION_BETS"),
                    "BET_SHA_BINDING":isinstance(conf,dict) and conf.get("BET_ARTIFACT_SHA")==p.get("BET_ARTIFACT_SHA"),
                    "NO_RESULT_INPUT":isinstance(p.get("RESEARCH_PACKET"),dict) and p["RESEARCH_PACKET"].get("RESULT_INPUT_USED") is False,
                    "NO_BACKFLOW":isinstance(conf,dict) and conf.get("CONFIDENCE_TO_BET_BACKFLOW")==0 and conf.get("CONFIDENCE_TO_P3_BACKFLOW")==0,
                    "TIME_FIELDS":isinstance(deadline,str) and isinstance(locked,str),
                  }
                  if checks["TIME_FIELDS"]:
                      try: checks["LOCK_BEFORE_DEADLINE"]=datetime.fromisoformat(locked)<datetime.fromisoformat(deadline)
                      except Exception: checks["LOCK_BEFORE_DEADLINE"]=False
                  else: checks["LOCK_BEFORE_DEADLINE"]=False
                  meta=row.get("result_meta") if isinstance(row.get("result_meta"),dict) else {}
                  result_status=meta.get("result_status")
                  settlements=meta.get("trifecta_settlements")
                  checks["OFFICIAL_RESULT_BOUND"]=result_status in ("ESTABLISHED","TRIFECTA_NOT_ESTABLISHED") and isinstance(settlements,list)
                  failed=[k for k,v in checks.items() if not v]
                  if failed:
                      buckets[unit]["UNDETERMINED"]+=1
                      for x in failed: reasons[x]+=1
                      continue
                  buckets[unit]["PROSPECTIVE_REUSABLE"]+=1
