name: G11 night result backfill 2026-09-17 to 2026-09-19

on:
  # This bounded recovery runs only when this exact file changes or by an
  # explicit manual dispatch. Revision 4 runs after the V2 feed safety update.
  # It has no schedule and cannot expand its dates.
  push:
    branches:
      - main
    paths:
      - .github/workflows/g11-night-backfill-20260917-20260919.yml
  workflow_dispatch:

permissions:
  actions: write
  contents: read

concurrency:
  group: g11-night-backfill-20260917-20260919
  cancel-in-progress: false

jobs:
  dispatch-bounded-night-backfill:
    if: github.repository == 'tatsuuut/-g11-official-data-relay' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Dispatch and verify each missing NIGHT date in order
        run: |
          set -euo pipefail
          api="https://api.github.com/repos/${GITHUB_REPOSITORY}"
          prior_run_id=""

          for operational_date in 2026-09-17 2026-09-18 2026-09-19; do
            marker_epoch="$(date -u +%s)"
            payload="$(jq -cn --arg day "${operational_date}"               '{ref:"main",inputs:{phase:"night",operational_date:$day}}')"
            curl --fail-with-body --silent --show-error               -X POST               -H "Authorization: Bearer ${GH_TOKEN}"               -H 'Accept: application/vnd.github+json'               -H 'X-GitHub-Api-Version: 2022-11-28'               "${api}/actions/workflows/g11-free-runner.yml/dispatches"               -d "${payload}"

            run_id=""
            for _ in $(seq 1 30); do
              response="$(curl --fail-with-body --silent --show-error                 -H "Authorization: Bearer ${GH_TOKEN}"                 -H 'Accept: application/vnd.github+json'                 -H 'X-GitHub-Api-Version: 2022-11-28'                 "${api}/actions/workflows/g11-free-runner.yml/runs?event=workflow_dispatch&branch=main&per_page=10")"
              run_id="$(jq -r                 --argjson marker "${marker_epoch}"                 --arg prior "${prior_run_id}"                 '[.workflow_runs[]
                  | select((.created_at | fromdateiso8601) >= $marker)
                  | select((.id | tostring) != $prior)]
                 | sort_by(.created_at) | reverse | .[0].id // empty'                 <<<"${response}")"
              if [ -n "${run_id}" ]; then
                break
              fi
              sleep 2
            done
            test -n "${run_id}"

            conclusion=""
            for _ in $(seq 1 90); do
              response="$(curl --fail-with-body --silent --show-error                 -H "Authorization: Bearer ${GH_TOKEN}"                 -H 'Accept: application/vnd.github+json'                 -H 'X-GitHub-Api-Version: 2022-11-28'                 "${api}/actions/runs/${run_id}")"
              status="$(jq -r '.status' <<<"${response}")"
              conclusion="$(jq -r '.conclusion // empty' <<<"${response}")"
              if [ "${status}" = "completed" ]; then
                break
              fi
              sleep 5
            done
            if [ "${conclusion}" != "success" ]; then
              printf 'NIGHT_BACKFILL_FAILED date=%s run_id=%s conclusion=%s\n'                 "${operational_date}" "${run_id}" "${conclusion}" >&2
              exit 1
            fi
            printf 'NIGHT_BACKFILL_PASS date=%s run_id=%s\n'               "${operational_date}" "${run_id}"
            prior_run_id="${run_id}"
          done
