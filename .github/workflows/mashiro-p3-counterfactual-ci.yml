name: Mashiro P3 counterfactual CI

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/mashiro-p3-counterfactual-ci.yml

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout private counterfactual branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: ${{ secrets.PRIVATE_SOURCE_REPO }}
          ref: research/mashiro-p3-counterfactual-v1-20260930
          token: ${{ secrets.G11_PRIVATE_REPO_TOKEN }}
          persist-credentials: false
          fetch-depth: 1
      - name: Compile and run counterfactual tests
        run: |
          set -euo pipefail
          python3 -m py_compile g11/research/mashiro_giant_kill/v1/p3_counterfactual_v1.py
          python3 -m py_compile g11/research/mashiro_giant_kill/v1/test_p3_counterfactual_v1.py
          python3 -m unittest g11.research.mashiro_giant_kill.v1.test_p3_counterfactual_v1 -v
      - name: Prove shadow-only authority
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          text=Path("g11/research/mashiro_giant_kill/v1/p3_counterfactual_v1.py").read_text()
          assert '"PRODUCTION_AUTHORITY":False' in text
          assert '"P3_MUTATED":False' in text
          assert '"BET_MUTATED":False' in text
          assert '"RESULT_INPUT_USED":False' in text
          print("MASHIRO_P3_COUNTERFACTUAL_SHADOW=PASS")
          PY
