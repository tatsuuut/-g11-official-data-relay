name: P3 confidence status monitor CI

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/p3-confidence-status-monitor-ci.yml

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout private status-monitor branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: ${{ secrets.PRIVATE_SOURCE_REPO }}
          ref: research/p3-confidence-status-monitor-v1
          token: ${{ secrets.G11_PRIVATE_REPO_TOKEN }}
          persist-credentials: false
          fetch-depth: 1
      - name: Compile and test status monitor
        run: |
          set -euo pipefail
          python3 -m py_compile g11/growth_p3/v1_1/confidence_calibration_status_v1.py
          python3 -m py_compile g11/growth_p3/v1_1/test_confidence_calibration_status_v1.py
          python3 -m unittest g11.growth_p3.v1_1.test_confidence_calibration_status_v1 -v
      - name: Read bundled baseline
        run: |
          set -euo pipefail
          python3 -m g11.growth_p3.v1_1.confidence_calibration_status_v1 \
            --output /tmp/status.json
          python3 - <<'PY'
          import json
          v=json.load(open("/tmp/status.json"))
          assert v["TOTAL_RECORDS"]==238
          assert v["STATUS"]=="WAITING_FROZEN_HOLDOUT"
          assert v["NEXT_SCHEDULED_HOLDOUT_DATE"]=="2026-10-03"
          assert v["HOLDOUT_DAYS"]==[]
          assert v["PRODUCTION_MUTATED"] is False
          assert v["LOCK_MUTATED"] is False
          print("P3_CONFIDENCE_STATUS_BASELINE=PASS")
          PY
