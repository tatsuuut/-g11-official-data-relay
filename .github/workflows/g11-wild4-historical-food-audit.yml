name: G11 WILD4 historical food audit

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/g11-wild4-historical-food-audit.yml

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout private authority
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: tatsuuut/boat-brain-lab
          ref: main
          token: ${{ secrets.G11_PRIVATE_REPO_TOKEN }}
          path: private
          persist-credentials: false
          fetch-depth: 1
      - name: Checkout pinned official-source history
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: BoatraceCSV/boatracecsv.github.io
          ref: fea7ba7d5c09ff2019adb0461bb91081fe57144f
          path: public-data
          persist-credentials: false
          fetch-depth: 1
      - name: Build historical authority inputs and audit thresholds
        working-directory: private
        env:
          PYTHONPATH: .
          OUT: ${{ runner.temp }}/wild4-history
          PUBLIC: ${{ github.workspace }}/public-data
        run: |
          set -euo pipefail
          mkdir -p "${OUT}"
          python3 -m g11.true_ai.v1.src.public_backfill_v1 \
            --public-repo "${PUBLIC}" \
            --dataset-output "${OUT}/head-dataset.json" \
            --audit-output "${OUT}/head-audit.json" \
            --end 2026-09-19
          python3 -m g11.wild_pack.v1.public_position_bootstrap_v1 \
            --head-dataset "${OUT}/head-dataset.json" \
            --public-repo "${PUBLIC}" \
            --overlay-output "${OUT}/position-overlay.json" \
            --audit-output "${OUT}/position-audit.json"
          python3 - "${OUT}" "${PUBLIC}" <<'PY'
          import json
          import pathlib
          import sys
          from g11.wild_pack.v1 import wild_bet_bootstrap_v1 as bet

          out=pathlib.Path(sys.argv[1])
          public=pathlib.Path(sys.argv[2])
          dataset=json.loads((out/"head-dataset.json").read_text())
          overlay=json.loads((out/"position-overlay.json").read_text())
          contract=bet.load_json(pathlib.Path("g11/wild_pack/v1/BET_MODEL_CONTRACT_V1.json"))
          odds=bet.public_odds_candidates(public)
          records={r["RACE_ID"]:r for r in dataset["RECORDS"]}
          overlay_ids={r["STANDARD_RACE_KEY"] for r in overlay["RECORDS"]}
          targets=sorted(set(records) & set(odds["RECORDS"]))
          fold_days=int(contract["BOOTSTRAP"]["FOLD_LENGTH_DAYS"])
          rows=[]
          for threshold in (1000,2000,3000,4000,5000,6000,7500,9000,10000):
              plan=bet.walk_forward_plan(
                  dataset["RECORDS"], targets,
                  fold_days=fold_days,
                  minimum_prior_races=threshold,
              )
              runnable=0
              fold_rows=[]
              for fold in plan["FOLDS"]:
                  common=sum(1 for race_id in fold["PRIOR_RACE_IDS"] if race_id in overlay_ids)
                  ready=(fold["STATUS"]=="READY" and common>=threshold)
                  if ready:
                      runnable += len(fold["TARGET_RACE_IDS"])
                  fold_rows.append({
                      "start":fold["FOLD_START"],
                      "end":fold["FOLD_END"],
                      "targets":len(fold["TARGET_RACE_IDS"]),
                      "head_prior":fold["PRIOR_RACE_COUNT"],
                      "common_prior":common,
                      "ready":ready,
                  })
              rows.append({
                  "minimum_prior":threshold,
                  "targets_total":len(targets),
                  "plan_ready_targets":plan["READY_TARGET_RACE_COUNT"],
                  "crossfit_runnable_targets":runnable,
                  "remaining_to_10000_after_historical":max(0,10000-runnable),
                  "folds":fold_rows,
              })
          result={
              "HEAD_DATASET_RACES":len(dataset["RECORDS"]),
              "POSITION_ELIGIBLE_RACES":len(overlay_ids),
              "OFFICIAL_OD3_PRICE_CANDIDATES":odds["PRICE_SIDE_CANDIDATE_RACES"],
              "MORNING_DATASET_ODDS_INTERSECTION":len(targets),
              "THRESHOLDS":rows,
          }
          print("WILD4_HISTORICAL_FOOD_AUDIT="+json.dumps(result,ensure_ascii=False,sort_keys=True))
          PY
