name: G11 PREDEADLINE critical watchdog

on:
  workflow_run:
    workflows: ["runtime sync", "runtime completion dispatch"]
    types: [completed]
  schedule:
    # Independent MORNING recovery while the normal authority window is open.
    - cron: "17-57/10 17 * * *"
    - cron: "7-57/10 18-21 * * *"
    - cron: "7,17,27 22 * * *"
    # 08:00-22:55 JST. The accepted MORNING last-race deadline is the stop gate.
    - cron: "*/5 23,0-13 * * *"
  workflow_dispatch:

permissions:
  actions: write
  checks: read
  contents: read

concurrency:
  group: g11-predeadline-critical-watchdog
  cancel-in-progress: false

jobs:
  inspect:
    if: >-
      github.repository_id == '1367703708' && github.ref == 'refs/heads/main' &&
      (github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'failure')
    # The lightweight supervisor uses an independent hosted image pool.
    runs-on: ubuntu-22.04
    timeout-minutes: 3
    env:
      TZ: Asia/Tokyo
      GH_TOKEN: ${{ github.token }}
      G11_APP_ORIGIN: ${{ secrets.APP_ENDPOINT }}
    steps:
      - name: Checkout public watchdog policy
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Audit public production firewall
        run: python3 scripts/audit_public_surface.py
      - name: Recover absent critical checkpoint without a model runtime
        run: python3 scripts/predeadline_watchdog_v1.py
