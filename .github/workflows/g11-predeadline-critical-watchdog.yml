name: G11 PREDEADLINE critical watchdog

on:
  push:
    branches: [main]
    paths:
      - scripts/predeadline_dispatch_v1.py
      - scripts/predeadline_watchdog_v1.py
      - .github/workflows/g11-predeadline-critical-watchdog.yml
  workflow_run:
    workflows: ["runtime sync", "runtime completion dispatch"]
    types: [completed]
  schedule:
    # Independent MORNING recovery while the normal authority window is open.
    - cron: "17-57/10 17 * * *"
    - cron: "7-57/10 18-21 * * *"
    - cron: "7,17,27 22 * * *"
    # 08:00-22:55 JST. The accepted MORNING last-race deadline is the stop gate.
    - cron: "*/5 23,0-13 * * *"
  workflow_dispatch:
    inputs:
      morning_handoff_day:
        description: Existing verified MORNING handoff day; empty runs the normal watchdog
        required: false
        type: string
      morning_handoff_authority:
        description: Exact saved daily authority for a bounded handoff continuation
        required: false
        type: string

permissions:
  actions: write
  checks: read
  contents: read

jobs:
  inspect:
    if: >-
      github.repository_id == '1367703708' && github.ref == 'refs/heads/main' &&
      inputs.morning_handoff_day == '' &&
      (github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'failure')
    concurrency:
      group: g11-predeadline-critical-watchdog
      cancel-in-progress: false
    # The lightweight supervisor uses an independent hosted image pool.
    runs-on: ubuntu-22.04
    timeout-minutes: 3
    env:
      TZ: Asia/Tokyo
      GH_TOKEN: ${{ github.token }}
      G11_APP_ORIGIN: ${{ secrets.APP_ENDPOINT }}
    steps:
      - name: Checkout public watchdog policy
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Audit public production firewall
        run: python3 scripts/audit_public_surface.py
      - name: Recover absent critical checkpoint without a model runtime
        id: checkpoint
        run: python3 scripts/predeadline_watchdog_v1.py
      - name: Check official input availability independently of checkpoint success
        if: ${{ !cancelled() && steps.checkpoint.outputs.official_input_day != '' }}
        env:
          OPERATIONAL_DATE: ${{ steps.checkpoint.outputs.official_input_day }}
        run: python3 scripts/predeadline_watchdog_v1.py --official-input-day "${OPERATIONAL_DATE}"

  arm-first-race:
    if: >-
      github.repository_id == '1367703708' && github.ref == 'refs/heads/main' &&
      ((github.event_name == 'workflow_run' && github.event.workflow_run.name == 'runtime sync' &&
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.head_branch == 'main' &&
        github.event.workflow_run.head_repository.full_name == github.repository) ||
       (github.event_name == 'workflow_dispatch' && inputs.morning_handoff_day != ''))
    # Timed metadata-only waiting must never occupy the normal watchdog or
    # prediction concurrency groups. Each leg stays below the hosted job cap.
    concurrency:
      group: g11-verified-morning-first-race-handoff
      cancel-in-progress: false
    runs-on: ubuntu-22.04
    timeout-minutes: 190
    env:
      TZ: Asia/Tokyo
      GH_TOKEN: ${{ github.token }}
      G11_APP_ORIGIN: ${{ secrets.APP_ENDPOINT }}
      G11_ARM_MORNING: 'true'
      G11_ARM_MORNING_DAY: ${{ inputs.morning_handoff_day }}
      G11_ARM_MORNING_AUTHORITY: ${{ inputs.morning_handoff_authority }}
    steps:
      - name: Checkout saved-only MORNING handoff
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Audit public production firewall
        run: python3 scripts/audit_public_surface.py
      - name: Arm the first existing PREDEADLINE run without relying on cron
        run: python3 scripts/predeadline_watchdog_v1.py

