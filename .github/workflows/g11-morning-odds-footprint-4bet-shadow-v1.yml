name: runtime observation
# Current-state v4 binding verified; missing MORNING remains isolated WAITING.

on:
  push:
    branches: [main]
    paths: [.github/workflows/g11-morning-odds-footprint-4bet-shadow-v1.yml]
  workflow_run:
    workflows: ["runtime sync", "LIVE-predeadline-*"]
    types: [completed]
  workflow_dispatch:
    inputs:
      mode:
        description: capture/settle footprint or observe/settle WILD4 research
        required: true
        default: capture
        type: choice
        options:
          - capture
          - settle
          - wild4
          - wild4-settle
          - wild4-recover-20261013
          - specialty-v4-save
      operational_date:
        description: YYYY-MM-DD; defaults to current JST date
        required: false
        type: string
      night_checkpoint_key:
        description: Exact verified NIGHT publication checkpoint from the existing relay
        required: false
        type: string
  schedule:
    # Independent prospective research polling, 09:01-21:56 JST.
    - cron: "1-56/5 0-12 * * *"
    # Final official NIGHT retry, separate from the legacy footprint lane.
    - cron: "25,40,55 13 * * *"
    # Dedicated MORNING research lane. Start after production morning ends at
    # 07:05 JST, but keep bounded retries through 08:55 so a delayed app feed
    # cannot erase the entire day's market-footprint sample.
    - cron: "10-55/5 22 * * *"
    - cron: "*/5 23 * * *"
    # Separate NIGHT research settlement retries. Detection is already locked.
    - cron: "20,35,50 13 * * *"

permissions:
  actions: read
  contents: read
  id-token: write

concurrency:
  group: g11-morning-odds-footprint-4bet-shadow-v1-${{ (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && (inputs.mode == 'wild4' || inputs.mode == 'wild4-settle' || inputs.mode == 'wild4-recover-20261013' || inputs.mode == 'specialty-v4-save')) || (github.event_name == 'schedule' && (github.event.schedule == '1-56/5 0-12 * * *' || github.event.schedule == '25,40,55 13 * * *'))) && 'wild4' || github.event_name == 'workflow_run' && (startsWith(github.event.workflow_run.display_title, 'LIVE-predeadline-') && 'wild4' || 'ignored') || 'footprint' }}
  cancel-in-progress: false

jobs:
  shadow:
    name: observation
    if: >-
      github.repository_id == '1367703708' &&
      github.ref == 'refs/heads/main' &&
      github.event_name != 'workflow_run' &&
      (github.event_name != 'push' || contains(github.event.head_commit.message, '[specialty-v4-save]')) &&
      !(github.event_name == 'workflow_dispatch' && (inputs.mode == 'wild4' || inputs.mode == 'wild4-settle')) &&
      !(github.event_name == 'schedule' && (github.event.schedule == '1-56/5 0-12 * * *' || github.event.schedule == '25,40,55 13 * * *'))
    runs-on: ubuntu-24.04
    timeout-minutes: 9
    env:
      TZ: Asia/Tokyo
      G11_SPECIALTY_ONLY: ${{ (inputs.mode == 'specialty-v4-save' || github.event_name == 'push' && contains(github.event.head_commit.message, '[specialty-v4-save]')) }}
      PYTHONPATH: ${{ github.workspace }}/.g11-private
      G11_APP_ORIGIN: ${{ secrets.APP_ENDPOINT }}
    steps:
      - name: Checkout public relay
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Resolve research mode and operational date
        if: env.G11_SPECIALTY_ONLY != 'true' && inputs.mode != 'wild4-recover-20261013'
        id: mode
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          SCHEDULE_EXPRESSION: ${{ github.event.schedule }}
          REQUESTED_MODE: ${{ inputs.mode }}
          REQUESTED_DATE: ${{ inputs.operational_date }}
        run: |
          set -euo pipefail
          operational_date="$(date +%F)"
          if [ -n "${REQUESTED_DATE:-}" ]; then
            operational_date="${REQUESTED_DATE}"
          fi
          if [ "${EVENT_NAME}" = "workflow_dispatch" ]; then
            mode="${REQUESTED_MODE:-capture}"
          else
            case "${SCHEDULE_EXPRESSION}" in
              "10-55/5 22 * * *"|"*/5 23 * * *") mode="capture" ;;
              "20,35,50 13 * * *") mode="settle" ;;
              *) echo "unexpected schedule" >&2; exit 1 ;;
            esac
          fi
          python3 - "${operational_date}" "${mode}" <<'PY'
          import datetime, re, sys
          if re.fullmatch(r"\d{4}-\d{2}-\d{2}", sys.argv[1]) is None:
              raise SystemExit("DATE_FORMAT")
          datetime.date.fromisoformat(sys.argv[1])
          if sys.argv[2] not in {"capture", "settle"}:
              raise SystemExit("MODE")
          PY
          echo "operational_date=${operational_date}" >> "${GITHUB_OUTPUT}"
          echo "mode=${mode}" >> "${GITHUB_OUTPUT}"

      - name: Require private repository credential
        if: env.G11_SPECIALTY_ONLY != 'true' && inputs.mode != 'wild4-recover-20261013'
        env:
          G11_PRIVATE_REPO_TOKEN: ${{ secrets.G11_PRIVATE_REPO_TOKEN }}
        run: test -n "${G11_PRIVATE_REPO_TOKEN}"

      - name: Checkout private detector source
        if: env.G11_SPECIALTY_ONLY != 'true' && inputs.mode != 'wild4-recover-20261013'
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: ${{ secrets.PRIVATE_SOURCE_REPO }}
          ref: main
          token: ${{ secrets.G11_PRIVATE_REPO_TOKEN }}
          path: .g11-private
          fetch-depth: 1

      - name: Checkout private append-only research history
        if: env.G11_SPECIALTY_ONLY != 'true' && inputs.mode != 'wild4-recover-20261013'
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: ${{ secrets.PRIVATE_SOURCE_REPO }}
          ref: g11-runtime
          token: ${{ secrets.G11_PRIVATE_REPO_TOKEN }}
          path: .g11-history
          fetch-depth: 1

      - name: Install pinned official HTML parser dependency
        if: env.G11_SPECIALTY_ONLY != 'true' && inputs.mode != 'wild4-recover-20261013'
        run: python3 -m pip install --disable-pip-version-check --no-input 'lxml==6.1.1'

      - name: Fetch current verified app feed read-only
        if: env.G11_SPECIALTY_ONLY != 'true' && inputs.mode != 'wild4-recover-20261013'
        id: feed
        shell: bash
        env:
          OPERATIONAL_DATE: ${{ steps.mode.outputs.operational_date }}
          MODE: ${{ steps.mode.outputs.mode }}
        run: |
          set -euo pipefail
          mkdir -p .shadow-work
          rm -f .shadow-work/feed.json .shadow-work/feed-response.json

          # The app feed can legitimately lag the 07:05 MORNING boundary.
          # Do not fail the whole day's footprint lane on a temporary 404.
          # Each scheduled invocation gets a short bounded retry, then exits
          # cleanly so the next 5-minute invocation can try again.
          ready=false
          for attempt in 1 2 3 4 5 6; do
            http_status="$(curl --silent --show-error --location \
              "${G11_APP_ORIGIN}/api/g11-feed?date=${OPERATIONAL_DATE}" \
              -o .shadow-work/feed-response.json \
              --write-out '%{http_code}' || true)"

            if [ "${http_status}" = "200" ] && \
               jq -e --arg d "${OPERATIONAL_DATE}" '
                 .status == "PASS"
                 and .operational_date_jst == $d
                 and (.races | type == "array")
                 and (.races | length > 0)
               ' .shadow-work/feed-response.json >/dev/null 2>&1; then
              mv .shadow-work/feed-response.json .shadow-work/feed.json
              ready=true
              break
            fi

            echo "G11_FOOTPRINT_FEED_WAIT attempt=${attempt} http=${http_status} mode=${MODE}"
            rm -f .shadow-work/feed-response.json
            if [ "${attempt}" -lt 6 ]; then
              sleep 10
            fi
          done

          if [ "${ready}" != "true" ]; then
            echo "ready=false" >> "${GITHUB_OUTPUT}"
            echo "G11_FOOTPRINT_FEED=WAITING_VERIFIED_FEED"
            exit 0
          fi

          sha="$(sha256sum .shadow-work/feed.json | cut -d" " -f1)"
          echo "ready=true" >> "${GITHUB_OUTPUT}"
          echo "feed_sha=${sha}" >> "${GITHUB_OUTPUT}"
          echo "G11_FOOTPRINT_FEED=READY sha=${sha}"

      - name: Require a formal MORNING research scope
        id: scope
        if: env.G11_SPECIALTY_ONLY != 'true' && inputs.mode != 'wild4-recover-20261013' && (steps.mode.outputs.mode == 'capture' && steps.feed.outputs.ready == 'true')
        shell: bash
        run: |
          set -euo pipefail
          # A same-day rescue has a valid app feed but no formal MORNING
          # research races. Do not turn its missing scope into a research lock.
          if jq -e '
            .counts.formal == 0
            and .counts.excluded == (.races | length)
            and all(.races[]; .formal_status == "EXCLUDED" and .research_eligible == false)
          ' .shadow-work/feed.json >/dev/null; then
            echo 'capture=false' >> "${GITHUB_OUTPUT}"
            echo 'G11_FOOTPRINT_CAPTURE=NO_FORMAL_MORNING_SCOPE'
          else
            echo 'capture=true' >> "${GITHUB_OUTPUT}"
          fi

      - name: Capture earliest complete MORNING exact-120 odds
        if: env.G11_SPECIALTY_ONLY != 'true' && inputs.mode != 'wild4-recover-20261013' && (steps.mode.outputs.mode == 'capture' && steps.feed.outputs.ready == 'true' && steps.scope.outputs.capture == 'true')
        shell: bash
        env:
          OPERATIONAL_DATE: ${{ steps.mode.outputs.operational_date }}
        run: |
          set -euo pipefail
          python3 -m g11.morning_odds_footprint.v1.runtime_v1 capture \
            --feed "${GITHUB_WORKSPACE}/.shadow-work/feed.json" \
            --history-root "${GITHUB_WORKSPACE}/.g11-history/g11/morning-odds-footprint/v1" \
            --operational-date "${OPERATIONAL_DATE}" \
            --max-requests 24 \
            --interval-seconds 10 \
            --summary-out "${GITHUB_WORKSPACE}/.shadow-work/run-summary.json"
          jq -c . .shadow-work/run-summary.json

      - name: Settle only already-locked footprint research
        if: env.G11_SPECIALTY_ONLY != 'true' && inputs.mode != 'wild4-recover-20261013' && (steps.mode.outputs.mode == 'settle' && steps.feed.outputs.ready == 'true')
        shell: bash
        env:
          OPERATIONAL_DATE: ${{ steps.mode.outputs.operational_date }}
        run: |
          set -euo pipefail
          day_path="g11/morning-odds-footprint/v1/${OPERATIONAL_DATE:0:4}/${OPERATIONAL_DATE:5:2}/${OPERATIONAL_DATE:8:2}"
          if [ ! -f ".g11-history/${day_path}/scope.json" ]; then
            echo "No MORNING footprint scope for ${OPERATIONAL_DATE}; settlement is a no-op."
            exit 0
          fi
          python3 -m g11.morning_odds_footprint.v1.runtime_v1 settle \
            --feed "${GITHUB_WORKSPACE}/.shadow-work/feed.json" \
            --history-root "${GITHUB_WORKSPACE}/.g11-history/g11/morning-odds-footprint/v1" \
            --operational-date "${OPERATIONAL_DATE}" \
            --summary-out "${GITHUB_WORKSPACE}/.shadow-work/run-summary.json"
          jq -c . .shadow-work/run-summary.json

      - name: Assert production isolation
        if: env.G11_SPECIALTY_ONLY != 'true' && inputs.mode != 'wild4-recover-20261013'
        shell: bash
        env:
          OPERATIONAL_DATE: ${{ steps.mode.outputs.operational_date }}
        run: |
          set -euo pipefail
          day_path=".g11-history/g11/morning-odds-footprint/v1/${OPERATIONAL_DATE:0:4}/${OPERATIONAL_DATE:5:2}/${OPERATIONAL_DATE:8:2}"
          if [ -f "${day_path}/daily-summary.json" ]; then
            jq -e '
              .P3_MUTATED == false
              and .WILD_MUTATED == false
              and .ABEKEN_MUTATED == false
              and .PRODUCTION_BETS_MUTATED == false
              and .NOTIFICATION_MUTATED == false
              and .PURCHASE_EXECUTED == false
              and .RESULT_INPUT_USED_FOR_DETECTION == false
              and .PAYOUT_INPUT_USED_FOR_DETECTION == false
              and .NO_AUTOMATIC_P3_PROMOTION == true
            ' "${day_path}/daily-summary.json" >/dev/null
          fi

      - name: Persist only research-history path
        if: env.G11_SPECIALTY_ONLY != 'true' && inputs.mode != 'wild4-recover-20261013'
        working-directory: .g11-history
        shell: bash
        env:
          G11_PRIVATE_REPO_TOKEN: ${{ secrets.G11_PRIVATE_REPO_TOKEN }}
          OPERATIONAL_DATE: ${{ steps.mode.outputs.operational_date }}
          MODE: ${{ steps.mode.outputs.mode }}
        run: |
          set -euo pipefail
          git config user.name "g11-research-bot"
          git config user.email "g11-research-bot@users.noreply.github.com"
          if [ ! -e g11/morning-odds-footprint/v1 ]; then
            echo "No morning-odds-footprint history exists yet; persistence is a clean no-op."
            exit 0
          fi
          git add g11/morning-odds-footprint/v1
          if git diff --cached --quiet; then
            echo "No research changes to persist."
            exit 0
          fi
          git commit -m "morning-odds-footprint: ${MODE} ${OPERATIONAL_DATE}"
          git fetch origin g11-runtime
          git rebase origin/g11-runtime
          git push origin HEAD:g11-runtime

      # One-time 2026-10-13 recovery inside the existing job. The normal
      # WILD4 reusable workflow, date gate and model pins remain unchanged.
      - name: Require explicitly scoped WILD4 recovery
        if: inputs.mode == 'wild4-recover-20261013'
        env:
          REQUESTED_DATE: ${{ inputs.operational_date }}
        run: |
          test "${GITHUB_EVENT_NAME}" = workflow_dispatch
          test "${GITHUB_REF}" = refs/heads/main
          test "${REQUESTED_DATE}" = 2026-10-13
      - name: Restore existing archive carrying immutable October 13 inputs
        if: inputs.mode == 'wild4-recover-20261013'
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: .relay-cache/state.tgz.gpg
          # Historical cache entries were evicted. Read retained October 13
          # files from this already-published archive; all original hash gates
          # remain mandatory, and no October 14 file can be changed or saved.
          key: g11-state-v4-published-2026-10-14-38490097791
          fail-on-cache-miss: true
      - name: Restore exact saved October 13 WILD4 LOCK artifact
        if: inputs.mode == 'wild4-recover-20261013'
        uses: actions/download-artifact@v4
        with:
          name: g11-wild4-20261013-future-oos-locks-encrypted
          run-id: 38409076971
          github-token: ${{ github.token }}
          path: .recovery-locks
      - name: Checkout pinned pure WILD4 accounting functions
        if: inputs.mode == 'wild4-recover-20261013'
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: tatsuuut/boat-brain-lab
          ref: 1cafd75c34216bd67592ed0e914b9298d3c9521a
          token: ${{ secrets.G11_PRIVATE_REPO_TOKEN }}
          path: .recovery-private
          persist-credentials: false
      - name: Checkout pinned immutable settlement contract
        if: inputs.mode == 'wild4-recover-20261013'
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: tatsuuut/boat-brain-lab
          ref: efd476cac11dc3ee8753b5a5001c42271be41974
          token: ${{ secrets.G11_PRIVATE_REPO_TOKEN }}
          path: .recovery-settlement
          persist-credentials: false
      - name: Validate 96R dry difference before appending missing settlements
        if: inputs.mode == 'wild4-recover-20261013'
        env:
          RECOVERY_MODE: ${{ inputs.mode }}
          RECOVERY_DATE: ${{ inputs.operational_date }}
          GH_TOKEN: ${{ github.token }}
          STATE_PASSPHRASE: ${{ secrets.G11_PRIVATE_REPO_TOKEN }}
        run: |
          python3 scripts/wild4_night_recovery_20261013.py prepare \
            --work "${RUNNER_TEMP}/wild4-recovery" \
            --private "${GITHUB_WORKSPACE}/.recovery-private" \
            --settlement "${GITHUB_WORKSPACE}/.recovery-settlement" \
            --state-archive "${GITHUB_WORKSPACE}/.relay-cache/state.tgz.gpg" \
            --lock-archive "${GITHUB_WORKSPACE}/.recovery-locks/future-locks.tgz.gpg"
      - name: Encrypt existing WILD4 ledger with verified settlement append
        if: inputs.mode == 'wild4-recover-20261013'
        env:
          STATE_PASSPHRASE: ${{ secrets.G11_PRIVATE_REPO_TOKEN }}
        run: |
          set -euo pipefail
          tar -czf "${RUNNER_TEMP}/wild4-recovery/future-locks.tgz" \
            -C "${RUNNER_TEMP}/wild4-recovery/restored" g11-wild4-future-locks
          exec 3<<<"${STATE_PASSPHRASE}"
          gpg --batch --yes --pinentry-mode loopback --passphrase-fd 3 --symmetric --cipher-algo AES256 \
            --output "${RUNNER_TEMP}/wild4-recovery/future-locks.tgz.gpg" "${RUNNER_TEMP}/wild4-recovery/future-locks.tgz"
          exec 3<&-
      - name: Save through existing encrypted WILD4 canonical artifact
        if: inputs.mode == 'wild4-recover-20261013'
        uses: actions/upload-artifact@v4
        with:
          name: g11-wild4-20261013-future-oos-locks-encrypted
          path: ${{ runner.temp }}/wild4-recovery/future-locks.tgz.gpg
          if-no-files-found: error
          retention-days: 30
      - name: Read back the artifact before publication
        if: inputs.mode == 'wild4-recover-20261013'
        uses: actions/download-artifact@v4
        with:
          name: g11-wild4-20261013-future-oos-locks-encrypted
          path: .recovery-saved-readback
      - name: Prove persisted ledger hash equality
        if: inputs.mode == 'wild4-recover-20261013'
        env:
          RECOVERY_MODE: ${{ inputs.mode }}
          RECOVERY_DATE: ${{ inputs.operational_date }}
          STATE_PASSPHRASE: ${{ secrets.G11_PRIVATE_REPO_TOKEN }}
        run: |
          python3 scripts/wild4_night_recovery_20261013.py verify-saved \
            --work "${RUNNER_TEMP}/wild4-recovery" \
            --lock-archive "${GITHUB_WORKSPACE}/.recovery-saved-readback/future-locks.tgz.gpg"
      - name: Publish only WILD4 settlement references and verify exact GET
        if: inputs.mode == 'wild4-recover-20261013'
        env:
          RECOVERY_MODE: ${{ inputs.mode }}
          RECOVERY_DATE: ${{ inputs.operational_date }}
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 scripts/wild4_night_recovery_20261013.py publish --work "${RUNNER_TEMP}/wild4-recovery"

      # Explicit research-only recovery in the existing job/concurrency lane.
      # No canonical MORNING/NIGHT state is restored, and no runtime gate is changed.
      - name: Checkout the already validated V4 lifecycle writer
        if: env.G11_SPECIALTY_ONLY == 'true'
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: tatsuuut/boat-brain-lab
          ref: bb7f273e51fc80af1669f3e9857dd4a9e6adae04
          token: ${{ secrets.G11_PRIVATE_REPO_TOKEN }}
          path: .g11-private
          persist-credentials: false
      - name: Load the existing pinned lifecycle dependency
        if: env.G11_SPECIALTY_ONLY == 'true'
        run: python3 -m pip install --disable-pip-version-check --no-input 'catboost==1.2.8'
      - name: Validate normal-day canonical identity and append only V4 research
        if: env.G11_SPECIALTY_ONLY == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          STATE_PASSPHRASE: ${{ secrets.G11_PRIVATE_REPO_TOKEN }}
        run: |
          python3 scripts/specialty_v4_save_recovery.py prepare \
            --work "${RUNNER_TEMP}/specialty-v4-save" --private "${GITHUB_WORKSPACE}/.g11-private"
      - name: Verify research-only safety and encrypted roundtrip before durable upload
        if: env.G11_SPECIALTY_ONLY == 'true'
        env:
          SPECIALTY_TEST_APP: ${{ runner.temp }}/specialty-v4-save/app-before.json
        run: python3 -m unittest discover -s scripts -p test_specialty_v4_save_recovery.py -v
      - name: Encrypt the unchanged ledger with only its research receipt appended
        if: env.G11_SPECIALTY_ONLY == 'true'
        env:
          STATE_PASSPHRASE: ${{ secrets.G11_PRIVATE_REPO_TOKEN }}
        run: |
          set -euo pipefail
          tar -czf "${RUNNER_TEMP}/specialty-v4-save/future-locks.tgz" \
            -C "${RUNNER_TEMP}/specialty-v4-save/restored" g11-wild4-future-locks
          exec 3<<<"${STATE_PASSPHRASE}"
          gpg --batch --yes --pinentry-mode loopback --passphrase-fd 3 --symmetric --cipher-algo AES256 \
            --output "${RUNNER_TEMP}/specialty-v4-save/future-locks.tgz.gpg" "${RUNNER_TEMP}/specialty-v4-save/future-locks.tgz"
          exec 3<&-
      - name: Save V4 research through the existing canonical encrypted artifact
        if: env.G11_SPECIALTY_ONLY == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: g11-wild4-20261017-future-oos-locks-encrypted
          path: ${{ runner.temp }}/specialty-v4-save/future-locks.tgz.gpg
          if-no-files-found: error
          retention-days: 30
      - name: Read back the saved research artifact before publication
        if: env.G11_SPECIALTY_ONLY == 'true'
        uses: actions/download-artifact@v4
        with:
          name: g11-wild4-20261017-future-oos-locks-encrypted
          path: .specialty-saved-readback
      - name: Require complete decrypted byte equality
        if: env.G11_SPECIALTY_ONLY == 'true'
        env:
          STATE_PASSPHRASE: ${{ secrets.G11_PRIVATE_REPO_TOKEN }}
        run: |
          python3 scripts/specialty_v4_save_recovery.py verify-saved \
            --work "${RUNNER_TEMP}/specialty-v4-save" \
            --lock-archive "${GITHUB_WORKSPACE}/.specialty-saved-readback/future-locks.tgz.gpg"
      - name: Publish only research metadata and read back through the existing app GET
        if: env.G11_SPECIALTY_ONLY == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 scripts/specialty_v4_save_recovery.py publish --work "${RUNNER_TEMP}/specialty-v4-save"

  wild4-prospective:
    name: Goripan WILD4 prospective observation
    if: >-
      !(inputs.mode == 'specialty-v4-save' || github.event_name == 'push' && contains(github.event.head_commit.message, '[specialty-v4-save]')) &&
      github.repository_id == '1367703708' &&
      github.ref == 'refs/heads/main' &&
      (
        github.event_name == 'push' ||
        (github.event_name == 'workflow_dispatch' && (inputs.mode == 'wild4' || inputs.mode == 'wild4-settle')) ||
        (github.event_name == 'schedule' && (github.event.schedule == '1-56/5 0-12 * * *' || github.event.schedule == '25,40,55 13 * * *')) ||
        (
          github.event_name == 'workflow_run' &&
          github.event.workflow_run.conclusion == 'success' &&
          github.event.workflow_run.head_branch == 'main' &&
          github.event.workflow_run.path == '.github/workflows/g11-free-runner.yml' &&
          github.event.workflow_run.head_repository.full_name == github.repository &&
          startsWith(github.event.workflow_run.display_title, 'LIVE-predeadline-')
        )
      )
    uses: tatsuuut/-g11-official-data-relay/.github/workflows/g11-wild4-shadow-lock-only.yml@b7d15fbb35afa7cb727c9f72e3cc03b5014b1a3b
    with:
      night_checkpoint_key: ${{ inputs.night_checkpoint_key || '' }}
      lineage_readback_date: ${{ github.event_name == 'push' && contains(github.event.head_commit.message, '[goripan-promotion]') && '2026-10-07' || '' }}
    secrets: inherit



