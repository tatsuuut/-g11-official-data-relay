name: runtime observation

on:
  workflow_run:
    workflows: [runtime sync]
    types: [completed]
  workflow_dispatch:
    inputs:
      mode:
        description: capture MORNING odds or settle research results
        required: true
        default: capture
        type: choice
        options:
          - capture
          - settle
      operational_date:
        description: YYYY-MM-DD; defaults to current JST date
        required: false
        type: string
  schedule:
    # Dedicated MORNING research lane. Start after production morning ends at
    # 07:05 JST, but keep bounded retries through 08:55 so a delayed app feed
    # cannot erase the entire day's market-footprint sample.
    - cron: "10-55/5 22 * * *"
    - cron: "*/5 23 * * *"
    # Separate NIGHT research settlement retries. Detection is already locked.
    - cron: "20,35,50 13 * * *"

permissions:
  actions: read
  contents: read

concurrency:
  group: g11-morning-odds-footprint-4bet-shadow-v1
  cancel-in-progress: false

jobs:
  shadow:
    name: observation
    if: >-
      github.repository_id == '1367703708' &&
      github.ref == 'refs/heads/main' &&
      github.event_name != 'workflow_run'
    runs-on: ubuntu-24.04
    timeout-minutes: 9
    env:
      TZ: Asia/Tokyo
      PYTHONPATH: ${{ github.workspace }}/.g11-private
      G11_APP_ORIGIN: ${{ secrets.APP_ENDPOINT }}
    steps:
      - name: Checkout public relay
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Resolve research mode and operational date
        id: mode
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          SCHEDULE_EXPRESSION: ${{ github.event.schedule }}
          REQUESTED_MODE: ${{ inputs.mode }}
          REQUESTED_DATE: ${{ inputs.operational_date }}
        run: |
          set -euo pipefail
          operational_date="$(date +%F)"
          if [ -n "${REQUESTED_DATE:-}" ]; then
            operational_date="${REQUESTED_DATE}"
          fi
          if [ "${EVENT_NAME}" = "workflow_dispatch" ]; then
            mode="${REQUESTED_MODE:-capture}"
          else
            case "${SCHEDULE_EXPRESSION}" in
              "10-55/5 22 * * *"|"*/5 23 * * *") mode="capture" ;;
              "20,35,50 13 * * *") mode="settle" ;;
              *) echo "unexpected schedule" >&2; exit 1 ;;
            esac
          fi
          python3 - "${operational_date}" "${mode}" <<'PY'
          import datetime, re, sys
          if re.fullmatch(r"\d{4}-\d{2}-\d{2}", sys.argv[1]) is None:
              raise SystemExit("DATE_FORMAT")
          datetime.date.fromisoformat(sys.argv[1])
          if sys.argv[2] not in {"capture", "settle"}:
              raise SystemExit("MODE")
          PY
          echo "operational_date=${operational_date}" >> "${GITHUB_OUTPUT}"
          echo "mode=${mode}" >> "${GITHUB_OUTPUT}"

      - name: Require private repository credential
        env:
          G11_PRIVATE_REPO_TOKEN: ${{ secrets.G11_PRIVATE_REPO_TOKEN }}
        run: test -n "${G11_PRIVATE_REPO_TOKEN}"

      - name: Checkout private detector source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: ${{ secrets.PRIVATE_SOURCE_REPO }}
          ref: main
          token: ${{ secrets.G11_PRIVATE_REPO_TOKEN }}
          path: .g11-private
          fetch-depth: 1

      - name: Checkout private append-only research history
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: ${{ secrets.PRIVATE_SOURCE_REPO }}
          ref: g11-runtime
          token: ${{ secrets.G11_PRIVATE_REPO_TOKEN }}
          path: .g11-history
          fetch-depth: 1

      - name: Install pinned official HTML parser dependency
        run: python3 -m pip install --disable-pip-version-check --no-input 'lxml==6.1.1'

      - name: Fetch current verified app feed read-only
        id: feed
        shell: bash
        env:
          OPERATIONAL_DATE: ${{ steps.mode.outputs.operational_date }}
          MODE: ${{ steps.mode.outputs.mode }}
        run: |
          set -euo pipefail
          mkdir -p .shadow-work
          rm -f .shadow-work/feed.json .shadow-work/feed-response.json

          # The app feed can legitimately lag the 07:05 MORNING boundary.
          # Do not fail the whole day's footprint lane on a temporary 404.
          # Each scheduled invocation gets a short bounded retry, then exits
          # cleanly so the next 5-minute invocation can try again.
          ready=false
          for attempt in 1 2 3 4 5 6; do
            http_status="$(curl --silent --show-error --location \
              "${G11_APP_ORIGIN}/api/g11-feed?date=${OPERATIONAL_DATE}" \
              -o .shadow-work/feed-response.json \
              --write-out '%{http_code}' || true)"

            if [ "${http_status}" = "200" ] && \
               jq -e --arg d "${OPERATIONAL_DATE}" '
                 .status == "PASS"
                 and .operational_date_jst == $d
                 and (.races | type == "array")
                 and (.races | length > 0)
               ' .shadow-work/feed-response.json >/dev/null 2>&1; then
              mv .shadow-work/feed-response.json .shadow-work/feed.json
              ready=true
              break
            fi

            echo "G11_FOOTPRINT_FEED_WAIT attempt=${attempt} http=${http_status} mode=${MODE}"
            rm -f .shadow-work/feed-response.json
            if [ "${attempt}" -lt 6 ]; then
              sleep 10
            fi
          done

          if [ "${ready}" != "true" ]; then
            echo "ready=false" >> "${GITHUB_OUTPUT}"
            echo "G11_FOOTPRINT_FEED=WAITING_VERIFIED_FEED"
            exit 0
          fi

          sha="$(sha256sum .shadow-work/feed.json | cut -d" " -f1)"
          echo "ready=true" >> "${GITHUB_OUTPUT}"
          echo "feed_sha=${sha}" >> "${GITHUB_OUTPUT}"
          echo "G11_FOOTPRINT_FEED=READY sha=${sha}"

      - name: Require a formal MORNING research scope
        id: scope
        if: steps.mode.outputs.mode == 'capture' && steps.feed.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          # A same-day rescue has a valid app feed but no formal MORNING
          # research races. Do not turn its missing scope into a research lock.
          if jq -e '
            .counts.formal == 0
            and .counts.excluded == (.races | length)
            and all(.races[]; .formal_status == "EXCLUDED" and .research_eligible == false)
          ' .shadow-work/feed.json >/dev/null; then
            echo 'capture=false' >> "${GITHUB_OUTPUT}"
            echo 'G11_FOOTPRINT_CAPTURE=NO_FORMAL_MORNING_SCOPE'
          else
            echo 'capture=true' >> "${GITHUB_OUTPUT}"
          fi

      - name: Capture earliest complete MORNING exact-120 odds
        if: steps.mode.outputs.mode == 'capture' && steps.feed.outputs.ready == 'true' && steps.scope.outputs.capture == 'true'
        shell: bash
        env:
          OPERATIONAL_DATE: ${{ steps.mode.outputs.operational_date }}
        run: |
          set -euo pipefail
          python3 -m g11.morning_odds_footprint.v1.runtime_v1 capture \
            --feed "${GITHUB_WORKSPACE}/.shadow-work/feed.json" \
            --history-root "${GITHUB_WORKSPACE}/.g11-history/g11/morning-odds-footprint/v1" \
            --operational-date "${OPERATIONAL_DATE}" \
            --max-requests 24 \
            --interval-seconds 10 \
            --summary-out "${GITHUB_WORKSPACE}/.shadow-work/run-summary.json"
          jq -c . .shadow-work/run-summary.json

      - name: Settle only already-locked footprint research
        if: steps.mode.outputs.mode == 'settle' && steps.feed.outputs.ready == 'true'
        shell: bash
        env:
          OPERATIONAL_DATE: ${{ steps.mode.outputs.operational_date }}
        run: |
          set -euo pipefail
          day_path="g11/morning-odds-footprint/v1/${OPERATIONAL_DATE:0:4}/${OPERATIONAL_DATE:5:2}/${OPERATIONAL_DATE:8:2}"
          if [ ! -f ".g11-history/${day_path}/scope.json" ]; then
            echo "No MORNING footprint scope for ${OPERATIONAL_DATE}; settlement is a no-op."
            exit 0
          fi
          python3 -m g11.morning_odds_footprint.v1.runtime_v1 settle \
            --feed "${GITHUB_WORKSPACE}/.shadow-work/feed.json" \
            --history-root "${GITHUB_WORKSPACE}/.g11-history/g11/morning-odds-footprint/v1" \
            --operational-date "${OPERATIONAL_DATE}" \
            --summary-out "${GITHUB_WORKSPACE}/.shadow-work/run-summary.json"
          jq -c . .shadow-work/run-summary.json

      - name: Assert production isolation
        shell: bash
        env:
          OPERATIONAL_DATE: ${{ steps.mode.outputs.operational_date }}
        run: |
          set -euo pipefail
          day_path=".g11-history/g11/morning-odds-footprint/v1/${OPERATIONAL_DATE:0:4}/${OPERATIONAL_DATE:5:2}/${OPERATIONAL_DATE:8:2}"
          if [ -f "${day_path}/daily-summary.json" ]; then
            jq -e '
              .P3_MUTATED == false
              and .WILD_MUTATED == false
              and .ABEKEN_MUTATED == false
              and .PRODUCTION_BETS_MUTATED == false
              and .NOTIFICATION_MUTATED == false
              and .PURCHASE_EXECUTED == false
              and .RESULT_INPUT_USED_FOR_DETECTION == false
              and .PAYOUT_INPUT_USED_FOR_DETECTION == false
              and .NO_AUTOMATIC_P3_PROMOTION == true
            ' "${day_path}/daily-summary.json" >/dev/null
          fi

      - name: Persist only research-history path
        working-directory: .g11-history
        shell: bash
        env:
          G11_PRIVATE_REPO_TOKEN: ${{ secrets.G11_PRIVATE_REPO_TOKEN }}
          OPERATIONAL_DATE: ${{ steps.mode.outputs.operational_date }}
          MODE: ${{ steps.mode.outputs.mode }}
        run: |
          set -euo pipefail
          git config user.name "g11-research-bot"
          git config user.email "g11-research-bot@users.noreply.github.com"
          if [ ! -e g11/morning-odds-footprint/v1 ]; then
            echo "No morning-odds-footprint history exists yet; persistence is a clean no-op."
            exit 0
          fi
          git add g11/morning-odds-footprint/v1
          if git diff --cached --quiet; then
            echo "No research changes to persist."
            exit 0
          fi
          git commit -m "morning-odds-footprint: ${MODE} ${OPERATIONAL_DATE}"
          git fetch origin g11-runtime
          git rebase origin/g11-runtime
          git push origin HEAD:g11-runtime

  wild4-prospective:
    name: WILD4 prospective SHADOW observation
    if: >-
      github.repository_id == '1367703708' &&
      github.ref == 'refs/heads/main' &&
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      startsWith(github.event.workflow_run.display_title, 'LIVE-predeadline-')
    uses: tatsuuut/-g11-official-data-relay/.github/workflows/g11-wild4-shadow-lock-only.yml@2f1855fbe253e5554987eb5270cd605639b5d9ff
    secrets: inherit
