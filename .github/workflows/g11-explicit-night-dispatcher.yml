name: G11 explicit night dispatcher

# 2026-09-24: rescue reference finance diagnostic.

# 2026-09-24: rescue per-race reference display republish.

# 2026-09-24: bounded same-day rescue NIGHT republish trigger.

on:
  # This file is allowlisted by the public-surface audit. Push validates the
  # workflow only; scheduled NIGHT dispatch starts at 22:00 JST. Repair republish enabled v40. WILD4 settlement replay hook.
  push:
    branches:
      - main
    paths:
      - .github/workflows/g11-explicit-night-dispatcher.yml
      - scripts/audit_three_phase_runtime_contract.py
  workflow_dispatch:
  schedule:
    # 22:00-01:55 JST, every 5 minutes until the app confirms NIGHT complete.
    - cron: "*/5 13-16 * * *"

permissions:
  actions: write
  contents: read

concurrency:
  group: g11-explicit-night-dispatcher
  cancel-in-progress: false

jobs:
  dispatch-night:
    if: github.repository == 'tatsuuut/-g11-official-data-relay' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      TZ: Asia/Tokyo
      GH_TOKEN: ${{ github.token }}
      G11_APP_ORIGIN: https://g11-race-lab.higatatsunori2.chatgpt.site
    steps:
      - name: Checkout tested night dispatch policy
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false

      - name: Test night date and completion decisions without live mutation
        run: python3 scripts/audit_three_phase_runtime_contract.py --night-self-test

      - name: Recover current-day PREDEADLINE heartbeat
        if: github.event_name == 'push' && contains(github.event.head_commit.message, '[predeadline-recover-20260925]')
        env:
          RECOVERY_DAY: '2026-09-25'
        run: |
          set -euo pipefail
          # One bounded operator recovery, not a new scheduler or prediction lane.
          # Old push replays cannot start a different day's runtime.
          if [ "$(date +%F)" != "${RECOVERY_DAY}" ]; then
            echo 'G11_PREDEADLINE_RECOVERY=REFUSED_DATE'
            exit 1
          fi
          now_hhmm="$(date +%H%M)"
          if [ "${now_hhmm}" -lt 800 ] || [ "${now_hhmm}" -ge 2050 ]; then
            echo 'G11_PREDEADLINE_RECOVERY=REFUSED_WINDOW'
            exit 1
          fi
          api="https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/g11-free-runner.yml"
          # Ask for each active status directly, rather than scanning the latest
          # twenty runs. Do not compete with an existing runtime of any phase.
          for status in queued in_progress requested waiting pending; do
            runs="$(curl --fail-with-body --silent --show-error \
              --connect-timeout 10 --max-time 20 \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H 'Accept: application/vnd.github+json' \
              -H 'X-GitHub-Api-Version: 2022-11-28' \
              "${api}/runs?status=${status}&per_page=1")"
            count="$(printf '%s' "${runs}" | jq -er '.total_count | select(type == "number" and . >= 0)')"
            if [ "${count}" -gt 0 ]; then
              echo "G11_PREDEADLINE_RECOVERY=DEFER_ACTIVE status=${status} count=${count}"
              exit 0
            fi
          done
          feed="$(mktemp)"
          trap 'rm -f "${feed}"' EXIT
          curl --fail-with-body --silent --show-error --location \
            --connect-timeout 10 --max-time 20 \
            "${G11_APP_ORIGIN}/api/g11-feed?date=${RECOVERY_DAY}" -o "${feed}"
          jq -e --arg day "${RECOVERY_DAY}" '
            .operational_date_jst == $day and .status == "PASS"
            and (.stage == "MORNING" or .stage == "PREDEADLINE")
            and .canonical_authorities.growth_p3.logic_id == "CURRENT_GROWTH_P3"
            and .canonical_authorities.growth_p3.status == "LOCKED"
            and (.races | type == "array" and length > 0)
          ' "${feed}" >/dev/null
          payload="$(jq -cn --arg day "${RECOVERY_DAY}" \
            '{ref:"main",inputs:{phase:"predeadline",operational_date:$day}}')"
          # No POST retry: a timeout may already have accepted the dispatch.
          curl --fail-with-body --silent --show-error \
            --connect-timeout 10 --max-time 20 \
            -X POST \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "${api}/dispatches" -d "${payload}"
          echo "G11_PREDEADLINE_RECOVERY=DISPATCH_ACCEPTED day=${RECOVERY_DAY}"

      - name: Audit accepted research-finance schema
        if: github.event_name == 'push' && contains(github.event.head_commit.message, '[finance-schema-audit]')
        run: |
          set -euo pipefail
          for day in 2026-09-17 2026-09-18 2026-09-19 2026-09-20 2026-09-21; do
            file="$(mktemp)"
            curl --fail-with-body --silent --show-error --location \
              "https://g11-race-lab.higatatsunori2.chatgpt.site/api/g11-feed?date=${day}" \
              -o "${file}"
            echo "DAY=${day}"
            jq -c '{
              stage:.stage,
              counts:.counts,
              top_keys:(keys | sort),
              research:.research,
              research_db:.research_db,
              p3_verification:(.p3_verification // null),
              research_pipeline:(.research_pipeline // null),
              rank_upset_research:(.RANK_UPSET_RESEARCH // .rank_upset_research // null),
              shadow_summary:(.original_display_shadow // null),
              race_shadow_counts:{
                with_shadow:([.races[] | select((.original_display_shadow | type)=="object")] | length),
                with_result:([.races[] | select(.result_trifecta != null)]|length),
                with_research_decision:([.races[] | select(.research_decision != null)]|length),
                with_miss_classification:([.races[] | select(.miss_classification != null)]|length)
              },
              finance_statuses:([.races[].research_finance.status] | group_by(.) | map({status:.[0],count:length})),
              finance_sample:(.races | map(select(.research_finance.status=="VERIFIED")) | .[0].research_finance),
              result_sample:(.races | map(select(.result_trifecta != null)) | .[0] | {key,result_trifecta,payout,research_eligible,research_finance,result_meta,original_display_shadow,research_decision,miss_classification})
            }' "${file}"
          done

      - name: Audit deployed research UI selectors
        if: github.event_name == 'push' && contains(github.event.head_commit.message, '[ui-research-audit]')
        run: |
          set -euo pipefail
          page="$(mktemp)"
          curl --fail-with-body --silent --show-error --location             "https://g11-race-lab.higatatsunori2.chatgpt.site" -o "${page}"
          python3 - "${page}" <<'PY' > "${RUNNER_TEMP}/assets.txt"
          import pathlib,re,sys
          html=pathlib.Path(sys.argv[1]).read_text(encoding="utf-8",errors="replace")
          assets=[]
          for value in re.findall(r'''(?:src|href)=["']([^"']+\.js(?:\?[^"']*)?)["']''', html):
              if value not in assets:
                  assets.append(value)
          for value in assets:
              print(value)
          PY
          matched=0
          # One-shot route audit for the deployed Site bundle.
          while IFS= read -r asset; do
            [ -n "${asset}" ] || continue
            case "${asset}" in
              http*) url="${asset}" ;;
              /*) url="https://g11-race-lab.higatatsunori2.chatgpt.site${asset}" ;;
              *) url="https://g11-race-lab.higatatsunori2.chatgpt.site/${asset}" ;;
            esac
            js="$(mktemp)"
            curl --fail-with-body --silent --show-error --location "${url}" -o "${js}" || continue
            python3 - "${js}" <<'PY'
          import pathlib,re,sys
          text=pathlib.Path(sys.argv[1]).read_text(encoding="utf-8",errors="replace")
          routes=sorted(set(re.findall(r'["\x60\x27](/api/[A-Za-z0-9_?=&./:-]+)',text)))
          if routes:
              print("SITE_API_ROUTES",routes)
          PY
          done < "${RUNNER_TEMP}/assets.txt"
          while IFS= read -r asset; do
            [ -n "${asset}" ] || continue
            case "${asset}" in
              http*) url="${asset}" ;;
              /*) url="https://g11-race-lab.higatatsunori2.chatgpt.site${asset}" ;;
              *) url="https://g11-race-lab.higatatsunori2.chatgpt.site/${asset}" ;;
            esac
            js="$(mktemp)"
            curl --fail-with-body --silent --show-error --location "${url}" -o "${js}" || continue
            if grep -qE '夜結果待ち|変更案の提示|本番採用審査|処刑監査室|night_execution|TRIFECTA_NOT_ESTABLISHED|result_trifecta' "${js}"; then
              matched=1
              echo "ASSET=${url}"
              python3 - "${js}" <<'PY'
          import pathlib,re,sys
          text=pathlib.Path(sys.argv[1]).read_text(encoding="utf-8",errors="replace")
          needles=["夜結果待ち","変更案の提示","本番採用審査","処刑監査室","night_execution","TRIFECTA_NOT_ESTABLISHED","result_trifecta","reference_finance","reference_practical_hit"]
          for needle in needles:
              start=0
              shown=0
              while shown<8:
                  pos=text.find(needle,start)
                  if pos<0: break
                  print("MATCH",needle,repr(text[max(0,pos-900):pos+2200]))
                  start=pos+len(needle)
                  shown+=1
          PY
            fi
          done < "${RUNNER_TEMP}/assets.txt"
          echo "MATCHED_ASSET=${matched}"
          while IFS= read -r asset; do
            [ -n "${asset}" ] || continue
            case "${asset}" in
              http*) url="${asset}" ;;
              /*) url="https://g11-race-lab.higatatsunori2.chatgpt.site${asset}" ;;
              *) url="https://g11-race-lab.higatatsunori2.chatgpt.site/${asset}" ;;
            esac
            js="$(mktemp)"
            curl --fail-with-body --silent --show-error --location "${url}" -o "${js}" || continue
            python3 - "${js}" <<'PY'
          import pathlib,sys
          text=pathlib.Path(sys.argv[1]).read_text(encoding="utf-8",errors="replace")
          phrase="処刑監査室"
          pos=text.find(phrase)
          if pos>=0:
              start=text.rfind("function ",0,pos)
              if start<0: start=max(0,pos-10000)
              end=min(len(text),start+24000)
              print("EXECUTION_FUNCTION",repr(text[start:end]))
          phrase="朝・直前・展示の処刑比較"
          pos=text.find(phrase)
          if pos>=0:
              start=text.rfind("function ",0,pos)
              if start<0: start=max(0,pos-10000)
              end=min(len(text),start+20000)
              print("DISPLAY_AUDIT_FUNCTION",repr(text[start:end]))
          PY
          done < "${RUNNER_TEMP}/assets.txt"
          release="$(mktemp)"
          if curl --fail-with-body --silent --show-error --location             "https://g11-race-lab.higatatsunori2.chatgpt.site/api/g11-app-release?client=ios"             -o "${release}"; then
            echo "G11_APP_RELEASE=$(tr -d '\n' < "${release}")"
          fi
          accepted_late_reference="$(mktemp)"
          if curl --fail-with-body --silent --show-error --location \
            "https://g11-race-lab.higatatsunori2.chatgpt.site/api/g11-feed?date=2026-09-08" \
            -o "${accepted_late_reference}"; then
            echo "ACCEPTED_LATE_REFERENCE_CONTRACT="
            jq -c '{
              stage,status,counts,research_db,
              top_level:(.late_reference // null),
              race_sample:([.races[]
                | select((.late_reference|type)=="object")
                | {
                    key,formal_status,exclusion_reason,research_eligible,
                    practical_hit,validation_hit,miss_classification,
                    research_decision,research_finance,late_reference
                  }][0] // null)
            }' "${accepted_late_reference}"
          fi

          current="$(mktemp)"
          curl --fail-with-body --silent --show-error --location             "https://g11-race-lab.higatatsunori2.chatgpt.site/api/g11-feed?date=2026-09-21"             -o "${current}"
          jq -c '{
            stage,status,counts,research_db,
            with_result_trifecta:([.races[]|select(.result_trifecta!=null)]|length),
            final_established:([.races[]|select((.result_meta.result_status//"")=="ESTABLISHED")]|length),
            final_no_trifecta:([.races[]|select((.result_meta.result_status//"")=="TRIFECTA_NOT_ESTABLISHED")]|length),
            unresolved:([.races[]|select(((.result_meta.result_status//"")!="ESTABLISHED") and ((.result_meta.result_status//"")!="TRIFECTA_NOT_ESTABLISHED"))]|length),
            shadow_night_execution:([.races[]|select((.original_display_shadow.night_execution//null)!=null)]|length)
          }' "${current}"
          accepted="$(mktemp)"
          curl --fail-with-body --silent --show-error --location \
            "https://g11-race-lab.higatatsunori2.chatgpt.site/api/g11-feed?date=2026-09-21" \
            -o "${accepted}"
          echo "ACCEPTED_WILD_TOP=$(jq -c '.wild_pack' "${accepted}")"
          echo "ACCEPTED_WILD_RACE_SAMPLE=$(jq -c '[.races[]|select((.wild_pack|type)=="object")][0].wild_pack' "${accepted}")"

          for day in 2026-09-19 2026-09-20 2026-09-21 2026-09-22; do
            cap="$(mktemp)"
            if curl --fail-with-body --silent --show-error --location \
              "https://g11-race-lab.higatatsunori2.chatgpt.site/api/g11-feed?date=${day}" \
              -o "${cap}"; then
              echo "CAPABILITY_DAY=${day}"
              jq -c '{
                capabilities,
                canonical_keys:(.canonical_authorities|keys|sort),
                wild_pack_present:(.wild_pack|type=="object"),
                wild_authority_present:(.canonical_authorities.wild_pack|type=="object"),
                race_wild_count:([.races[]|select((.wild_pack|type)=="object")]|length),
                race_wild_morning_count:([.races[]|select((.wild_pack.morning|type)=="object")]|length),
                race_wild_pre_count:([.races[]|select((.wild_pack.pre_race|type)=="object")]|length),
                race_wild_sample:([.races[]|select((.wild_pack|type)=="object")|{key,wild_pack}][0] // null)
              }' "${cap}"
              if [ "${day}" = "2026-09-22" ]; then
                jq -c '[.races[]
                  | select(.key=="20260922-03-01" or .key=="20260922-17-02")
                  | {key,deadline_jst,predeadline,predeadline_exclusion_reason,odds_captured_at_jst,wild_pack}]' "${cap}"
              fi
              if [ "${day}" = "2026-09-22" ]; then
                echo "VALUE_ALERT_AUDIT_20260922="
                jq -c '[.races[]
                  | select((.predeadline|type)=="object" and .predeadline.odds_merit=="◎")
                  | {key,venue,race,deadline_jst,
                     root_quality:.quality,
                     root_turbulence:.turbulence,
                     root_odds_merit:.odds_merit,
                     pre_quality:.predeadline.quality,
                     pre_turbulence:.predeadline.turbulence,
                     pre_points:.predeadline.production_points,
                     pre_odds_merit:.predeadline.odds_merit,
                     legacy_odds_merit:.predeadline.legacy_odds_merit,
                     value_alert:.predeadline.value_alert,
                     value_alert_type:.predeadline.value_alert_type,
                     production_mean_ev:.predeadline.production_mean_ev,
                     best_ev:.predeadline.best_ev,
                     practical_bets:.predeadline.practical_bets}]' "${cap}"
              fi
            fi
          done


      - name: Dispatch explicit NIGHT phase
        env:
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          set -euo pipefail
          if [ "${GITHUB_EVENT_NAME}" = "push" ] && [[ "${COMMIT_MESSAGE}" != *"[night-republish]"* ]] && [[ "${COMMIT_MESSAGE}" != *"[wild-night-settle]"* ]]; then
            echo 'G11_NIGHT_DISPATCH=VALIDATED_ONLY_NO_LIVE_RUN'
            exit 0
          fi
          policy="scripts/audit_three_phase_runtime_contract.py"
          # Scheduled/manual/repair invocations share the relay's 02:00
          # rollover. A delayed night job cannot enter tomorrow's morning.
          if window_day="$(python3 "${policy}" --night-day)"; then
            operational_date="${window_day}"
          else
            code=$?
            if [ "${code}" -eq 2 ]; then
              echo 'G11_NIGHT_DISPATCH=OUTSIDE_NIGHT_WINDOW'
              exit 0
            fi
            exit "${code}"
          fi
          # Retain the explicit historical operator marker; no implicit replay.
          if [ "${GITHUB_EVENT_NAME}" = "push" ] && [[ "${COMMIT_MESSAGE}" == *"[night-republish-20260922]"* ]]; then
            operational_date="2026-09-22"
          fi
          current_feed="$(mktemp)"
          trap 'rm -f "${current_feed}"' EXIT
          if [[ "${COMMIT_MESSAGE}" != *"[wild-night-settle]"* ]]; then
            if curl --fail-with-body --silent --show-error --location \
              --connect-timeout 10 --max-time 20 \
              "${G11_APP_ORIGIN}/api/g11-feed?date=${operational_date}" \
              -o "${current_feed}"; then
              # Result coverage and research eligibility have different
              # denominators. Money must describe the displayed locked bets.
              if python3 "${policy}" --night-ready "${current_feed}" --day "${operational_date}"; then
                echo "NIGHT_ALREADY_COMPLETE=${operational_date}"
                exit 0
              fi
            else
              echo 'G11_NIGHT_READBACK=UNAVAILABLE_NOT_COMPLETION'
            fi
          fi

          # Do not queue repeated NIGHT jobs behind another active runtime.
          # The next scheduled dispatcher remains the bounded retry source.
          api="https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/g11-free-runner.yml"
          for status in queued in_progress requested waiting pending; do
            runs="$(curl --fail-with-body --silent --show-error \
              --connect-timeout 10 --max-time 20 \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H 'Accept: application/vnd.github+json' \
              -H 'X-GitHub-Api-Version: 2022-11-28' \
              "${api}/runs?status=${status}&per_page=1")"
            count="$(printf '%s' "${runs}" | jq -er '.total_count | select(type == "number" and . >= 0 and floor == .)')"
            if [ "${count}" -gt 0 ]; then
              echo "G11_NIGHT_DISPATCH=DEFER_ACTIVE status=${status} count=${count}"
              exit 0
            fi
          done
          # Recheck after network reads in case the 02:00 boundary was crossed.
          if current_day="$(python3 "${policy}" --night-day)"; then
            if [ "${current_day}" != "${window_day}" ]; then
              echo 'G11_NIGHT_DISPATCH=DATE_CHANGED'
              exit 0
            fi
          else
            code=$?
            if [ "${code}" -eq 2 ]; then
              echo 'G11_NIGHT_DISPATCH=WINDOW_CLOSED_BEFORE_POST'
              exit 0
            fi
            exit "${code}"
          fi
          payload="$(jq -cn --arg day "${operational_date}" \
            '{ref:"main",inputs:{phase:"night",operational_date:$day}}')"
          # No immediate POST retry: a timeout may already mean accepted.
          curl --fail-with-body --silent --show-error \
            --connect-timeout 10 --max-time 20 \
            -X POST \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/g11-free-runner.yml/dispatches" \
            -d "${payload}"
          echo "G11_NIGHT_DISPATCH=ACCEPTED day=${operational_date}"
