name: G11 UI WILD4 context audit

on:
  pull_request:
    paths:
      - ".github/workflows/g11-ui-wild4-context-audit.yml"

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Inspect deployed UI WILD4 context
        run: |
          set -euo pipefail
          page=$(mktemp)
          curl --fail-with-body --silent --show-error --location \
            'https://g11-race-lab.higatatsunori2.chatgpt.site' -o "${page}"
          python3 - "${page}" <<'PY' > assets.txt
          import pathlib,re,sys
          html=pathlib.Path(sys.argv[1]).read_text(encoding='utf-8',errors='replace')
          seen=[]
          for v in re.findall(r'''(?:src|href)=["']([^"']+\.js(?:\?[^"']*)?)["']''', html):
              if v not in seen:
                  seen.append(v)
          print('\n'.join(seen))
          PY
          while IFS= read -r asset; do
            [ -n "${asset}" ] || continue
            case "${asset}" in
              http*) url="${asset}" ;;
              /*) url="https://g11-race-lab.higatatsunori2.chatgpt.site${asset}" ;;
              *) url="https://g11-race-lab.higatatsunori2.chatgpt.site/${asset}" ;;
            esac
            js=$(mktemp)
            curl --fail-with-body --silent --show-error --location "${url}" -o "${js}" || continue
            python3 - "${js}" <<'PY'
          import pathlib,sys
          text=pathlib.Path(sys.argv[1]).read_text(encoding='utf-8',errors='replace')
          needles=['WILD4 BET','HEAD_DERIVED_SHADOW','NOT_WILD2','WILD_BET OOS','HEAD由来10点','function cp']
          for needle in needles:
              start=0
              shown=0
              while shown<5:
                  pos=text.find(needle,start)
                  if pos<0: break
                  print('NEEDLE='+needle)
                  print(repr(text[max(0,pos-5000):min(len(text),pos+9000)]))
                  start=pos+len(needle)
                  shown+=1
          PY
          done < assets.txt
          curl --fail-with-body --silent --show-error --location \
            'https://g11-race-lab.higatatsunori2.chatgpt.site/api/g11-feed?date=2026-09-24' \
            -o feed.json
          echo 'RESCUE_WILD_DISPLAY_STATE='
          jq -c '{
            stage,
            wild_authority:.canonical_authorities.wild_pack,
            true_ai_display:(.true_ai.app_display_authorized // null),
            true_ai_predictions:((.true_ai.public_predictions // [])|length),
            race_sample:(.races[0].wild_pack)
          }' feed.json
          jq -e '
            .canonical_authorities.wild_pack.implementation_status == "PASS"
            and .canonical_authorities.wild_pack.morning_full_pack_ready == true
            and .canonical_authorities.wild_pack.app_source_binding_status == "PASS"
            and (.canonical_authorities.wild_pack.runtime_current_pack_id | type) == "string"
            and .canonical_authorities.wild_pack.runtime_current_pack_id == .canonical_authorities.wild_pack.app_published_pack_id
            and (.true_ai.app_display_authorized // false) == false
            and ((.true_ai.public_predictions // []) | length) == 0
          ' feed.json >/dev/null
          echo 'FAKE_WILD4_HEAD_DERIVED_SURFACE=SUPPRESSED'
