name: Goripan backend candidate pool contract
on:
  push:
    branches: [codex/goripan-multi-rollout-20261112]
    paths:
      - .github/workflows/g11-goripan-pool-contract.yml
      - .github/workflows/g11-morning-odds-footprint-4bet-shadow-v1.yml
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/g11-goripan-pool-contract.yml
permissions:
  contents: read
  actions: read
jobs:
  contract:
    if: github.event_name == 'push' || (github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'codex/goripan-multi-rollout-20261112')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: tatsuuut/boat-brain-lab
          ref: c93325d50220c047fd43a6e328828f6fbc0c6bfc
          token: ${{ secrets.G11_PRIVATE_REPO_TOKEN }}
          path: candidate
          persist-credentials: false
      - uses: tatsuuut/-g11-official-data-relay/.github/actions/g11-public-python@57883a3ba0a77d674f749acfaba0bbc2054a05ee
        with:
          enabled: 'true'
      - name: Verify real pinned backend and source identity
        working-directory: candidate
        run: |
          test "$(git rev-parse HEAD)" = c93325d50220c047fd43a6e328828f6fbc0c6bfc
          python3 -c 'import catboost; assert catboost.__version__ == "1.2.8"'
      - name: Check all old gates and new pool isolation
        working-directory: candidate
        env:
          PYTHONPATH: .
        run: |
          python3 -m unittest \
            g11.wild_pack.v1.test_goripan_saved_cohort_v1 \
            g11.wild_pack.v1.test_goripan_500_update_v1 \
            g11.wild_pack.v1.test_wild4_lifecycle_v1 \
            g11.wild_pack.v1.test_wild4_generation_gate_v2 \
            g11.wild_pack.v1.test_wild4_coverage_retry_v1 \
            g11.wild_pack.v1.test_wild_bet_training_v1 \
            g11.wild_pack.v1.test_wild_bet_bootstrap_v1 \
            g11.wild_pack.v1.test_goripan_candidate_pool_v1 \
            g11.wild_pack.v1.test_goripan_pool_training_smoke_v1
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: tatsuuut/boat-brain-lab
          ref: da010812e0d4e94738161b1fe810c2fa4e21a268
          token: ${{ secrets.G11_PRIVATE_REPO_TOKEN }}
          path: publisher
          persist-credentials: false
      - name: Verify retained public projection with exact lifecycle
        working-directory: publisher
        run: |
          cp ../candidate/g11/wild_pack/v1/wild4_lifecycle_v1.py g11/wild_pack/v1/wild4_lifecycle_v1.py
          cp ../candidate/g11/wild_pack/v1/goripan_candidate_pool_v1.py g11/wild_pack/v1/goripan_candidate_pool_v1.py
          cmp ../candidate/g11/wild_pack/v1/wild4_lifecycle_v1.py g11/wild_pack/v1/wild4_lifecycle_v1.py
          python3 -m unittest g11.wild_pack.v1.test_goripan_public_projection_v1
      - name: Read exact completed November 11 checkpoint
        uses: actions/download-artifact@v4
        with:
          name: g11-wild4-20261111-future-oos-locks-encrypted
          run-id: 43034209096
          github-token: ${{ github.token }}
          path: .original-night
      - name: Check original models and finance on disposable copies only
        working-directory: candidate
        env:
          STATE_PASSPHRASE: ${{ secrets.G11_PRIVATE_REPO_TOKEN }}
        run: |
          set -euo pipefail
          exec 3<<<"${STATE_PASSPHRASE}"
          gpg --batch --yes --pinentry-mode loopback --passphrase-fd 3 --decrypt \
            --output "${RUNNER_TEMP}/original-night.tgz" ../.original-night/future-locks.tgz.gpg
          exec 3<&-
          python3 - <<'PYREAD'
          import os,pathlib,sys,json
          sys.path.insert(0,os.environ['G11_PUBLIC_RUNTIME_HELPERS'])
          from extract_runtime_state_v1 import extract_complete_state
          from g11.wild_pack.v1 import wild4_lifecycle_v1 as life
          from g11.wild_pack.v1 import goripan_candidate_pool_v1 as pool
          from g11.wild_pack.v1.wild4_official_settlement_v1 import verify_prior
          temp=pathlib.Path(os.environ['RUNNER_TEMP'])
          extract_complete_state(temp/'original-night.tgz',temp/'read-only-original')
          root=temp/'read-only-original/g11-wild4-future-locks'
          before={str(p):life.b.file_sha256(p) for p in root.rglob('*') if p.is_file()}
          state=life.read(life.state_path(root))
          active=state['active']
          assert life.model_info(life.state_path(root).parent/'models'/active['identity'])==active
          settled=verify_prior(root)
          assert len(settled)==117 and state['last_completed_night']=='2026-11-11'
          assert active['identity']=='06032b26d9aabc8a9c4eda6b91ea6ed6269944b001153f523f51649b36f5a1be'
          assert pool.MAX_CANDIDATES==3 and not state.get('candidate_pool')
          assert {str(p):life.b.file_sha256(p) for p in root.rglob('*') if p.is_file()}==before
          print('GORIPAN_ORIGINAL_CHECKPOINT_READBACK='+json.dumps({
              'settled':len(settled),'active':active['identity'],'changed_files':0,
              'training_run':False,'publication_run':False,'actual_pool_candidates':0},sort_keys=True))
          PYREAD
