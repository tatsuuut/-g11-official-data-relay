name: G11 rescue predeadline bounded-wait audit

on:
  pull_request:
    paths:
      - ".github/workflows/g11-rescue-predeadline-bounded-wait-audit.yml"

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout relay
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Checkout private bounded-wait fix
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: tatsuuut/boat-brain-lab
          ref: fix/rescue-predeadline-bounded-wait-v1
          token: ${{ secrets.G11_PRIVATE_REPO_TOKEN }}
          path: .g11-private
          fetch-depth: 1

      - name: Install dependencies
        run: python3 -m pip install --disable-pip-version-check --no-input 'lxml==6.1.1'

      - name: Compile and test bounded wait
        working-directory: .g11-private
        run: |
          set -euo pipefail
          python3 -m compileall -q g11/canonical/official_pipeline.py g11/relay/rescue_v1.py
          python3 -m unittest -v \
            g11.canonical.test_official_pipeline.CanonicalOfficialPipelineTests.test_due_runner_waits_in_process_when_t7_boundary_is_near
          python3 - <<'PY'
          from pathlib import Path
          text=Path('g11/relay/rescue_v1.py').read_text(encoding='utf-8')
          assert 'run_predeadline_cycle(max_requests=48, early_wait_seconds=30)' in text
          print('RESCUE_BOUNDED_WAIT_CALL=PASS')
          PY
