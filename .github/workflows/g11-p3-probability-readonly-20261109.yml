name: P3 saved probability read-only export 20261109
on:
  pull_request:
    branches: [main]
    paths: ['.github/workflows/g11-p3-probability-readonly-20261109.yml']
permissions:
  contents: read
  actions: read
jobs:
  saved-probabilities:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'codex/p3-probability-readonly-20261109'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - day: '2026-11-07'
            key: g11-state-v4-published-2026-11-07-42370012821-1-checkpoint
          - day: '2026-11-08'
            key: g11-state-v4-published-2026-11-08-42477683561-1-checkpoint
    steps:
      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        id: saved
        with:
          path: .relay-cache/state.tgz.gpg
          key: ${{matrix.key}}
          fail-on-cache-miss: true
      - name: Require the exact saved checkpoint
        env:
          EXPECTED_KEY: ${{matrix.key}}
          ACTUAL_KEY: ${{steps.saved.outputs.cache-matched-key}}
        run: test "${EXPECTED_KEY}" = "${ACTUAL_KEY}"
      - name: Decrypt into temporary isolated storage
        env:
          G11_PRIVATE_REPO_TOKEN: ${{secrets.G11_PRIVATE_REPO_TOKEN}}
        run: |
          set -euo pipefail
          umask 077
          sha256sum .relay-cache/state.tgz.gpg > "${RUNNER_TEMP}/source.sha256"
          exec 3<<<"${G11_PRIVATE_REPO_TOKEN}"
          gpg --batch --yes --pinentry-mode loopback --passphrase-fd 3 --decrypt --output "${RUNNER_TEMP}/saved.tgz" .relay-cache/state.tgz.gpg
          exec 3<&-
      - name: Extract existing target snapshots without executing private code
        env:
          TARGET_DAY: ${{matrix.day}}
        run: |
          set -euo pipefail
          umask 077
          cat > "${RUNNER_TEMP}/extract.py" <<'PY'
          """Read exact existing snapshots from a tar stream. No imports of prediction code."""
          import argparse
          import gzip
          import hashlib
          import json
          from pathlib import Path, PurePosixPath
          import re
          import tarfile
          
          def digest_file(path):
              h=hashlib.sha256()
              with path.open('rb') as f:
                  for b in iter(lambda:f.read(1024*1024),b''):h.update(b)
              return h.hexdigest()
          
          def extract(archive, day, output):
              if day not in ('2026-11-07','2026-11-08'):raise ValueError('DAY_OUT_OF_SCOPE')
              before=digest_file(archive)
              pattern=re.compile(r'(?:^|/)snapshots/(morning|predeadline)/(current-growth-p3(?:-live)?-'+day.replace('-','')+r'-[0-9]{2}-[0-9]{2})\.json$')
              records=[];seen=set();total=0
              with tarfile.open(archive,mode='r|gz') as tar:
                  for member in tar:
                      m=pattern.search(member.name)
                      if m is None:continue
                      if not member.isfile() or PurePosixPath(member.name).is_absolute() or '..' in PurePosixPath(member.name).parts:raise ValueError('UNSAFE_SNAPSHOT_MEMBER')
                      if member.name in seen:raise ValueError('DUPLICATE_MEMBER')
                      seen.add(member.name)
                      if member.size>8*1024*1024:raise ValueError('SNAPSHOT_TOO_LARGE')
                      total+=member.size
                      if total>128*1024*1024:raise ValueError('EXPORT_TOO_LARGE')
                      data=tar.extractfile(member).read()
                      if len(data)!=member.size:raise ValueError('TRUNCATED_MEMBER')
                      value=json.loads(data)
                      if value.get('SCHEMA')!='G11_CANONICAL_PARSED_SNAPSHOT' or value.get('STAGE')!=m[1].upper() or value.get('NAME')!=m[2]:raise ValueError('SNAPSHOT_ENVELOPE')
                      if not isinstance(value.get('PAYLOAD'),dict):raise ValueError('NO_PAYLOAD')
                      records.append({'path':member.name,'sha256':hashlib.sha256(data).hexdigest(),'size':len(data),'content_utf8':data.decode('utf-8')})
              if before!=digest_file(archive):raise ValueError('ARCHIVE_CHANGED')
              if not records:raise ValueError('NO_SAVED_SNAPSHOTS')
              document={'schema':'G11_P3_EXISTING_SNAPSHOT_EXPORT_V1','day':day,'archive_sha256':before,
                        'prediction_inference_executed':False,'state_writeback':False,'snapshot_count':len(records),'records':records}
              encoded=json.dumps(document,ensure_ascii=False,separators=(',',':')).encode()
              output.write_bytes(gzip.compress(encoded,mtime=0))
              return {'day':day,'snapshot_count':len(records),'export_sha256':digest_file(output),'source_unchanged':True}
          
          if __name__=='__main__':
              p=argparse.ArgumentParser();p.add_argument('--archive',type=Path,required=True);p.add_argument('--day',required=True);p.add_argument('--output',type=Path,required=True)
              a=p.parse_args();print(json.dumps(extract(a.archive,a.day,a.output)))
          PY
          python3 "${RUNNER_TEMP}/extract.py" --archive "${RUNNER_TEMP}/saved.tgz" --day "${TARGET_DAY}" --output "${RUNNER_TEMP}/p3-saved.json.gz"
          sha256sum -c "${RUNNER_TEMP}/source.sha256"
