          boundary=json.loads(pathlib.Path("../.relay-state/rescue/boundary.json").read_bytes())
          if boundary.get("schema")!="G11_DELAYED_MORNING_RECOVERY_BOUNDARY_V1" or (boundary.get("operational_date_jst")!=os.environ["OPERATIONAL_DATE"] or not (os.environ["OPERATIONAL_DATE"]=="2026-10-21" or os.environ["OPERATIONAL_DATE"]>="2026-10-22")) or boundary.get("canonical_morning_promoted") is not False or boundary.get("research_eligible") is not False or boundary.get("same_day_results_used") is not False:
