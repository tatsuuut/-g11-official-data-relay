          import importlib.util, os, pathlib, sys
          from g11.canonical.official_pipeline import OfficialArtifactStore
          workspace, temp = map(pathlib.Path, sys.argv[1:3])
          day = sys.argv[3]
          module_path = workspace/'.g11-settlement/g11/wild_pack/v1/wild4_official_settlement_v1.py'
          spec = importlib.util.spec_from_file_location('wild4_pinned_settlement', module_path)
          module = importlib.util.module_from_spec(spec); spec.loader.exec_module(module)
          ledger = temp/'g11-wild4-future-locks'
          if os.environ.get('CANONICAL_READY') == 'false':
              import json
              from g11.canonical.official_pipeline import _is_sg_event_title
              rescue_source = workspace/'.g11-settlement/g11/wild_pack/v1/wild4_rescue_settlement_v1.py'
              rescue_spec = importlib.util.spec_from_file_location('wild4_rescue_settlement', rescue_source)
              rescue = importlib.util.module_from_spec(rescue_spec); rescue_spec.loader.exec_module(rescue)
              state = workspace/'.relay-state'
              source = state/'rescue/store/snapshots/night/official-day-results.json'
              if not source.is_file():
                  if os.environ.get('NIGHT_CHECKPOINT_KEY'):
                      raise SystemExit('WILD4_RESCUE_VERIFIED_NIGHT_MISSING')
                  print('WILD4_RESCUE_NIGHT=AWAITING_VERIFIED_RESULTS')
                  sys.exit(0)
              store = OfficialArtifactStore(state/'rescue/store')
              summary = rescue.settle_rescue_day(ledger,state,day,
                  store.load_verified_snapshot('night','official-day-results'),
                  store.load_verified_snapshot('morning','official-day-input'),is_sg=_is_sg_event_title)
              with open(os.environ['GITHUB_OUTPUT'],'a',encoding='utf-8') as output:
                  output.write('new='+str(summary['new'])+'\ncomplete='+str(summary['complete']).lower()+'\nheld='+str(summary['held'])+'\n')
                  output.write('rescue_join_readback=true\n')
              print('WILD4_RESCUE_NIGHT_READBACK='+json.dumps(summary,sort_keys=True))
              print('WILD4_RESCUE_FORMAL_METRICS_INCLUDED=false; LEARNING_CONNECTED=false')
              with open(os.environ['GITHUB_STEP_SUMMARY'],'a',encoding='utf-8') as output:
                  output.write('Rescue NIGHT: saved='+str(summary['total'])+'; held='+str(summary['held'])+'\n')
              sys.exit(0)
          previous = module.verify_prior(ledger)
          lock_keys = {p.stem for p in ledger.glob('*.json') if module.KEY.fullmatch(p.stem)}
          complete = False
          source = workspace/'.relay-state/store/snapshots/night/workbook-ledger-projection.json'
          if not source.is_file():
              if os.environ.get('NIGHT_CHECKPOINT_KEY'):
                  raise SystemExit('WILD4_VERIFIED_NIGHT_PROJECTION_MISSING')
              print('WILD4_OFFICIAL_NIGHT=AWAITING_VERIFIED_PROJECTION')
              print('::warning::WILD4 settlement pending verified NIGHT; not completed')
              print('WILD4_PRIOR_SETTLED='+str(len(previous)))
