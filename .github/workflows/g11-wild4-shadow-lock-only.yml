name: G11 WILD4 prospective shadow lock only

on:
  push:
    branches:
      - codex/wild4-shadow-training-20261003
    paths:
      - .github/workflows/g11-wild4-shadow-lock-only.yml
  workflow_call:
    inputs:
      lineage_readback_date:
        description: Read-only promotion readback of existing 2026-10-07 lineage
        type: string
        required: false
        default: ""

permissions:
  actions: read
  contents: read
  id-token: write

concurrency:
  group: g11-wild4-prospective-shadow-lock
  cancel-in-progress: false

jobs:
  lock-future-only:
    if: github.repository_id == '1367703708'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      TZ: Asia/Tokyo
    steps:
      - name: Checkout isolated research branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: codex/wild4-shadow-training-20261003
          persist-credentials: false
      - name: Bind the current operational date
        id: day
        env:
          UPSTREAM_RUN_TITLE: ${{ github.event.workflow_run.display_title }}
          REQUESTED_DAY: ${{ github.event.inputs.operational_date }}
          REQUESTED_MODE: ${{ github.event.inputs.mode }}
          LINEAGE_READBACK_DATE: ${{ inputs.lineage_readback_date }}
        run: |
          python3 - <<'PY'
          import os, re
          from datetime import datetime, timedelta
          from zoneinfo import ZoneInfo
          title=os.environ.get('UPSTREAM_RUN_TITLE','')
          readback=os.environ.get('LINEAGE_READBACK_DATE','')
          if readback:
              if readback!='2026-10-07': raise SystemExit('READBACK_DATE_NOT_AUTHORIZED')
              day=readback
          elif os.environ['GITHUB_EVENT_NAME'] in {'push','schedule'}:
              day=datetime.now(ZoneInfo('Asia/Tokyo')).date().isoformat()
          elif os.environ['GITHUB_EVENT_NAME']=='workflow_dispatch':
              day=os.environ.get('REQUESTED_DAY','')
              if re.fullmatch(r'20[0-9]{2}-[0-9]{2}-[0-9]{2}',day) is None:
                  raise SystemExit('REQUESTED_DAY_MISMATCH')
          else:
              match=re.fullmatch(r'LIVE-predeadline-(20[0-9]{2}-[0-9]{2}-[0-9]{2})',title)
              if match is not None:
                  day=match.group(1)
              elif title=='LIVE-predeadline-':
                  day=datetime.now(ZoneInfo('Asia/Tokyo')).date().isoformat()
              else:
                  raise SystemExit('UPSTREAM_RUN_TITLE_MISMATCH')
          now_jst=datetime.now(ZoneInfo('Asia/Tokyo'))
          # Match the normal NIGHT lane's previous-day window before 02:00 JST.
          # This exception is settlement-only; expired predictions are never generated.
          night_rollover=(not readback and os.environ['GITHUB_EVENT_NAME']=='workflow_dispatch'
              and os.environ.get('REQUESTED_MODE','')=='wild4-settle'
              and now_jst.hour<2
              and day==(now_jst.date()-timedelta(days=1)).isoformat())
          if not readback and day!=now_jst.date().isoformat() and not night_rollover:
              raise SystemExit('NON_CURRENT_OPERATIONAL_DATE')
          with open(os.environ['GITHUB_OUTPUT'],'a',encoding='utf-8') as output:
              output.write('day='+day+'\n')
              output.write('night_rollover='+str(night_rollover).lower()+'\n')
              output.write('lifecycle_enabled='+str(day>='2026-10-13').lower()+'\n')
              output.write('artifact_name=g11-wild4-'+day.replace('-','')+'-future-oos-locks-encrypted\n')
          print('WILD4_SHADOW_OPERATIONAL_DATE='+day)
          PY
      - name: Restore current encrypted canonical state
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: .relay-cache/state.tgz.gpg
          key: g11-state-v4-${{ steps.day.outputs.day }}-isolated-shadow-no-exact-match
          restore-keys: |
            g11-state-v4-published-${{ steps.day.outputs.day }}-
      - name: Verify current canonical state availability
        id: state-ready
        run: |
          if [ -s .relay-cache/state.tgz.gpg ]; then
            echo 'ready=true' >> "${GITHUB_OUTPUT}"
          else
            echo 'ready=false' >> "${GITHUB_OUTPUT}"
            echo 'WILD4_WAITING_CURRENT_CANONICAL_STATE; no decryption attempted'
          fi
      - name: Retrieve exact frozen encrypted candidate
        continue-on-error: true
        if: steps.state-ready.outputs.ready == 'true'
        uses: actions/download-artifact@v4
        with:
          name: g11-wild4-frozen-shadow-candidate-encrypted
          run-id: 37080452963
          github-token: ${{ github.token }}
          path: .candidate-encrypted
      - name: Retrieve existing verified calibration artifact
        if: steps.state-ready.outputs.ready == 'true'
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: g11-wild4-temperature-v3-candidate-encrypted-38194510075
          run-id: 38194510075
          github-token: ${{ github.token }}
          path: .calibrated-encrypted
      - name: Identify the most recent encrypted shadow ledger
        if: steps.state-ready.outputs.ready == 'true'
        id: prior
        env:
          GH_TOKEN: ${{ github.token }}
          OPERATIONAL_DATE: ${{ steps.day.outputs.day }}
        run: |
          set -euo pipefail
          name="g11-wild4-${OPERATIONAL_DATE//-/}-future-oos-locks-encrypted"
          id=''
          selected_run=''
          # Find ledgers by their exact day artifact name, independently of
          # the number of intervening LIVE runs with no new lock.
          curl --fail-with-body --silent --show-error --retry 3 \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts?name=${name}&per_page=100" \
            -o "${RUNNER_TEMP}/observer-artifacts.json"
          ledger_candidates="$(jq -r --arg name "${name}" '
            [.artifacts[] | select(.name == $name and .expired == false)]
            | sort_by(.created_at) | reverse | .[]
            | [.id, .workflow_run.id] | @tsv' "${RUNNER_TEMP}/observer-artifacts.json")"
          while IFS=$'\t' read -r artifact_id run_id; do
            [ -n "${artifact_id}" ] || continue
            [ "${run_id}" != "${GITHUB_RUN_ID}" ] || continue
            curl --fail-with-body --silent --show-error --retry 3 \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}" \
              -o "${RUNNER_TEMP}/observer-ledger-run.json"
            if jq -e '
              .conclusion == "success" and (
                (.path == ".github/workflows/g11-wild4-shadow-lock-only.yml"
                  and .head_branch == "codex/wild4-shadow-training-20261003")
                or (.path == ".github/workflows/g11-morning-odds-footprint-4bet-shadow-v1.yml"
                  and (.event == "workflow_run" or .event == "schedule" or .event == "push" or .event == "workflow_dispatch") and .head_branch == "main")
              )' "${RUNNER_TEMP}/observer-ledger-run.json" >/dev/null; then
              id="${artifact_id}"
              selected_run="${run_id}"
              break
            fi
          done <<< "${ledger_candidates}"
          # A rerun of the same GitHub run must not manufacture a replacement
          # ledger when that run already has an immutable artifact.
          self_artifacts="$(curl --fail-with-body --silent --show-error --retry 3 \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/artifacts?per_page=100")"
          if printf '%s' "${self_artifacts}" | jq -e --arg name "${name}" \
            'any(.artifacts[]; .name == $name and .expired == false)' >/dev/null; then
            echo 'WILD4_SAME_RUN_ARTIFACT_RERUN_FORBIDDEN' >&2
            exit 1
          fi
          if [ -z "${id}" ] && [ "${OPERATIONAL_DATE}" = '2026-10-03' ]; then
            id='11258679601'
            selected_run='37083260709'
          fi
          echo "id=${id}" >> "${GITHUB_OUTPUT}"
          echo "run_id=${selected_run}" >> "${GITHUB_OUTPUT}"
          if [ -z "${id}" ]; then echo 'WILD4_PRIOR_LEDGER=NONE'; else echo 'WILD4_PRIOR_LEDGER=FOUND'; fi
      - name: Retrieve exact prior encrypted shadow ledger
        if: steps.state-ready.outputs.ready == 'true' && (steps.prior.outputs.id != '')
        uses: actions/download-artifact@v4
        with:
          name: ${{ steps.day.outputs.artifact_name }}
          run-id: ${{ steps.prior.outputs.run_id }}
          github-token: ${{ github.token }}
          path: .prior-encrypted
      - name: Checkout frozen shadow source
        if: steps.state-ready.outputs.ready == 'true'
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: tatsuuut/boat-brain-lab
          ref: 836bdbbaf8401b0441baa037af3e6fc4c70c2ed5
          token: ${{ secrets.G11_PRIVATE_REPO_TOKEN }}
          path: .g11-private
          persist-credentials: false
      - name: Decrypt verified state and candidate
        id: decrypted
        if: steps.state-ready.outputs.ready == 'true'
        env:
          OPERATIONAL_DATE: ${{ steps.day.outputs.day }}
          STATE_PASSPHRASE: ${{ secrets.G11_PRIVATE_REPO_TOKEN }}
        run: |
          set -euo pipefail
          test -s .relay-cache/state.tgz.gpg
          test -n "${STATE_PASSPHRASE}"
          exec 3<<<"${STATE_PASSPHRASE}"
          gpg --batch --yes --pinentry-mode loopback --passphrase-fd 3 \
            --decrypt --output "${RUNNER_TEMP}/g11-state.tgz" .relay-cache/state.tgz.gpg
          exec 3<&-
          if [ -s .candidate-encrypted/g11-wild4-candidate.tgz.gpg ]; then
          exec 3<<<"${STATE_PASSPHRASE}"
          gpg --batch --yes --pinentry-mode loopback --passphrase-fd 3 \
            --decrypt --output "${RUNNER_TEMP}/candidate.tgz" .candidate-encrypted/g11-wild4-candidate.tgz.gpg
          exec 3<&-
          fi
          python3 - <<'PY'
          import json, os, pathlib, tarfile, hashlib
          root=pathlib.Path(os.environ['RUNNER_TEMP'])
          for archive,dest in ((root/'g11-state.tgz',pathlib.Path('.relay-state')),
                               (root/'candidate.tgz',root)):
              if not archive.is_file(): continue
              dest.mkdir(exist_ok=True)
              with tarfile.open(archive,'r:gz') as handle:
                  members=handle.getmembers()
                  if not members: raise SystemExit('EMPTY_ARCHIVE')
                  for member in members:
                      path=pathlib.PurePosixPath(member.name)
                      if path.is_absolute() or '..' in path.parts or member.issym() or member.islnk():
                          raise SystemExit('UNSAFE_ARCHIVE')
                  handle.extractall(dest,filter='data')
          state=json.loads(pathlib.Path('.relay-state/relay-state.json').read_text())
          if state.get('OPERATIONAL_DATE_JST')!=os.environ['OPERATIONAL_DATE']:
              raise SystemExit('STATE_DATE_MISMATCH')
          ready=state.get('MORNING_COMPLETE') is True
          rescue=False
          path=pathlib.Path('.relay-state/rescue/boundary.json')
          if not ready and path.is_file():
              cert=json.loads(path.read_bytes()); unsigned=dict(cert)
              sha=unsigned.pop('authority_sha256',None)
              canonical=json.dumps(unsigned,ensure_ascii=False,sort_keys=True,separators=(',',':'),allow_nan=False).encode()
              rescue=(cert.get('operational_date_jst')==os.environ['OPERATIONAL_DATE']=='2026-10-06'
                  and cert.get('schema')=='G11_SAME_DAY_RESCUE_BOUNDARY_V1'
                  and cert.get('canonical_morning_promoted') is False
                  and cert.get('research_eligible') is False
                  and cert.get('same_day_results_used') is False
                  and sha==hashlib.sha256(canonical).hexdigest()
                  and not pathlib.Path('.relay-state/daily-runtime/2026-10-06/authority.json').exists())
              if not rescue: raise SystemExit('WILD4_RESCUE_BOUNDARY_INVALID')
          with open(os.environ['GITHUB_OUTPUT'],'a') as out:
              out.write('canonical_ready='+str(ready).lower()+'\n')
              out.write('runtime_ready='+str(ready or rescue).lower()+'\n')
              out.write('store='+('.relay-state/rescue/store' if rescue else '.relay-state/store')+'\n')
          print('WILD4_STATE_MODE='+('RESCUE_PROSPECTIVE_SHADOW_ONLY' if rescue else 'CANONICAL' if ready else 'WAITING'))
          PY
      - name: Restore and verify earlier immutable SHADOW locks
        if: steps.state-ready.outputs.ready == 'true' && steps.decrypted.outputs.runtime_ready == 'true'
        env:
          OPERATIONAL_DATE: ${{ steps.day.outputs.day }}
          STATE_PASSPHRASE: ${{ secrets.G11_PRIVATE_REPO_TOKEN }}
        run: |
          set -euo pipefail
          if [ ! -e .prior-encrypted/future-locks.tgz.gpg ]; then
            echo 'WILD4_PRIOR_LOCKS=0'
            exit 0
          fi
          exec 3<<<"${STATE_PASSPHRASE}"
          gpg --batch --yes --pinentry-mode loopback --passphrase-fd 3 \
            --decrypt --output "${RUNNER_TEMP}/prior-locks.tgz" .prior-encrypted/future-locks.tgz.gpg
          exec 3<&-
          python3 - <<'PY'
          import json, os, pathlib, re, tarfile, hashlib
          from datetime import datetime
          root=pathlib.Path(os.environ['RUNNER_TEMP'])
          with tarfile.open(root/'prior-locks.tgz','r:gz') as archive:
              members=archive.getmembers()
              if not members: raise SystemExit('PRIOR_LOCKS_EMPTY_ARCHIVE')
              for member in members:
                  path=pathlib.PurePosixPath(member.name)
                  if path.is_absolute() or '..' in path.parts or path.parts[0]!='g11-wild4-future-locks' or member.issym() or member.islnk():
                      raise SystemExit('PRIOR_LOCKS_UNSAFE_ARCHIVE')
              archive.extractall(root,filter='data')
          out=root/'g11-wild4-future-locks'
          manifest=json.loads((out/'batch-manifest.json').read_text())
          value={key:item for key,item in manifest.items() if key!='CONTENT_SHA256'}
          canonical=json.dumps(value,ensure_ascii=False,sort_keys=True,separators=(',',':'))+'\n'
          if hashlib.sha256(canonical.encode()).hexdigest()!=manifest['CONTENT_SHA256']:
              raise SystemExit('PRIOR_MANIFEST_SHA')
          expected=manifest['CANDIDATE_MODEL_SHA256']
          if (manifest['CANDIDATE_MODEL_SHA256']!=expected or
              re.fullmatch(r'[0-9a-f]{64}',manifest['CANDIDATE_INPUT_SHA256']) is None or
              manifest['DATE']!=os.environ['OPERATIONAL_DATE']):
              raise SystemExit('PRIOR_MODEL_OR_DAY')
          pattern=re.compile(r'[0-9]{8}-[0-9]{2}-(?:0[1-9]|1[0-2])')
          files=sorted(p for p in out.glob('*.json') if pattern.fullmatch(p.stem))
          if [p.stem for p in files]!=manifest['RACE_KEYS']:
              raise SystemExit('PRIOR_LOCK_COVERAGE')
          for path in files:
              lock=json.loads(path.read_text())
              value={key:item for key,item in lock.items() if key!='CONTENT_SHA256'}
              canonical=json.dumps(value,ensure_ascii=False,sort_keys=True,separators=(',',':'))+'\n'
              if (hashlib.sha256(canonical.encode()).hexdigest()!=lock['CONTENT_SHA256']
                  or lock['CANDIDATE_MODEL_SHA256']!=expected
                  or lock['STANDARD_RACE_KEY']!=path.stem
                  or datetime.fromisoformat(lock['LOCKED_AT'])>=datetime.fromisoformat(lock['RACE_DEADLINE_AT'])):
                  raise SystemExit('PRIOR_LOCK_READBACK')
          print('WILD4_PRIOR_LOCKS='+str(len(files)))
          print('WILD4_PRIOR_RACES='+json.dumps([
              {'race_key':p.stem,'buy_count':json.loads(p.read_text())['BUY_COUNT'],
               'locked_at':json.loads(p.read_text())['LOCKED_AT'],
               'deadline':json.loads(p.read_text())['RACE_DEADLINE_AT']}
              for p in files],sort_keys=True))
          PY
      - name: Carry previous-day model registry without copying previous predictions
        if: steps.state-ready.outputs.ready == 'true' && steps.decrypted.outputs.runtime_ready == 'true' && steps.prior.outputs.id == '' && steps.day.outputs.lifecycle_enabled == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          STATE_PASSPHRASE: ${{ secrets.G11_PRIVATE_REPO_TOKEN }}
          OPERATIONAL_DATE: ${{ steps.day.outputs.day }}
        run: |
          python3 - <<'PYCARRY'
          import os,json,urllib.request,urllib.error,subprocess,pathlib,tarfile,shutil,zipfile,io
          from datetime import date,timedelta
          base='https://api.github.com/repos/'+os.environ['GITHUB_REPOSITORY']
          headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json'}
          def get(path):
              with urllib.request.urlopen(urllib.request.Request(base+path,headers=headers),timeout=45) as r: return r.read()
          previous=(date.fromisoformat(os.environ['OPERATIONAL_DATE'])-timedelta(days=1)).isoformat()
          name='g11-wild4-'+previous.replace('-','')+'-future-oos-locks-encrypted'
          items=json.loads(get('/actions/artifacts?name='+name+'&per_page=100'))['artifacts']
          valid=[]
          for a in items:
              if a['name']!=name or a['expired']: continue
              run=json.loads(get('/actions/runs/'+str(a['workflow_run']['id'])))
              if run['path']=='.github/workflows/g11-morning-odds-footprint-4bet-shadow-v1.yml' and run['head_branch']=='main' and run['conclusion']=='success': valid.append(a)
          if not valid: raise SystemExit('PREVIOUS_DAY_MODEL_REGISTRY_UNAVAILABLE')
          selected=max(valid,key=lambda a:a['created_at'])
          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self,*args,**kwargs): return None
          try:
              urllib.request.build_opener(NoRedirect).open(urllib.request.Request(base+'/actions/artifacts/'+str(selected['id'])+'/zip',headers=headers),timeout=45)
              raise SystemExit('ARTIFACT_REDIRECT_REQUIRED')
          except urllib.error.HTTPError as e:
              if e.code not in (301,302,303,307,308): raise
              location=e.headers['Location']
          if not location.startswith('https://'): raise SystemExit('ARTIFACT_DOWNLOAD_SCHEME')
          # Never forward GitHub Authorization to the signed artifact host.
          with urllib.request.urlopen(location,timeout=60) as response: raw=response.read()
          with zipfile.ZipFile(io.BytesIO(raw)) as z:
              if z.namelist()!=['future-locks.tgz.gpg']: raise SystemExit('REGISTRY_ARCHIVE_SHAPE')
              encrypted=z.read(z.namelist()[0])
          temp=pathlib.Path(os.environ['RUNNER_TEMP']); enc=temp/'registry-prior.gpg';enc.write_bytes(encrypted)
          r=subprocess.run(['gpg','--batch','--yes','--pinentry-mode','loopback','--passphrase-fd','0','--decrypt','--output',str(temp/'registry-prior.tgz'),str(enc)],input=(os.environ['STATE_PASSPHRASE']+'\n').encode(),capture_output=True)
          if r.returncode: raise SystemExit('REGISTRY_DECRYPT_FAILED')
          dest=temp/'registry-prior';dest.mkdir(exist_ok=True)
          with tarfile.open(temp/'registry-prior.tgz','r:gz') as a:
              members=a.getmembers()
              for m in members:
                  q=pathlib.PurePosixPath(m.name)
                  if q.is_absolute() or '..' in q.parts or m.issym() or m.islnk() or not (m.isfile() or m.isdir()): raise SystemExit('UNSAFE_REGISTRY_ARCHIVE')
              a.extractall(dest,filter='data')
          source=dest/'g11-wild4-future-locks/model-registry'
          if not source.is_dir(): raise SystemExit('PREVIOUS_MODEL_REGISTRY_NOT_CONNECTED')
          ledger=temp/'g11-wild4-future-locks';ledger.mkdir(exist_ok=True)
          shutil.copytree(source,ledger/'model-registry')
          print('WILD4_PRIOR_MODEL_REGISTRY=VERIFIED_SOURCE')
          PYCARRY
      - name: Bind one model for the operational day
        if: steps.state-ready.outputs.ready == 'true' && steps.decrypted.outputs.runtime_ready == 'true'
        working-directory: .g11-private
        env:
          OPERATIONAL_DATE: ${{ steps.day.outputs.day }}
          STATE_PASSPHRASE: ${{ secrets.G11_PRIVATE_REPO_TOKEN }}
        run: |
          set -euo pipefail
          if [ -s "${GITHUB_WORKSPACE}/.calibrated-encrypted/calibrated-candidate.tgz.gpg" ]; then
          exec 3<<<"${STATE_PASSPHRASE}"
          gpg --batch --yes --pinentry-mode loopback --passphrase-fd 3 --decrypt \
            --output "${RUNNER_TEMP}/validated-calibration.tgz" "${GITHUB_WORKSPACE}/.calibrated-encrypted/calibrated-candidate.tgz.gpg"
          exec 3<&-
          fi
          python3 - <<'PYBIND'
          import os,pathlib,tarfile,json,sys
          sys.path.insert(0,str(pathlib.Path(os.environ['GITHUB_WORKSPACE'])/'scripts'))
          import hot_delta_transport_v1 as hot
          pathlib.Path('.relay-output').mkdir(exist_ok=True)
          from datetime import datetime,date,timedelta,timezone
          from g11.wild_pack.v1 import wild4_lifecycle_v1 as life
          temp=pathlib.Path(os.environ['RUNNER_TEMP']); day=os.environ['OPERATIONAL_DATE']
          if (temp/'validated-calibration.tgz').is_file():
            with tarfile.open(temp/'validated-calibration.tgz','r:gz') as a:
              for m in a.getmembers():
                  p=pathlib.PurePosixPath(m.name)
                  if p.is_absolute() or '..' in p.parts or m.issym() or m.islnk() or not (m.isfile() or m.isdir()): raise SystemExit('UNSAFE_CALIBRATION_ARCHIVE')
              a.extractall(temp,filter='data')
          prior_complete=False
          if day>='2026-10-13':
              previous=(date.fromisoformat(day)-timedelta(days=1)).isoformat()
              try:
                  feed,_,_=hot.fetch('https://g11-race-lab.higatatsunori2.chatgpt.site/api/g11-feed?date='+previous)
                  prior_complete=(feed.get('operational_date_jst')==previous and feed.get('stage')=='NIGHT' and feed.get('status')=='PASS'
                      and feed.get('counts',{}).get('results')==feed.get('counts',{}).get('races') and feed.get('counts',{}).get('races',0)>0)
                  today,_,_=hot.fetch('https://g11-race-lab.higatatsunori2.chatgpt.site/api/g11-feed?date='+day)
                  deadlines=[datetime.fromisoformat(day+'T'+r['deadline_jst']+':00+09:00') if len(r['deadline_jst'])==5 else datetime.fromisoformat(r['deadline_jst']) for r in today.get('races',[])]
                  prior_complete=bool(prior_complete and today.get('operational_date_jst')==day and deadlines and datetime.now(timezone.utc)<min(deadlines))
              except Exception: prior_complete=False
          selected=life.bind_day(temp/'g11-wild4-future-locks',temp/'g11-wild4-candidate',
              temp/'g11-wild4-calibrated-candidate',day,previous_night_complete=prior_complete,now=datetime.now(timezone.utc))
          info=life.model_info(selected)
          # The legacy audit keeps its complete original input artifact.
          if info['identity']==life.BASE and (temp/'g11-wild4-candidate/model.cbm').is_file(): selected=temp/'g11-wild4-candidate'
          with open(os.environ['GITHUB_ENV'],'a') as out:
              out.write('WILD4_CANDIDATE_ROOT='+str(selected)+'\n')
              out.write('WILD4_CALIBRATED='+str(info['identity']!=life.BASE or not (selected/'wild-bet-shadow-training-input.manifest.json').is_file()).lower()+'\n')
          print('WILD4_DAY_MODEL_IDENTITY='+info['identity'])
          print('WILD4_MODEL_ADOPTION_BOUNDARY='+day)
          PYBIND
      - name: Check for a matching unexpired official odds packet
        if: steps.state-ready.outputs.ready == 'true' && steps.decrypted.outputs.runtime_ready == 'true'
        id: availability
        working-directory: .g11-private
        env:
          OPERATIONAL_DATE: ${{ steps.day.outputs.day }}
        run: |
          python3 - "${GITHUB_WORKSPACE}" <<'PY'
          import os, pathlib, sys
          from datetime import datetime, timezone
          from g11.wild_pack.v1 import wild_bet_training_v1 as train
          from g11.wild_pack.v1 import wild_bet_future_oos_v1 as future
          workspace=pathlib.Path(sys.argv[1])
          day=os.environ['OPERATIONAL_DATE']
          candidate=pathlib.Path(os.environ['WILD4_CANDIDATE_ROOT'])
          binding,registry,model=future.verified_candidate(candidate)
          history=workspace/'${{ steps.decrypted.outputs.store }}'/'g11/wild-pack-oos/morning'/day
          source=history/'bet-prediction-time-odds.manifest.json'
          if source.is_file():
              manifest,odds=train.verified_gzip(source,
                  schema='G11_WILD_BET_OOS_COLLECTION_MANIFEST_V1',kind='ODDS')
              if odds.get('RESULT_DATA_PRESENT') is not False:
                  raise SystemExit('ODDS_HAS_RESULTS')
              records=odds['RECORDS']
          else:
              records=[]
              odds=None
          from g11.wild_pack.v1 import bet_oos_collection_v1 as bet
          from g11.canonical.official_pipeline import OfficialArtifactStore
          source_store=workspace/'${{ steps.decrypted.outputs.store }}'
          upstream_path=history/'bet-upstream.manifest.json'
          if upstream_path.is_file():
              upstream_manifest,upstream=train.verified_gzip(upstream_path,
                  schema='G11_WILD_BET_OOS_COLLECTION_MANIFEST_V1',kind='UPSTREAM')
              official=OfficialArtifactStore(source_store)
              snapshots={}
              for item in upstream['RECORDS']:
                  key=item['PAYLOAD']['STANDARD_RACE_KEY']
                  name='odds3t-'+key.lower()
                  if (source_store/'snapshots/predeadline'/(name+'.json')).is_file():
                      snapshots[key]=official.load_verified_snapshot('predeadline',name)
              direct=bet.attach_prediction_time_odds(upstream,snapshots)
              common={r['STANDARD_RACE_KEY']:r for r in records}
              for item in direct['RECORDS']:
                  key=item['STANDARD_RACE_KEY']
                  if key in common and item['BET_PACKET_HASH']!=common[key]['BET_PACKET_HASH']:
                      raise SystemExit('DIRECT_AND_PERSISTED_ODDS_CONFLICT')
              direct_records=direct['RECORDS']
          else:
              direct_records=[]
          print('WILD4_VERIFIED_DIRECT_SNAPSHOT_COUNT='+str(len(direct_records)))
          chosen=direct if direct_records else odds
          if chosen is not None:
              from g11.wild_pack.v1 import wild_bet_bootstrap_v1 as b
              without_hash={k:v for k,v in chosen.items() if k!='CONTENT_SHA256'}
              if chosen['CONTENT_SHA256']!=train.daily_sha(without_hash):
                  raise SystemExit('RESEARCH_ODDS_READBACK_SHA')
              b._write_json_atomic(pathlib.Path(os.environ['RUNNER_TEMP'])/'wild4-verified-odds-day.json',chosen)
              records=chosen['RECORDS']
          now=datetime.now(timezone.utc)
          direct_due=[r for r in direct_records
              if datetime.fromisoformat(r['UPSTREAM_PACKET']['RACE_DEADLINE_AT'])>now
              and r['UPSTREAM_PACKET']['EVALUATION_CONTEXT_PACK_ID']==binding['EVALUATION_CONTEXT_PACK_ID']]
          print('WILD4_VERIFIED_DIRECT_UNEXPIRED='+str(len(direct_due)))
          if records:
              latest=max(records,key=lambda r:r['ODDS_CAPTURED_AT'])
              captured=datetime.fromisoformat(latest['ODDS_CAPTURED_AT'])
              deadline=datetime.fromisoformat(latest['UPSTREAM_PACKET']['RACE_DEADLINE_AT'])
              print('WILD4_LATEST_CAPTURE_AT='+captured.isoformat())
              print('WILD4_LATEST_CAPTURE_DEADLINE_AT='+deadline.isoformat())
              print('WILD4_LATEST_CAPTURE_MARGIN_SECONDS='+str(int((deadline-captured).total_seconds())))
              print('WILD4_LATEST_CAPTURE_AGE_SECONDS='+str(int((now-captured).total_seconds())))
          due=[r for r in records if datetime.fromisoformat(r['UPSTREAM_PACKET']['RACE_DEADLINE_AT'])>now
               and r['UPSTREAM_PACKET']['EVALUATION_CONTEXT_PACK_ID']==binding['EVALUATION_CONTEXT_PACK_ID']]
          with open(os.environ['GITHUB_OUTPUT'],'a',encoding='utf-8') as output:
              output.write('due='+('true' if due else 'false')+'\n')
          print('WILD4_ODDS_DAY_CONSIDERED='+str(len(records)))
          print('WILD4_MATCHING_UNEXPIRED='+str(len(due)))
          PY
      - name: Verify frozen WILD4 inference runtime
        if: inputs.lineage_readback_date == '' && steps.state-ready.outputs.ready == 'true' && steps.decrypted.outputs.runtime_ready == 'true'
        working-directory: .g11-private
