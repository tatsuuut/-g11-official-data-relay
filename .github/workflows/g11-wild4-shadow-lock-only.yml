name: G11 WILD4 prospective shadow lock only

on:
  push:
    branches:
      - codex/wild4-shadow-training-20261003
    paths:
      - .github/workflows/g11-wild4-shadow-lock-only.yml
  workflow_call:
    inputs:
      predeadline_checkpoint_key:
        description: Exact verified early capture checkpoint; no stale fallback
        type: string
        required: false
        default: ""
      night_checkpoint_key:
        description: Exact saved and read-back NIGHT checkpoint; no fallback when supplied
        type: string
        required: false
        default: ""
      lineage_readback_date:
        description: Read-only promotion readback of existing 2026-10-07 lineage
        type: string
        required: false
        default: ""

permissions:
  actions: read
  contents: read
  id-token: write

concurrency:
  group: g11-wild4-prospective-shadow-lock
  cancel-in-progress: false

jobs:
  lock-future-only:
    if: github.repository_id == '1367703708'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      TZ: Asia/Tokyo
    steps:
      - name: Prepare pinned WILD4 dependency before state acquisition
        if: inputs.lineage_readback_date == ''
        run: |
          python3 - <<'PYDEPENDENCY'
          import importlib.metadata, subprocess, sys, time
          from datetime import datetime, timezone
          started=time.monotonic()
          print('WILD4_DEPENDENCY_PREP_STARTED_AT='+datetime.now(timezone.utc).isoformat(),flush=True)
          try:
              installed=importlib.metadata.version('catboost')
          except importlib.metadata.PackageNotFoundError:
              installed=None
          if installed != '1.2.8':
              subprocess.run([sys.executable,'-m','pip','install','--disable-pip-version-check','--no-input','catboost==1.2.8'],check=True,timeout=180)
              action='INSTALLED_PINNED'
          else:
              action='REUSED_PINNED'
          # Re-enter Python after installation: a newly created user site is
          # not on the already-running interpreter's sys.path.
          subprocess.run([sys.executable,'-c',
              "import importlib.metadata; assert importlib.metadata.version('catboost') == '1.2.8'; from catboost import CatBoostClassifier"],check=True,timeout=30)
          print('WILD4_DEPENDENCY_PREP_ACTION='+action)
          print('WILD4_DEPENDENCY_PREP_READY_AT='+datetime.now(timezone.utc).isoformat())
          print('WILD4_DEPENDENCY_PREP_SECONDS='+format(time.monotonic()-started,'.3f'))
          PYDEPENDENCY
      - name: Checkout isolated research branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: codex/wild4-shadow-training-20261003
          persist-credentials: false
      - name: Bind the current operational date
        id: day
        env:
          UPSTREAM_RUN_TITLE: ${{ github.event.workflow_run.display_title }}
          REQUESTED_DAY: ${{ github.event.inputs.operational_date }}
          REQUESTED_MODE: ${{ github.event.inputs.mode }}
          LINEAGE_READBACK_DATE: ${{ inputs.lineage_readback_date }}
          NIGHT_CHECKPOINT_KEY: ${{ inputs.night_checkpoint_key }}
          PREDEADLINE_CHECKPOINT_KEY: ${{ inputs.predeadline_checkpoint_key }}
        run: |
          python3 - <<'PY'
          import os, re
          from datetime import datetime, timedelta
          from zoneinfo import ZoneInfo
          title=os.environ.get('UPSTREAM_RUN_TITLE','')
          readback=os.environ.get('LINEAGE_READBACK_DATE','')
          if readback:
              if readback!='2026-10-07': raise SystemExit('READBACK_DATE_NOT_AUTHORIZED')
              day=readback
          elif os.environ['GITHUB_EVENT_NAME'] in {'push','schedule'}:
              day=datetime.now(ZoneInfo('Asia/Tokyo')).date().isoformat()
          elif os.environ['GITHUB_EVENT_NAME']=='workflow_dispatch':
              day=os.environ.get('REQUESTED_DAY','')
              if re.fullmatch(r'20[0-9]{2}-[0-9]{2}-[0-9]{2}',day) is None:
                  raise SystemExit('REQUESTED_DAY_MISMATCH')
          else:
              match=re.fullmatch(r'LIVE-predeadline-(20[0-9]{2}-[0-9]{2}-[0-9]{2})',title)
              if match is not None:
                  day=match.group(1)
              elif title=='LIVE-predeadline-':
                  day=datetime.now(ZoneInfo('Asia/Tokyo')).date().isoformat()
              else:
                  raise SystemExit('UPSTREAM_RUN_TITLE_MISMATCH')
          now_jst=datetime.now(ZoneInfo('Asia/Tokyo'))
          # Match the normal NIGHT lane's previous-day window before 02:00 JST.
          # This exception is settlement-only; expired predictions are never generated.
          night_rollover=(not readback and os.environ['GITHUB_EVENT_NAME']=='workflow_dispatch'
              and os.environ.get('REQUESTED_MODE','')=='wild4-settle'
              and now_jst.hour<2
              and day==(now_jst.date()-timedelta(days=1)).isoformat())
          if not readback and day!=now_jst.date().isoformat() and not night_rollover:
              raise SystemExit('NON_CURRENT_OPERATIONAL_DATE')
          checkpoint=os.environ.get('NIGHT_CHECKPOINT_KEY','')
          if checkpoint and (os.environ.get('REQUESTED_MODE')!='wild4-settle' or readback
              or re.fullmatch(r'g11-state-v4-published-'+re.escape(day)+r'-[0-9]+-[0-9]+-checkpoint',checkpoint) is None):
              raise SystemExit('NIGHT_CHECKPOINT_IDENTITY')
          live_checkpoint=os.environ.get('PREDEADLINE_CHECKPOINT_KEY','')
          if live_checkpoint and (checkpoint or readback or os.environ.get('REQUESTED_MODE')!='wild4'
              or re.fullmatch(r'g11-state-v4-critical-'+re.escape(day)+r'-[0-9]+',live_checkpoint) is None):
              raise SystemExit('PREDEADLINE_CHECKPOINT_IDENTITY')
          with open(os.environ['GITHUB_OUTPUT'],'a',encoding='utf-8') as output:
              output.write('day='+day+'\n')
              output.write('night_rollover='+str(night_rollover).lower()+'\n')
              output.write('lifecycle_enabled='+str(day>='2026-10-13').lower()+'\n')
              output.write('artifact_name=g11-wild4-'+day.replace('-','')+'-future-oos-locks-encrypted\n')
          print('WILD4_SHADOW_OPERATIONAL_DATE='+day)
          PY
      - name: Restore current encrypted canonical state
        id: canonical-cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: .relay-cache/state.tgz.gpg
          key: ${{ inputs.predeadline_checkpoint_key || inputs.night_checkpoint_key || format('g11-state-v4-{0}-isolated-shadow-no-exact-match', steps.day.outputs.day) }}
          restore-keys: ${{ inputs.predeadline_checkpoint_key == '' && inputs.night_checkpoint_key == '' && format('g11-state-v4-published-{0}-', steps.day.outputs.day) || '' }}
      - name: Verify current canonical state availability
        id: state-ready
        run: |
          if [ -n '${{ inputs.predeadline_checkpoint_key || inputs.night_checkpoint_key }}' ] && [ '${{ steps.canonical-cache.outputs.cache-hit }}' != true ]; then
            echo 'WILD4_REQUESTED_CHECKPOINT_MISSING' >&2
            exit 1
          fi
          if [ -s .relay-cache/state.tgz.gpg ]; then
            echo 'ready=true' >> "${GITHUB_OUTPUT}"
          else
            echo 'ready=false' >> "${GITHUB_OUTPUT}"
            echo 'WILD4_WAITING_CURRENT_CANONICAL_STATE; no decryption attempted'
          fi
      - name: Retrieve exact frozen encrypted candidate
        continue-on-error: true
        if: steps.state-ready.outputs.ready == 'true'
        uses: actions/download-artifact@v4
        with:
          name: g11-wild4-frozen-shadow-candidate-encrypted
          run-id: 37080452963
          github-token: ${{ github.token }}
          path: .candidate-encrypted
      - name: Retrieve existing verified calibration artifact
        if: steps.state-ready.outputs.ready == 'true'
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: g11-wild4-temperature-v3-candidate-encrypted-38194510075
          run-id: 38194510075
          github-token: ${{ github.token }}
          path: .calibrated-encrypted
      - name: Identify the most recent encrypted shadow ledger
        if: steps.state-ready.outputs.ready == 'true'
        id: prior
        env:
          GH_TOKEN: ${{ github.token }}
          OPERATIONAL_DATE: ${{ steps.day.outputs.day }}
        run: |
          set -euo pipefail
          name="g11-wild4-${OPERATIONAL_DATE//-/}-future-oos-locks-encrypted"
          id=''
          selected_run=''
          # Find ledgers by their exact day artifact name, independently of
          # the number of intervening LIVE runs with no new lock.
          curl --fail-with-body --silent --show-error --retry 3 \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts?name=${name}&per_page=100" \
            -o "${RUNNER_TEMP}/observer-artifacts.json"
          ledger_candidates="$(jq -r --arg name "${name}" '
            [.artifacts[] | select(.name == $name and .expired == false)]
            | sort_by(.created_at) | reverse | .[]
            | [.id, .workflow_run.id] | @tsv' "${RUNNER_TEMP}/observer-artifacts.json")"
          while IFS=$'\t' read -r artifact_id run_id; do
            [ -n "${artifact_id}" ] || continue
            [ "${run_id}" != "${GITHUB_RUN_ID}" ] || continue
            curl --fail-with-body --silent --show-error --retry 3 \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}" \
              -o "${RUNNER_TEMP}/observer-ledger-run.json"
            if jq -e '
              .conclusion == "success" and (
                (.path == ".github/workflows/g11-wild4-shadow-lock-only.yml"
                  and .head_branch == "codex/wild4-shadow-training-20261003")
                or (.path == ".github/workflows/g11-morning-odds-footprint-4bet-shadow-v1.yml"
                  and (.event == "workflow_run" or .event == "schedule" or .event == "push" or .event == "workflow_dispatch") and .head_branch == "main")
              )' "${RUNNER_TEMP}/observer-ledger-run.json" >/dev/null; then
              id="${artifact_id}"
              selected_run="${run_id}"
              break
            fi
          done <<< "${ledger_candidates}"
          # A rerun of the same GitHub run must not manufacture a replacement
          # ledger when that run already has an immutable artifact.
          self_artifacts="$(curl --fail-with-body --silent --show-error --retry 3 \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/artifacts?per_page=100")"
          if printf '%s' "${self_artifacts}" | jq -e --arg name "${name}" \
            'any(.artifacts[]; .name == $name and .expired == false)' >/dev/null; then
            echo 'WILD4_SAME_RUN_ARTIFACT_RERUN_FORBIDDEN' >&2
            exit 1
          fi
          if [ -z "${id}" ] && [ "${OPERATIONAL_DATE}" = '2026-10-03' ]; then
            id='11258679601'
            selected_run='37083260709'
          fi
          echo "id=${id}" >> "${GITHUB_OUTPUT}"
          echo "run_id=${selected_run}" >> "${GITHUB_OUTPUT}"
          if [ -z "${id}" ]; then echo 'WILD4_PRIOR_LEDGER=NONE'; else echo 'WILD4_PRIOR_LEDGER=FOUND'; fi
      - name: Retrieve exact prior encrypted shadow ledger
        if: steps.state-ready.outputs.ready == 'true' && (steps.prior.outputs.id != '')
        uses: actions/download-artifact@v4
        with:
          name: ${{ steps.day.outputs.artifact_name }}
          run-id: ${{ steps.prior.outputs.run_id }}
          github-token: ${{ github.token }}
          path: .prior-encrypted
      - name: Checkout frozen shadow source
        if: steps.state-ready.outputs.ready == 'true'
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: tatsuuut/boat-brain-lab
          ref: 67d6ed0862f8bb91c7ee827023a86480aa00eb2f
          token: ${{ secrets.G11_PRIVATE_REPO_TOKEN }}
          path: .g11-private
          persist-credentials: false
      - name: Decrypt verified state and candidate
        id: decrypted
        if: steps.state-ready.outputs.ready == 'true'
        env:
          OPERATIONAL_DATE: ${{ steps.day.outputs.day }}
          STATE_PASSPHRASE: ${{ secrets.G11_PRIVATE_REPO_TOKEN }}
          PREDEADLINE_CHECKPOINT_KEY: ${{ inputs.predeadline_checkpoint_key }}
        run: |
          set -euo pipefail
          test -s .relay-cache/state.tgz.gpg
          test -n "${STATE_PASSPHRASE}"
          exec 3<<<"${STATE_PASSPHRASE}"
          gpg --batch --yes --pinentry-mode loopback --passphrase-fd 3 \
            --decrypt --output "${RUNNER_TEMP}/g11-state.tgz" .relay-cache/state.tgz.gpg
          exec 3<&-
          if [ -s .candidate-encrypted/g11-wild4-candidate.tgz.gpg ]; then
          exec 3<<<"${STATE_PASSPHRASE}"
          gpg --batch --yes --pinentry-mode loopback --passphrase-fd 3 \
            --decrypt --output "${RUNNER_TEMP}/candidate.tgz" .candidate-encrypted/g11-wild4-candidate.tgz.gpg
          exec 3<&-
          fi
          python3 - <<'PY'
          import json, os, pathlib, tarfile, hashlib
          root=pathlib.Path(os.environ['RUNNER_TEMP'])
          for archive,dest in ((root/'g11-state.tgz',pathlib.Path('.relay-state')),
                               (root/'candidate.tgz',root)):
              if not archive.is_file(): continue
              dest.mkdir(exist_ok=True)
              with tarfile.open(archive,'r:gz') as handle:
                  members=handle.getmembers()
                  if not members: raise SystemExit('EMPTY_ARCHIVE')
                  for member in members:
                      path=pathlib.PurePosixPath(member.name)
                      if path.is_absolute() or '..' in path.parts or member.issym() or member.islnk():
                          raise SystemExit('UNSAFE_ARCHIVE')
                  handle.extractall(dest,filter='data')
          state=json.loads(pathlib.Path('.relay-state/relay-state.json').read_text())
          if state.get('OPERATIONAL_DATE_JST')!=os.environ['OPERATIONAL_DATE']:
              raise SystemExit('STATE_DATE_MISMATCH')
          def verify_early_checkpoint(root, state, day, key):
              if not key:
                  return
              import re
              match=re.fullmatch(r'g11-state-v4-critical-'+re.escape(day)+r'-([0-9]+)',key)
              critical=state.get('CRITICAL',{})
              if (match is None or state.get('OPERATIONAL_DATE_JST')!=day
                  or state.get('MORNING_COMPLETE') is not True
                  or critical.get('SCHEMA')!='G11_PREDEADLINE_CRITICAL_CHECKPOINT_V1'
                  or critical.get('CRITICAL_CHECKPOINT_STATUS')!='PASS'
                  or critical.get('OPERATIONAL_DATE')!=day
                  or critical.get('LAST_CRITICAL_RUN_ID')!=match.group(1)
                  or critical.get('POST_DEADLINE_GENERATION')!=0):
                  raise ValueError('WILD4_EARLY_CHECKPOINT_BINDING')
              digest=hashlib.sha256()
              for path in sorted(p for p in (root/'store').rglob('*') if p.is_file() and not p.is_symlink()):
                  name=path.relative_to(root/'store').as_posix().encode()
                  digest.update(len(name).to_bytes(8,'big')); digest.update(name)
                  with path.open('rb') as handle:
                      while chunk:=handle.read(1024*1024): digest.update(chunk)
              if digest.hexdigest()!=critical.get('CRITICAL_CHECKPOINT_SHA'):
                  raise ValueError('WILD4_EARLY_CHECKPOINT_HASH')
              authority=json.loads((root/'daily-runtime'/day/'authority.json').read_bytes())
              if (authority.get('operational_date_jst')!=day or authority.get('immutable') is not True
                  or authority.get('authority_sha256')!=critical.get('AUTHORITY_SHA256')
                  or authority.get('runtime_source_sha')!=critical.get('RUNTIME_SOURCE_SHA')):
                  raise ValueError('WILD4_EARLY_CHECKPOINT_AUTHORITY')
          verify_early_checkpoint(pathlib.Path('.relay-state'),state,os.environ['OPERATIONAL_DATE'],
                                  os.environ.get('PREDEADLINE_CHECKPOINT_KEY',''))
          ready=state.get('MORNING_COMPLETE') is True
          rescue=False
          path=pathlib.Path('.relay-state/rescue/boundary.json')
          if not ready and path.is_file():
              cert=json.loads(path.read_bytes()); unsigned=dict(cert)
              sha=unsigned.pop('authority_sha256',None)
              canonical=json.dumps(unsigned,ensure_ascii=False,sort_keys=True,separators=(',',':'),allow_nan=False).encode()
              rescue=(cert.get('operational_date_jst')==os.environ['OPERATIONAL_DATE'] and (os.environ['OPERATIONAL_DATE'] in {'2026-10-06','2026-10-21'} or os.environ['OPERATIONAL_DATE'] >= '2026-10-22')
                  and cert.get('schema')==('G11_DELAYED_MORNING_RECOVERY_BOUNDARY_V1' if os.environ['OPERATIONAL_DATE']>='2026-10-21' else 'G11_SAME_DAY_RESCUE_BOUNDARY_V1')
                  and cert.get('canonical_morning_promoted') is False
                  and cert.get('research_eligible') is False
                  and cert.get('same_day_results_used') is False
                  and sha==hashlib.sha256(canonical).hexdigest()
                  and not pathlib.Path('.relay-state/store/snapshots/morning/official-day-input.json').exists()
                  and (os.environ['OPERATIONAL_DATE']>='2026-10-21' or not pathlib.Path('.relay-state/daily-runtime/2026-10-06/authority.json').exists()))
              if not rescue: raise SystemExit('WILD4_RESCUE_BOUNDARY_INVALID')
          AUTONOMOUS_FROM = "2026-10-22"
          from datetime import datetime
          def is_future_rescue_day(day):
              try:
                  return isinstance(day, str) and datetime.fromisoformat(day).date().isoformat() == day and day >= AUTONOMOUS_FROM
              except ValueError:
                  return False
          def require(ok, reason):
              if not ok:
                  raise RuntimeError("DELAYED_LIVE:" + reason)
          def canonical(value):
              return json.dumps(value, ensure_ascii=False, sort_keys=True,
                                separators=(",", ":"), allow_nan=False).encode()
          def sha(data):
              return hashlib.sha256(data).hexdigest()
          def validate_future_boundary(cert, parent, day):
              """Future automatic continuation cannot change the day's frozen runtime."""
              require(is_future_rescue_day(day), "FUTURE_DAY")
              require(parent.get("schema") == "G11_DAILY_RUNTIME_AUTHORITY_V1"
                      and cert.get("runtime_source_sha") == parent.get("runtime_source_sha")
                      and cert.get("source_files") == parent.get("source_files")
                      and cert.get("source_delta") == [], "FUTURE_PINNED_SOURCE")
              require(bool(cert.get("model_files")) and cert["model_files"] == parent.get("model_files")
                      and cert.get("model_set_sha256") == sha(canonical(cert["model_files"])), "FUTURE_PINNED_MODELS")
              require(cert.get("safety_margin_seconds") == 300
                      and all(cert.get(k) == parent.get(k) and isinstance(cert.get(k), dict)
                              and cert[k].get("source_sha") == cert["runtime_source_sha"]
                              for k in ("p3", "abeken_v53", "wild", "true_ai")), "FUTURE_RUNTIME_BINDINGS")
          if os.environ['OPERATIONAL_DATE'] >= AUTONOMOUS_FROM and rescue:
              parent_path=pathlib.Path('.relay-state/daily-runtime')/os.environ['OPERATIONAL_DATE']/'authority.json'
              parent=json.loads(parent_path.read_bytes()); unsigned_parent=dict(parent)
              parent_sha=unsigned_parent.pop('authority_sha256',None)
              require(parent_sha==sha(canonical(unsigned_parent))==cert.get('parent_authority_sha256')
                  and parent.get('operational_date_jst')==os.environ['OPERATIONAL_DATE'] and parent.get('immutable') is True
                  and cert.get('immutable') is True
                  and not any(pathlib.Path('.relay-state/store/snapshots/morning').glob('*.json')), 'FUTURE_PARENT_AUTHORITY')
              validate_future_boundary(cert,parent,os.environ['OPERATIONAL_DATE'])
          with open(os.environ['GITHUB_OUTPUT'],'a') as out:
              out.write('canonical_ready='+str(ready).lower()+'\n')
              out.write('runtime_ready='+str(ready or rescue).lower()+'\n')
              out.write('store='+('.relay-state/rescue/store' if rescue else '.relay-state/store')+'\n')
          print('WILD4_STATE_MODE='+('RESCUE_PROSPECTIVE_SHADOW_ONLY' if rescue else 'CANONICAL' if ready else 'WAITING'))
          PY
      - name: Restore and verify earlier immutable SHADOW locks
        if: steps.state-ready.outputs.ready == 'true' && steps.decrypted.outputs.runtime_ready == 'true'
        env:
          OPERATIONAL_DATE: ${{ steps.day.outputs.day }}
          STATE_PASSPHRASE: ${{ secrets.G11_PRIVATE_REPO_TOKEN }}
          CANONICAL_READY: ${{ steps.decrypted.outputs.canonical_ready }}
          SETTLEMENT_ONLY: ${{ (github.event_name == 'schedule' && github.event.schedule == '25,40,55 13 * * *') || (github.event_name == 'workflow_dispatch' && github.event.inputs.mode == 'wild4-settle') }}
        run: |
          set -euo pipefail
          if [ ! -e .prior-encrypted/future-locks.tgz.gpg ]; then
            echo 'WILD4_PRIOR_LOCKS=0'
            exit 0
          fi
          exec 3<<<"${STATE_PASSPHRASE}"
          gpg --batch --yes --pinentry-mode loopback --passphrase-fd 3 \
            --decrypt --output "${RUNNER_TEMP}/prior-locks.tgz" .prior-encrypted/future-locks.tgz.gpg
          exec 3<&-
          python3 - <<'PY'
          import json, os, pathlib, re, tarfile, hashlib
          from datetime import datetime
          root=pathlib.Path(os.environ['RUNNER_TEMP'])
          with tarfile.open(root/'prior-locks.tgz','r:gz') as archive:
              members=archive.getmembers()
              if not members: raise SystemExit('PRIOR_LOCKS_EMPTY_ARCHIVE')
              for member in members:
                  path=pathlib.PurePosixPath(member.name)
                  if path.is_absolute() or '..' in path.parts or path.parts[0]!='g11-wild4-future-locks' or member.issym() or member.islnk():
                      raise SystemExit('PRIOR_LOCKS_UNSAFE_ARCHIVE')
              archive.extractall(root,filter='data')
          out=root/'g11-wild4-future-locks'
          if not (out/'batch-manifest.json').is_file():
              # A verified pre-first-LOCK model checkpoint has no batch yet.
              # Any saved race without its batch remains a hard failure.
              pattern=re.compile(r'[0-9]{8}-[0-9]{2}-(?:0[1-9]|1[0-2])')
              if any(pattern.fullmatch(p.stem) for p in out.rglob('*.json')):
                  raise SystemExit('PRIOR_LOCKS_WITHOUT_MANIFEST')
              import sys
              sys.path.insert(0,str(pathlib.Path(os.environ['GITHUB_WORKSPACE'])/'.g11-private'))
              from g11.wild_pack.v1 import wild4_lifecycle_v1 as life
              pin=life.read(out/'day-model-binding.json')
              state=life.read(life.state_path(out))
              if (pin.get('schema')!='G11_WILD4_DAY_MODEL_BINDING_V1'
                  or pin.get('date')!=os.environ['OPERATIONAL_DATE']
                  or pin.get('authority')!=life.AUTHORITY
                  or state.get('schema')!='G11_WILD4_LIFECYCLE_V1'
                  or state.get('authority')!=life.AUTHORITY
                  or state.get('active')!=pin.get('model')
                  or life.model_info(out/'model-registry/models'/pin['model']['identity'])!=pin['model']):
                  raise SystemExit('PRIOR_MODEL_ONLY_BINDING')
              print('WILD4_PRIOR_LEDGER=VERIFIED_MODEL_ONLY_CHECKPOINT')
              print('WILD4_PRIOR_LOCKS=0')
              print('WILD4_PRIOR_MODEL_IDENTITY='+pin['model']['identity'])
              raise SystemExit(0)
          manifest=json.loads((out/'batch-manifest.json').read_text())
          value={key:item for key,item in manifest.items() if key!='CONTENT_SHA256'}
          canonical=json.dumps(value,ensure_ascii=False,sort_keys=True,separators=(',',':'))+'\n'
          if hashlib.sha256(canonical.encode()).hexdigest()!=manifest['CONTENT_SHA256']:
              raise SystemExit('PRIOR_MANIFEST_SHA')
          expected=manifest['CANDIDATE_MODEL_SHA256']
          if (manifest['CANDIDATE_MODEL_SHA256']!=expected or
              re.fullmatch(r'[0-9a-f]{64}',manifest['CANDIDATE_INPUT_SHA256']) is None or
