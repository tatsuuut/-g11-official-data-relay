        env:
          OPERATIONAL_DATE: ${{ steps.day.outputs.day }}
          LINEAGE_READBACK_DATE: ${{ inputs.lineage_readback_date }}
        run: |
          set -euo pipefail
          if [ ! -s "${RUNNER_TEMP}/g11-wild4-future-locks/batch-manifest.json" ] || [ ! -s "${RUNNER_TEMP}/wild4-verified-odds-day.json" ]; then
            echo 'GORIPAN_PUBLIC_PROJECTION=WAITING_CANONICAL_LOCK'
            exit 0
          fi
          if [ -n "${LINEAGE_READBACK_DATE}" ]; then
            python3 -m unittest g11.wild_pack.v1.test_goripan_public_projection_v1
          fi
          python3 -m g11.wild_pack.v1.goripan_public_projection_v1 \
            --ledger "${RUNNER_TEMP}/g11-wild4-future-locks" \
            --odds-day "${RUNNER_TEMP}/wild4-verified-odds-day.json" \
            --operational-date "${OPERATIONAL_DATE}" \
            --store "${GITHUB_WORKSPACE}/${{ steps.decrypted.outputs.store }}" \
            --candidate-root "${WILD4_CANDIDATE_ROOT}" \
            --output "${RUNNER_TEMP}/goripan-public-projection.json"
          echo 'ready=true' >> "${GITHUB_OUTPUT}"
      - name: Deliver WILD4 public projection and verify exact Site GET readback
        if: steps.public-projection.outputs.ready == 'true'
        continue-on-error: true
        env:
          OPERATIONAL_DATE: ${{ steps.day.outputs.day }}
        run: |
          python3 - <<'PY'
          import hashlib,json,os,pathlib,subprocess,sys,urllib.parse,urllib.request
          base='https://g11-race-lab.higatatsunori2.chatgpt.site'
          raw=(pathlib.Path(os.environ['RUNNER_TEMP'])/'goripan-public-projection.json').read_bytes()
          projection=json.loads(raw)
          audience='g11-race-lab'
          url=os.environ['ACTIONS_ID_TOKEN_REQUEST_URL']
          request=urllib.request.Request(url+('&' if '?' in url else '?')+'audience='+audience,
              headers={'Authorization':'Bearer '+os.environ['ACTIONS_ID_TOKEN_REQUEST_TOKEN']})
          with urllib.request.urlopen(request,timeout=30) as response:
              token=json.load(response)['value']
          # Use the existing Site transport's curl path; keep the bearer off argv.
          output=pathlib.Path(os.environ['RUNNER_TEMP'])/'goripan-delivery-response.json'
          request_path=pathlib.Path(os.environ['RUNNER_TEMP'])/'goripan-public-projection.json'
          headers='Authorization: Bearer '+token+'\nContent-Type: application/json\nX-G11-Feed-Sha256: '+hashlib.sha256(raw).hexdigest()+'\n'
          sent=subprocess.run(['curl','--silent','--show-error','--max-time','45','-X','POST',
              base+'/api/g11-wild4-projection','--header','@-','--data-binary','@'+str(request_path),
              '--output',str(output),'--write-out','%{http_code}'],input=headers,capture_output=True,text=True)
          if sent.returncode: raise SystemExit('GORIPAN_DELIVERY_TRANSPORT_FAILED')
          try: saved=json.loads(output.read_bytes())
          except ValueError: raise SystemExit('GORIPAN_DELIVERY_HTTP_'+sent.stdout+'_NON_JSON')
          if saved.get('status')!='PASS': raise SystemExit('GORIPAN_DELIVERY_HTTP_'+sent.stdout+':'+str(saved.get('error')))
          query=urllib.parse.urlencode({'view':'v53-final','date':os.environ['OPERATIONAL_DATE']})
          sys.path.insert(0,'scripts')
          import hot_delta_transport_v1 as hot
          pathlib.Path('.relay-output').mkdir(exist_ok=True)
          feed,readback_headers,data=hot.fetch(base+'/api/g11-feed?'+query)
          expected=readback_headers['x-g11-feed-sha256']
          if hashlib.sha256(data).hexdigest()!=expected: raise SystemExit('SITE_GET_SHA')
          feed=json.loads(data)
          if feed.get('goripan',{}).get('status')!='VERIFIED_CANONICAL_PROJECTION': raise SystemExit('SITE_PROJECTION_STATUS')
          races={r['key']:r for r in feed['races']}
          for lock in projection['races']:
              actual=races[lock['race_key']].get('wild_pack',{}).get('wild4',{}).get('goripan')
              if actual!=lock: raise SystemExit('SITE_LOCK_READBACK_MISMATCH')
          if feed.get('goripan',{}).get('observation',{}).get('lifecycle') != projection.get('observation',{}).get('lifecycle'): raise SystemExit('SITE_LIFECYCLE_READBACK_MISMATCH')
          print('GORIPAN_LIFECYCLE_READBACK='+json.dumps(projection.get('observation',{}).get('lifecycle'),sort_keys=True))
          print('GORIPAN_SITE_GET_READBACK=PASS')
          print('GORIPAN_SAVED_LOCKS='+str(len(projection['races'])))
          print('GORIPAN_ABSTAIN='+str(sum(r['abstain'] for r in projection['races'])))
          print('GORIPAN_BET_COUNTS='+json.dumps(sorted({r['bet_count'] for r in projection['races']})))
          print('GORIPAN_SOURCE_LOCK_MUTATION=0')
          print('GORIPAN_UNVERIFIED_CANDIDATE_PROMOTION=false')
          PY

