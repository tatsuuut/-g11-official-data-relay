      - name: Lock future races before deadline without any production write
        if: inputs.lineage_readback_date == '' && steps.day.outputs.night_rollover != 'true' && steps.state-ready.outputs.ready == 'true' && steps.decrypted.outputs.runtime_ready == 'true' && (steps.availability.outputs.due == 'true')
        env:
          OPERATIONAL_DATE: ${{ steps.day.outputs.day }}
        working-directory: .g11-private
        run: |
          set -euo pipefail
          python3 - "${GITHUB_WORKSPACE}" "${RUNNER_TEMP}" "${OPERATIONAL_DATE}" <<'PY'
          import json, os, pathlib, sys
          from datetime import datetime, timezone
          from catboost import CatBoostClassifier
          from g11.wild_pack.v1 import wild_bet_bootstrap_v1 as b
          from g11.wild_pack.v1 import wild_bet_training_v1 as train
          from g11.wild_pack.v1 import wild_bet_future_oos_v1 as future
          workspace, temp=map(pathlib.Path,sys.argv[1:3])
          candidate=pathlib.Path(os.environ['WILD4_CANDIDATE_ROOT'])
          binding,registry,model_path=future.verified_candidate(candidate)
          from g11.wild_pack.v1 import wild4_lifecycle_v1 as life
          pin=life.read(temp/'g11-wild4-future-locks/day-model-binding.json')
          if life.model_info(candidate)!=pin['model']: raise SystemExit('DAY_MODEL_BINDING_MISMATCH')
          odds_day=b.load_json(temp/'wild4-verified-odds-day.json')
          source_sha=odds_day.get('CONTENT_SHA256')
          if (source_sha!=train.daily_sha({k:v for k,v in odds_day.items() if k!='CONTENT_SHA256'})
              or odds_day.get('SCHEMA')!='G11_WILD_BET_PREDICTION_TIME_ODDS_DAY_V1'
              or odds_day.get('RESULT_DATA_PRESENT') is not False):
              raise SystemExit('ODDS_DAY_IDENTITY')
          model=CatBoostClassifier(); model.load_model(str(model_path))
          contract=b.load_json(pathlib.Path('g11/wild_pack/v1/BET_MODEL_CONTRACT_V1.json'))
          out=temp/'g11-wild4-future-locks'; out.mkdir(exist_ok=True)
          import re
          key_pattern=re.compile(r'[0-9]{8}-[0-9]{2}-(?:0[1-9]|1[0-2])')
          existing=[p for p in out.glob('*.json') if key_pattern.fullmatch(p.stem)]
          def retain_existing_lock(stored, row, binding, sha256_value):
              # The ledger fixes one prediction per race. Newer odds are not
              # the original prediction input and must not replace that LOCK.
              unsigned=dict(stored); digest=unsigned.pop('CONTENT_SHA256',None)
              deadline=datetime.fromisoformat(stored['RACE_DEADLINE_AT'])
              locked_at=datetime.fromisoformat(stored['LOCKED_AT'])
              checks={
                  'content': digest==sha256_value(unsigned),
                  'status': stored.get('STATUS')=='LOCKED_BEFORE_RESULT',
                  'registry': stored.get('CANDIDATE_REGISTRY_SHA256')==binding['REGISTRY_SHA256'],
                  'model': stored.get('CANDIDATE_MODEL_SHA256')==binding['MODEL_SHA256'],
                  'race': stored.get('STANDARD_RACE_KEY')==row['STANDARD_RACE_KEY'],
                  'deadline': deadline==datetime.fromisoformat(row['UPSTREAM_PACKET']['RACE_DEADLINE_AT']),
                  'timely': locked_at.tzinfo is not None and deadline.tzinfo is not None and locked_at<deadline,
                  'input': re.fullmatch(r'[0-9a-f]{64}',str(stored.get('INPUT_PACKET_SHA256'))) is not None,
                  'odds': re.fullmatch(r'[0-9a-f]{64}',str(stored.get('ODDS_SNAPSHOT_SHA256'))) is not None,
                  'production': stored.get('PRODUCTION_BETS_CHANGED') is False,
                  'result': stored.get('OFFICIAL_RESULT_USED') is False,
              }
              failed=[name for name,ok in checks.items() if not ok]
              if failed: raise RuntimeError('IMMUTABLE_SHADOW_LOCK_READBACK:'+','.join(failed))
              return stored['INPUT_PACKET_SHA256']!=row['BET_PACKET_HASH']
          considered=expired=pack_mismatch=locked=retained=0
          for row in sorted(odds_day['RECORDS'],key=lambda value:value['STANDARD_RACE_KEY']):
              considered+=1
              packet=row['UPSTREAM_PACKET']; now=datetime.now(timezone.utc)
              deadline=datetime.fromisoformat(packet['RACE_DEADLINE_AT'])
              path=out/(row['STANDARD_RACE_KEY']+'.json')
              if path.exists():
                  prior_bytes=path.read_bytes()
                  changed=retain_existing_lock(b.load_json(path),row,binding,b.sha256_value)
                  if path.read_bytes()!=prior_bytes: raise SystemExit('RETAINED_LOCK_BYTES_CHANGED')
                  print('WILD4_RETAINED_LOCK_READBACK='+json.dumps({'race_key':row['STANDARD_RACE_KEY'],'newer_input_ignored':changed,'lock_mutated':False},sort_keys=True))
                  retained+=1; continue
              if now>=deadline:
                  expired+=1; continue
              if packet['EVALUATION_CONTEXT_PACK_ID']!=binding['EVALUATION_CONTEXT_PACK_ID']:
                  pack_mismatch+=1; continue
              future.predict_and_lock(row,candidate,contract,path,now=now,predictor=model)
              saved=b.load_json(path)
              print('WILD4_SAVED_TIMING='+json.dumps({'race_key':row['STANDARD_RACE_KEY'],'odds_captured_at':row['ODDS_CAPTURED_AT'],'decision_started_at':now.isoformat(),'locked_at':saved['LOCKED_AT'],'save_readback_at':datetime.now(timezone.utc).isoformat(),'deadline_at':packet['RACE_DEADLINE_AT'],'buy_count':saved['BUY_COUNT']},sort_keys=True))
              try:
                  life.observe_challenger(out,row,contract,now)
              except Exception as exc:
                  print('WILD4_CHALLENGER_OBSERVATION_HOLD='+type(exc).__name__)
              locked+=1
          files=sorted(p for p in out.glob('*.json') if key_pattern.fullmatch(p.stem))
          if len(files)!=len(existing)+locked:
              raise SystemExit('LOCK_COVERAGE')
          summary={'SCHEMA':'G11_WILD_BET_FUTURE_OOS_SHADOW_BATCH_V1',
              'DATE':sys.argv[3],'SOURCE_ODDS_SHA256':source_sha,
              'STATUS':'LOCKED_BEFORE_DEADLINE' if files else 'NO_ELIGIBLE_FUTURE_RACE_LOCKED',
              'FUTURE_OOS_PASS':False,
              'CANDIDATE_MODEL_SHA256':binding['MODEL_SHA256'],
              'CANDIDATE_INPUT_SHA256':binding['TRAINING_INPUT_SHA256'],
              'CONSIDERED':considered,'EXPIRED_BEFORE_THIS_RUN':expired,
              'PACK_MISMATCH':pack_mismatch,'NEW_LOCKED_THIS_RUN':locked,
              'RETAINED_FROM_PRIOR':len(existing),'LOCKED_BEFORE_DEADLINE':len(files),
              'RACE_KEYS':[p.stem for p in files],
              'PRODUCTION_MUTATED':False,'ACTUAL_PURCHASE':False}
          summary['CONTENT_SHA256']=b.sha256_value(summary)
          b._write_json_atomic(out/'batch-manifest.json',summary)
          print('WILD4_FUTURE_OOS_CONSIDERED='+str(considered))
          print('WILD4_FUTURE_OOS_LOCKED='+str(locked))
          print('WILD4_FUTURE_OOS_TOTAL_LOCKS='+str(len(files)))
          print('WILD4_FUTURE_OOS_LOCK_IDENTITIES='+json.dumps([
              {'race_key':p.stem,'buy_count':b.load_json(p)['BUY_COUNT'],
               'locked_at':b.load_json(p)['LOCKED_AT'],
               'deadline':b.load_json(p)['RACE_DEADLINE_AT']}
              for p in files],sort_keys=True))
          print('WILD4_FUTURE_OOS_RETAINED='+str(retained))
          print('WILD4_FUTURE_OOS_EXPIRED='+str(expired))
          print('WILD4_FUTURE_OOS_PACK_MISMATCH='+str(pack_mismatch))
          print('WILD4_PRODUCTION_MUTATED=false')
          PY
      - name: Read back frozen holdout evidence without retraining
        if: env.WILD4_CALIBRATED != 'true' && inputs.lineage_readback_date == '' && steps.day.outputs.night_rollover != 'true' && steps.state-ready.outputs.ready == 'true' && steps.decrypted.outputs.runtime_ready == 'true' && (steps.availability.outputs.due == 'true')
        working-directory: .g11-private
        run: |
          set -euo pipefail
          python3 - "${RUNNER_TEMP}" <<'PY'
          import json, math, pathlib, sys
          from collections import Counter
          from catboost import CatBoostClassifier
          from g11.wild_pack.v1 import wild_bet_bootstrap_v1 as b
          from g11.wild_pack.v1 import wild_bet_training_v1 as train
          from g11.wild_pack.v1 import wild_bet_future_oos_v1 as future
          root=pathlib.Path(sys.argv[1]); candidate=root/'g11-wild4-candidate'
          binding,registry,model_path=future.verified_candidate(candidate)
          manifest,dataset=train.verified_gzip(candidate/'wild-bet-shadow-training-input.manifest.json',
              schema='G11_WILD_BET_SHADOW_TRAINING_INPUT_MANIFEST_V1')
          if dataset['CONTENT_SHA256']!=binding['TRAINING_INPUT_SHA256']:
              raise SystemExit('READBACK_INPUT_SHA_MISMATCH')
          contract=b.load_json(pathlib.Path('g11/wild_pack/v1/BET_MODEL_CONTRACT_V1.json'))
          if registry['CONTRACT_SHA256']!=b.sha256_value(contract):
              raise SystemExit('READBACK_CONTRACT_SHA_MISMATCH')
          records={row['STANDARD_RACE_KEY']:row for row in dataset['RECORDS']}
          splits=dataset['SPLIT_RACE_IDS']
          all_keys=[key for name in ('TRAIN','VALIDATION','FINAL_HOLDOUT') for key in splits[name]]
          if len(records)!=10126 or len(all_keys)!=len(set(all_keys)) or set(all_keys)!=set(records):
              raise SystemExit('READBACK_SPLIT_COVERAGE')
          for name,field in (('TRAIN','TRAIN_RACES'),('VALIDATION','VALIDATION_RACES'),
                             ('FINAL_HOLDOUT','FINAL_HOLDOUT_RACES')):
              if len(splits[name])!=registry[field]:
                  raise SystemExit('READBACK_SPLIT_COUNT')
          dates={name:{records[key]['RACE_DATE'] for key in splits[name]} for name in splits}
          if not (max(dates['TRAIN'])<min(dates['VALIDATION'])
                  and max(dates['VALIDATION'])<min(dates['FINAL_HOLDOUT'])
                  and max(dates['FINAL_HOLDOUT'])<=binding['TRAINING_CUTOFF_DATE']
                  and binding['TRAINING_CUTOFF_DATE']=='2026-10-02'):
              raise SystemExit('READBACK_CHRONOLOGICAL_CUTOFF')
          model=CatBoostClassifier(); model.load_model(str(model_path))
          holdout=[records[key] for key in splits['FINAL_HOLDOUT']]
          features,labels,identities=b._feature_rows(holdout)
          raw=[float(row[1]) for row in model.predict_proba(features)]
          logloss=-sum(label*math.log(max(p,1e-15))+(1-label)*math.log(max(1-p,1e-15))
                       for p,label in zip(raw,labels,strict=True))/len(labels)
          by_race={}
          for (key,combo),p,label in zip(identities,raw,labels,strict=True):
              by_race.setdefault(key,[]).append((combo,p,label))
          selected=hits=payout=top1_hits=0; counts=[]
          for key,values in by_race.items():
              total=sum(max(p,1e-15) for combo,p,label in values)
              source=records[key]; odds={cell['COMBINATION']:cell['PREDICTION_TIME_ODDS'] for cell in source['CELLS']}
              chosen=[(combo,label) for combo,p,label in values
                      if p/total*odds[combo]>contract['SELECTION']['BREAK_EVEN_EV']]
              count=len(chosen); hit=any(label==1 for combo,label in chosen)
              counts.append(count); selected+=count; hits+=int(hit)
              if hit: payout+=source['LABEL']['OFFICIAL_PAYOUT_PER_100_YEN']
              top1_hits+=max(values,key=lambda value:value[1])[2]
          if not (math.isclose(logloss,registry['FINAL_HOLDOUT_CELL_LOGLOSS'],rel_tol=1e-12,abs_tol=1e-12)
                  and selected==registry['FINAL_HOLDOUT_SELECTION_COUNT']
                  and hits==registry['FINAL_HOLDOUT_SELECTION_HITS']
