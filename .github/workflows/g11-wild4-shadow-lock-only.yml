        if: inputs.lineage_readback_date == '' && steps.decrypted.outputs.canonical_ready == 'true' && steps.decrypted.outputs.runtime_ready == 'true' && steps.growth.outcome != 'success'
        continue-on-error: true
        working-directory: .g11-private
        env:
          OPERATIONAL_DATE: ${{ steps.day.outputs.day }}
        run: |
          python3 - <<'PYRECHECK'
          import json,os,pathlib
          from datetime import datetime,timezone
          from g11.canonical.official_pipeline import OfficialArtifactStore
          from g11.wild_pack.v1 import wild4_lifecycle_v1 as life
          from g11.wild_pack.v1.wild4_official_settlement_v1 import verify_prior
          ledger=pathlib.Path(os.environ['RUNNER_TEMP'])/'g11-wild4-future-locks'
          day=os.environ['OPERATIONAL_DATE']
          state=life.read(life.state_path(ledger))
          attempt=state.get('last_attempt') or {}
          if (attempt.get('date')!=day or attempt.get('state')!='TECHNICAL_HOLD'
              or attempt.get('reason')!='OFFICIAL_DAY_PREDICTION_COVERAGE'):
              print('WILD4_COVERAGE_RECHECK=NOT_REQUIRED');raise SystemExit(0)
          root=pathlib.Path(os.environ['GITHUB_WORKSPACE'])/'.relay-state/store'
          source=OfficialArtifactStore(root)
          verified=source.load_verified_snapshot('night','workbook-ledger-projection')
          direct=source.load_verified_snapshot('night','official-day-results')
          official={f"{day.replace('-','')}-{r['venue_code']}-{r['race_no']:02d}" for r in direct['SNAPSHOT']['PAYLOAD']['RESULTS']}
          settled=verify_prior(ledger)
          locks={p.stem for p in ledger.glob('*.json') if life.KEY.fullmatch(p.stem)}
          life.require(set(settled)==locks,'COVERAGE_RECHECK_SETTLEMENTS_INCOMPLETE')
          # A now-complete cohort may only use the normal NIGHT path. This
          # repair step is limited to diagnostics for the still-incomplete day.
          if set(settled)==official:
              print('WILD4_COVERAGE_RECHECK=WAIT_NORMAL_NIGHT');raise SystemExit(0)
          result=life.after_night(ledger,root,day,verified,direct,now=datetime.now(timezone.utc))
          for key in ('active','pending','challenger','history','last_training','policy'):
              life.require(result.get(key)==state.get(key),'COVERAGE_RECHECK_MODEL_MUTATION')
          life.require(life.read(life.state_path(ledger))==result,'COVERAGE_RECHECK_READBACK')
          odds=life.b.load_json(pathlib.Path(os.environ['RUNNER_TEMP'])/'wild4-verified-odds-day.json')
          ready={r['STANDARD_RACE_KEY'] for r in odds['RECORDS']}
          missing=official-set(settled)
          print('WILD4_MISSING_INPUT_AUDIT='+json.dumps({'date':day,
              'missing_lock_with_saved_odds':sorted(missing & ready),
              'missing_lock_without_saved_odds':sorted(missing-ready),
              'historical_backfill':False},sort_keys=True))
          print('WILD4_COVERAGE_RECHECK='+json.dumps(result['last_attempt'],sort_keys=True))
          with open(os.environ['GITHUB_OUTPUT'],'a') as output: output.write('saved=true\n')
          PYRECHECK
