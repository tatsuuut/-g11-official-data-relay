                          if isinstance(r.get('wild_pack', {}).get('wild4', {}).get('goripan'), dict)]
              old = {r['race_key']: r for r in old_rows}
              if len(current) != len(rows) or len(current) != 151 or len(old) != len(old_rows) or len(old) not in (136, 151) or not old.keys() <= current.keys():
                  raise ValueError('WILD4_UNION_PUBLIC_COVERAGE')
              for key, row in old.items():
                  saved = current[key]
                  if exact({k: v for k, v in row.items() if k != 'settlement'}) != exact({k: v for k, v in saved.items() if k != 'settlement'}):
                      raise ValueError('WILD4_UNION_PUBLIC_IMMUTABLE:' + key)
                  if row.get('settlement') is not None and exact(row['settlement']) != exact(saved.get('settlement')):
                      raise ValueError('WILD4_UNION_PUBLIC_SETTLEMENT:' + key)
              print('WILD4_UNION_PUBLIC_READBACK=PASS PRIOR=' + str(len(old)) + ' PROJECTED=151')

          if __name__ == '__main__':
              temp = pathlib.Path(os.environ['RUNNER_TEMP'])
              verify_published_union(json.loads((temp / 'goripan-prior-public-feed.json').read_bytes()),
                                     json.loads((temp / 'goripan-public-projection.json').read_bytes()))
          PYUNIONPUBLIC
          fi
          echo 'ready=true' >> "${GITHUB_OUTPUT}"
      - name: Deliver WILD4 public projection and verify exact Site GET readback
        id: public-delivery
        if: steps.public-projection.outputs.ready == 'true'
        continue-on-error: true
        env:
          OPERATIONAL_DATE: ${{ steps.day.outputs.day }}
        run: |
          python3 - <<'PY'
          import hashlib,json,os,pathlib,subprocess,sys,urllib.parse,urllib.request
          base='https://g11-race-lab.higatatsunori2.chatgpt.site'
          raw=(pathlib.Path(os.environ['RUNNER_TEMP'])/'goripan-public-projection.json').read_bytes()
          projection=json.loads(raw)
          audience='g11-race-lab'
          url=os.environ['ACTIONS_ID_TOKEN_REQUEST_URL']
          request=urllib.request.Request(url+('&' if '?' in url else '?')+'audience='+audience,
              headers={'Authorization':'Bearer '+os.environ['ACTIONS_ID_TOKEN_REQUEST_TOKEN']})
          with urllib.request.urlopen(request,timeout=30) as response:
              token=json.load(response)['value']
          # Use the existing Site transport's curl path; keep the bearer off argv.
          output=pathlib.Path(os.environ['RUNNER_TEMP'])/'goripan-delivery-response.json'
          request_path=pathlib.Path(os.environ['RUNNER_TEMP'])/'goripan-public-projection.json'
          headers='Authorization: Bearer '+token+'\nContent-Type: application/json\nX-G11-Feed-Sha256: '+hashlib.sha256(raw).hexdigest()+'\n'
          sent=subprocess.run(['curl','--silent','--show-error','--max-time','45','-X','POST',
              base+'/api/g11-wild4-projection','--header','@-','--data-binary','@'+str(request_path),
              '--output',str(output),'--write-out','%{http_code}'],input=headers,capture_output=True,text=True)
          if sent.returncode: raise SystemExit('GORIPAN_DELIVERY_TRANSPORT_FAILED')
          try: saved=json.loads(output.read_bytes())
          except ValueError: raise SystemExit('GORIPAN_DELIVERY_HTTP_'+sent.stdout+'_NON_JSON')
          if saved.get('status')!='PASS': raise SystemExit('GORIPAN_DELIVERY_HTTP_'+sent.stdout+':'+str(saved.get('error')))
          query=urllib.parse.urlencode({'view':'v53-final','date':os.environ['OPERATIONAL_DATE']})
          sys.path.insert(0,'scripts')
          import hot_delta_transport_v1 as hot
          pathlib.Path('.relay-output').mkdir(exist_ok=True)
          feed,readback_headers,data=hot.fetch(base+'/api/g11-feed?'+query)
          expected=readback_headers['x-g11-feed-sha256']
          if hashlib.sha256(data).hexdigest()!=expected: raise SystemExit('SITE_GET_SHA')
          feed=json.loads(data)
          expected_status='VERIFIED_CANONICAL_PROJECTION' if '${{ steps.decrypted.outputs.canonical_ready }}' == 'true' else 'VERIFIED_RESCUE_PROSPECTIVE_SHADOW'
          if feed.get('goripan',{}).get('status')!=expected_status: raise SystemExit('SITE_PROJECTION_STATUS')
          races={r['key']:r for r in feed['races']}
          for lock in projection['races']:
              actual=races[lock['race_key']].get('wild_pack',{}).get('wild4',{}).get('goripan')
              if actual!=lock: raise SystemExit('SITE_LOCK_READBACK_MISMATCH')
          if feed.get('goripan',{}).get('observation',{}).get('lifecycle') != projection.get('observation',{}).get('lifecycle'): raise SystemExit('SITE_LIFECYCLE_READBACK_MISMATCH')
          print('GORIPAN_LIFECYCLE_READBACK='+json.dumps(projection.get('observation',{}).get('lifecycle'),sort_keys=True))
          print('GORIPAN_SITE_GET_READBACK=PASS')
          print('GORIPAN_SAVED_LOCKS='+str(len(projection['races'])))
          print('GORIPAN_ABSTAIN='+str(sum(r['abstain'] for r in projection['races'])))
          print('GORIPAN_BET_COUNTS='+json.dumps(sorted({r['bet_count'] for r in projection['races']})))
          print('GORIPAN_SOURCE_LOCK_MUTATION=0')
          print('GORIPAN_UNVERIFIED_CANDIDATE_PROMOTION=false')
          PY

      - name: Checkout notification input reader only
        if: steps.public-projection.outputs.ready == 'true'
        continue-on-error: true
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: tatsuuut/-g11-official-data-relay
          ref: main
          path: .g11-input-reader
          sparse-checkout: scripts/selective_alert_input_v1.py
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Append saved WILD4 input evidence with selection and delivery disabled
        if: steps.public-projection.outputs.ready == 'true'
        continue-on-error: true
        env:
          PYTHONPATH: ${{ github.workspace }}/.g11-public-projection
        run: |
          python3 .g11-input-reader/scripts/selective_alert_input_v1.py \
            --store "${GITHUB_WORKSPACE}/${{ steps.decrypted.outputs.store }}" \
            --projection "${RUNNER_TEMP}/goripan-public-projection.json" \
            --odds-day "${RUNNER_TEMP}/wild4-verified-odds-day.json"

      - name: Require successful attempted public projection and delivery
        if: always() && !cancelled() && (steps.public-source.outcome == 'failure' || steps.public-projection.outcome == 'failure' || steps.public-projection.outputs.ready == 'true')
        run: |
          if [ '${{ steps.public-source.outcome }}' = 'failure' ] || [ '${{ steps.public-projection.outcome }}' = 'failure' ] || { [ '${{ steps.public-projection.outputs.ready }}' = 'true' ] && [ '${{ steps.public-delivery.outcome }}' != 'success' ]; }; then
            echo 'WILD4_ATTEMPTED_PUBLICATION_NOT_VERIFIED' >&2
            exit 1
          fi
      - name: Require completion for verified NIGHT handoff
        if: always() && !cancelled() && (inputs.night_checkpoint_key != '' || steps.settlement.outputs.complete == 'true' || (steps.settlement.outputs.held != '' && steps.settlement.outputs.held != '0'))
        run: |
          if [ '${{ steps.settlement.outputs.complete }}' != true ] && [ '${{ steps.settlement.outputs.rescue_join_readback }}' != true ]; then
            echo 'WILD4_POST_NIGHT_SETTLEMENT_INCOMPLETE' >&2
            exit 1
          fi
          if [ '${{ steps.settlement.outputs.held }}' != '' ] && [ '${{ steps.settlement.outputs.held }}' != '0' ]; then
            echo '::warning::Rescue NIGHT saved valid records; held races remain explicitly unresolved in the immutable audit'
          fi
          if [ '${{ steps.public-projection.outputs.ready }}' != true ] || [ '${{ steps.public-delivery.outcome }}' != success ]; then
            echo 'WILD4_NIGHT_PUBLICATION_NOT_VERIFIED' >&2
            exit 1
          fi
