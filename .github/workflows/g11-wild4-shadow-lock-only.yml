              store = OfficialArtifactStore(workspace/'.relay-state/store')
              verified = store.load_verified_snapshot('night', 'workbook-ledger-projection')
              direct = store.load_verified_snapshot('night', 'official-day-results')
              summary = module.settle_day(ledger, verified, day, direct)
              settled = module.verify_prior(ledger)
              if set(settled) != lock_keys or summary['total'] != len(lock_keys):
                  raise SystemExit('WILD4_UNSETTLED_LOCKS_REMAIN')
              complete = bool(lock_keys)
              new = summary['new']
              print('WILD4_OFFICIAL_SETTLEMENT_NEW='+str(new))
              print('WILD4_OFFICIAL_SETTLEMENT_TOTAL='+str(summary['total']))
              print('WILD4_OFFICIAL_SETTLEMENT_EXCLUDED='+str(summary['excluded']))
              print('WILD4_OFFICIAL_SOURCE_SHA256='+verified['SNAPSHOT_SHA256'])
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as output:
              output.write('new='+str(new)+'\n')
              output.write('complete='+str(complete).lower()+'\n')
          status = 'COMPLETE' if complete else 'NO_SAVED_LOCKS' if source.is_file() else 'PENDING_VERIFIED_NIGHT'
          print('WILD4_SETTLEMENT_STATUS='+status)
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8') as output:
              output.write('WILD4 settlement: '+status+'; saved LOCKs='+str(len(lock_keys))+'; new='+str(new)+'\n')
          PY
      - name: Continue existing BET learning after completed NIGHT
