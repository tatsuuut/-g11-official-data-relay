      - name: Persist V4 specialty research after completed NIGHT
        id: specialty
        if: inputs.lineage_readback_date == '' && steps.day.outputs.lifecycle_enabled == 'true' && steps.state-ready.outputs.ready == 'true' && steps.decrypted.outputs.runtime_ready == 'true'
        continue-on-error: true
