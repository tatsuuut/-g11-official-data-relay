name: G11 WILD4 prospective shadow lock only

on:
  push:
    branches:
      - codex/wild4-shadow-training-20261003
    paths:
      - .github/workflows/g11-wild4-shadow-lock-only.yml
  workflow_call:

permissions:
  actions: read
  contents: read

concurrency:
  group: g11-wild4-prospective-shadow-lock
  cancel-in-progress: false

jobs:
  lock-future-only:
    if: github.repository_id == '1367703708'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      TZ: Asia/Tokyo
    steps:
      - name: Checkout isolated research branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: codex/wild4-shadow-training-20261003
          persist-credentials: false
      - name: Bind the current operational date
        id: day
        env:
          UPSTREAM_RUN_TITLE: ${{ github.event.workflow_run.display_title }}
        run: |
          python3 - <<'PY'
          import os, re
          from datetime import datetime
          from zoneinfo import ZoneInfo
          title=os.environ.get('UPSTREAM_RUN_TITLE','')
          if os.environ['GITHUB_EVENT_NAME'] in {'push','schedule'}:
              day=datetime.now(ZoneInfo('Asia/Tokyo')).date().isoformat()
          else:
              match=re.fullmatch(r'LIVE-predeadline-(20[0-9]{2}-[0-9]{2}-[0-9]{2})',title)
              if match is not None:
                  day=match.group(1)
              elif title=='LIVE-predeadline-':
                  day=datetime.now(ZoneInfo('Asia/Tokyo')).date().isoformat()
              else:
                  raise SystemExit('UPSTREAM_RUN_TITLE_MISMATCH')
          if day!=datetime.now(ZoneInfo('Asia/Tokyo')).date().isoformat():
              raise SystemExit('NON_CURRENT_OPERATIONAL_DATE')
          with open(os.environ['GITHUB_OUTPUT'],'a',encoding='utf-8') as output:
              output.write('day='+day+'\n')
              output.write('artifact_name=g11-wild4-'+day.replace('-','')+'-future-oos-locks-encrypted\n')
          print('WILD4_SHADOW_OPERATIONAL_DATE='+day)
          PY
      - name: Restore current encrypted canonical state
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: .relay-cache/state.tgz.gpg
          key: g11-state-v2-${{ steps.day.outputs.day }}-isolated-shadow-no-exact-match
          restore-keys: |
            g11-state-v2-${{ steps.day.outputs.day }}-
      - name: Retrieve exact frozen encrypted candidate
        uses: actions/download-artifact@v4
        with:
          name: g11-wild4-frozen-shadow-candidate-encrypted
          run-id: 37080452963
          github-token: ${{ github.token }}
          path: .candidate-encrypted
      - name: Identify the most recent encrypted shadow ledger
        id: prior
        env:
          GH_TOKEN: ${{ github.token }}
          OPERATIONAL_DATE: ${{ steps.day.outputs.day }}
        run: |
          set -euo pipefail
          name="g11-wild4-${OPERATIONAL_DATE//-/}-future-oos-locks-encrypted"
          id=''
          selected_run=''
          # Find ledgers by their exact day artifact name, independently of
          # the number of intervening LIVE runs with no new lock.
          curl --fail-with-body --silent --show-error --retry 3 \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts?name=${name}&per_page=100" \
            -o "${RUNNER_TEMP}/observer-artifacts.json"
          ledger_candidates="$(jq -r --arg name "${name}" '
            [.artifacts[] | select(.name == $name and .expired == false)]
            | sort_by(.created_at) | reverse | .[]
            | [.id, .workflow_run.id] | @tsv' "${RUNNER_TEMP}/observer-artifacts.json")"
          while IFS=$'\t' read -r artifact_id run_id; do
            [ -n "${artifact_id}" ] || continue
            [ "${run_id}" != "${GITHUB_RUN_ID}" ] || continue
            curl --fail-with-body --silent --show-error --retry 3 \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}" \
              -o "${RUNNER_TEMP}/observer-ledger-run.json"
            if jq -e '
              .conclusion == "success" and (
                (.path == ".github/workflows/g11-wild4-shadow-lock-only.yml"
                  and .head_branch == "codex/wild4-shadow-training-20261003")
                or (.path == ".github/workflows/g11-morning-odds-footprint-4bet-shadow-v1.yml"
                  and (.event == "workflow_run" or .event == "schedule" or .event == "push") and .head_branch == "main")
              )' "${RUNNER_TEMP}/observer-ledger-run.json" >/dev/null; then
              id="${artifact_id}"
              selected_run="${run_id}"
              break
            fi
          done <<< "${ledger_candidates}"
          # A rerun of the same GitHub run must not manufacture a replacement
          # ledger when that run already has an immutable artifact.
          self_artifacts="$(curl --fail-with-body --silent --show-error --retry 3 \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/artifacts?per_page=100")"
          if printf '%s' "${self_artifacts}" | jq -e --arg name "${name}" \
            'any(.artifacts[]; .name == $name and .expired == false)' >/dev/null; then
            echo 'WILD4_SAME_RUN_ARTIFACT_RERUN_FORBIDDEN' >&2
            exit 1
          fi
          if [ -z "${id}" ] && [ "${OPERATIONAL_DATE}" = '2026-10-03' ]; then
            id='11258679601'
            selected_run='37083260709'
          fi
          echo "id=${id}" >> "${GITHUB_OUTPUT}"
          echo "run_id=${selected_run}" >> "${GITHUB_OUTPUT}"
          if [ -z "${id}" ]; then echo 'WILD4_PRIOR_LEDGER=NONE'; else echo 'WILD4_PRIOR_LEDGER=FOUND'; fi
      - name: Retrieve exact prior encrypted shadow ledger
        if: steps.prior.outputs.id != ''
        uses: actions/download-artifact@v4
        with:
          name: ${{ steps.day.outputs.artifact_name }}
          run-id: ${{ steps.prior.outputs.run_id }}
          github-token: ${{ github.token }}
          path: .prior-encrypted
      - name: Checkout frozen shadow source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: tatsuuut/boat-brain-lab
          ref: 13ce9fc06d9796f54e52a45dfb0ee811d6e4fa39
          token: ${{ secrets.G11_PRIVATE_REPO_TOKEN }}
          path: .g11-private
          persist-credentials: false
      - name: Decrypt verified state and candidate
        env:
          OPERATIONAL_DATE: ${{ steps.day.outputs.day }}
          STATE_PASSPHRASE: ${{ secrets.G11_PRIVATE_REPO_TOKEN }}
        run: |
          set -euo pipefail
          test -s .relay-cache/state.tgz.gpg
          test -s .candidate-encrypted/g11-wild4-candidate.tgz.gpg
          test -n "${STATE_PASSPHRASE}"
          exec 3<<<"${STATE_PASSPHRASE}"
          gpg --batch --yes --pinentry-mode loopback --passphrase-fd 3 \
            --decrypt --output "${RUNNER_TEMP}/g11-state.tgz" .relay-cache/state.tgz.gpg
          exec 3<&-
          exec 3<<<"${STATE_PASSPHRASE}"
          gpg --batch --yes --pinentry-mode loopback --passphrase-fd 3 \
            --decrypt --output "${RUNNER_TEMP}/candidate.tgz" .candidate-encrypted/g11-wild4-candidate.tgz.gpg
          exec 3<&-
          python3 - <<'PY'
          import json, os, pathlib, tarfile
          root=pathlib.Path(os.environ['RUNNER_TEMP'])
          for archive,dest in ((root/'g11-state.tgz',pathlib.Path('.relay-state')),
                               (root/'candidate.tgz',root)):
              dest.mkdir(exist_ok=True)
              with tarfile.open(archive,'r:gz') as handle:
                  members=handle.getmembers()
                  if not members: raise SystemExit('EMPTY_ARCHIVE')
                  for member in members:
                      path=pathlib.PurePosixPath(member.name)
                      if path.is_absolute() or '..' in path.parts or member.issym() or member.islnk():
                          raise SystemExit('UNSAFE_ARCHIVE')
                  handle.extractall(dest,filter='data')
          state=json.loads(pathlib.Path('.relay-state/relay-state.json').read_text())
          if state.get('OPERATIONAL_DATE_JST')!=os.environ['OPERATIONAL_DATE']:
              raise SystemExit('STATE_DATE_MISMATCH')
          print('WILD4_FUTURE_STATE_READBACK=PASS')
          PY
      - name: Restore and verify earlier immutable SHADOW locks
        env:
          OPERATIONAL_DATE: ${{ steps.day.outputs.day }}
          STATE_PASSPHRASE: ${{ secrets.G11_PRIVATE_REPO_TOKEN }}
        run: |
          set -euo pipefail
          if [ ! -e .prior-encrypted/future-locks.tgz.gpg ]; then
            echo 'WILD4_PRIOR_LOCKS=0'
            exit 0
          fi
          exec 3<<<"${STATE_PASSPHRASE}"
          gpg --batch --yes --pinentry-mode loopback --passphrase-fd 3 \
            --decrypt --output "${RUNNER_TEMP}/prior-locks.tgz" .prior-encrypted/future-locks.tgz.gpg
          exec 3<&-
          python3 - <<'PY'
          import json, os, pathlib, re, tarfile, hashlib
          from datetime import datetime
          root=pathlib.Path(os.environ['RUNNER_TEMP'])
          with tarfile.open(root/'prior-locks.tgz','r:gz') as archive:
              members=archive.getmembers()
              if not members: raise SystemExit('PRIOR_LOCKS_EMPTY_ARCHIVE')
              for member in members:
                  path=pathlib.PurePosixPath(member.name)
                  if path.is_absolute() or '..' in path.parts or path.parts[0]!='g11-wild4-future-locks' or member.issym() or member.islnk():
                      raise SystemExit('PRIOR_LOCKS_UNSAFE_ARCHIVE')
              archive.extractall(root,filter='data')
          out=root/'g11-wild4-future-locks'
          manifest=json.loads((out/'batch-manifest.json').read_text())
          value={key:item for key,item in manifest.items() if key!='CONTENT_SHA256'}
          canonical=json.dumps(value,ensure_ascii=False,sort_keys=True,separators=(',',':'))+'\n'
          if hashlib.sha256(canonical.encode()).hexdigest()!=manifest['CONTENT_SHA256']:
              raise SystemExit('PRIOR_MANIFEST_SHA')
          expected='2d17db06cf9d7f0e73501e84b14f23621a42abb8a4ea1da3ef9d3fd07ac6c412'
          if (manifest['CANDIDATE_MODEL_SHA256']!=expected or
              manifest['CANDIDATE_INPUT_SHA256']!='a18923aeb5d17d8bdd58ddf337ff523858122a592754cd96087a68159c986447' or
              manifest['DATE']!=os.environ['OPERATIONAL_DATE']):
              raise SystemExit('PRIOR_MODEL_OR_DAY')
          pattern=re.compile(r'[0-9]{8}-[0-9]{2}-(?:0[1-9]|1[0-2])')
          files=sorted(p for p in out.glob('*.json') if pattern.fullmatch(p.stem))
          if [p.stem for p in files]!=manifest['RACE_KEYS']:
              raise SystemExit('PRIOR_LOCK_COVERAGE')
          for path in files:
              lock=json.loads(path.read_text())
              value={key:item for key,item in lock.items() if key!='CONTENT_SHA256'}
              canonical=json.dumps(value,ensure_ascii=False,sort_keys=True,separators=(',',':'))+'\n'
              if (hashlib.sha256(canonical.encode()).hexdigest()!=lock['CONTENT_SHA256']
                  or lock['CANDIDATE_MODEL_SHA256']!=expected
                  or lock['STANDARD_RACE_KEY']!=path.stem
                  or datetime.fromisoformat(lock['LOCKED_AT'])>=datetime.fromisoformat(lock['RACE_DEADLINE_AT'])):
                  raise SystemExit('PRIOR_LOCK_READBACK')
          print('WILD4_PRIOR_LOCKS='+str(len(files)))
          print('WILD4_PRIOR_RACES='+json.dumps([
              {'race_key':p.stem,'buy_count':json.loads(p.read_text())['BUY_COUNT'],
               'locked_at':json.loads(p.read_text())['LOCKED_AT'],
               'deadline':json.loads(p.read_text())['RACE_DEADLINE_AT']}
              for p in files],sort_keys=True))
          PY
      - name: Check for a matching unexpired official odds packet
        id: availability
        working-directory: .g11-private
        env:
          OPERATIONAL_DATE: ${{ steps.day.outputs.day }}
        run: |
          python3 - "${GITHUB_WORKSPACE}" <<'PY'
          import os, pathlib, sys
          from datetime import datetime, timezone
          from g11.wild_pack.v1 import wild_bet_training_v1 as train
          from g11.wild_pack.v1 import wild_bet_future_oos_v1 as future
          workspace=pathlib.Path(sys.argv[1])
          day=os.environ['OPERATIONAL_DATE']
          candidate=pathlib.Path(os.environ['RUNNER_TEMP'])/'g11-wild4-candidate'
          binding,registry,model=future.verified_candidate(candidate)
          history=workspace/'.relay-state/store/g11/wild-pack-oos/morning'/day
          source=history/'bet-prediction-time-odds.manifest.json'
          if source.is_file():
              manifest,odds=train.verified_gzip(source,
                  schema='G11_WILD_BET_OOS_COLLECTION_MANIFEST_V1',kind='ODDS')
              if odds.get('RESULT_DATA_PRESENT') is not False:
                  raise SystemExit('ODDS_HAS_RESULTS')
              records=odds['RECORDS']
          else:
              records=[]
              odds=None
          from g11.wild_pack.v1 import bet_oos_collection_v1 as bet
          from g11.canonical.official_pipeline import OfficialArtifactStore
          source_store=workspace/'.relay-state/store'
          upstream_path=history/'bet-upstream.manifest.json'
          if upstream_path.is_file():
              upstream_manifest,upstream=train.verified_gzip(upstream_path,
                  schema='G11_WILD_BET_OOS_COLLECTION_MANIFEST_V1',kind='UPSTREAM')
              official=OfficialArtifactStore(source_store)
              snapshots={}
              for item in upstream['RECORDS']:
                  key=item['PAYLOAD']['STANDARD_RACE_KEY']
                  name='odds3t-'+key.lower()
                  if (source_store/'snapshots/predeadline'/(name+'.json')).is_file():
                      snapshots[key]=official.load_verified_snapshot('predeadline',name)
              direct=bet.attach_prediction_time_odds(upstream,snapshots)
              common={r['STANDARD_RACE_KEY']:r for r in records}
              for item in direct['RECORDS']:
                  key=item['STANDARD_RACE_KEY']
                  if key in common and item['BET_PACKET_HASH']!=common[key]['BET_PACKET_HASH']:
                      raise SystemExit('DIRECT_AND_PERSISTED_ODDS_CONFLICT')
              direct_records=direct['RECORDS']
          else:
              direct_records=[]
          print('WILD4_VERIFIED_DIRECT_SNAPSHOT_COUNT='+str(len(direct_records)))
          chosen=direct if direct_records else odds
          if chosen is not None:
              from g11.wild_pack.v1 import wild_bet_bootstrap_v1 as b
              without_hash={k:v for k,v in chosen.items() if k!='CONTENT_SHA256'}
              if chosen['CONTENT_SHA256']!=train.daily_sha(without_hash):
                  raise SystemExit('RESEARCH_ODDS_READBACK_SHA')
              b._write_json_atomic(pathlib.Path(os.environ['RUNNER_TEMP'])/'wild4-verified-odds-day.json',chosen)
              records=chosen['RECORDS']
          now=datetime.now(timezone.utc)
          direct_due=[r for r in direct_records
              if datetime.fromisoformat(r['UPSTREAM_PACKET']['RACE_DEADLINE_AT'])>now
              and r['UPSTREAM_PACKET']['EVALUATION_CONTEXT_PACK_ID']==binding['EVALUATION_CONTEXT_PACK_ID']]
          print('WILD4_VERIFIED_DIRECT_UNEXPIRED='+str(len(direct_due)))
          if records:
              latest=max(records,key=lambda r:r['ODDS_CAPTURED_AT'])
              captured=datetime.fromisoformat(latest['ODDS_CAPTURED_AT'])
              deadline=datetime.fromisoformat(latest['UPSTREAM_PACKET']['RACE_DEADLINE_AT'])
              print('WILD4_LATEST_CAPTURE_AT='+captured.isoformat())
              print('WILD4_LATEST_CAPTURE_DEADLINE_AT='+deadline.isoformat())
              print('WILD4_LATEST_CAPTURE_MARGIN_SECONDS='+str(int((deadline-captured).total_seconds())))
              print('WILD4_LATEST_CAPTURE_AGE_SECONDS='+str(int((now-captured).total_seconds())))
          due=[r for r in records if datetime.fromisoformat(r['UPSTREAM_PACKET']['RACE_DEADLINE_AT'])>now
               and r['UPSTREAM_PACKET']['EVALUATION_CONTEXT_PACK_ID']==binding['EVALUATION_CONTEXT_PACK_ID']]
          with open(os.environ['GITHUB_OUTPUT'],'a',encoding='utf-8') as output:
              output.write('due='+('true' if due else 'false')+'\n')
          print('WILD4_ODDS_DAY_CONSIDERED='+str(len(records)))
          print('WILD4_MATCHING_UNEXPIRED='+str(len(due)))
          PY
      - name: Install CatBoost only in isolated research lane
        if: steps.availability.outputs.due == 'true'
        run: python3 -m pip install --disable-pip-version-check --no-input 'catboost==1.2.8'
      - name: Lock future races before deadline without any production write
        if: steps.availability.outputs.due == 'true'
        env:
          OPERATIONAL_DATE: ${{ steps.day.outputs.day }}
        working-directory: .g11-private
        run: |
          set -euo pipefail
          python3 - "${GITHUB_WORKSPACE}" "${RUNNER_TEMP}" "${OPERATIONAL_DATE}" <<'PY'
          import json, pathlib, sys
          from datetime import datetime, timezone
          from catboost import CatBoostClassifier
          from g11.wild_pack.v1 import wild_bet_bootstrap_v1 as b
          from g11.wild_pack.v1 import wild_bet_training_v1 as train
          from g11.wild_pack.v1 import wild_bet_future_oos_v1 as future
          workspace, temp=map(pathlib.Path,sys.argv[1:3])
          candidate=temp/'g11-wild4-candidate'
          binding,registry,model_path=future.verified_candidate(candidate)
          if binding['MODEL_SHA256']!='2d17db06cf9d7f0e73501e84b14f23621a42abb8a4ea1da3ef9d3fd07ac6c412':
              raise SystemExit('FROZEN_MODEL_SHA_MISMATCH')
          if binding['TRAINING_INPUT_SHA256']!='a18923aeb5d17d8bdd58ddf337ff523858122a592754cd96087a68159c986447':
              raise SystemExit('FROZEN_INPUT_SHA_MISMATCH')
          odds_day=b.load_json(temp/'wild4-verified-odds-day.json')
          source_sha=odds_day.get('CONTENT_SHA256')
          if (source_sha!=train.daily_sha({k:v for k,v in odds_day.items() if k!='CONTENT_SHA256'})
              or odds_day.get('SCHEMA')!='G11_WILD_BET_PREDICTION_TIME_ODDS_DAY_V1'
              or odds_day.get('RESULT_DATA_PRESENT') is not False):
              raise SystemExit('ODDS_DAY_IDENTITY')
          model=CatBoostClassifier(); model.load_model(str(model_path))
          contract=b.load_json(pathlib.Path('g11/wild_pack/v1/BET_MODEL_CONTRACT_V1.json'))
          out=temp/'g11-wild4-future-locks'; out.mkdir(exist_ok=True)
          import re
          key_pattern=re.compile(r'[0-9]{8}-[0-9]{2}-(?:0[1-9]|1[0-2])')
          existing=[p for p in out.glob('*.json') if key_pattern.fullmatch(p.stem)]
          considered=expired=pack_mismatch=locked=retained=0
          for row in sorted(odds_day['RECORDS'],key=lambda value:value['STANDARD_RACE_KEY']):
              considered+=1
              packet=row['UPSTREAM_PACKET']; now=datetime.now(timezone.utc)
              deadline=datetime.fromisoformat(packet['RACE_DEADLINE_AT'])
              path=out/(row['STANDARD_RACE_KEY']+'.json')
              if path.exists():
                  future.predict_and_lock(row,candidate,contract,path,now=now,predictor=model)
                  retained+=1; continue
              if now>=deadline:
                  expired+=1; continue
              if packet['EVALUATION_CONTEXT_PACK_ID']!=binding['EVALUATION_CONTEXT_PACK_ID']:
                  pack_mismatch+=1; continue
              future.predict_and_lock(row,candidate,contract,path,now=now,predictor=model)
              locked+=1
          files=sorted(p for p in out.glob('*.json') if key_pattern.fullmatch(p.stem))
          if len(files)!=len(existing)+locked:
              raise SystemExit('LOCK_COVERAGE')
          summary={'SCHEMA':'G11_WILD_BET_FUTURE_OOS_SHADOW_BATCH_V1',
              'DATE':sys.argv[3],'SOURCE_ODDS_SHA256':source_sha,
              'STATUS':'LOCKED_BEFORE_DEADLINE' if files else 'NO_ELIGIBLE_FUTURE_RACE_LOCKED',
              'FUTURE_OOS_PASS':False,
              'CANDIDATE_MODEL_SHA256':binding['MODEL_SHA256'],
              'CANDIDATE_INPUT_SHA256':binding['TRAINING_INPUT_SHA256'],
              'CONSIDERED':considered,'EXPIRED_BEFORE_THIS_RUN':expired,
              'PACK_MISMATCH':pack_mismatch,'NEW_LOCKED_THIS_RUN':locked,
              'RETAINED_FROM_PRIOR':len(existing),'LOCKED_BEFORE_DEADLINE':len(files),
              'RACE_KEYS':[p.stem for p in files],
              'PRODUCTION_MUTATED':False,'ACTUAL_PURCHASE':False}
          summary['CONTENT_SHA256']=b.sha256_value(summary)
          b._write_json_atomic(out/'batch-manifest.json',summary)
          print('WILD4_FUTURE_OOS_CONSIDERED='+str(considered))
          print('WILD4_FUTURE_OOS_LOCKED='+str(locked))
          print('WILD4_FUTURE_OOS_TOTAL_LOCKS='+str(len(files)))
          print('WILD4_FUTURE_OOS_LOCK_IDENTITIES='+json.dumps([
              {'race_key':p.stem,'buy_count':b.load_json(p)['BUY_COUNT'],
               'locked_at':b.load_json(p)['LOCKED_AT'],
               'deadline':b.load_json(p)['RACE_DEADLINE_AT']}
              for p in files],sort_keys=True))
          print('WILD4_FUTURE_OOS_RETAINED='+str(retained))
          print('WILD4_FUTURE_OOS_EXPIRED='+str(expired))
          print('WILD4_FUTURE_OOS_PACK_MISMATCH='+str(pack_mismatch))
          print('WILD4_PRODUCTION_MUTATED=false')
          PY
      - name: Read back frozen holdout evidence without retraining
        if: steps.availability.outputs.due == 'true'
        working-directory: .g11-private
        run: |
          set -euo pipefail
          python3 - "${RUNNER_TEMP}" <<'PY'
          import json, math, pathlib, sys
          from collections import Counter
          from catboost import CatBoostClassifier
          from g11.wild_pack.v1 import wild_bet_bootstrap_v1 as b
          from g11.wild_pack.v1 import wild_bet_training_v1 as train
          from g11.wild_pack.v1 import wild_bet_future_oos_v1 as future
          root=pathlib.Path(sys.argv[1]); candidate=root/'g11-wild4-candidate'
          binding,registry,model_path=future.verified_candidate(candidate)
          manifest,dataset=train.verified_gzip(candidate/'wild-bet-shadow-training-input.manifest.json',
              schema='G11_WILD_BET_SHADOW_TRAINING_INPUT_MANIFEST_V1')
          if dataset['CONTENT_SHA256']!=binding['TRAINING_INPUT_SHA256']:
              raise SystemExit('READBACK_INPUT_SHA_MISMATCH')
          contract=b.load_json(pathlib.Path('g11/wild_pack/v1/BET_MODEL_CONTRACT_V1.json'))
          if registry['CONTRACT_SHA256']!=b.sha256_value(contract):
              raise SystemExit('READBACK_CONTRACT_SHA_MISMATCH')
          records={row['STANDARD_RACE_KEY']:row for row in dataset['RECORDS']}
          splits=dataset['SPLIT_RACE_IDS']
          all_keys=[key for name in ('TRAIN','VALIDATION','FINAL_HOLDOUT') for key in splits[name]]
          if len(records)!=10126 or len(all_keys)!=len(set(all_keys)) or set(all_keys)!=set(records):
              raise SystemExit('READBACK_SPLIT_COVERAGE')
          for name,field in (('TRAIN','TRAIN_RACES'),('VALIDATION','VALIDATION_RACES'),
                             ('FINAL_HOLDOUT','FINAL_HOLDOUT_RACES')):
              if len(splits[name])!=registry[field]:
                  raise SystemExit('READBACK_SPLIT_COUNT')
          dates={name:{records[key]['RACE_DATE'] for key in splits[name]} for name in splits}
          if not (max(dates['TRAIN'])<min(dates['VALIDATION'])
                  and max(dates['VALIDATION'])<min(dates['FINAL_HOLDOUT'])
                  and max(dates['FINAL_HOLDOUT'])<=binding['TRAINING_CUTOFF_DATE']
                  and binding['TRAINING_CUTOFF_DATE']=='2026-10-02'):
              raise SystemExit('READBACK_CHRONOLOGICAL_CUTOFF')
          model=CatBoostClassifier(); model.load_model(str(model_path))
          holdout=[records[key] for key in splits['FINAL_HOLDOUT']]
          features,labels,identities=b._feature_rows(holdout)
          raw=[float(row[1]) for row in model.predict_proba(features)]
          logloss=-sum(label*math.log(max(p,1e-15))+(1-label)*math.log(max(1-p,1e-15))
                       for p,label in zip(raw,labels,strict=True))/len(labels)
          by_race={}
          for (key,combo),p,label in zip(identities,raw,labels,strict=True):
              by_race.setdefault(key,[]).append((combo,p,label))
          selected=hits=payout=top1_hits=0; counts=[]
          for key,values in by_race.items():
              total=sum(max(p,1e-15) for combo,p,label in values)
              source=records[key]; odds={cell['COMBINATION']:cell['PREDICTION_TIME_ODDS'] for cell in source['CELLS']}
              chosen=[(combo,label) for combo,p,label in values
                      if p/total*odds[combo]>contract['SELECTION']['BREAK_EVEN_EV']]
              count=len(chosen); hit=any(label==1 for combo,label in chosen)
              counts.append(count); selected+=count; hits+=int(hit)
              if hit: payout+=source['LABEL']['OFFICIAL_PAYOUT_PER_100_YEN']
              top1_hits+=max(values,key=lambda value:value[1])[2]
          if not (math.isclose(logloss,registry['FINAL_HOLDOUT_CELL_LOGLOSS'],rel_tol=1e-12,abs_tol=1e-12)
                  and selected==registry['FINAL_HOLDOUT_SELECTION_COUNT']
                  and hits==registry['FINAL_HOLDOUT_SELECTION_HITS']
                  and b.audit_bet_count_policy(counts,contract['SELECTION'])==registry['FINAL_HOLDOUT_BET_COUNT_AUDIT']):
              raise SystemExit('READBACK_HOLDOUT_METRICS')
          investment=selected*100
          report={'SCHEMA':'G11_WILD4_FROZEN_CANDIDATE_READBACK_V1','STATUS':'PASS',
              'MODEL_SHA256':binding['MODEL_SHA256'],'TRAINING_INPUT_SHA256':binding['TRAINING_INPUT_SHA256'],
              'TRAINING_CUTOFF_DATE':binding['TRAINING_CUTOFF_DATE'],
              'FUTURE_OOS_START_DATE':binding['FUTURE_OOS_START_DATE'],
              'ELIGIBLE_RACES':len(records),'TRAIN_RACES':registry['TRAIN_RACES'],
              'VALIDATION_RACES':registry['VALIDATION_RACES'],'FINAL_HOLDOUT_RACES':len(holdout),
              'HOLDOUT_CELL_LOGLOSS':logloss,'HOLDOUT_SELECTED_BETS':selected,
              'HOLDOUT_HIT_RACES':hits,'HOLDOUT_TOP1_COMBINATION_HITS':top1_hits,
              'HOLDOUT_SELECTION_COUNT_DISTRIBUTION':dict(sorted(Counter(counts).items())),
              'HOLDOUT_BET_COUNT_AUDIT':registry['FINAL_HOLDOUT_BET_COUNT_AUDIT'],
              'HYPOTHETICAL_UNIT_100YEN_INVESTMENT':investment,
              'HYPOTHETICAL_UNIT_100YEN_PAYOUT':payout,
              'HYPOTHETICAL_RECOVERY_PERCENT':100*payout/investment if investment else None,
              'HYPOTHETICAL_NET_YEN':payout-investment,'HISTORICAL_HOLDOUT_IS_FUTURE_OOS':False,
              'MODEL_RETRAINED':False,'PRODUCTION_MUTATED':False,'ACTUAL_PURCHASE':False,
              'PRODUCTION_PROMOTION_ELIGIBLE':False}
          report['CONTENT_SHA256']=b.sha256_value(report)
          b._write_json_atomic(root/'g11-wild4-future-locks'/'candidate-readback.json',report)
          print('WILD4_CANDIDATE_HOLDOUT_READBACK=PASS')
          print('WILD4_CANDIDATE_HOLDOUT_SUMMARY='+json.dumps(report,sort_keys=True))
          PY
      - name: Checkout pinned official settlement source
        if: github.event_name == 'schedule' && github.event.schedule == '25,40,55 13 * * *'
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: tatsuuut/boat-brain-lab
          ref: efd476cac11dc3ee8753b5a5001c42271be41974
          token: ${{ secrets.G11_PRIVATE_REPO_TOKEN }}
          path: .g11-settlement
          persist-credentials: false
      - name: Settle only immutable locks from verified final NIGHT
        if: github.event_name == 'schedule' && github.event.schedule == '25,40,55 13 * * *'
        id: settlement
        env:
          OPERATIONAL_DATE: ${{ steps.day.outputs.day }}
        run: |
          set -euo pipefail
          export PYTHONPATH="${GITHUB_WORKSPACE}/.g11-private"
          python3 - "${GITHUB_WORKSPACE}" "${RUNNER_TEMP}" "${OPERATIONAL_DATE}" <<'PY'
          import importlib.util, os, pathlib, sys
          from g11.canonical.official_pipeline import OfficialArtifactStore
          workspace, temp = map(pathlib.Path, sys.argv[1:3])
          day = sys.argv[3]
          module_path = workspace/'.g11-settlement/g11/wild_pack/v1/wild4_official_settlement_v1.py'
          spec = importlib.util.spec_from_file_location('wild4_pinned_settlement', module_path)
          module = importlib.util.module_from_spec(spec); spec.loader.exec_module(module)
          ledger = temp/'g11-wild4-future-locks'
          previous = module.verify_prior(ledger)
          source = workspace/'.relay-state/store/snapshots/night/workbook-ledger-projection.json'
          if not source.is_file():
              print('WILD4_OFFICIAL_NIGHT=AWAITING_VERIFIED_PROJECTION')
              print('WILD4_PRIOR_SETTLED='+str(len(previous)))
              new = 0
          else:
              store = OfficialArtifactStore(workspace/'.relay-state/store')
              verified = store.load_verified_snapshot('night', 'workbook-ledger-projection')
              direct = store.load_verified_snapshot('night', 'official-day-results')
              summary = module.settle_day(ledger, verified, day, direct)
              new = summary['new']
              print('WILD4_OFFICIAL_SETTLEMENT_NEW='+str(new))
              print('WILD4_OFFICIAL_SETTLEMENT_TOTAL='+str(summary['total']))
              print('WILD4_OFFICIAL_SETTLEMENT_EXCLUDED='+str(summary['excluded']))
              print('WILD4_OFFICIAL_SOURCE_SHA256='+verified['SNAPSHOT_SHA256'])
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as output:
              output.write('new='+str(new)+'\n')
          PY
      - name: Encrypt immutable future locks
        if: steps.availability.outputs.due == 'true' || steps.settlement.outputs.new != '0' && steps.settlement.outputs.new != ''
        env:
          STATE_PASSPHRASE: ${{ secrets.G11_PRIVATE_REPO_TOKEN }}
        run: |
          set -euo pipefail
          tar -czf "${RUNNER_TEMP}/future-locks.tgz" -C "${RUNNER_TEMP}" g11-wild4-future-locks
          exec 3<<<"${STATE_PASSPHRASE}"
          gpg --batch --yes --pinentry-mode loopback --passphrase-fd 3 \
            --symmetric --cipher-algo AES256 \
            --output "${RUNNER_TEMP}/future-locks.tgz.gpg" "${RUNNER_TEMP}/future-locks.tgz"
          exec 3<&-
      - name: Preserve encrypted shadow locks
        if: steps.availability.outputs.due == 'true' || steps.settlement.outputs.new != '0' && steps.settlement.outputs.new != ''
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.day.outputs.artifact_name }}
          path: ${{ runner.temp }}/future-locks.tgz.gpg
          if-no-files-found: error
          retention-days: 30
