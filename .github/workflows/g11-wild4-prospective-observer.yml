name: G11 WILD4 research-only prospective observer
run-name: WILD4-SHADOW-${{ github.event.workflow_run.display_title }}

on:
  workflow_run:
    workflows: ["runtime sync"]
    types: [completed]
    branches: [main]

permissions:
  actions: read
  contents: read

concurrency:
  group: g11-wild4-prospective-shadow-lock
  cancel-in-progress: false

jobs:
  observe:
    if: >-
      github.repository_id == '1367703708' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.event == 'workflow_dispatch' &&
      startsWith(github.event.workflow_run.display_title, 'LIVE-predeadline-')
    uses: tatsuuut/-g11-official-data-relay/.github/workflows/g11-wild4-shadow-lock-only.yml@7c3dce4355f1b79e4d870c9850c1ee9f9194bb77
    secrets: inherit
