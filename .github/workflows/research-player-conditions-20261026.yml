name: P3 saved LIVE wave and equal-points audit
on:
  push:
    branches: [research/player-conditions-20261026]
    paths: [.github/workflows/research-player-conditions-20261026.yml]
permissions:
  contents: read
  actions: read
concurrency:
  group: player-conditions-20261026
  cancel-in-progress: false
jobs:
  audit:
    if: github.ref == 'refs/heads/research/player-conditions-20261026'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        day: ['2026-10-20', '2026-10-22', '2026-10-23', '2026-10-24', '2026-10-25', '2026-10-26']
    steps:
      - name: Checkout pinned source readers
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: tatsuuut/boat-brain-lab
          ref: e8e8da4f10e9b9ec6719b9b542e24c5ab06354c6
          token: ${{secrets.G11_PRIVATE_REPO_TOKEN}}
          persist-credentials: false
          path: source
      - name: Restore existing encrypted state read only
        id: archive
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: .relay-cache/state.tgz.gpg
          key: player-conditions-readonly-${{matrix.day}}-20261026
          restore-keys: |
            g11-state-v4-published-${{matrix.day}}-
            g11-state-v4-critical-${{matrix.day}}-
            g11-state-v4-${{matrix.day}}-
      - name: Decrypt into isolated workspace
        env:
          ARCHIVE_PASSPHRASE: ${{secrets.G11_PRIVATE_REPO_TOKEN}}
        run: |
          set -euo pipefail
          umask 077
          if [ -s .relay-cache/state.tgz.gpg ]; then
            exec 3<<<"${ARCHIVE_PASSPHRASE}"
            gpg --batch --yes --pinentry-mode loopback --passphrase-fd 3 --decrypt --output "${RUNNER_TEMP}/source.tgz" .relay-cache/state.tgz.gpg
            exec 3<&-
          fi
      - name: Inspect source coverage without replaying predictions
        env:
          PYTHONPATH: source
          AUDIT_DAY: ${{matrix.day}}
          MATCHED_CACHE_KEY: ${{steps.archive.outputs.cache-matched-key}}
        run: |
          python3 - <<'PY'
          import collections, hashlib, json, os, tarfile
          from pathlib import Path, PurePosixPath
          from g11.growth_p3.v1_1.confidence_historical_backtest_v1 import manifest_archive, ledger_map, verified_outcome, summary, require, stamp
          from g11.growth_p3.v1_1.canonical_v1_1 import canonical_sha
          from g11.canonical.official_pipeline import OfficialArtifactStore
          
          day = os.environ['AUDIT_DAY']
          root = Path('.audit/state')
          root.mkdir(parents=True, exist_ok=True)
          archive = Path(os.environ['RUNNER_TEMP']) / 'source.tgz'
          report = {'schema': 'G11_P3_LIVE_WAVE_DIAGNOSTIC_V1', 'cache_day': day,
                    'cutoff_exclusive': '2026-10-26', 'prediction_recalculated': False,
                    'rank_thresholds_changed': False, 'formal_certification': False}
          if not archive.is_file():
              report['status'] = 'CACHE_UNAVAILABLE'
              print('P3_WAVE_AUDIT_JSON=' + json.dumps(report, separators=(',', ':')))
              raise SystemExit(0)
          with tarfile.open(archive, 'r|gz') as tf:
              for member in tf:
                  path = PurePosixPath(member.name)
                  require(not path.is_absolute() and '..' not in path.parts and not member.issym() and not member.islnk(), 'UNSAFE_ARCHIVE')
                  name = '/'.join(path.parts)
                  selected = name.startswith('store/archives/') or name.startswith('store/responses/') or name.startswith('store/snapshots/predeadline/current-growth-p3-live-')
                  if not member.isfile() or not selected:
                      continue
                  require(member.size < 100_000_000, 'MEMBER_SIZE')
                  target = root.joinpath(*path.parts)
                  target.parent.mkdir(parents=True, exist_ok=True)
                  target.write_bytes(tf.extractfile(member).read())
          
          def score_subset(record, outcome, archive_value):
              # Original stored order only, no re-ranking with later data. Refund races
              # are reported separately because the effective three-ticket stake changes.
              bets = record['PRODUCTION_BET_ORDER'][:3]
              require(len(bets) == 3 and len(set(bets)) == 3, 'FIRST_THREE')
              winners = archive_value['OFFICIAL_TRIFECTA_SETTLEMENTS']['BY_RACE_KEY'][record['RACE_ID']]
              return dict(outcome, Y=int(any(s['combination'] in bets for s in winners)),
                          NET_STAKE=300, GROSS_STAKE=300, REFUND=0,
                          PAYOUT=sum(s['payout'] for s in winners if s['combination'] in bets))
          
          def grouped(rows):
              return {'all_bets': summary(rows), 'first_three': summary([r['FIRST_THREE'] for r in rows]),
                      'head_hit_n': sum(r.get('HEAD_HIT', 0) for r in rows),
                      'head_verified_n': sum('HEAD_HIT' in r for r in rows)}
          
          rows, compact, sources = [], [], []
          excluded, snapshot_issues, identities = collections.Counter(), collections.Counter(), collections.Counter()
          store = OfficialArtifactStore(root / 'store')
          for path in sorted(root.rglob('daily-research-*.json.gz')):
              value, digest = manifest_archive(path)
              race_day = value['OPERATIONAL_DATE_JST']
              if not '2026-10-20' <= race_day < '2026-10-26' or (day != '2026-10-26' and race_day != day):
                  continue
              sources.append({'day': race_day, 'archive_sha256': digest})
              ledger = ledger_map(value)
              for record in value.get('P3_CONFIDENCE_CALIBRATION_DEV', {}).get('RECORDS', []):
                  if record.get('MORNING_OR_LIVE') != 'LIVE':
                      continue
                  try:
                      outcome = verified_outcome(record, ledger[record['RACE_ID']], value)
                  except (ValueError, KeyError, TypeError) as exc:
                      excluded['OUTCOME:' + str(exc)] += 1
                      continue
                  if outcome['Y'] is None:
                      excluded['VOID'] += 1
                      continue
                  if record['REFUND_BOATS']:
                      excluded['REFUND_RACE'] += 1
                      continue
                  outcome['POINTS'] = record['POINTS']
                  outcome['FIRST_THREE'] = score_subset(record, outcome, value)
                  compact.append(outcome)
                  try:
                      verified = store.load_verified_snapshot('predeadline', record['SOURCE_SNAPSHOT_NAME'])
                      payload = verified['SNAPSHOT']['PAYLOAD']
                      body = dict(payload); content_sha = body.pop('CONTENT_SHA256', None)
                      require(verified['SNAPSHOT_SHA256'] == record['SOURCE_SNAPSHOT_SHA256'], 'SNAPSHOT_SHA_BINDING')
                      require(content_sha == record['SOURCE_CONTENT_SHA256'] == canonical_sha(body), 'CONTENT_SHA_BINDING')
                      require(payload['RACE_ID'] == record['RACE_ID'] and payload['SNAPSHOT'] == 'LIVE', 'LIVE_IDENTITY')
                      require(payload['PREDICTION_AT'] == record['PREDICTION_LOCKED_AT'] and stamp(payload['PREDICTION_AT']) < stamp(record['RACE_DEADLINE_AT']), 'LIVE_TIME')
                      require(payload['PRODUCTION_BETS'] == record['PRODUCTION_BET_ORDER'] and payload['PRODUCTION_POINTS'] == record['POINTS'], 'BET_BINDING')
                      wave = payload['WAVE']['WAVE']
                      require(type(wave) is int and 1 <= wave <= 8, 'LIVE_WAVE_RANGE')
                      require(record['POINTS'] == (3 if wave <= 2 else 5 if wave <= 5 else 7), 'WAVE_POINT_BINDING')
                      require(all(stamp(r['CAPTURED_AT_JST']) <= stamp(payload['PREDICTION_AT']) for r in verified['SNAPSHOT']['SOURCE_RECEIPTS']), 'LATE_INPUT')
                      winners = record['OFFICIAL_WINNING_TRIFECTA_SET']
                      outcome['WAVE'] = wave
                      outcome['HEAD_HIT'] = int(any(int(b.split('-')[0]) == payload['HEAD'] for b in winners))
                      identities[json.dumps({k: payload.get(k) for k in ['LOGIC_VERSION', 'BET_SELECTION_MODE', 'BASE_LOGIC_VERSION']}, sort_keys=True)] += 1
                      rows.append(outcome)
                  except (OSError, ValueError, KeyError, TypeError) as exc:
                      snapshot_issues[str(exc)] += 1
          
          report.update(status='COMPLETE', sources=sources, excluded=dict(excluded), snapshot_issues=dict(snapshot_issues),
                        compact_by_points={str(n): grouped([r for r in compact if r['POINTS'] == n]) for n in [3, 5, 7]},
                        verified_by_wave={str(w): grouped([r for r in rows if r['WAVE'] == w]) for w in range(1, 9)},
                        verified_by_wave_band={name: grouped([r for r in rows if lo <= r['WAVE'] <= hi]) for name, lo, hi in [('1-2',1,2),('3-5',3,5),('6-8',6,8)]},
                        identity_groups=[dict(json.loads(k), n=n) for k,n in identities.items()],
                        method={'first_three': 'ORIGINAL_PRODUCTION_ORDER_PREFIX_3_NO_RESORT', 'refund_races': 'EXCLUDED_FROM_EQUAL_POINTS_COMPARISON',
                                'wave_source': 'ORIGINAL_LIVE_SNAPSHOT_ONLY_NEVER_MORNING_LEDGER', 'comparison': 'RETROSPECTIVE_DESCRIPTIVE_NOT_CAUSAL'})
          print('P3_WAVE_AUDIT_JSON=' + json.dumps(report, ensure_ascii=False, separators=(',', ':')))
          PY
      - name: Remove temporary plaintext
        if: always()
        run: rm -rf .audit "${RUNNER_TEMP}/source.tgz"
