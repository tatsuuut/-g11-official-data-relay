name: Player condition saved-source audit
on:
  push:
    branches: [research/player-conditions-20261026]
    paths: [.github/workflows/research-player-conditions-20261026.yml]
permissions:
  contents: read
  actions: read
concurrency:
  group: player-conditions-20261026
  cancel-in-progress: false
jobs:
  audit:
    if: github.ref == 'refs/heads/research/player-conditions-20261026'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        day: ['2026-10-26']
    steps:
      - name: Checkout pinned source readers
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: tatsuuut/boat-brain-lab
          ref: e8e8da4f10e9b9ec6719b9b542e24c5ab06354c6
          token: ${{secrets.G11_PRIVATE_REPO_TOKEN}}
          persist-credentials: false
          path: source
      - name: Restore existing encrypted state read only
        id: archive
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: .relay-cache/state.tgz.gpg
          key: player-conditions-readonly-${{matrix.day}}-20261026
          restore-keys: |
            g11-state-v4-published-${{matrix.day}}-
            g11-state-v4-critical-${{matrix.day}}-
            g11-state-v4-${{matrix.day}}-
      - name: Decrypt into isolated workspace
        env:
          ARCHIVE_PASSPHRASE: ${{secrets.G11_PRIVATE_REPO_TOKEN}}
        run: |
          set -euo pipefail
          umask 077
          if [ -s .relay-cache/state.tgz.gpg ]; then
            exec 3<<<"${ARCHIVE_PASSPHRASE}"
            gpg --batch --yes --pinentry-mode loopback --passphrase-fd 3 --decrypt --output "${RUNNER_TEMP}/source.tgz" .relay-cache/state.tgz.gpg
            exec 3<&-
          fi
      - name: Inspect source coverage without replaying predictions
        env:
          PYTHONPATH: source
          AUDIT_DAY: ${{matrix.day}}
          MATCHED_CACHE_KEY: ${{steps.archive.outputs.cache-matched-key}}
        run: |
          python3 - <<'PY'
          import collections,hashlib,json,os,tarfile
          from pathlib import Path,PurePosixPath
          from g11.growth_p3.v1_1.confidence_historical_backtest_v1 import manifest_archive,ledger_map,verified_outcome,summary,research_grade
          root=Path('.audit/state');root.mkdir(parents=True,exist_ok=True)
          archive=Path(os.environ['RUNNER_TEMP'])/'source.tgz'
          assert archive.is_file(), 'ARCHIVE_REQUIRED'
          with tarfile.open(archive,'r|gz') as tf:
           for m in tf:
            p=PurePosixPath(m.name)
            if p.is_absolute() or '..' in p.parts or m.issym() or m.islnk():raise RuntimeError('UNSAFE_ARCHIVE')
            if not m.isfile() or not '/'.join(p.parts).startswith('store/archives/'):continue
            assert m.size<100_000_000
            out=root.joinpath(*p.parts);out.parent.mkdir(parents=True,exist_ok=True);out.write_bytes(tf.extractfile(m).read())
          rows=[];sources=[];identities=collections.Counter();rejected=collections.Counter();shapes={}
          for path in sorted(root.rglob('daily-research-*.json.gz')):
           value,digest=manifest_archive(path);day=value['OPERATIONAL_DATE_JST']
           if not '2026-10-20'<=day<'2026-10-26':continue
           ledger=ledger_map(value)
           records=value.get('P3_CONFIDENCE_CALIBRATION_DEV',{}).get('RECORDS',[])
           sources.append({'day':day,'archive_sha256':digest,'records':len(records)})
           if not shapes:
            shapes={'ledger_fields':value['RESEARCH_LEDGER60_FIELDS'],'bindings':value['SOURCE_BINDINGS'],'record_fields':sorted(records[0]) if records else []}
           for r in records:
            if r.get('MORNING_OR_LIVE')!='LIVE':continue
            identities[json.dumps({k:r.get(k) for k in ['P3_VERSION','P3_ENGINE_FINGERPRINT','CONFIDENCE_RULE_VERSION','PL120_VERSION']},sort_keys=True)]+=1
            try:
             out=verified_outcome(r,ledger[r['RACE_ID']],value)
             rows.append(out)
            except Exception as exc:rejected[str(exc)]+=1
          units={u:summary([r for r in rows if r['UNIT']==u]) for u in ['LIVE_3','LIVE_5','LIVE_7']}
          byday={d:{u:summary([r for r in rows if r['RACE_DAY']==d and r['UNIT']==u]) for u in units} for d in sorted({r['RACE_DAY'] for r in rows})}
          folds=[]
          for day in sorted(byday):
           for u in units:
            train=[r for r in rows if r['RACE_DAY']<day and r['UNIT']==u and r['Y'] in [0,1]]
            test=[r for r in rows if r['RACE_DAY']==day and r['UNIT']==u and r['Y'] in [0,1]]
            if len(train)<30 or len({r['RACE_DAY'] for r in train})<3:continue
            rate=sum(r['Y'] for r in train)/len(train)
            folds.append({'day':day,'unit':u,'train':summary(train),'test':summary(test),'reference_grade':research_grade(rate)})
          report={'schema':'G11_P3_LIVE_POINT_REFERENCE_AUDIT_V1','cutoff_exclusive':'2026-10-26','sources':sources,'units':units,'by_day':byday,'walk_forward':folds,'identity_groups':[dict(json.loads(k),n=n) for k,n in identities.items()],'shapes':shapes,'rejected':dict(rejected),'method':{'kind':'HISTORICAL_PERIOD_POINT_COHORT','thresholds':{'S':.6,'A':.4,'B':.2,'C':0},'minimum_races':30,'minimum_days':3,'individual_probability':False,'formal_certification':False,'model_generation_verified':False}}
          print('P3_POINT_REFERENCE_JSON='+json.dumps(report,ensure_ascii=False,separators=(',',':')))
          PY
      - name: Remove temporary plaintext
        if: always()
        run: rm -rf .audit "${RUNNER_TEMP}/source.tgz"

