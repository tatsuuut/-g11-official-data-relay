name: verify P3 confidence daily evidence branch

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/verify-p3-confidence-daily-evidence.yml

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout private research branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: tatsuuut/boat-brain-lab
          ref: research/p3-confidence-daily-evidence-v1
          token: ${{ secrets.G11_PRIVATE_REPO_TOKEN }}
          path: private-src
          persist-credentials: false
      # rerun 3
      - name: Compile
        run: |
          cd private-src
          python3 -m py_compile g11/canonical/official_pipeline.py
          python3 -m py_compile g11/growth_p3/v1_1/confidence_daily_evidence_v1.py
      - name: Focused tests
        run: |
          cd private-src
          python3 -m unittest g11.canonical.test_p3_confidence_daily_evidence -v
          python3 -m unittest g11.canonical.test_official_pipeline.CanonicalOfficialPipelineTests.test_night_partial_http_200_is_rejected_then_full_k_can_retry -v
          python3 -m unittest g11.canonical.test_official_pipeline.CanonicalOfficialPipelineTests.test_permanent_daily_history_restore_audit_rehashes_all_layers -v
