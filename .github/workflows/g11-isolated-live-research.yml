name: independent saved-input research
run-name: RESEARCH-${{github.event.workflow_run.id}}
on:
  workflow_dispatch:
    inputs:
      operational_date:
        description: Saved operational day, never a request to regenerate a forecast.
        required: true
        type: string
      source_key:
        description: Exact authenticated canonical checkpoint key.
        required: true
        type: string
  workflow_run:
    workflows: [runtime sync, paired Mashiro P3 saved comparison contract]
    types: [in_progress, completed]
    branches: [main]

permissions:
  contents: read
  actions: read
  id-token: write

# This group never shares the canonical LIVE/NIGHT writer's serialized slot.
concurrency:
  group: g11-isolated-saved-input-research
  cancel-in-progress: false

jobs:
  saved-research:
    if: vars.G11_RELAY_ENABLED == 'true' && github.ref == 'refs/heads/main' && (github.event_name == 'workflow_dispatch' || (github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.head_repository.full_name == github.repository))
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      TZ: Asia/Tokyo
      G11_APP_ORIGIN: https://g11-race-lab.higatatsunori2.chatgpt.site
      G11_OIDC_AUDIENCE: g11-race-lab
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: main
          persist-credentials: false
      - name: Select an activated canonical input checkpoint
        id: input
        env:
          GH_TOKEN: ${{github.token}}
        run: python3 scripts/isolated_research_runner_v1.py select-event
      - name: Prepare optional standard gzip acceleration
        if: steps.input.outputs.active=='true'
        run: python3 -S scripts/encrypt_runtime_state_v1.py --prepare-gzip
      - name: Restore exact canonical input without acquiring official data
        if: steps.input.outputs.active=='true'
        id: canonical-cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: .relay-cache/state.tgz.gpg
          key: ${{steps.input.outputs.source_key}}
          fail-on-cache-miss: true
      - name: Authenticate the input before exposing its disposable copy
        if: steps.input.outputs.active=='true'
        env:
          G11_PRIVATE_REPO_TOKEN: ${{secrets.G11_PRIVATE_REPO_TOKEN}}
        run: |
          set -euo pipefail
          test '${{steps.canonical-cache.outputs.cache-matched-key}}' = '${{steps.input.outputs.source_key}}'
          exec 3<<<"${G11_PRIVATE_REPO_TOKEN}"
          python3 scripts/isolated_research_runner_v1.py decode --destination .research-state
          exec 3<&-
          rm -f .relay-cache/state.tgz.gpg
      - name: Require activated normal operation and decide the capture window
        if: steps.input.outputs.active=='true'
        id: window
        run: python3 scripts/isolated_research_runner_v1.py prepare-input --state-root .research-state --day '${{steps.input.outputs.day}}'
      - name: Restore the same frozen source for read-only research
        if: steps.window.outputs.active=='true'
        run: python3 scripts/daily_runtime_bootstrap_v1.py prepare --state-root .research-state --operational-date '${{steps.input.outputs.day}}' --phase predeadline --source-root .g11-private
      - name: Checkout activated exhibition input reader for saved-only research
        if: steps.window.outputs.active=='true'&&steps.input.outputs.day=='2026-11-27'
        continue-on-error: true
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: tatsuuut/boat-brain-lab
          ref: 614905a4001d6f4392ece21f49a30b3b4991581c
          token: ${{ secrets.G11_PRIVATE_REPO_TOKEN }}
          path: .g11-exhibition-input
          persist-credentials: false
          fetch-depth: 1
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            .github/workflows/g11-predeadline-critical-path-ci.yml
            docs/EXHIBITION_THIRD_SOURCE_20261127.md
            docs/P3_ORIGINAL_INPUT_RUNTIME_PROTOCOL_20261114.json
            g11/canonical/boatcast_preview_v1.py
            g11/canonical/fixtures/boatcast_preview_20261127_18_03_metadata.json
            g11/canonical/fixtures/boatcast_preview_20261127_18_03_str3.txt
            g11/canonical/fixtures/boatcast_preview_20261127_18_03_stt.txt
            g11/canonical/fixtures/boatcast_preview_20261127_18_03_sui.txt
            g11/canonical/fixtures/boatcast_preview_20261127_18_03_tkz.txt
            g11/canonical/fixtures/fun_original_20261126_20_12.html
            g11/canonical/fixtures/fun_original_20261126_20_12.json
            g11/canonical/fun_original_display_v1.py
            g11/canonical/official_pipeline.py
            g11/canonical/published_preview_v1.py
            g11/canonical/shared_original_display_v1.py
            g11/canonical/test_boatcast_preview_admission_v1.py
            g11/canonical/test_boatcast_preview_v1.py
            g11/canonical/test_exhibition_third_routing_v1.py
            g11/canonical/test_fun_original_display_v1.py
            g11/canonical/test_p3_boatcast_preview_transport_v1.py
            g11/canonical/test_shared_original_display_v1.py
            g11/growth_p3/v1_1/current_runtime_v1.py
            g11/growth_p3/v1_1/test_official_display_tickets_v1.py
            g11/growth_p3/v1_1/true_only_models_v2.py
            g11/relay/test_verified_venue_live_v1.py
            g11/relay/verified_venue_live_v1.py
            g11/wild_pack/v1/runtime_orchestrator_v1.py
            g11/wild_pack/v1/test_runtime_orchestrator_v1.py
            p3/formal_input_admission/v1/audit/formal_input_admission_static_auditor_v1.py
            p3/formal_input_admission/v1/design/FORMAL_INPUT_ADMISSION_GATE_DESIGN_V1.json
            p3/formal_input_admission/v1/evidence/FORMAL_INPUT_ADMISSION_STATIC_AUDIT_EVIDENCE_V1.json
            p3/formal_input_admission/v1/evidence/FORMAL_INPUT_ADMISSION_STATIC_AUDIT_READBACK_VERIFICATION_V1.json
            p3/formal_input_admission/v1/src/formal_input_admission_gate_v1.py
            p3/formal_invocation_adapter/v1/audit/formal_p3_invocation_adapter_static_auditor_v1.py
            p3/formal_invocation_adapter/v1/design/FORMAL_P3_INVOCATION_ADAPTER_DESIGN_V1.json
            p3/formal_invocation_adapter/v1/evidence/FORMAL_P3_INVOCATION_ADAPTER_STATIC_AUDIT_EVIDENCE_V1.json
            p3/formal_invocation_adapter/v1/evidence/FORMAL_P3_INVOCATION_ADAPTER_STATIC_AUDIT_READBACK_VERIFICATION_V1.json
            p3/formal_invocation_adapter/v1/src/formal_p3_invocation_adapter_v1.py
            tests/test_exhibition_third_source_authority_v1.py
            tests/test_exhibition_third_source_scope_v1.py
            tools/verify_exhibition_third_source_scope_v1.py
            tools/verify_p3_original_input_runtime_patch_v1.py
      - name: Checkout the pinned official-display comparison
        id: display-source
        if: steps.window.outputs.active=='true'
        continue-on-error: true
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: tatsuuut/boat-brain-lab
          ref: 2f8e7fc4e201145c3c0faa2d0580e68bdb30b08e
          token: ${{secrets.G11_PRIVATE_REPO_TOKEN}}
          path: .p3-display-source
          persist-credentials: false
          sparse-checkout: g11/research/p3_original_display_v1/observe.py
          sparse-checkout-cone-mode: false
      - name: Restore this day's encrypted P3 display observations
        if: steps.display-source.outcome=='success'
        id: display-cache
        continue-on-error: true
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: .p3-display-cache/observations.gpg
          key: p3-oriten-forward-v1-${{steps.input.outputs.day}}-${{github.run_id}}-${{github.run_attempt}}
          restore-keys: |
            p3-oriten-forward-v1-${{steps.input.outputs.day}}-
      - name: Authenticate prior P3 display observations
        if: steps.display-cache.outcome=='success' && steps.display-cache.outputs.cache-matched-key!=''
        id: display-restore
        continue-on-error: true
        env:
          G11_PRIVATE_REPO_TOKEN: ${{secrets.G11_PRIVATE_REPO_TOKEN}}
        run: |
          set -euo pipefail
          exec 3<<<"${G11_PRIVATE_REPO_TOKEN}"
          python3 -S scripts/isolated_research_runner_v1.py decode --encrypted .p3-display-cache/observations.gpg --destination .p3-display-day
      - name: Compare timely official display against already saved P3 LIVE
        id: display-observe
        if: steps.display-cache.outcome=='success' && (steps.display-cache.outputs.cache-matched-key=='' || steps.display-restore.outcome=='success')
        continue-on-error: true
        env:
          DAY: ${{steps.input.outputs.day}}
          PYTHONPATH: .g11-private
        run: |
          set -euo pipefail
          mkdir -p .p3-display-day
          fingerprint() { find .p3-display-day -type f -name '*.json' -print0 | sort -z | xargs -0r sha256sum | sha256sum; }
          before=$(fingerprint)
          observer=.p3-display-source/g11/research/p3_original_display_v1/observe.py
          if [[ "$DAY" > "2026-11-20" && -f .g11-private/g11/growth_p3/v1_1/official_display_tickets_v1.py ]]; then
            # The authenticated morning runtime owns both ticket lists after formal adoption.
            observer=.g11-private/g11/research/p3_original_display_v1/observe.py
          fi
          python3 -S "$observer" --store .research-state/store --day "$DAY" --output .p3-display-day
          if [[ $(fingerprint) != "$before" ]]; then echo 'changed=true' >> "$GITHUB_OUTPUT"; fi
      - name: Encrypt and verify the updated P3 display comparison
        id: display-encrypt
        if: steps.display-observe.outputs.changed=='true'
        continue-on-error: true
        env:
          G11_PRIVATE_REPO_TOKEN: ${{secrets.G11_PRIVATE_REPO_TOKEN}}
        run: |
          set -euo pipefail
          mkdir -p .p3-display-cache
          exec 3<<<"${G11_PRIVATE_REPO_TOKEN}"
          python3 -S scripts/encrypt_runtime_state_v1.py --state-root .p3-display-day --output .p3-display-cache/observations.gpg
          exec 3<<<"${G11_PRIVATE_REPO_TOKEN}"
          python3 -S scripts/isolated_research_runner_v1.py decode --encrypted .p3-display-cache/observations.gpg --destination .p3-display-readback
          diff -qr .p3-display-day .p3-display-readback
      - name: Persist updated P3 display observations for this day
        if: steps.display-encrypt.outcome=='success'
        continue-on-error: true
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: .p3-display-cache/observations.gpg
          key: p3-oriten-forward-v1-${{steps.input.outputs.day}}-${{github.run_id}}-${{github.run_attempt}}
      - name: Retain encrypted forward comparison for later chronological validation
        if: steps.display-encrypt.outcome=='success'
        continue-on-error: true
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: p3-oriten-forward-v1-${{steps.input.outputs.day}}-${{github.run_id}}-${{github.run_attempt}}
          path: .p3-display-cache/observations.gpg
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 90
      - name: Restore only the separate research output namespace
        if: steps.window.outputs.active=='true' && steps.input.outputs.research_key!=''
        id: research-cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: .relay-cache/state.tgz.gpg
          key: ${{steps.input.outputs.research_key}}
          fail-on-cache-miss: true
      - name: Authenticate prior research outputs
        if: steps.research-cache.outputs.cache-hit=='true'
        env:
          G11_PRIVATE_REPO_TOKEN: ${{secrets.G11_PRIVATE_REPO_TOKEN}}
        run: |
          set -euo pipefail
          test '${{steps.research-cache.outputs.cache-matched-key}}' = '${{steps.input.outputs.research_key}}'
          exec 3<<<"${G11_PRIVATE_REPO_TOKEN}"
          python3 scripts/isolated_research_runner_v1.py decode --destination .research-previous
          exec 3<&-
      - name: Prepare dependencies only for an open research window
        if: steps.window.outputs.active=='true' && steps.window.outputs.closing!='true'
        uses: ./.github/actions/g11-public-python
      - name: Checkout the pinned observation-only research source
        if: steps.window.outputs.active=='true' && steps.window.outputs.closing!='true'
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: tatsuuut/boat-brain-lab
          ref: 9c265a5433b81d501d6f1d35a32287bf79c2447b
          token: ${{secrets.G11_PRIVATE_REPO_TOKEN}}
          path: .g11-deme-research
          persist-credentials: false
          fetch-depth: 1
          sparse-checkout: g11/canonical/deme_discovery*
          sparse-checkout-cone-mode: false
      - name: Checkout the pinned independent fixed-rule Mashiro observer
        if: steps.window.outputs.active=='true'
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: tatsuuut/boat-brain-lab
          ref: 724b660ae36e59eb989892b1a4050a54f65e8ab6
          token: ${{secrets.G11_PRIVATE_REPO_TOKEN}}
          path: .g11-mashiro-fixed
          persist-credentials: false
          sparse-checkout: g11/research/mashiro_fixed_v1
      - name: Checkout the pinned paired Mashiro and P3 auditor
        if: steps.window.outputs.active=='true'
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: tatsuuut/boat-brain-lab
          ref: a121ca98fc80628a4fea056d589d05f19c83740b
          token: ${{secrets.G11_PRIVATE_REPO_TOKEN}}
          path: .g11-mashiro-bridge
          persist-credentials: false
          sparse-checkout: |
            g11/research/mashiro_p3_bridge_v1
            g11/growth_p3/v1_1/mashiro_tactical_research_v1.py
          sparse-checkout-cone-mode: false
      - name: Run research only and export an allowlisted bundle
        if: steps.window.outputs.active=='true'
        id: research
        env:
          G11_PRIVATE_REPO_TOKEN: ""
        run: python3 scripts/isolated_research_runner_v1.py run --state-root .research-state --day '${{steps.input.outputs.day}}' --source-key '${{steps.input.outputs.source_key}}'
      - name: Encrypt separate research outputs
        if: steps.research.outcome=='success' && steps.research.outputs.no_change!='true'
        env:
          G11_PRIVATE_REPO_TOKEN: ${{secrets.G11_PRIVATE_REPO_TOKEN}}
        run: |
          set -euo pipefail
          mkdir -p .relay-cache .relay-output
          exec 3<<<"${G11_PRIVATE_REPO_TOKEN}"
          python3 scripts/encrypt_runtime_state_v1.py --state-root .research-export --output .relay-cache/state.tgz.gpg
          exec 3<&-
      - name: Persist and read back only the isolated research namespace
        if: steps.research.outcome=='success' && steps.research.outputs.no_change!='true'
        id: persisted
        uses: ./.github/actions/g11-publication-checkpoint
        with:
          cache-key: g11-research-v1-${{steps.input.outputs.day}}-${{github.run_id}}-${{github.run_attempt}}
      - name: Publish the independent fixed-study app display after verified persistence
        if: steps.research.outcome=='success' && (steps.persisted.outputs.ready=='true' || steps.research.outputs.no_change=='true')
        env:
          RESEARCH_CHECKPOINT_VERIFIED: 'true'
        run: python3 -S scripts/mashiro_fixed_display_v1.py --state-root .research-state --source-root .g11-private --observer-root .g11-mashiro-fixed --day '${{steps.input.outputs.day}}' --source-checkpoint '${{steps.input.outputs.source_key}}'
      - name: Publish the isolated same-point Mashiro and P3 comparison
        if: steps.research.outcome=='success' && (steps.persisted.outputs.ready=='true' || steps.research.outputs.no_change=='true')
        env:
          RESEARCH_CHECKPOINT_VERIFIED: 'true'
        run: python3 -S scripts/mashiro_p3_bridge_v1.py --mode publish --state-root .research-state --day '${{steps.input.outputs.day}}'
      - name: Retain encrypted paired evidence after a changed closing checkpoint
        if: steps.research.outputs.closing=='true' && steps.persisted.outputs.ready=='true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: mashiro-p3-paired-${{steps.input.outputs.day}}-${{github.run_id}}-${{github.run_attempt}}
          path: .relay-cache/state.tgz.gpg
          retention-days: 90
          if-no-files-found: error
          include-hidden-files: true
      - name: Publish only the separate research display
        if: steps.persisted.outputs.ready=='true' && steps.research.outputs.closing!='true' && steps.research.outputs.publication_ready=='true'
        env:
          RESEARCH_CHECKPOINT_VERIFIED: ${{steps.persisted.outputs.ready}}
        run: python3 scripts/isolated_research_runner_v1.py publish --state-root .research-state --day '${{steps.input.outputs.day}}'
      - name: Select durable fixed-study evidence after verified research persistence
        id: fixed-archive
        if: steps.research.outcome=='success' && steps.research.outputs.fixed_archive_ready=='true' && (steps.persisted.outputs.ready=='true' || steps.research.outputs.no_change=='true')
        env:
          GH_TOKEN: ${{github.token}}
          STUDY_DAY: ${{steps.input.outputs.day}}
          STUDY_PROTOCOL_SHA: ${{steps.research.outputs.fixed_protocol_sha}}
        run: |
          python3 - <<'PY'
          import json,os,re,subprocess
          day=os.environ['STUDY_DAY'];sha=os.environ['STUDY_PROTOCOL_SHA']
          assert re.fullmatch(r'2026-\d{2}-\d{2}',day) and re.fullmatch('[a-f0-9]{64}',sha)
          name='mashiro-fixed-v1-'+day+'-'+sha[:12]
          result=subprocess.run(['gh','api','repos/'+os.environ['GITHUB_REPOSITORY']+'/actions/artifacts?name='+name+'&per_page=100'],check=True,capture_output=True,text=True)
          exists=any(not a['expired'] and a['name']==name and a.get('workflow_run',{}).get('head_branch')=='main' for a in json.loads(result.stdout)['artifacts'])
          with open(os.environ['GITHUB_OUTPUT'],'a') as out:
              out.write('needed='+str(not exists).lower()+'\nartifact_name='+name+'\n')
          PY
      - name: Encrypt and verify only the fixed-study daily evidence
        if: steps.fixed-archive.outputs.needed=='true'
        env:
          G11_PRIVATE_REPO_TOKEN: ${{secrets.G11_PRIVATE_REPO_TOKEN}}
        run: |
          set -euo pipefail
          python3 scripts/audit_mashiro_fixed_inputs_v1.py --state-root .research-state --source-root .g11-private --observer-root .g11-mashiro-fixed --day '${{steps.input.outputs.day}}' --archive .mashiro-fixed-evidence --source-checkpoint '${{steps.input.outputs.source_key}}'
          exec 3<<<"${G11_PRIVATE_REPO_TOKEN}"
          python3 scripts/encrypt_runtime_state_v1.py --state-root .mashiro-fixed-evidence --output .mashiro-fixed-evidence.tgz.gpg
          exec 3<&-
          exec 3<<<"${G11_PRIVATE_REPO_TOKEN}"
          gpg --batch --yes --pinentry-mode loopback --passphrase-fd 3 --decrypt --output .mashiro-fixed-readback.tgz .mashiro-fixed-evidence.tgz.gpg 2>/dev/null
          exec 3<&-
          python3 - <<'PY'
          import hashlib,json,pathlib,tarfile
          with tarfile.open('.mashiro-fixed-readback.tgz','r:gz') as archive:
              members=archive.getmembers()
              assert len(members)<10000 and sum(m.size for m in members)<=256*1024*1024
              assert all((m.isdir() or m.isfile()) and not pathlib.PurePosixPath(m.name).is_absolute() and '..' not in pathlib.PurePosixPath(m.name).parts for m in members)
              files={pathlib.PurePosixPath(m.name).as_posix().removeprefix('./'):m for m in members if m.isfile()}
              manifest=json.load(archive.extractfile(files['manifest.json']))
              assert set(files)==set(manifest['FILES'])|{'manifest.json'}
              for name,row in manifest['FILES'].items():
                  raw=archive.extractfile(files[name]).read()
                  assert len(raw)==row['bytes'] and hashlib.sha256(raw).hexdigest()==row['sha256']
              assert manifest['P3_OR_MODEL_STATE_INCLUDED'] is False and manifest['OFFICIAL_ACQUISITION']==0
          print('G11_MASHIRO_FIXED_ENCRYPTED_EVIDENCE_READBACK=PASS')
          PY
          rm -f .mashiro-fixed-readback.tgz
      - name: Retain encrypted daily study evidence beyond transient caches
        if: steps.fixed-archive.outputs.needed=='true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ${{steps.fixed-archive.outputs.artifact_name}}
          path: .mashiro-fixed-evidence.tgz.gpg
          retention-days: 90
          if-no-files-found: error
          include-hidden-files: true
      - name: Locate yesterday's outstanding fixed-study observations
        id: fixed-late
        if: steps.research.outcome=='success' && steps.window.outputs.active=='true'
        continue-on-error: true
        env:
          GH_TOKEN: ${{github.token}}
        run: python3 -S scripts/mashiro_fixed_saved_k_close_v1.py select --day '${{steps.input.outputs.day}}'
      - name: Authenticate the retained, closed observation bundle
        id: fixed-late-input
        if: steps.fixed-late.outputs.needed=='true'
        continue-on-error: true
        env:
          G11_PRIVATE_REPO_TOKEN: ${{secrets.G11_PRIVATE_REPO_TOKEN}}
        run: |
          set -euo pipefail
          exec 3<<<"${G11_PRIVATE_REPO_TOKEN}"
          python3 -S scripts/isolated_research_runner_v1.py decode --encrypted .mashiro-saved-k/bundle.gpg --destination .mashiro-saved-k/original
          exec 3<&-
      - name: Reconcile the original observations to the K archive already bound to MORNING
        id: fixed-late-join
        if: steps.fixed-late-input.outcome=='success'
        continue-on-error: true
        run: python3 -S scripts/mashiro_fixed_saved_k_close_v1.py build --day '${{steps.input.outputs.day}}' --source-key '${{steps.input.outputs.source_key}}'
      - name: Encrypt and verify the independent settlement evidence
        id: fixed-late-persist
        if: steps.fixed-late-join.outcome=='success' && steps.fixed-late-join.outputs.prepared=='true'
        continue-on-error: true
        env:
          G11_PRIVATE_REPO_TOKEN: ${{secrets.G11_PRIVATE_REPO_TOKEN}}
        run: |
          set -euo pipefail
          exec 3<<<"${G11_PRIVATE_REPO_TOKEN}"
          python3 scripts/encrypt_runtime_state_v1.py --state-root .mashiro-saved-k/evidence --output .mashiro-saved-k/outcomes.tgz.gpg
          exec 3<&-
          exec 3<<<"${G11_PRIVATE_REPO_TOKEN}"
          python3 -S scripts/isolated_research_runner_v1.py decode --encrypted .mashiro-saved-k/outcomes.tgz.gpg --destination .mashiro-saved-k/readback
          exec 3<&-
          diff -qr .mashiro-saved-k/evidence .mashiro-saved-k/readback
      - name: Retain the verified result evidence before app publication
        id: fixed-late-archive
        if: steps.fixed-late-persist.outcome=='success'
        continue-on-error: true
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: mashiro-fixed-saved-k-from-${{steps.input.outputs.day}}-${{github.run_id}}-${{github.run_attempt}}
          path: .mashiro-saved-k/outcomes.tgz.gpg
          retention-days: 90
          if-no-files-found: error
          include-hidden-files: true
      - name: Publish only the reconciled previous-day Mashiro projection
        id: fixed-late-publication
        if: steps.fixed-late-archive.outcome=='success'
        env:
          RESEARCH_CHECKPOINT_VERIFIED: 'true'
        run: python3 -S scripts/mashiro_fixed_saved_k_close_v1.py publish --day '${{steps.input.outputs.day}}'
      - name: Report an incomplete previous-day fixed-study recovery
        if: always() && (steps.fixed-late.outcome=='failure' || (steps.fixed-late.outputs.needed=='true' && (steps.fixed-late-join.outcome!='success' || (steps.fixed-late-join.outputs.prepared=='true' && steps.fixed-late-publication.outcome!='success'))))
        run: |
          echo "::error::Previous-day fixed-study reconciliation is incomplete. See selection, binding, evidence and readback above."
          exit 1
