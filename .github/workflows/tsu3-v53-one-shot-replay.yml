name: Tsu3 V53 one-shot historical replay

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/tsu3-v53-one-shot-replay.yml

permissions:
  actions: read
  contents: read

jobs:
  replay:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      G11_PRIVATE_REPOSITORY: ${{ secrets.PRIVATE_SOURCE_REPO }}
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUNBUFFERED: "1"
      TZ: Asia/Tokyo
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Restore encrypted 2026-10-01 runtime state
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: .relay-cache/state.tgz.gpg
          key: g11-state-v2-2026-10-01-replay-${{ github.run_id }}
          restore-keys: |
            g11-state-v2-2026-10-01-
      - name: Decrypt saved state
        env:
          G11_PRIVATE_REPO_TOKEN: ${{ secrets.G11_PRIVATE_REPO_TOKEN }}
        run: |
          set -euo pipefail
          test -s .relay-cache/state.tgz.gpg
          mkdir -p .relay-state
          archive="${RUNNER_TEMP}/g11-relay-state.tgz"
          exec 3<<<"${G11_PRIVATE_REPO_TOKEN}"
          gpg --batch --yes --pinentry-mode loopback --passphrase-fd 3 --decrypt --output "${archive}" .relay-cache/state.tgz.gpg
          exec 3<&-
          tar -xzf "${archive}" -C .relay-state
          test -d .relay-state/store
      - name: Checkout current private G11 runtime
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: ${{ env.G11_PRIVATE_REPOSITORY }}
          ref: main
          token: ${{ secrets.G11_PRIVATE_REPO_TOKEN }}
          path: .g11-private
          persist-credentials: false
          fetch-depth: 1
      - name: Replay saved Tsu3 through current V53
        env:
          G11_PRIVATE_REPO_TOKEN: ""
        run: |
          set -euo pipefail
          PYTHONPATH=".g11-private" python3 - <<'PY'
          import copy, json
          from pathlib import Path
          from g11.abeken.v53 import abeken_shadow_v53_runtime as v53
          from g11.canonical.official_pipeline import OfficialArtifactStore
          key="20261001-09-03"
          store=OfficialArtifactStore(Path('.relay-state/store').resolve(strict=True))
          m=store.load_verified_snapshot('morning',f'abeken-v53-shadow-morning-{key.lower()}')['SNAPSHOT']['PAYLOAD']['RESULT']
          l=store.load_verified_snapshot('predeadline',f'abeken-v53-shadow-live-{key.lower()}')['SNAPSHOT']['PAYLOAD']['RESULT']
          b=store.load_verified_snapshot('predeadline',f'beforeinfo-{key.lower()}')['SNAPSHOT']['PAYLOAD']
          before=(b.get('OFFICIAL_BEFOREINFO') or b.get('BEFOREINFO') or b.get('RAW') or b.get('DATA'))
          if not isinstance(before,dict) or 'RACERS' not in before:
              print('BEFOREINFO_PAYLOAD_KEYS='+json.dumps(sorted(b.keys())))
              raise SystemExit('SAVED_BEFOREINFO_SCHEMA_UNRESOLVED')
          morning=copy.deepcopy(m)
          morning['RACE_DATE']='2026-10-02'
          candidate=copy.deepcopy(l['PRE_RACE_CANDIDATE_INPUT'])
          decision,modes,audit=v53._derive_inferred_pre_race_graph(morning,candidate,before)
          old=list(l['DECISION']['BUY_SET']); new=list(decision['BUY_SET']); target='6-1-2'
          out={'STATUS':'PASS_RESULT_BLIND_COUNTERFACTUAL','RACE_KEY':key,'SOURCE_CAPTURED_AT_JST':l['PRE_RACE_DATA_CAPTURED_AT'],'CURRENT_RUNTIME_LOGIC_VERSION':v53.RUNTIME_LOGIC_VERSION,'CURRENT_RIGHT_POLICY_VERSION':audit['RIGHT_TRANSITION_POLICY_VERSION'],'RESULT_INPUT_USED':False,'PAYOUT_INPUT_USED':False,'OLD_V53':{'MAIN_HEAD':l['DECISION']['MAIN_HEAD'],'SUB_HEAD_LIST':l['DECISION']['SUB_HEAD_LIST'],'BUY_COUNT':len(old),'TARGET_6_1_2':target in old},'CURRENT_V53_REPLAY':{'MAIN_HEAD':decision['MAIN_HEAD'],'SUB_HEAD_LIST':decision['SUB_HEAD_LIST'],'LIMITED_HEAD_LIST':decision.get('LIMITED_HEAD_LIST',[]),'HEAD_POOL':decision['HEAD_POOL'],'BUY_COUNT':len(new),'BUY_SET':new,'TARGET_6_1_2':target in new,'UPDATE_MODES':modes,'FULL_HEAD_LIST':audit.get('FULL_HEAD_LIST'),'FULL_TO_LIMITED_HEADS':audit.get('FULL_TO_LIMITED_HEADS'),'NONHEAD_TO_LIMITED_HEADS':audit.get('NONHEAD_TO_LIMITED_HEADS')},'COUNT_DELTA':len(new)-len(old)}
          print('TSU3_CURRENT_V53_REPLAY='+json.dumps(out,ensure_ascii=False,sort_keys=True))
          PY
