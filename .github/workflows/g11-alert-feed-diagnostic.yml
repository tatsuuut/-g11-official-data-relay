name: G11 alert feed diagnostic

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/g11-alert-feed-diagnostic.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect-alert-feed:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    env:
      G11_APP_ORIGIN: https://g11-race-lab.higatatsunori2.chatgpt.site
      TZ: Asia/Tokyo
    steps:
      - name: Read current alert projection
        run: |
          set -euo pipefail
          operational_date="$(date +%F)"
          curl --fail-with-body --silent --show-error --location             "${G11_APP_ORIGIN}/api/g11-feed?date=${operational_date}"             -o feed.json
          jq -c '{
            operational_date_jst,
            stage,
            counts,
            growth_p3: .canonical_authorities.growth_p3,
            alert_candidates: [
              .races[]
              | select(
                  .odds_merit == "◎"
                  or ((.predeadline | type) == "object" and .predeadline.odds_merit == "◎")
                )
              | {
                  key,
                  venue,
                  race,
                  formal_status,
                  research_eligible,
                  odds_merit,
                  predeadline_odds_merit: (
                    if (.predeadline | type) == "object"
                    then .predeadline.odds_merit
                    else null
                    end
                  ),
                  best_ev,
                  value_bets,
                  p3_logic_id,
                  p3_status
                }
            ]
          }' feed.json
