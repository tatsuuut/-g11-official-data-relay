name: G11 night special8 transport finance audit

on:
  pull_request:
    paths:
      - ".github/workflows/g11-night-special8-transport-finance-audit.yml"

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout relay
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Checkout private fix branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: tatsuuut/boat-brain-lab
          ref: fix/night-special8-transport-finance-20260923
          token: ${{ secrets.G11_PRIVATE_REPO_TOKEN }}
          path: .g11-private
          fetch-depth: 1

      - name: Install pinned parser dependency
        run: python3 -m pip install --disable-pip-version-check --no-input 'lxml==6.1.1'

      - name: Compile and test NIGHT finance
        working-directory: .g11-private
        run: |
          python3 -m compileall -q g11/relay/night_transport_finance_v1.py
          python3 -m unittest -v g11.relay.test_night_transport_finance_v1
