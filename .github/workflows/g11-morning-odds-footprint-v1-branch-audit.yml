name: G11 morning odds footprint V1 branch audit

on:
  pull_request:
    paths:
      - ".github/workflows/g11-morning-odds-footprint-v1-branch-audit.yml"

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout relay
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Checkout private feature branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: tatsuuut/boat-brain-lab
          ref: feat/morning-odds-footprint-4bet-shadow-v1
          token: ${{ secrets.G11_PRIVATE_REPO_TOKEN }}
          path: .g11-private
          fetch-depth: 1

      - name: Install pinned parser dependency
        run: python3 -m pip install --disable-pip-version-check --no-input 'lxml==6.1.1'

      - name: Compile and test V1
        working-directory: .g11-private
        run: |
          python3 -m compileall -q g11/morning_odds_footprint/v1
          python3 -m unittest -v g11.morning_odds_footprint.v1.test_runtime_v1
