name: 2026-10-02 Abeken score audit
on:
  push:
    branches: [main]
    paths: [.github/workflows/abeken-score-audit-20261002.yml]
permissions:
  actions: read
  contents: read
jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {persist-credentials: false}
      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: .relay-cache/state.tgz.gpg
          key: g11-state-v2-2026-10-02-audit-${{ github.run_id }}
          restore-keys: |
            g11-state-v2-2026-10-02-
      - name: Decrypt state
        env:
          TOKEN: ${{ secrets.G11_PRIVATE_REPO_TOKEN }}
        run: |
          set -euo pipefail
          test -s .relay-cache/state.tgz.gpg
          mkdir -p .relay-state
          archive="${RUNNER_TEMP}/state.tgz"
          exec 3<<<"${TOKEN}"
          gpg --batch --yes --pinentry-mode loopback --passphrase-fd 3 --decrypt --output "${archive}" .relay-cache/state.tgz.gpg
          exec 3<&-
          tar -xzf "${archive}" -C .relay-state
      - name: Inspect 10-02 score-bearing snapshots
        run: |
          python3 - <<'PY'
          from pathlib import Path
          root=Path('.relay-state/store')
          print('STORE_EXISTS',root.exists())
          for sub in ['snapshots/morning','snapshots/predeadline','snapshots/night']:
              p=root/sub
              print('DIR',sub,p.exists())
              if p.exists():
                  names=[x.name for x in p.iterdir() if x.is_file() and ('abeken' in x.name or 'night' in x.name or 'result' in x.name)]
                  print('\n'.join(names[-300:]))
          print('RESULT_CANDIDATES')
          for p in root.rglob('*.json'):
              low=str(p).lower()
              if any(t in low for t in ('night','result','settlement','ledger')):
                  print(p)
          import json
          for rel in [
              'shadow/original-display/v2/night/20261002-04-07.json',
              'snapshots/morning/abeken-shadow-morning-20261002-04-07.json',
              'snapshots/predeadline/abeken-shadow-live-20261002-04-07.json',
              'snapshots/morning/abeken-v53-shadow-morning-20261002-04-07.json',
              'snapshots/predeadline/abeken-v53-shadow-live-20261002-04-07.json',
          ]:
              p=root/rel
              print('SAMPLE_FILE',rel,p.exists())
              if p.exists():
                  x=json.loads(p.read_text())
                  print(json.dumps(x,ensure_ascii=False)[:30000])
          print('KEY_FILES_0407')
          for p in root.rglob('*20261002-04-07*'):
              print(p)
          night=json.loads((root/'shadow/original-display/v2/night/20261002-04-07.json').read_text())
          def walk(v,path=''):
              if isinstance(v,dict):
                  for k,x in v.items():
                      if any(t in str(k).upper() for t in ('TRIFECTA','3連単','SETTLEMENT','PAYOUT','WINNING')):
                          print('KEYPATH',path+'/'+str(k),json.dumps(x,ensure_ascii=False)[:5000])
                      walk(x,path+'/'+str(k))
              elif isinstance(v,list):
                  for i,x in enumerate(v): walk(x,path+'/'+str(i))
          walk(night)
          import re
          def payload(path):
              x=json.loads(path.read_text())
              return x.get('PAYLOAD',x)
          def baseline_bets(path):
              try:
                  r=payload(path)['RESULT']
                  return set(r.get('PRACTICAL_BETS') or r.get('BUY_SET') or [])
              except Exception:
                  return set()
          def v53_bets(path):
              try:
                  r=payload(path)['RESULT']
                  return set(r['DECISION']['BUY_SET'])
              except Exception:
                  return set()
          rows=[]
          nightdir=root/'shadow/original-display/v2/night'
          for np in sorted(nightdir.glob('20261002-??-??.json')):
              key=np.stem
              night=json.loads(np.read_text())
              settlements=night.get('SETTLEMENTS') or []
              if not settlements: continue
              winners=[str(x.get('combination')) for x in settlements if x.get('combination')]
              if not winners: continue
              bm=root/'snapshots/morning'/f'abeken-shadow-morning-{key}.json'
              bl=root/'snapshots/predeadline'/f'abeken-shadow-live-{key}.json'
              vm=root/'snapshots/morning'/f'abeken-v53-shadow-morning-{key}.json'
              vl=root/'snapshots/predeadline'/f'abeken-v53-shadow-live-{key}.json'
              base=baseline_bets(bl) if bl.exists() else baseline_bets(bm) if bm.exists() else set()
              base_m=baseline_bets(bm) if bm.exists() else set()
              v53=v53_bets(vl) if vl.exists() else v53_bets(vm) if vm.exists() else set()
              bh=any(w in base for w in winners)
              bmh=any(w in base_m for w in winners)
              vh=any(w in v53 for w in winners)
              if bh != vh or bmh != vh or bh or vh:
                  rows.append({
                    'key':key,'winner':winners,'payout':[x.get('payout') for x in settlements],
                    'baseline_current_hit':bh,'baseline_morning_hit':bmh,'v53_hit':vh,
                    'baseline_current_count':len(base),'baseline_morning_count':len(base_m),'v53_count':len(v53),
                    'v53_live':vl.exists(),
                    'winning_in_baseline_current':[w for w in winners if w in base],
                    'winning_in_baseline_morning':[w for w in winners if w in base_m],
                    'winning_in_v53':[w for w in winners if w in v53],
                  })
          print('ABEKEN_1002_AUDIT='+json.dumps(rows,ensure_ascii=False,sort_keys=True))
          PY