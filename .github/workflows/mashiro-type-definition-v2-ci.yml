name: Mashiro type definition V2 research CI

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/mashiro-type-definition-v2-ci.yml

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout private Mashiro V2 branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: ${{ secrets.PRIVATE_SOURCE_REPO }}
          ref: research/mashiro-type-definition-v2-20260930
          token: ${{ secrets.G11_PRIVATE_REPO_TOKEN }}
          persist-credentials: false
          fetch-depth: 1
      - name: Compile and run focused tests
        run: |
          set -euo pipefail
          python3 -m py_compile g11/research/mashiro_giant_kill/v1/type_definition_v2.py
          python3 -m py_compile g11/research/mashiro_giant_kill/v1/test_type_definition_v2.py
          python3 -m unittest g11.research.mashiro_giant_kill.v1.test_type_definition_v2 -v
      - name: Run real 19-vs-35 contrast
        run: |
          set -euo pipefail
          python3 -m g11.research.mashiro_giant_kill.v1.type_definition_v2 \
            --input docs/research/evidence/g11-mashiro-giant-kill-v1-independent-holdout.json \
            --output /tmp/mashiro-v2.json | tee /tmp/mashiro-v2-summary.txt
          python3 - <<'PY'
          import json
          v=json.load(open("/tmp/mashiro-v2.json"))
          assert v["GROUPS"]["INDEPENDENT_HIT_CONFIRMED_N"]==19
          assert v["GROUPS"]["OPPORTUNITY_NO_HIT_N"]==35
          assert v["STATUS"]=="DESCRIPTIVE_TYPE_CONTRAST_COMPLETE_NO_FORMAL_TYPE"
          assert v["PRODUCTION_MUTATED"] is False
          assert v["PREDICTION_MUTATED"] is False
          assert v["BET_MUTATED"] is False
          assert v["FEED_MUTATED"] is False
          print(json.dumps({
            "COMPONENTS":v["DESCRIPTIVE_COMPONENT_CANDIDATES"],
            "COMPARISONS":v["COMPARISONS"],
          },ensure_ascii=False,sort_keys=True))
          PY
