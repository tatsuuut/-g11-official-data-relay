name: G11 predeadline ledger audit

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/g11-predeadline-ledger-audit.yml

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: .relay-cache/state.tgz.gpg
          key: g11-state-v2-2026-09-21-${{ github.run_id }}
          restore-keys: |
            g11-state-v2-2026-09-21-
            g11-state-v2-
      - name: Inspect request ledger
        env:
          G11_PRIVATE_REPO_TOKEN: ${{ secrets.G11_PRIVATE_REPO_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p .relay-state
          archive="${RUNNER_TEMP}/state.tgz"
          exec 3<<<"${G11_PRIVATE_REPO_TOKEN}"
          gpg --batch --yes --pinentry-mode loopback --passphrase-fd 3             --decrypt --output "${archive}" .relay-cache/state.tgz.gpg
          exec 3<&-
          tar -xzf "${archive}" -C .relay-state
          python3 - <<'PY'
          import json
          from pathlib import Path
          root=Path(".relay-state/store/ledger")
          print("LEDGER_EXISTS",root.is_dir())
          events=[]
          for p in sorted((root/"events").glob("*.json")):
              events.append(json.loads(p.read_text()))
          active={}
          outcomes=[]
          for e in events:
              pl=e.get("PAYLOAD",{})
              if e.get("TYPE")=="REQUEST_STARTED":
                  active[pl.get("REQUEST_ID")]={
                      "source":pl.get("SOURCE_ID"),
                      "host":pl.get("HOST"),
                      "at":e.get("AT_JST")
                  }
              elif e.get("TYPE")=="OUTCOME_RECORDED":
                  req=active.get(pl.get("REQUEST_ID"),{})
                  outcomes.append({
                      "source":req.get("source"),
                      "at":e.get("AT_JST"),
                      "outcome":pl.get("OUTCOME"),
                      "retry_at":pl.get("RETRY_AT_JST"),
                      "pause":pl.get("PAUSE_SECONDS"),
                      "reason":pl.get("REJECTION_REASON"),
                  })
          from collections import Counter
          print("OUTCOME_COUNTS",json.dumps(Counter(x["outcome"] for x in outcomes),sort_keys=True))
          print("BEFOREINFO_OUTCOMES",json.dumps(Counter(x["outcome"] for x in outcomes if str(x["source"]).startswith("beforeinfo-")),sort_keys=True))
          print("ODDS_OUTCOMES",json.dumps(Counter(x["outcome"] for x in outcomes if str(x["source"]).startswith("odds3t-")),sort_keys=True))
          bad=[x for x in outcomes if x["outcome"]!="HTTP_200"]
          from collections import Counter
          print("BAD_REASON_COUNTS",json.dumps(Counter((x["source"].split("-")[0] if x["source"] else "none", x["reason"]) for x in bad),ensure_ascii=False,sort_keys=True))
          print("BAD",json.dumps(bad,ensure_ascii=False))
          PY
