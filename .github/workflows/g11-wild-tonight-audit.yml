name: G11 WILD tonight audit

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/g11-wild-tonight-audit.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - name: Restore current encrypted state
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: .relay-cache/state.tgz.gpg
          key: g11-state-v2-2026-09-21-${{ github.run_id }}
          restore-keys: |
            g11-state-v2-2026-09-21-
            g11-state-v2-
      - name: Decrypt and inspect WILD4 day
        env:
          G11_PRIVATE_REPO_TOKEN: ${{ secrets.G11_PRIVATE_REPO_TOKEN }}
        run: |
          set -euo pipefail
          test -n "${G11_PRIVATE_REPO_TOKEN}"
          test -f .relay-cache/state.tgz.gpg
          mkdir -p .relay-state
          archive="${RUNNER_TEMP}/g11-relay-state.tgz"
          exec 3<<<"${G11_PRIVATE_REPO_TOKEN}"
          gpg --batch --yes --pinentry-mode loopback --passphrase-fd 3             --decrypt --output "${archive}" .relay-cache/state.tgz.gpg
          exec 3<&-
          tar -xzf "${archive}" -C .relay-state
          python3 - <<'PY'
          import gzip, json
          from pathlib import Path
          root=Path(".relay-state/store/g11/wild-pack-oos/morning/2026-09-21")
          print("DAY_ROOT_EXISTS",root.is_dir())
          for name in [
              "position-oos-admission.manifest.json",
              "bet-upstream.manifest.json",
              "bet-prediction-time-odds.manifest.json",
              "bet-eligible.manifest.json",
          ]:
              p=root/name
              print(name, "EXISTS", p.is_file())
              if p.is_file():
                  v=json.loads(p.read_text())
                  print(name, json.dumps(v, ensure_ascii=False, sort_keys=True))
          for artifact in ["bet-upstream.json.gz","bet-prediction-time-odds.json.gz","bet-eligible.json.gz"]:
              p=root/artifact
              if p.is_file():
                  v=json.loads(gzip.decompress(p.read_bytes()))
                  summary={k:v.get(k) for k in [
                      "STATUS","RACE_COUNT","UPSTREAM_RACE_COUNT","ODDS_PACKET_RACE_COUNT",
                      "ODDS_MISSING_RACE_COUNT","BET_ELIGIBLE_RACES","EXCLUSIONS"
                  ]}
                  print(artifact, json.dumps(summary, ensure_ascii=False, sort_keys=True))
          status=Path(".relay-state/store/g11/wild-pack-oos/morning/bet-status.json")
          if status.is_file():
              v=json.loads(status.read_text())
              print("BET_STATUS",json.dumps(v,ensure_ascii=False,sort_keys=True))
          PY
