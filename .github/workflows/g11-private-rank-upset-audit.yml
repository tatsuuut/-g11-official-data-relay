name: G11 private rank-upset audit

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/g11-private-rank-upset-audit.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUNBUFFERED: "1"
    steps:
      - name: Checkout private runtime
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: tatsuuut/boat-brain-lab
          ref: main
          token: ${{ secrets.G11_PRIVATE_REPO_TOKEN }}
          path: private
          persist-credentials: false
          fetch-depth: 1

      - name: Compile and run focused tests
        working-directory: private
        env:
          PYTHONPATH: .
        run: |
          set -euo pipefail
          python3 -m py_compile g11/canonical/official_pipeline.py
          python3 -m unittest             g11.canonical.test_official_pipeline.CanonicalOfficialPipelineTests.test_rank_upset_research_detects_lower_p3_rank_beating_higher             g11.canonical.test_official_pipeline.CanonicalOfficialPipelineTests.test_rank_upset_research_no_inversion_for_exact_top3             g11.canonical.test_official_pipeline.CanonicalOfficialPipelineTests.test_rank_upset_research_summary_groups_wave_and_venue
