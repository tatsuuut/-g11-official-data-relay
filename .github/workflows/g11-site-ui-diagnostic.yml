name: G11 site UI diagnostic

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/g11-site-ui-diagnostic.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect-site-ui:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    env:
      G11_APP_ORIGIN: https://g11-race-lab.higatatsunori2.chatgpt.site
    steps:
      - name: Inspect public feed refresh bundle
        run: |
          set -euo pipefail
          curl --fail-with-body --silent --show-error --location             "${G11_APP_ORIGIN}/" -o index.html
          python3 - <<'PY'
          import html
          import re
          import subprocess
          from pathlib import Path
          from urllib.parse import urljoin

          origin = "https://g11-race-lab.higatatsunori2.chatgpt.site/"
          page = Path("index.html").read_text(encoding="utf-8", errors="replace")
          assets = []
          for match in re.finditer(r'(?:src|href)=["\']([^"\']+\.js(?:\?[^"\']*)?)["\']', page):
              url = urljoin(origin, html.unescape(match.group(1)))
              if url not in assets:
                  assets.append(url)
          print("G11_SITE_JS_ASSETS=" + repr(assets))

          needles = [
              "/api/g11-feed",
              "setInterval",
              "visibilitychange",
              "pageshow",
              "addEventListener(`focus`",
              'addEventListener("focus"',
              "cache:`no-store`",
              'cache:"no-store"',
              "function Hf",
              "latest",
              "selectedDate",
              "operational_date_jst",
          ]
          for idx, url in enumerate(assets):
              path = Path(f"asset-{idx}.js")
              subprocess.run(
                  ["curl","--fail-with-body","--silent","--show-error","--location",url,"-o",str(path)],
                  check=True,
              )
              source = path.read_text(encoding="utf-8", errors="replace")
              for needle in needles:
                  start = 0
                  found = 0
                  while True:
                      pos = source.find(needle, start)
                      if pos < 0:
                          break
                      found += 1
                      lo = max(0, pos - 3500)
                      hi = min(len(source), pos + len(needle) + 3500)
                      snippet = source[lo:hi].replace("\n", " ")
                      print(f"G11_REFRESH_MATCH asset={idx} needle={needle!r} occurrence={found} context={snippet}")
                      start = pos + len(needle)
                      if found >= 6:
                          break
          PY
