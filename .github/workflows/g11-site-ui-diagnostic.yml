name: G11 site UI diagnostic

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/g11-site-ui-diagnostic.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect-site-ui:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    env:
      G11_APP_ORIGIN: https://g11-race-lab.higatatsunori2.chatgpt.site
    steps:
      - name: Inspect public VALUE ALERTS bundle
        run: |
          set -euo pipefail
          curl --fail-with-body --silent --show-error --location             "${G11_APP_ORIGIN}/" -o index.html
          python3 - <<'PY'
          import html
          import re
          import subprocess
          from pathlib import Path
          from urllib.parse import urljoin

          origin = "https://g11-race-lab.higatatsunori2.chatgpt.site/"
          page = Path("index.html").read_text(encoding="utf-8", errors="replace")
          assets = []
          for match in re.finditer(r'(?:src|href)=["\']([^"\']+\.js(?:\?[^"\']*)?)["\']', page):
              url = urljoin(origin, html.unescape(match.group(1)))
              if url not in assets:
                  assets.append(url)
          print("G11_SITE_JS_ASSETS=" + repr(assets))
          needles = [
              "対象の◎はありません",
              "VALUE ALERTS",
              "value_alert_supported",
              "CURRENT_GROWTH_P3",
              "odds_merit",
              "formal_status",
              "research_eligible",
          ]
          for idx, url in enumerate(assets):
              path = Path(f"asset-{idx}.js")
              subprocess.run(
                  ["curl","--fail-with-body","--silent","--show-error","--location",url,"-o",str(path)],
                  check=True,
              )
              text = path.read_text(encoding="utf-8", errors="replace")
              for needle in needles:
                  start = 0
                  while True:
                      pos = text.find(needle, start)
                      if pos < 0:
                          break
                      lo = max(0, pos - 1800)
                      hi = min(len(text), pos + len(needle) + 1800)
                      snippet = text[lo:hi].replace("\n", " ")
                      print(f"G11_SITE_MATCH asset={idx} needle={needle!r} context={snippet}")
                      start = pos + len(needle)
          PY
