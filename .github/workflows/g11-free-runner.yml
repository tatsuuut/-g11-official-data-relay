name: runtime sync
run-name: ${{ github.event_name == 'workflow_dispatch' && (inputs.phase == 'predeadline' || inputs.phase == 'night') && format('LIVE-{0}-{1}', inputs.phase, inputs.operational_date) || github.workflow }}

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/g11-free-runner.yml
  workflow_dispatch:
    inputs:
      phase:
        description: Safe relay phase
        required: true
        default: dry-run
        type: choice
        options:
          - dry-run
          - auto
          - morning
          - predeadline
          - night
          - repair-20260928
      operational_date:
        description: YYYY-MM-DD; dry-run may inspect a non-current date
        required: false
        type: string
  schedule:
    - cron: "15-55/5 17 * * *"
    - cron: "*/5 18-21 * * *"
    - cron: "0-5/5 22 * * *"
    - cron: "*/5 23 * * *"
    - cron: "*/5 0-11 * * *"
    - cron: "0-10/5 12 * * *"

permissions:
  actions: write
  contents: read
  id-token: write

concurrency:
  group: g11-free-official-data-runner
  cancel-in-progress: false

jobs:
  run-private-runtime:
    # Job names identify the active LIVE continuation in the jobs API. A
    # repair or diagnostic dispatch has the ordinary runtime name instead.
    name: ${{ github.event_name == 'workflow_dispatch' && (inputs.phase == 'predeadline' || inputs.phase == 'night') && format('LIVE-{0}-{1}', inputs.phase, inputs.operational_date) || 'runtime' }}
    if: >-
      github.repository_id == '1367703708' &&
      github.ref == 'refs/heads/main' &&
      inputs.phase != 'repair-20260928' &&
      vars.G11_RELAY_ENABLED == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      G11_PRIVATE_REPOSITORY: ${{ secrets.PRIVATE_SOURCE_REPO }}
      G11_PRIVATE_RUNTIME_REF: main
      G11_RUNTIME_BRANCH: g11-runtime
      G11_APP_ORIGIN: ${{ secrets.APP_ENDPOINT }}
      G11_OIDC_AUDIENCE: ${{ secrets.OIDC_AUD }}
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUNBUFFERED: "1"
      TZ: Asia/Tokyo

    steps:
      - name: Check runtime configuration
        run: |
          test -n "${G11_PRIVATE_REPOSITORY}" && echo 'PRIVATE_SOURCE_CONFIGURED=true'
          test -n "${G11_APP_ORIGIN}" && echo 'APP_ENDPOINT_CONFIGURED=true'
          test -n "${G11_OIDC_AUDIENCE}" && echo 'OIDC_CONFIGURED=true'

      - name: Checkout public relay
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false

      - name: Audit public surface
        run: python3 scripts/audit_public_surface.py

      - name: Verify last-race heartbeat boundaries
        if: github.event_name != 'schedule'
        run: python3 -m unittest discover -s scripts -p test_dynamic_last_race_heartbeat.py

      - name: Resolve the bounded phase and race day
        id: due
        env:
          REQUESTED_PHASE: ${{ inputs.phase }}
          REQUESTED_DATE: ${{ inputs.operational_date }}
          EVENT_NAME: ${{ github.event_name }}
          SCHEDULE_EXPRESSION: ${{ github.event.schedule }}
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          set -euo pipefail
          now_hour="$(date +%H)"
          now_minute="$(date +%M)"
          if [ "${now_hour}" -lt 2 ]; then
            operational_date="$(date --date='yesterday' +%F)"
          else
            operational_date="$(date +%F)"
          fi
          if [ "${EVENT_NAME}" = "workflow_dispatch" ]; then
            phase="${REQUESTED_PHASE:-dry-run}"
            if [ -n "${REQUESTED_DATE}" ]; then
              operational_date="${REQUESTED_DATE}"
            fi
          elif [ "${EVENT_NAME}" = "schedule" ]; then
            # GitHub scheduled jobs are best-effort and can start after the
            # intended clock window. Resolve the phase from the triggering
            # cron expression so a delayed predeadline job can never enter the
            # night result path before the official K file exists.
            case "${SCHEDULE_EXPRESSION}" in
              "15-55/5 17 * * *"|"*/5 18-21 * * *"|"0-5/5 22 * * *")
                phase="morning"
                ;;
              "*/5 23 * * *"|"*/5 0-11 * * *"|"0-10/5 12 * * *")
                phase="predeadline"
                ;;
              *)
                phase="auto"
                ;;
            esac
          elif [ "${EVENT_NAME}" = "push" ]; then
            # Explicit bounded recovery markers may launch today's MORNING or
            # NIGHT phase independently. Ordinary pushes remain PREDEADLINE
            # diagnostics.
            # Installing tomorrow's heartbeat policy must not replay today's
            # completed PREDEADLINE races on the workflow-file push.
            if [[ "${COMMIT_MESSAGE}" == *"[historical-final-repair]"* ]]; then
              phase="dry-run"
            elif [[ "${COMMIT_MESSAGE}" == *"[heartbeat-config-only]"* ]] && [[ "${operational_date}" < "2026-09-29" ]]; then
              phase="dry-run"
            elif [[ "${COMMIT_MESSAGE}" == *"[night-20260929]"* ]]; then
              phase="night"
              operational_date="2026-09-29"
            elif [[ "${COMMIT_MESSAGE}" == *"[night-current]"* ]]; then
              phase="night"
            elif [[ "${COMMIT_MESSAGE}" == *"[morning-current]"* ]]; then
              phase="morning"
              operational_date="$(date +%F)"
            elif [[ "${COMMIT_MESSAGE}" == *"[morning-20260923]"* ]]; then
              phase="morning"
              operational_date="2026-09-23"
            else
              phase="predeadline"
            fi
          elif [ "${now_hour}" -ge 2 ] && [ "${now_hour}" -le 7 ]; then
            phase="morning"
          elif [ "${now_hour}" -ge 8 ] && [ "${now_hour}" -le 20 ]; then
            phase="predeadline"
          elif [ "${now_minute}" = "30" ]; then
            phase="night"
          else
            phase="auto"
          fi
          if [ "${SCHEDULE_EXPRESSION}" = "0-10/5 12 * * *" ] && [[ "${operational_date}" < "2026-09-29" ]]; then
            phase="dry-run"
          fi
          python3 - "${operational_date}" "${phase}" <<'PY'
          import datetime as dt
          import re
          import sys

          if re.fullmatch(r"\d{4}-\d{2}-\d{2}", sys.argv[1]) is None:
              raise SystemExit("G11_RELAY_OPERATIONAL_DATE_FORMAT")
          dt.date.fromisoformat(sys.argv[1])
          if sys.argv[2] not in {"auto", "morning", "predeadline", "night", "dry-run"}:
              raise SystemExit("G11_RELAY_PHASE")
          PY
          printf 'operational_date=%s\nphase=%s\n' \
            "${operational_date}" "${phase}" >> "${GITHUB_OUTPUT}"

      - name: Restore only encrypted runtime state
        id: restore-state
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: .relay-cache/state.tgz.gpg
          key: g11-state-v2-${{ steps.due.outputs.operational_date }}-${{ github.run_id }}
          restore-keys: |
            g11-state-v2-${{ steps.due.outputs.operational_date }}-
            g11-state-v2-

      - name: Fail closed when the private credential is absent
        env:
          G11_PRIVATE_REPO_TOKEN: ${{ secrets.G11_PRIVATE_REPO_TOKEN }}
        run: test -n "${G11_PRIVATE_REPO_TOKEN}"

      - name: Decrypt and validate restored state
        env:
          G11_PRIVATE_REPO_TOKEN: ${{ secrets.G11_PRIVATE_REPO_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p .relay-state
          encrypted=".relay-cache/state.tgz.gpg"
          if [ ! -f "${encrypted}" ]; then
            exit 0
          fi
          archive="${RUNNER_TEMP}/g11-relay-state.tgz"
          exec 3<<<"${G11_PRIVATE_REPO_TOKEN}"
          gpg --batch --yes --pinentry-mode loopback --passphrase-fd 3 \
            --decrypt --output "${archive}" "${encrypted}"
          exec 3<&-
          python3 - "${archive}" "${{ steps.due.outputs.operational_date }}" <<'PY'
          import json
          import pathlib
          import shutil
          import sys
          import tarfile

          archive = pathlib.Path(sys.argv[1])
          operational_date = sys.argv[2]
          state_root = pathlib.Path(".relay-state")
          with tarfile.open(archive, "r:gz") as handle:
              members = handle.getmembers()
              if not members:
                  raise SystemExit("G11_RELAY_EMPTY_STATE_ARCHIVE")
              for member in members:
                  path = pathlib.PurePosixPath(member.name)
                  if path.is_absolute() or ".." in path.parts or member.issym() or member.islnk():
                      raise SystemExit("G11_RELAY_UNSAFE_STATE_ARCHIVE")
              handle.extractall(state_root, filter="data")

          metadata_path = state_root / "relay-state.json"
          if metadata_path.is_file():
              metadata = json.loads(metadata_path.read_text(encoding="utf-8"))
              if metadata.get("OPERATIONAL_DATE_JST") != operational_date:
                  store = state_root / "store"
                  for name in (
                      "manifest.json", "scope.json", "responses", "rejected-responses",
                      "snapshots", "ledger",
                  ):
                      target = store / name
                      if target.is_dir():
                          shutil.rmtree(target)
                      elif target.exists():
                          target.unlink()
                  # A rescue snapshot is date-bound and non-promotable. Never
                  # carry yesterday's complete rescue envelope into a new race
                  # day where it could be mistaken for today's fallback.
                  rescue = state_root / "rescue"
                  if rescue.is_dir():
                      shutil.rmtree(rescue)
                  elif rescue.exists():
                      rescue.unlink()
                  metadata = {
                      "SCHEMA": "G11_PRIVATE_PUBLIC_RELAY_STATE_V1",
                      "OPERATIONAL_DATE_JST": operational_date,
                      "MORNING_COMPLETE": False,
                      "LAST_PHASE": None,
                      "LAST_STORE_SHA256": None,
                      "LAST_PUBLISHED_FEED_SHA256": None,
                  }
                  metadata_path.write_text(
                      json.dumps(metadata, sort_keys=True, separators=(",", ":")) + "\n",
                      encoding="utf-8",
                  )
          PY

      - name: Checkout private G11 runtime
        id: private-source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: ${{ env.G11_PRIVATE_REPOSITORY }}
          ref: ${{ env.G11_PRIVATE_RUNTIME_REF }}
          token: ${{ secrets.G11_PRIVATE_REPO_TOKEN }}
          path: .g11-private
          persist-credentials: false
          fetch-depth: 1

      - name: Checkout hash-locked research runtime
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: ${{ env.G11_PRIVATE_REPOSITORY }}
          ref: ${{ env.G11_RUNTIME_BRANCH }}
          token: ${{ secrets.G11_PRIVATE_REPO_TOKEN }}
          path: .g11-model
          persist-credentials: false
          fetch-depth: 1
          sparse-checkout: |
            g11/true-ai-models
            g11/true-ai-history
            g11/wild-pack-history
            g11/wild-pack-models
            g11/wild-pack-oos

      - name: Resolve immutable private source identity
        id: source
        env:
          G11_PRIVATE_REPO_TOKEN: ""
        run: |
          set -euo pipefail
          source_sha="$(git -C .g11-private rev-parse HEAD)"
          printf 'source_sha=%s\n' "${source_sha}" >> "${GITHUB_OUTPUT}"

      - name: Hydrate append-only research history and stage the model
        run: |
          set -euo pipefail
          mkdir -p .relay-state/store/g11/true-ai-history
          if [ -d .g11-model/g11/true-ai-history ]; then
            cp -a .g11-model/g11/true-ai-history/. \
              .relay-state/store/g11/true-ai-history/
          fi
          mkdir -p .relay-state/store/g11/wild-pack-history
          if [ -d .g11-model/g11/wild-pack-history ]; then
            cp -a .g11-model/g11/wild-pack-history/. \
              .relay-state/store/g11/wild-pack-history/
          fi
          mkdir -p .relay-state/store/g11/wild-pack-models
          # The encrypted state is the authoritative handoff for a newly
          # trained FIRST CURRENT.  The read-only g11-runtime checkout may lag
          # when its PAT cannot push, so never overwrite a verified CURRENT
          # pack that already survived the encrypted checkpoint.
          if [ -s .relay-state/store/g11/wild-pack-models/acceptance-readback.json ]; then
            echo "WILD_CURRENT_SOURCE=ENCRYPTED_STATE"
          elif [ -d .g11-model/g11/wild-pack-models ]; then
            cp -a .g11-model/g11/wild-pack-models/. \
              .relay-state/store/g11/wild-pack-models/
            echo "WILD_CURRENT_SOURCE=RUNTIME_BRANCH"
          fi
          mkdir -p .relay-state/store/g11/wild-pack-oos
          if [ -d .g11-model/g11/wild-pack-oos ]; then
            # Encrypted state is the live append-only authority.  Runtime
            # branch OOS assets are a seed/fallback only and must never
            # overwrite a newer historical bootstrap or same-day packets.
            rsync -a --ignore-existing \
              .g11-model/g11/wild-pack-oos/ \
              .relay-state/store/g11/wild-pack-oos/
          fi
          day_root=".relay-state/store/g11/true-ai-history/${{ steps.due.outputs.operational_date }}"
          if [ ! -f "${day_root}/morning-predictions.manifest.json" ]; then
            model_source=".g11-model/g11/true-ai-models"
            test -f "${model_source}/latest-research.json"
            mkdir -p .relay-state/store/g11/true-ai-models
            cp -a "${model_source}/." .relay-state/store/g11/true-ai-models/
          fi

      - name: Materialize hash-verified chunked WILD models
        working-directory: .g11-private
        env:
          WILD_MODEL_ROOT: ${{ github.workspace }}/.relay-state/store/g11/wild-pack-models/morning
        run: |
          python3 -m py_compile g11/relay/rescue_v1.py g11/relay/rescue_entry_v2.py
          python3 - "${WILD_MODEL_ROOT}" <<'PY'
          import hashlib
          import json
          import os
          import pathlib
          import tempfile
          import sys

          from g11.wild_pack.v1 import chunked_artifact_v1 as chunks

          root = pathlib.Path(sys.argv[1])
          for wild_id in ("WILD_SECOND", "WILD_THIRD"):
              model_root = root / wild_id
              registry = json.loads(
                  (model_root / "registry-entry.json").read_text(encoding="utf-8")
              )
              target = model_root / str(registry["MODEL_FILE"])
              expected_sha = str(registry["MODEL_SHA256"])
              # Restored encrypted state may still contain the previous direct
              # file. When the immutable runtime branch now supplies a parts
              # manifest, the verified chunk representation is authoritative.
              if chunks.manifest_path(target).is_file() and target.exists():
                  target.unlink()
              value = chunks.read_verified(target, expected_sha)
              if not target.is_file():
                  descriptor, temporary = tempfile.mkstemp(
                      prefix=f".{target.name}.",
                      dir=target.parent,
                  )
                  try:
                      with os.fdopen(descriptor, "wb") as handle:
                          handle.write(value)
                          handle.flush()
                          os.fsync(handle.fileno())
                      os.replace(temporary, target)
                  finally:
                      if os.path.exists(temporary):
                          os.unlink(temporary)
              if hashlib.sha256(target.read_bytes()).hexdigest() != expected_sha:
                  raise SystemExit(f"{wild_id}_MATERIALIZED_MODEL_HASH")
          PY

      - name: Install pinned private runtime dependencies
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check --no-input 'lxml==6.1.1'

          # WILD runtime inference is used after the morning admission is
          # already present too.  Do not key CatBoost installation to missing
          # artifacts: PREDEADLINE and NIGHT can still load CURRENT .cbm
          # models. Verify the exact interpreter that later executes relay.v1.
          if [ "${{ steps.due.outputs.phase }}" != "dry-run" ]; then
            if ! python3 -c 'import catboost' >/dev/null 2>&1; then
              python3 -m pip install --disable-pip-version-check --no-input 'catboost==1.2.8'
            fi
            python3 - <<'PY'
          import catboost
          print("G11_CATBOOST_RUNTIME_PASS", catboost.__version__)
          PY
          fi

      - name: Capture due PREDEADLINE official inputs before regression checks
        if: steps.due.outputs.phase == 'predeadline'
        working-directory: .g11-private
        env:
          STATE_STORE: ${{ github.workspace }}/.relay-state/store
          RESCUE_STORE: ${{ github.workspace }}/.relay-state/rescue/store
        run: |
          set -euo pipefail

          capture_store=""
          capture_mode=""
          if [ -f "${STATE_STORE}/manifest.json" ] && \
             [ -f "${STATE_STORE}/snapshots/morning/official-day-input.json" ]; then
            capture_store="${STATE_STORE}"
            capture_mode="CANONICAL"
          elif [ -f "${RESCUE_STORE}/manifest.json" ] && \
               [ -f "${RESCUE_STORE}/snapshots/morning/official-day-input.json" ]; then
            # A missing canonical MORNING must not disable the time-critical
            # T-7 official capture.  The isolated rescue store is already
            # future-only/nonresearch and carries its own sealed PREDEADLINE
            # plan, so it can safely protect the capture window here.
            capture_store="${RESCUE_STORE}"
            capture_mode="SAME_DAY_RESCUE"
          else
            echo "G11_EARLY_PREDEADLINE_CAPTURE=SKIP_NO_VERIFIED_MORNING_STORE"
            exit 0
          fi

          python3 - "${capture_store}" "${capture_mode}" <<'PY'
          import json
          import pathlib
          import sys

          from g11.relay.predeadline_nowait_v1 import capture

          store = pathlib.Path(sys.argv[1])
          store_mode = sys.argv[2]
          result = capture(store)
          print(
              "G11_EARLY_PREDEADLINE_CAPTURE="
              + json.dumps(
                  {
                      "store_mode": store_mode,
                      "status": result.get("STATUS"),
                      "acquired_count": len(result.get("ACQUIRED", [])),
                      "missed_count": len(result.get("MISSED", [])),
                      "unavailable_count": len(result.get("UNAVAILABLE", [])),
                      "rejected_count": len(result.get("REJECTED", [])),
                      "retryable_count": len(result.get("RETRYABLE_FAILURES", [])),
                      "task_deferred_count": len(result.get("TASK_DEFERRED", [])),
                      "deferred": result.get("DEFERRED"),
                  },
                  ensure_ascii=False,
                  sort_keys=True,
              )
          )
          PY

      - name: Read back verified WILD BET bootstrap evidence
        working-directory: .g11-private
        env:
          WILD_OOS_ROOT: ${{ github.workspace }}/.relay-state/store/g11/wild-pack-oos/morning
        run: |
          python3 - "${WILD_OOS_ROOT}" <<'PY'
          import pathlib
          import sys

          from g11.wild_pack.v1 import bet_oos_collection_v1 as wild_bet

          root = pathlib.Path(sys.argv[1])
          status = wild_bet.status(root)
          if status["BET_ELIGIBLE_RACES"] < 4020:
              raise SystemExit("WILD_BET_BOOTSTRAP_COUNT_REGRESSION")
          if status["TARGET_RACES"] != 10000:
              raise SystemExit("WILD_BET_BOOTSTRAP_TARGET")
          if status["REMAINING_RACES"] != max(
              0, status["TARGET_RACES"] - status["BET_ELIGIBLE_RACES"]
          ):
              raise SystemExit("WILD_BET_BOOTSTRAP_REMAINING")
          if (
              status["FULLY_OOS_UPSTREAM"] is not True
              or status["PREDICTION_TIME_ODDS"] is not True
              or status["FIRST_CURRENT_READY"] is not False
              or status["PRODUCTION_MONETARY_ACTION"] != "PROHIBITED"
              or status["APP_PRODUCTION_SOURCE_CHANGED"] is not False
              or status["P3_MUTATED"] is not False
          ):
              raise SystemExit("WILD_BET_BOOTSTRAP_SAFETY")
          wild_bet._write_json_atomic(root / "bet-status.json", status)
          PY

      - name: Verify encrypted WILD CURRENT app projection
        working-directory: .g11-private
        env:
          STATE_STORE: ${{ github.workspace }}/.relay-state/store
          OPERATIONAL_DATE: ${{ steps.due.outputs.operational_date }}
        run: |
          set -euo pipefail
          python3 - "${STATE_STORE}" "${{ steps.due.outputs.operational_date }}" <<'PY'
          import pathlib
          import sys
          from g11.canonical import public_app_feed

          root = pathlib.Path(sys.argv[1]).resolve()
          projection, _ = public_app_feed._wild_pack_public_projection(
              root, sys.argv[2], None
          )
          assert projection is not None
          assert projection["status"] == "PASS"
          assert projection["morning"]["STATUS"] == "CURRENT"
          assert projection["pre_race"]["STATUS"] == "CURRENT"
          assert projection["pre_race"]["ELIGIBLE_RACES"] >= 10000
          assert projection["authority"]["morning_full_pack_ready"] is True
          assert projection["authority"]["pre_race_full_pack_ready"] is True
          assert projection["wild4"]["formal_eligible"] >= 4020
          assert projection["wild4"]["target"] == 10000
          assert projection["counter_reset"] is False
          assert projection["p3_mutated"] is False
          print({
              "WILD_CURRENT_APP_PROJECTION": "PASS",
              "PRE_RACE_ELIGIBLE": projection["pre_race"]["ELIGIBLE_RACES"],
              "WILD4_ELIGIBLE": projection["wild4"]["formal_eligible"],
              "WILD4_REMAINING": projection["wild4"]["remaining"],
          })
          PY

      - name: Verify relay schedule and authority contracts
        if: github.event_name != 'schedule'
        working-directory: .g11-private
        env:
          G11_PRIVATE_REPO_TOKEN: ""
          WILD_MODEL_ROOT: ${{ github.workspace }}/.relay-state/store/g11/wild-pack-models/morning
        run: |
          python3 - "${WILD_MODEL_ROOT}" <<'PY'
          import hashlib
          import json
          import pathlib
          import sys

          root = pathlib.Path(sys.argv[1])
          for wild_id in ("WILD_SECOND", "WILD_THIRD"):
              model_root = root / wild_id
              registry = json.loads(
                  (model_root / "registry-entry.json").read_text(encoding="utf-8")
              )
              if hashlib.sha256((model_root / "model.cbm").read_bytes()).hexdigest() != registry["MODEL_SHA256"]:
                  raise SystemExit(f"{wild_id}_MODEL_HASH")
              calibration = json.loads(
                  (model_root / "calibration.json").read_text(encoding="utf-8")
              )
              if calibration["CALIBRATION_SHA256"] != registry["CALIBRATION_SHA256"]:
                  raise SystemExit(f"{wild_id}_CALIBRATION_HASH")
          PY
          for module in \
            g11.relay.test_v1 \
            g11.relay.test_rescue_fake_wild4_display_v1 \
            g11.relay.test_night_transport_finance_v1 \
            g11.wild_pack.v1.test_governance_v1 \
            g11.wild_pack.v1.test_public_position_bootstrap_v1 \
            g11.wild_pack.v1.test_runtime_collection_v1 \
            g11.wild_pack.v1.test_conditional_position_model_v1 \
            g11.wild_pack.v1.test_prospective_oos_v1 \
            g11.wild_pack.v1.test_bet_oos_collection_v1 \
            g11.wild_pack.v1.test_runtime_orchestrator_v1 \
            g11.growth_p3.v1_1.test_current_runtime_v1 \
            g11.growth_p3.v1_1.test_confidence_evidence_v3 \
            g11.relay.test_final_bet_accounting_v1 \
            g11.relay.test_last_race_night_v1 \
            g11.canonical.test_integrated_authority_status_v1
          do
            python3 -m unittest "${module}"
          done

          # PREDEADLINE feed is also WILD4 training-food infrastructure.
          # Keep the widened incomplete-HTML retry policy under focused CI
          # without running the entire canonical suite every two minutes.
          python3 -m unittest \
            g11.canonical.test_official_pipeline.CanonicalOfficialPipelineTests.test_urls_and_dynamic_budget_cover_168_races \
            g11.canonical.test_official_pipeline.CanonicalOfficialPipelineTests.test_bootstrap_scope_is_sealed_from_b_cardinality \
            g11.canonical.test_official_pipeline.CanonicalOfficialPipelineTests.test_incomplete_http_200_is_evidence_not_canonical_and_can_retry \
            g11.canonical.test_official_pipeline.CanonicalOfficialPipelineTests.test_legacy_sealed_scope_gets_runtime_retry_cap_without_rewrite \
            g11.canonical.test_official_pipeline.CanonicalOfficialPipelineTests.test_predeadline_content_has_wider_bounded_retry_budget

      - name: Run the private fail-closed relay
        id: runtime
        continue-on-error: true
        working-directory: .g11-private
        env:
          G11_PRIVATE_REPO_TOKEN: ""
          G11_PRIVATE_SOURCE_SHA: ${{ steps.source.outputs.source_sha }}
          G11_BOUNDED_NIGHT_REPLAY: ${{ github.event_name == 'push' && contains(github.event.head_commit.message, '[night-20260929]') && '2026-09-29' || '' }}
        run: |
          set -euo pipefail
          mkdir -p ../.relay-output
          args=(
            --phase "${{ steps.due.outputs.phase }}"
            --operational-date "${{ steps.due.outputs.operational_date }}"
            --state-root "${GITHUB_WORKSPACE}/.relay-state"
            --feed-output "${GITHUB_WORKSPACE}/.relay-output/feed.json"
            --public-repository "${GITHUB_REPOSITORY}"
            --public-run-id "${GITHUB_RUN_ID}"
            --runtime-ref "${G11_RUNTIME_BRANCH}"
            --app-origin "${G11_APP_ORIGIN}"
            --oidc-audience "${G11_OIDC_AUDIENCE}"
          )
          runtime_stdout=../.relay-output/runtime.stdout
          if [ "${{ steps.due.outputs.phase }}" = "predeadline" ]; then
            python3 -m g11.relay.predeadline_nowait_v1 "${args[@]}" | tee "${runtime_stdout}"
          else
            python3 -m g11.relay.v1 "${args[@]}" | tee "${runtime_stdout}"
          fi
          python3 - "${runtime_stdout}" ../.relay-output/result.json <<'PY'
          import json
          import pathlib
          import sys

          source = pathlib.Path(sys.argv[1])
          target = pathlib.Path(sys.argv[2])
          result = None
          for line in source.read_text(encoding="utf-8").splitlines():
              try:
                  value = json.loads(line)
              except json.JSONDecodeError:
                  continue
              if (
                  isinstance(value, dict)
                  and isinstance(value.get("STATUS"), str)
                  and isinstance(value.get("OPERATIONAL_DATE_JST"), str)
                  and isinstance(value.get("PHASE"), str)
              ):
                  result = value
          if result is None:
              raise SystemExit("G11_RELAY_RESULT_JSON_NOT_FOUND")
          target.write_text(
              json.dumps(result, ensure_ascii=False, sort_keys=True, separators=(",", ":")) + "\n",
              encoding="utf-8",
          )
          print("G11_RELAY_RESULT_EXTRACT=PASS")
          PY

      - name: Audit WILD4 training-food capture
        if: steps.runtime.outcome == 'success' && steps.due.outputs.phase != 'dry-run'
        working-directory: .g11-private
        env:
          STATE_STORE: ${{ github.workspace }}/.relay-state/store
          OPERATIONAL_DATE: ${{ steps.due.outputs.operational_date }}
        run: |
          python3 - "${STATE_STORE}" "${{ steps.due.outputs.operational_date }}" <<'PY'
          import gzip
          import json
          import pathlib
          import sys

          from g11.wild_pack.v1 import bet_oos_collection_v1 as wild_bet

          store = pathlib.Path(sys.argv[1])
          operational_date = sys.argv[2]
          history = store / "g11" / "wild-pack-oos" / "morning"
          day = history / operational_date
          status = wild_bet.status(history)

          def artifact(name):
              path = day / name
              if not path.is_file():
                  return None
              return json.loads(gzip.decompress(path.read_bytes()))

          upstream = artifact("bet-upstream.json.gz")
          odds = artifact("bet-prediction-time-odds.json.gz")
          eligible = artifact("bet-eligible.json.gz")
          print(json.dumps({
              "G11_WILD4_FOOD_STATUS": "PASS",
              "CUMULATIVE_ELIGIBLE": status["BET_ELIGIBLE_RACES"],
              "REMAINING_TO_10000": status["REMAINING_RACES"],
              "TODAY_UPSTREAM": None if upstream is None else upstream["RACE_COUNT"],
              "TODAY_ODDS_READY": None if odds is None else odds["ODDS_PACKET_RACE_COUNT"],
              "TODAY_ODDS_MISSING": None if odds is None else odds["ODDS_MISSING_RACE_COUNT"],
              "TODAY_SETTLED_ELIGIBLE": None if eligible is None else eligible["BET_ELIGIBLE_RACES"],
          }, sort_keys=True))
          PY

      - name: Verify nightly research ledgers before encrypted persistence
        if: steps.runtime.outcome == 'success' && steps.due.outputs.phase == 'night'
        working-directory: .g11-private
        env:
          STATE_STORE: ${{ github.workspace }}/.relay-state/store
          OPERATIONAL_DATE: ${{ steps.due.outputs.operational_date }}
        run: |
          set -euo pipefail
          # Official-result waiting is checkpoint-only, not completed NIGHT.
          if [ -f ../.relay-output/result.json ] && \
             jq -e --arg day "${{ steps.due.outputs.operational_date }}" '
               .STATUS == "NIGHT_WAITING_OFFICIAL_RESULTS"
               and .PHASE == "NIGHT" and .OPERATIONAL_DATE_JST == $day
               and .FEED_EMITTED == false
             ' ../.relay-output/result.json >/dev/null 2>&1; then
            echo 'G11_NIGHT_RESEARCH_LEDGER_CHECK=DEFER_OFFICIAL_RESULTS'
            exit 0
          fi
          # A same-day rescue NIGHT is intentionally nonresearch. It can attach
          # the complete official result set and publish score-only display
          # without creating canonical TRUE-AI/WILD research ledgers.
          if [ -f ../.relay-output/result.json ] && \
             jq -e '.STATUS == "SAME_DAY_RESCUE_NIGHT_RESULTS_COMPLETE"' \
               ../.relay-output/result.json >/dev/null 2>&1; then
            echo "RESCUE_NIGHT_RESEARCH_LEDGER_CHECK=NOT_APPLICABLE"
            exit 0
          fi
          true_source="${STATE_STORE}/g11/true-ai-history/${{ steps.due.outputs.operational_date }}"
          wild_source="${STATE_STORE}/g11/wild-pack-history/${{ steps.due.outputs.operational_date }}"
          test -f "${true_source}/day-records.manifest.json"
          test -f "${wild_source}/factual-paths.manifest.json"
          python3 - "${STATE_STORE}" <<'PY'
          import json
          import pathlib
          import sys
          from g11.true_ai.v1.src import true_ai_research_inference_v1 as inference
          from g11.true_ai.v1.src import true_ai_runtime_v1 as true_runtime
          from g11.wild_pack.v1 import bet_oos_collection_v1 as wild_bet
          from g11.wild_pack.v1 import prospective_oos_v1 as wild_oos
          from g11.wild_pack.v1 import runtime_collection_v1 as wild_runtime

          root = pathlib.Path(sys.argv[1]) / "g11"
          true_status = true_runtime.collection_status(root / "true-ai-history")
          shadow_status = inference.shadow_status(root / "true-ai-history")
          wild_status = wild_runtime.collection_status(root / "wild-pack-history")
          oos_root = root / "wild-pack-oos" / "morning"
          oos_status = wild_oos.status(oos_root)
          bet_status = wild_bet.status(oos_root)
          assert true_status["DATA_LEAK_COUNT"] == 0
          assert shadow_status["DATA_LEAK_COUNT"] == 0
          assert wild_status["COUNTERFACTUAL_TARGET_COUNT"] == 0
          assert wild_status["FULL_PACK_READY"] is False
          assert oos_status["P3_MUTATED"] is False
          assert oos_status["APP_PRODUCTION_SOURCE_CHANGED"] is False
          assert bet_status["PRODUCTION_MONETARY_ACTION"] == "PROHIBITED"
          assert bet_status["FIRST_CURRENT_READY"] is False
          print(json.dumps({
              "TRUE_AI_FORMAL_PAIRED_RACES": true_status["FORMAL_PAIRED_RACES"],
              "WILD_SECOND_ELIGIBLE_RACES": wild_status["SECOND_ELIGIBLE_RACES"],
              "WILD_THIRD_ELIGIBLE_RACES": wild_status["THIRD_ELIGIBLE_RACES"],
              "WILD_POSITION_OOS_ADMITTED_RACES": oos_status["ADMITTED_RACE_COUNT"],
              "WILD_POSITION_OOS_SETTLED_RACES": oos_status["SETTLED_RACE_COUNT"],
              "WILD_BET_ELIGIBLE_RACES": bet_status["BET_ELIGIBLE_RACES"],
          }, sort_keys=True))
          PY

      - name: Encrypt changed state before persistence
        if: always()
        id: encrypt-state
        env:
          G11_PRIVATE_REPO_TOKEN: ${{ secrets.G11_PRIVATE_REPO_TOKEN }}
        run: |
          set -euo pipefail
          if [ ! -f .relay-state/relay-state.json ] && [ ! -f .relay-state/store/manifest.json ]; then
            echo 'ready=false' >> "${GITHUB_OUTPUT}"
            exit 0
          fi
          mkdir -p .relay-cache
          encrypted=".relay-cache/state.tgz.gpg"
          temporary="${encrypted}.tmp"
          exec 3<<<"${G11_PRIVATE_REPO_TOKEN}"
          tar -czf - -C .relay-state . | \
            gpg --batch --yes --pinentry-mode loopback --passphrase-fd 3 \
              --symmetric --cipher-algo AES256 --output "${temporary}"
          exec 3<&-
          mv "${temporary}" "${encrypted}"
          test -s "${encrypted}"
          echo 'ready=true' >> "${GITHUB_OUTPUT}"

      - name: Save only encrypted runtime state
        if: always() && steps.encrypt-state.outputs.ready == 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: .relay-cache/state.tgz.gpg
          key: g11-state-v2-${{ steps.due.outputs.operational_date }}-${{ github.run_id }}

      - name: Gate NIGHT publication on fully settled research
        id: night-ready
        if: steps.runtime.outcome == 'success' && hashFiles('.relay-output/feed.json') != ''
        env:
          FEED: .relay-output/feed.json
          OPERATIONAL_DATE: ${{ steps.due.outputs.operational_date }}
          RELAY_PHASE: ${{ steps.due.outputs.phase }}
        run: |
          set -euo pipefail
          if [ "${{ steps.due.outputs.phase }}" != "night" ]; then
            echo 'allowed=true' >> "${GITHUB_OUTPUT}"
            exit 0
          fi
          if [ -f .relay-output/result.json ] && \
             jq -e '.STATUS == "SAME_DAY_RESCUE_NIGHT_RESULTS_COMPLETE"' \
               .relay-output/result.json >/dev/null 2>&1; then
            if jq -e '
              .stage == "NIGHT"
              and .status == "PASS"
              and .counts.races > 0
              and .counts.pending == 0
              and .counts.results == .counts.races
              and .counts.formal == 0
              and .counts.research_samples == 0
              and .research_db.available == false
            ' "${FEED}" >/dev/null; then
              echo 'allowed=true' >> "${GITHUB_OUTPUT}"
              echo 'G11_NIGHT_PUBLICATION_GATE=PASS_RESCUE_NONRESEARCH'
            else
              echo 'allowed=false' >> "${GITHUB_OUTPUT}"
              echo 'G11_NIGHT_PUBLICATION_GATE=DEFER_RESCUE_INCOMPLETE'
              jq -c '{stage,status,counts,research_db}' "${FEED}"
            fi
            exit 0
          fi

          if jq -e '
            .stage == "NIGHT"
            and .status == "PASS"
            and .counts.pending == 0
            and .counts.races > 0
            and .counts.results == .counts.races
            and .counts.races == (.races | length)
            and .counts.research_samples == .counts.formal
            and .research_db.available == true
            and .research_db.formal_races == .counts.formal
            and ([.races[]
                  | select(.research_eligible == true)
                  | select((.research_finance.status // "") != "VERIFIED")]
                 | length) == 0
          ' "${FEED}" >/dev/null; then
            echo 'allowed=true' >> "${GITHUB_OUTPUT}"
            echo 'G11_NIGHT_PUBLICATION_GATE=PASS'
          else
            echo 'allowed=false' >> "${GITHUB_OUTPUT}"
            echo 'G11_NIGHT_PUBLICATION_GATE=DEFER_INCOMPLETE'
            jq -c '{
              stage,status,counts,research_db,
              unverified_research_finance:
                ([.races[]
                  | select(.research_eligible == true)
                  | select((.research_finance.status // "") != "VERIFIED")]
                 | length)
            }' "${FEED}"
          fi

      - name: Publish a newly verified feed through OIDC
        if: steps.runtime.outcome == 'success' && hashFiles('.relay-output/feed.json') != '' && steps.night-ready.outputs.allowed == 'true'
        id: publish
        env:
          FEED: .relay-output/feed.json
          OPERATIONAL_DATE: ${{ steps.due.outputs.operational_date }}
          RELAY_PHASE: ${{ steps.due.outputs.phase }}
        run: |
          set -euo pipefail
          # Preserve already-accepted immutable race snapshots.
          if curl --fail-with-body --silent --show-error --location \
            --retry 3 --retry-delay 2 \
            "${G11_APP_ORIGIN}/api/g11-feed?date=${OPERATIONAL_DATE}" \
            -o .relay-output/stored-feed.json; then
            # Load only the verified immutable CURRENT P3 morning eight-ticket lock.
            PYTHONPATH=".g11-private" python3 - "${FEED}" <<'PY'
          import json
          from pathlib import Path
          import sys
          from g11.canonical.official_pipeline import OfficialArtifactStore
          from g11.growth_p3.v1_1 import current_runtime_v1 as p3
          from g11.relay.night_transport_finance_v1 import _current_special_bets
          root = Path(".relay-state/store").resolve(strict=True)
          keys = {row["key"] for row in json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))["races"]}
          bets = _current_special_bets(root, keys)
          store = OfficialArtifactStore(root)
          proof = {}
          for key, ordered in bets.items():
              verified = store.load_verified_snapshot("morning", p3.snapshot_name(key))
              proof[key] = {"bets": ordered, "snapshot_sha": verified["SNAPSHOT_SHA256"]}
          Path(".relay-output/special-eight-proof.json").write_text(
              json.dumps(proof, sort_keys=True, separators=(",", ":")) + "\n", encoding="utf-8")
          print("G11_VERIFIED_SPECIAL8_MORNING_LOCKS=" + str(len(proof)))
          PY
            PYTHONPATH=".g11-private" python3 - "${FEED}" <<'PY'
          import json
          from pathlib import Path
          import sys
          incoming = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          stored = json.loads(Path(".relay-output/stored-feed.json").read_text(encoding="utf-8"))
          proof = json.loads(Path(".relay-output/special-eight-proof.json").read_text(encoding="utf-8"))
          previous = {row["key"]: row for row in stored["races"]}
          for row in incoming["races"]:
              key = row["key"]
              if key not in proof:
                  continue
              old = previous.get(key, {})
              p = proof[key]
              pre_old = old.get("predeadline") or {}
              pre_new = row.get("predeadline") or {}
              note = "｜SITE表示互換のみ｜正本特例8点=" + "/".join(p["bets"])
              checks = {
                  "snapshot": old.get("p3_snapshot_sha256") == p["snapshot_sha"],
                  "old_root_prefix": old.get("practical_bets") == p["bets"][:7] and old.get("p3_production_bets") == p["bets"][:7] and old.get("production_points") == 7,
                  "new_root_eight": row.get("practical_bets") == p["bets"] and row.get("p3_production_bets") == p["bets"] and row.get("production_points") == 8,
                  "special_id": row.get("special_case_id") == "G11_P3_SPECIAL_45_2_EQ_145_V1",
                  "old_note": (old.get("caution") or "").endswith(note),
                  "pre": not pre_old or (pre_old.get("practical_bets") == p["bets"][:7] and pre_new.get("practical_bets") == p["bets"] and pre_old.get("captured_at_jst") == pre_new.get("captured_at_jst") and (pre_old.get("caution") or "").endswith(note)),
                  "pre_old_prefix": pre_old.get("practical_bets") == p["bets"][:7],
                  "pre_new_eight": pre_new.get("practical_bets") == p["bets"] and pre_new.get("production_points") == 8,
                  "pre_new_count": len(pre_new.get("practical_bets")) if isinstance(pre_new.get("practical_bets"), list) else None,
                  "pre_time_same": pre_old.get("captured_at_jst") == pre_new.get("captured_at_jst"),
                  "pre_old_note": (pre_old.get("caution") or "").endswith(note),
              }
              print("G11_SPECIAL8_REPLAY_CHECK=" + json.dumps({"key": key, "checks": checks}, sort_keys=True))
          PY
            jq -c --slurpfile stored .relay-output/stored-feed.json \
                  --slurpfile special .relay-output/special-eight-proof.json '
              def confidence_metadata($a;$b):
                if (($a|type)=="object" and ($b|type)=="object"
                    and ($a|del(.raw_set_probability,.calibrated_set_estimate,.certification_status))
                        == ($b|del(.raw_set_probability,.calibrated_set_estimate,.certification_status))
                    and ($a.raw_set_probability==null or $a.raw_set_probability==$b.raw_set_probability)
                    and ($a.calibrated_set_estimate==null or $a.calibrated_set_estimate==$b.calibrated_set_estimate)
                    and ($a.certification_status==null or $a.certification_status==$b.certification_status)
                    and ($b.raw_set_probability|type)=="number"
                    and $b.raw_set_probability>=0 and $b.raw_set_probability<=1)
                then $b else $a end;
              ($special[0] // {}) as $proof |
              (.canonical_authorities.growth_p3 // {}) as $growth
              | (($growth.logic_id == "CURRENT_GROWTH_P3")
                  and ($growth.status == "LOCKED")
                  and ($growth.production_ready == true)
                  and ($growth.app_readback_status == "PASS")) as $current_p3
              | ($stored[0].races | map({key: .key, value: .}) | from_entries) as $prior
              | .races |= map(
                  . as $incoming
                  | ($prior[.key] // null) as $old
                  | ($proof[$incoming.key] // null) as $locked
                  | if (($old | type) == "object")
                    then
                      .top_boat = $old.top_boat
                      | .second_boat = $old.second_boat
                      | .axis = $old.axis
                      | .quality = $old.quality
                      | .turbulence = $old.turbulence
                      | .practical_bets = $old.practical_bets
                      | .production_points = $old.production_points
                      | .prediction = $old.prediction
                      | .caution = $old.caution
                      | .special_case_id = $old.special_case_id
                      | .special_strength = $old.special_strength
                      | .strong_mark = $old.strong_mark
                      | .p3_head = $old.p3_head
                      | .p3_logic_id = $old.p3_logic_id
                      | .p3_production_bets = $old.p3_production_bets
                      | .p3_published_at_jst = $old.p3_published_at_jst
                      | .p3_snapshot = $old.p3_snapshot
                      | .p3_snapshot_sha256 = $old.p3_snapshot_sha256
                      | .p3_status = $old.p3_status
                      | if ($old | has("trifecta_confidence"))
                        then .trifecta_confidence = confidence_metadata($old.trifecta_confidence; $incoming.trifecta_confidence)
                        else del(.trifecta_confidence) end
                    else .
                    end
                  | if (($old | type) == "object")
                       and (($old.predeadline | type) == "object")
                    then .odds_merit = $old.odds_merit
                      | .best_ev_bet = $old.best_ev_bet
                      | .best_ev = $old.best_ev
                      | .value_bets = $old.value_bets
                      | .odds_captured_at_jst = $old.odds_captured_at_jst
                      | .predeadline = $old.predeadline
                      | if ($old.p3_logic_id == "CURRENT_GROWTH_P3")
                           and ($old.predeadline.captured_at_jst == $incoming.predeadline.captured_at_jst)
                           and ($old.predeadline.axis == $incoming.predeadline.axis)
                           and ($old.predeadline.practical_bets == $incoming.predeadline.practical_bets)
                           and ($old.predeadline.trifecta_confidence.bet_artifact_sha ==
                                $incoming.predeadline.trifecta_confidence.bet_artifact_sha)
                        then .predeadline.trifecta_confidence =
                               confidence_metadata($old.predeadline.trifecta_confidence; $incoming.predeadline.trifecta_confidence)
                          | if (($incoming.predeadline.snapshot_sha256 // "") | test("^[a-f0-9]{64}$"))
                            then .predeadline.snapshot_sha256 = $incoming.predeadline.snapshot_sha256
                            else . end
                          | if ($old.predeadline.legacy_odds_merit == $incoming.predeadline.legacy_odds_merit)
                               and ($incoming.predeadline.odds_merit == $old.predeadline.legacy_odds_merit)
                               and (($old.predeadline | del(.odds_merit, .trifecta_confidence, .snapshot_sha256)) ==
                                    ($incoming.predeadline | del(.odds_merit, .trifecta_confidence, .snapshot_sha256)))
                            then .predeadline.odds_merit = $incoming.predeadline.odds_merit
                            else . end
                        else . end
                    else .
                    end
                  | if (($old | type) == "object") and (($locked | type) == "object")
                    then
                      if ($old.p3_snapshot_sha256 == $locked.snapshot_sha)
                         and ($old.practical_bets == $locked.bets[:7])
                         and ($old.p3_production_bets == $locked.bets[:7])
                         and ($old.production_points == 7)
                         and ($incoming.practical_bets == $locked.bets)
                         and ($incoming.p3_production_bets == $locked.bets)
                         and ($incoming.production_points == 8)
                         and (($incoming.special_case_id == null) or ($incoming.special_case_id == "G11_P3_SPECIAL_45_2_EQ_145_V1"))
                         and (($old.caution // "") | endswith("｜SITE表示互換のみ｜正本特例8点=" + ($locked.bets | join("/"))))
                         and (
                           (($old.predeadline | type) != "object")
                           or (
                             (($incoming.predeadline | type) == "object")
                             and ($old.predeadline.practical_bets == $locked.bets[:7])
                             and ($incoming.predeadline.practical_bets == $locked.bets)
                             and ($old.predeadline.captured_at_jst == $incoming.predeadline.captured_at_jst)
                             and (($old.predeadline.caution // "") | endswith("｜SITE表示互換のみ｜正本特例8点=" + ($locked.bets | join("/"))))
                           )
                         )
                        then .practical_bets = $locked.bets
                          | .p3_production_bets = $locked.bets
                          | .production_points = 8
                          | .special_case_id = $incoming.special_case_id
                          | .special_strength = $incoming.special_strength
                          | .strong_mark = $incoming.strong_mark
                          | .caution = ($old.caution | sub("｜SITE表示互換のみ｜正本特例8点=.*$"; ""))
                          | .predeadline = (
                            if (($old.predeadline | type) == "object")
                            then ($old.predeadline
                              | .practical_bets = $locked.bets
                              | .production_points = 8
                              | .special_case_id = $incoming.predeadline.special_case_id
                              | .special_strength = $incoming.predeadline.special_strength
                              | .strong_mark = $incoming.predeadline.strong_mark
                              | .caution = (.caution | sub("｜SITE表示互換のみ｜正本特例8点=.*$"; "")))
                            else $old.predeadline end)
                        else . end
                    else . end
                )
              | .races |= map(
                  if ((.predeadline | type) == "object")
                     and ((.predeadline.legacy_odds_merit | type) == "string")
                    then .odds_merit = .predeadline.legacy_odds_merit
                    else .
                    end
                )
              | .races |= map(
                  del(
                    .legacy_odds_merit,
                    .value_alert,
                    .value_alert_type,
                    .production_mean_ev
                  )
                )
              | if (($stored[0].true_ai | type) == "object")
                then .true_ai = $stored[0].true_ai
                else del(.true_ai)
                end
              | if (($stored[0].abeken | type) == "object")
                then .abeken = $stored[0].abeken
                else del(.abeken)
                end
              | .races |= map(
                  . as $incoming
                  | ($prior[.key] // null) as $old
                  | if (($old | type) == "object") and (($old.abeken_shadow | type) == "object")
                    then
                      if (($old.abeken_shadow.v53 | type) == "object")
                         and ($old.abeken_shadow.v53.formal_use == true)
                      then
                        if (($incoming.abeken_shadow.v53 | type) != "object")
                           or ($incoming.abeken_shadow.v53.formal_use != true)
                           or ($incoming.abeken_shadow.v53.runtime_logic_version != $old.abeken_shadow.v53.runtime_logic_version)
                           or ($incoming.abeken_shadow.v53.morning != $old.abeken_shadow.v53.morning)
                        then error("ABEKEN_V53_MORNING_TRANSPORT_MISMATCH")
                        else .abeken_shadow = ($old.abeken_shadow |
                          .v53.live = (
                            if (.v53.live | type) == "object" then .v53.live
                            else $incoming.abeken_shadow.v53.live end
                          ))
                        end
                      else .abeken_shadow = $old.abeken_shadow end
                    elif (($old | type) == "object")
                    then del(.abeken_shadow)
                    else .
                    end
                )
              | ([.races[] | select(.research_eligible == true and .odds_captured_at_jst != null)] | length) as $enriched
              | .counts.odds_enriched = $enriched
              | .counts.odds_waiting = (.counts.formal - $enriched)
              # Count canonical PRE_RACE ◎ independently from VALUE ALERT.
              | .counts.win_candidates_basis = "FORMAL_READY_PRE_RACE_ODDS_MERIT"
              | .counts.win_candidates = ([.races[] | select(.formal_status == "FORMAL" and .research_eligible == true and .predeadline.status == "READY" and .predeadline.odds_merit == "◎")] | length)
              | .counts.value_alert_count = ([.races[] | select(.formal_status == "FORMAL" and .research_eligible == true and .predeadline.status == "READY" and .predeadline.value_alert == true)] | length)
            ' "${FEED}" > .relay-output/feed-reconciled.json
            mv .relay-output/feed-reconciled.json "${FEED}"
          fi

          if [ "${RELAY_PHASE}" = "night" ] && \
             [ -f .relay-output/stored-feed.json ]; then
            jq -c --slurpfile stored .relay-output/stored-feed.json '
              ($stored[0].races | map({key: .key, value: .}) | from_entries) as $old
              | .abeken = $stored[0].abeken
              | .capabilities = $stored[0].capabilities
              | .canonical_authorities = $stored[0].canonical_authorities
              | if ($stored[0] | has("wild_pack"))
                then .wild_pack = $stored[0].wild_pack
                else del(.wild_pack)
                end
              | .races |= map(
                  . as $incoming
                  | ($old[.key] // null) as $prior
                  | if (($prior | type) == "object") and ($prior | has("abeken_shadow"))
                    then .abeken_shadow = $prior.abeken_shadow
                    elif (($prior | type) == "object")
                    then del(.abeken_shadow)
                    else .
                    end
                  | if (($prior | type) == "object") and ($prior | has("wild_pack"))
                    then .wild_pack = $prior.wild_pack
                    elif (($prior | type) == "object")
                    then del(.wild_pack)
                    else .
                    end
                )
            ' "${FEED}" > .relay-output/feed-night-immutable.json
            mv .relay-output/feed-night-immutable.json "${FEED}"
          fi

          if [ -f .relay-output/stored-feed.json ]; then
            python3 - "${FEED}" .relay-output/stored-feed.json <<'PY'
          import json
          import sys

          incoming = json.load(open(sys.argv[1], encoding="utf-8"))
          stored = json.load(open(sys.argv[2], encoding="utf-8"))
          old = {item["key"]: item for item in stored.get("races", [])}
          diagnostics = []
          for race in incoming.get("races", []):
              prior = old.get(race.get("key"))
              if not isinstance(prior, dict):
                  continue
              extra = sorted(set(race) - set(prior))
              missing = sorted(set(prior) - set(race))
              pre = race.get("predeadline")
              old_pre = prior.get("predeadline")
              pre_extra = (
                  sorted(set(pre) - set(old_pre))
                  if isinstance(pre, dict) and isinstance(old_pre, dict)
                  else []
              )
              pre_missing = (
                  sorted(set(old_pre) - set(pre))
                  if isinstance(pre, dict) and isinstance(old_pre, dict)
                  else []
              )
              if extra or missing or pre_extra or pre_missing:
                  diagnostics.append({
                      "key": race.get("key"),
                      "extra": extra,
                      "missing": missing,
                      "pre_extra": pre_extra,
                      "pre_missing": pre_missing,
                  })
          print("G11_FEED_SCHEMA_DIFF=" + json.dumps(
              diagnostics[:10], ensure_ascii=False, sort_keys=True
          ))
          pre_diffs = []
          for race in incoming.get("races", []):
              prior = old.get(race.get("key"))
              if not isinstance(prior, dict):
                  continue
              pre = race.get("predeadline")
              old_pre = prior.get("predeadline")
              if isinstance(pre, dict) and isinstance(old_pre, dict) and pre != old_pre:
                  changed = {
                      key: {"stored": old_pre.get(key), "incoming": pre.get(key)}
                      for key in sorted(set(pre) | set(old_pre))
                      if pre.get(key) != old_pre.get(key)
                  }
                  pre_diffs.append({"key": race.get("key"), "changed": changed})
          print("G11_PREDEADLINE_VALUE_DIFF=" + json.dumps(
              pre_diffs[:5], ensure_ascii=False, sort_keys=True
          ))
          new_pre = []
          for race in incoming.get("races", []):
              prior = old.get(race.get("key"))
              pre = race.get("predeadline")
              old_pre = prior.get("predeadline") if isinstance(prior, dict) else None
              if isinstance(pre, dict) and not isinstance(old_pre, dict):
                  new_pre.append({"key": race.get("key"), "predeadline": pre})
          print("G11_NEW_PREDEADLINE_OBJECTS=" + json.dumps(
              new_pre[:5], ensure_ascii=False, sort_keys=True
          ))
          stored_pre = [
              {"key": race.get("key"), "predeadline": race.get("predeadline")}
              for race in stored.get("races", [])
              if isinstance(race.get("predeadline"), dict)
          ]
          print("G11_STORED_PREDEADLINE_SAMPLE=" + json.dumps(
              stored_pre[:5], ensure_ascii=False, sort_keys=True
          ))
          if incoming.get("races"):
              print("G11_INCOMING_RACE_FIELDS=" + json.dumps(
                  sorted(incoming["races"][0]), ensure_ascii=False
              ))
          if stored.get("races"):
              print("G11_STORED_RACE_FIELDS=" + json.dumps(
                  sorted(stored["races"][0]), ensure_ascii=False
              ))
          PY
          fi

          # Preserve verified original-display NIGHT research emitted by the
          # private relay.  Do not replace settled CAPTURED_RESEARCH_ONLY /
          # daily_aggregate evidence with NOT_YET_ISSUED placeholders.
          # Race-level night_execution remains aggregate-only to stay under the
          # Site sync payload ceiling.
          if [ "${RELAY_PHASE}" = "night" ]; then
            python3 - "${FEED}" <<'PY'
          import json
          import sys

          path = sys.argv[1]
          feed = json.load(open(path, encoding="utf-8"))
          research = feed.get("original_display_research")
          if not isinstance(research, dict):
              raise SystemExit("G11_NIGHT_ORIGINAL_DISPLAY_RESEARCH_MISSING")
          required = {
              "available","status","source","boaters_used","morning_audits",
              "captures","night_settlements","profiles","promotion_gate",
              "proposal_gate_300r","daily_aggregate","production_mutated",
          }
          if set(research) != required:
              raise SystemExit("G11_NIGHT_ORIGINAL_DISPLAY_RESEARCH_SCHEMA")
          if research.get("boaters_used") is not False or research.get("production_mutated") is not False:
              raise SystemExit("G11_NIGHT_ORIGINAL_DISPLAY_RESEARCH_SAFETY")
          captured = 0
          settled = 0
          expected = {
              "status","source","captured_at_jst","top_display_boat",
              "rising_boats","falling_boats","boats","last_minute_inputs",
              "profile_projections","night_execution","production_mutated",
          }
          for race in feed.get("races", []):
              shadow = race.get("original_display_shadow")
              if not isinstance(shadow, dict):
                  raise SystemExit("G11_NIGHT_ORIGINAL_DISPLAY_SHADOW_MISSING")
              if set(shadow) != expected or shadow.get("production_mutated") is not False:
                  raise SystemExit("G11_NIGHT_ORIGINAL_DISPLAY_SHADOW_SCHEMA")
              captured += shadow.get("status") == "CAPTURED_RESEARCH_ONLY"
              settled += isinstance(shadow.get("night_execution"), dict)

          print("G11_NIGHT_ORIGINAL_DISPLAY_TRANSPORT=PRESERVED")
          print("G11_NIGHT_ORIGINAL_DISPLAY_SUMMARY="+json.dumps({
              "available":research.get("available"),
              "status":research.get("status"),
              "captures":research.get("captures"),
              "night_settlements":research.get("night_settlements"),
              "daily_aggregate_present":research.get("daily_aggregate") is not None,
              "captured_races":captured,
              "settled_races":settled,
          },ensure_ascii=False,sort_keys=True))
          PY
          fi

          if [ "${RELAY_PHASE}" = "night" ]; then
            PYTHONPATH=".g11-private" python3 -m g11.relay.night_transport_finance_v1 \
              "${FEED}" \
              ".relay-state/store/snapshots/night/workbook-ledger-projection.json"
            if [ -f .relay-state/store/snapshots/night/workbook-ledger-projection.json ]; then
              # Settle FINAL only after accepted MORNING/PRE_RACE reconciliation.
              PYTHONPATH=".g11-private" python3 -m g11.relay.final_bet_accounting_v1 \
                "${FEED}" \
                ".relay-state/store/snapshots/night/workbook-ledger-projection.json"
            fi
            if [ -f .relay-output/stored-feed.json ] && \
               jq -e 'has("confidence_result_revision_review") | not' .relay-output/stored-feed.json >/dev/null; then
              jq -c 'del(.confidence_result_revision_review)' "${FEED}" > .relay-output/feed-confidence-history.json
              mv .relay-output/feed-confidence-history.json "${FEED}"
            fi
          fi

          if [ "${RELAY_PHASE}" = "night" ]; then
            python3 - "${FEED}" <<'PY'
          import collections, json, sys
          feed=json.load(open(sys.argv[1],encoding="utf-8"))
          statuses=collections.Counter(
              (r.get("research_finance") or {}).get("status")
              for r in feed.get("races",[])
          )
          bad_eligible=[]
          bad_established=[]
          for r in feed.get("races",[]):
              rf=(r.get("research_finance") or {})
              if r.get("result_trifecta") is not None and r.get("research_eligible") is True and rf.get("status")!="VERIFIED":
                  bad_eligible.append({
                      "key":r.get("key"),
                      "result":r.get("result_trifecta"),
                      "formal_status":r.get("formal_status"),
                      "research_eligible":r.get("research_eligible"),
                      "research_finance":rf,
                  })
              if (r.get("result_meta") or {}).get("result_status")=="ESTABLISHED" and rf.get("status")!="VERIFIED":
                  bad_established.append({
                      "key":r.get("key"),
                      "result":r.get("result_trifecta"),
                      "formal_status":r.get("formal_status"),
                      "research_eligible":r.get("research_eligible"),
                      "research_finance":rf,
                  })
          verified=[
              r for r in feed.get("races",[])
              if (r.get("research_finance") or {}).get("status")=="VERIFIED"
          ]
          invariant_bad=[]
          for r in verified:
              rf=r["research_finance"]
              expected_keys={
                  "status","race_refund_occurred","gross_stake","refund_amount",
                  "net_investment","prize_return","profit","source"
              }
              valid=(
                  set(rf)==expected_keys
                  and type(rf.get("race_refund_occurred")) is bool
                  and all(type(rf.get(k)) is int for k in (
                      "gross_stake","refund_amount","net_investment",
                      "prize_return","profit"
                  ))
                  and rf.get("source")=="RESEARCH_LEDGER60"
                  and rf["gross_stake"]-rf["refund_amount"]==rf["net_investment"]
                  and rf["prize_return"]-rf["net_investment"]==rf["profit"]
                  and rf["gross_stake"]==len(r.get("practical_bets") or [])*100
              )
              if not valid:
                  invariant_bad.append({
                      "key":r.get("key"),
                      "practical_bets":r.get("practical_bets"),
                      "research_finance":rf,
                  })
          refund_cases=[
              {"key":r.get("key"),"research_finance":r.get("research_finance"),"result_meta":r.get("result_meta")}
              for r in verified
              if r["research_finance"].get("race_refund_occurred") is True
          ]
          print("G11_NIGHT_FINANCE_STATUS_COUNTS="+json.dumps(dict(statuses),ensure_ascii=False,sort_keys=True))
          print("G11_NIGHT_FINANCE_BAD_ELIGIBLE="+json.dumps(bad_eligible[:30],ensure_ascii=False,sort_keys=True))
          print("G11_NIGHT_FINANCE_BAD_ESTABLISHED="+json.dumps(bad_established[:30],ensure_ascii=False,sort_keys=True))
          print("G11_NIGHT_FINANCE_INVARIANT_BAD="+json.dumps(invariant_bad[:30],ensure_ascii=False,sort_keys=True))
          print("G11_NIGHT_FINANCE_SAMPLE="+json.dumps([
              {"key":r.get("key"),"practical_bets":r.get("practical_bets"),"research_finance":r.get("research_finance")}
              for r in verified[:3]
          ],ensure_ascii=False,sort_keys=True))
          print("G11_NIGHT_REFUND_CASES="+json.dumps(refund_cases[:30],ensure_ascii=False,sort_keys=True))
          print("G11_NIGHT_COUNTS="+json.dumps(feed.get("counts"),ensure_ascii=False,sort_keys=True))
          print("G11_NIGHT_RESEARCH="+json.dumps(feed.get("research"),ensure_ascii=False,sort_keys=True))
          print("G11_NIGHT_RESEARCH_DB="+json.dumps(feed.get("research_db"),ensure_ascii=False,sort_keys=True))
          PY
          fi

          echo "G11_INCOMING_WILD_CAPABILITY=$(jq -c '{capabilities,wild_pack_schema:(.wild_pack.schema // null),wild_pack_status:(.wild_pack.status // null),wild_authority:(.canonical_authorities.wild_pack // null)}' "${FEED}")"
          previous_wild="$(mktemp)"
          accepted_reference_date="$(date --date="${OPERATIONAL_DATE} -1 day" +%F)"
          if curl --fail-with-body --silent --show-error --location \
            "${G11_APP_ORIGIN}/api/g11-feed?date=${accepted_reference_date}" \
            -o "${previous_wild}"; then
            echo "G11_ACCEPTED_REFERENCE_DATE=${accepted_reference_date}"
            echo "G11_ACCEPTED_REFERENCE_WILD_CAPABILITY=$(jq -c '{capabilities,wild_pack_schema:(.wild_pack.schema // null),wild_pack_status:(.wild_pack.status // null),wild_authority:(.canonical_authorities.wild_pack // null)}' "${previous_wild}")"
            echo "G11_ACCEPTED_REFERENCE_RACE_FIELDS=$(jq -c '[.races[] | keys] | add | unique' "${previous_wild}")"
            if jq -e '.SNAPSHOT_CLASS=="TODAY_ONLY_RESCUE_PREDEADLINE"' "${FEED}" >/dev/null; then
              test -s .relay-output/stored-feed.json || { echo 'G11_RESCUE_ACCEPTED_FEED_READBACK_REQUIRED' >&2; exit 1; }
              python3 scripts/audit_public_surface.py project-rescue-stored-schema "${FEED}" .relay-output/stored-feed.json
            elif jq -e '.SNAPSHOT_CLASS == "SAME_DAY_RESCUE_NONRESEARCH"' "${FEED}" >/dev/null; then
              echo "G11_SITE_SCHEMA_PROJECT=SKIP_RESCUE_NONRESEARCH"
              jq -c 'del(.SNAPSHOT_CLASS,.CANONICAL_MORNING_PROMOTED,.RESEARCH_ELIGIBLE_AS_MORNING,.MORNING_HISTORY_BACKFILL,.ACCOUNTING_CLASS)' "${FEED}" > .relay-output/feed-rescue-site.json
              mv .relay-output/feed-rescue-site.json "${FEED}"
            else
              python3 scripts/audit_public_surface.py project-feed-schema "${FEED}" "${previous_wild}"
            fi
          fi

          echo "G11_TRANSPORT_RESCUE_PROOF=$(jq -c '{tagged:([.races[] | select((.today_rescue | type) == "object")] | length),first:(.races[0] | {key,today_rescue}),class:.SNAPSHOT_CLASS}' "${FEED}")"
          jq -e 'if .SNAPSHOT_CLASS=="TODAY_ONLY_RESCUE_PREDEADLINE" then all(.races[];(.today_rescue|type)=="object") else true end' "${FEED}" >/dev/null
          echo "G11_TRANSPORT_THREE_ENGINE=$(jq -c '{capability:.capabilities.three_engine_comparison,summary:(.three_engine_comparison|type),first:(.races[0] | {key,three_engine_classification,three_engine_score}),missing:([.races[] | select((.three_engine_score|type)!="object" or .three_engine_classification==null)]|length)}' "${FEED}")"
          if [ "${RELAY_PHASE}" = "night" ]; then
            python3 - "${FEED}" <<'PY'
          import collections, json, pathlib, sys
          feed=json.loads(pathlib.Path(sys.argv[1]).read_text(encoding="utf-8"))
          size=lambda value: len(json.dumps(value,ensure_ascii=False,sort_keys=True,separators=(",",":")).encode("utf-8"))
          top=sorted(((key,size(value)) for key,value in feed.items()),key=lambda row:-row[1])
          by_field=collections.Counter()
          for race in feed.get("races",[]):
              by_field.update({key:size(value) for key,value in race.items()})
          print("G11_NIGHT_RAW_FIELD_BYTES="+json.dumps({"total":pathlib.Path(sys.argv[1]).stat().st_size,"top_level":top,"race_fields":by_field.most_common()},ensure_ascii=False,separators=(",",":")))
          PY
          fi
          feed_sha="$(sha256sum "${FEED}" | cut -d' ' -f1)"
          printf 'verified_feed_bytes=%s\n' "$(wc -c < "${FEED}")"
          oidc="$(curl --fail-with-body --silent --show-error \
            -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            -H 'Accept: application/json' \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=${G11_OIDC_AUDIENCE}")"
          token="$(printf '%s' "${oidc}" | jq -er '.value')"
          http_status="$(curl --silent --show-error \
            -X POST "${G11_APP_ORIGIN}/api/g11-sync" \
            -H "Authorization: Bearer ${token}" \
            -H 'Content-Type: application/json' \
            -H "x-g11-feed-sha256: ${feed_sha}" \
            --data-binary "@${FEED}" \
            --output .relay-output/publish-result.json \
            --write-out '%{http_code}')"
          if [[ ! "${http_status}" =~ ^2[0-9][0-9]$ ]]; then
            if [ "${RELAY_PHASE}" = "night" ] && \
               { { [ "${http_status}" = "413" ] && \
                   jq -e '.error == "PAYLOAD_TOO_LARGE"' .relay-output/publish-result.json >/dev/null 2>&1; } || \
                 { [ "${http_status}" = "400" ] && \
                   jq -e '(.error == "Cannot read properties of undefined (reading '"'"'reduce'"'"')") or (.error == "FEED_ABEKEN_OBJECT")' .relay-output/publish-result.json >/dev/null 2>&1; }; } && \
               [ -f .relay-output/stored-feed.json ]; then
              python3 - "${FEED}" .relay-output/stored-feed.json \
                .relay-output/feed-night-stored-schema.json <<'PY'
          import copy
          import json
          import sys
          from pathlib import Path

          incoming = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          stored = json.loads(Path(sys.argv[2]).read_text(encoding="utf-8"))
          if incoming.get("operational_date_jst") != stored.get("operational_date_jst"):
              raise SystemExit("NIGHT_STORED_SCHEMA_DATE_MISMATCH")
          if incoming.get("stage") != "NIGHT" or incoming.get("status") != "PASS":
              raise SystemExit("NIGHT_STORED_SCHEMA_INCOMING_NOT_FINAL")

          incoming_by_key = {row["key"]: row for row in incoming.get("races", [])}
          stored_rows = stored.get("races")
          if not isinstance(stored_rows, list) or not stored_rows:
              raise SystemExit("NIGHT_STORED_SCHEMA_RACES")
          stored_keys = {row.get("key") for row in stored_rows}
          if stored_keys != set(incoming_by_key):
              raise SystemExit(
                  "NIGHT_STORED_SCHEMA_RACE_SET:"
                  + json.dumps({
                      "stored_only": sorted(stored_keys - set(incoming_by_key)),
                      "incoming_only": sorted(set(incoming_by_key) - stored_keys),
                  }, ensure_ascii=False)
              )

          out = copy.deepcopy(stored)
          for field in ("stage", "status", "generated_at_jst", "source"):
              if field in out and field in incoming:
                  out[field] = copy.deepcopy(incoming[field])

          for section in ("counts", "research", "research_db", "original_display_research"):
              old = out.get(section)
              new = incoming.get(section)
              if isinstance(old, dict) and isinstance(new, dict):
                  for key in list(old):
                      if key in new:
                          old[key] = copy.deepcopy(new[key])

          if isinstance(out.get("final_accounting"), dict) and isinstance(incoming.get("final_accounting"), dict):
              old_final = out["final_accounting"]
              new_final = incoming["final_accounting"]
              for key in ("status", "engines", "classifications", "source_counts", "by_race"):
                  if key in old_final and key in new_final:
                      old_final[key] = copy.deepcopy(new_final[key])

          safe_scalar = {
              "result_trifecta", "payout", "practical_hit", "validation_hit",
              "miss_classification", "research_decision",
          }
          safe_dict = {
              "research_finance", "actual_purchase", "result_meta",
          }
          for old in out["races"]:
              new = incoming_by_key[old["key"]]
              reference = new.get("late_reference")
              prior = old.get("late_reference")
              if (isinstance(reference, dict) and reference.get("status") == "RECORDED_NON_FORMAL_SETTLED"
                      and isinstance(prior, dict) and prior.get("status") == "RECORDED_NON_FORMAL_PENDING"):
                  for key in ("schema", "captured_at_jst", "morning_lock_established",
                              "included_in_formal_metrics", "purchase_executed"):
                      if reference.get(key) != prior.get(key):
                          raise SystemExit("NIGHT_REFERENCE_LOCK_CHANGED:" + old["key"])
                  old["late_reference"] = copy.deepcopy(reference)
              for field in safe_scalar:
                  if field in old and field in new:
                      old[field] = copy.deepcopy(new[field])
              for field in safe_dict:
                  if isinstance(old.get(field), dict) and isinstance(new.get(field), dict):
                      for key in list(old[field]):
                          if key in new[field]:
                              old[field][key] = copy.deepcopy(new[field][key])
              if isinstance(old.get("result_meta"), dict) and isinstance(new.get("result_meta"), dict):
                  for key in ("result_status", "dead_heat", "trifecta_settlements"):
                      if key in new["result_meta"]:
                          old["result_meta"][key] = copy.deepcopy(new["result_meta"][key])
              old_shadow = old.get("original_display_shadow")
              new_shadow = new.get("original_display_shadow")
              if isinstance(old_shadow, dict) and isinstance(new_shadow, dict):
                  for key in list(old_shadow):
                      if key in new_shadow:
                          old_shadow[key] = copy.deepcopy(new_shadow[key])

          counts = out.get("counts", {})
          if not (
              counts.get("pending") == 0
              and counts.get("results") == counts.get("races")
          ):
              raise SystemExit("NIGHT_STORED_SCHEMA_NOT_COMPLETE")

          def stable(value):
              value = copy.deepcopy(value)
              value.pop("three_engine_comparison", None)
              for row in value["races"]:
                  row.pop("three_engine_score", None)
                  row.pop("three_engine_classification", None)
              return value
          stable_before = stable(out)
          if any(r.get("formal_status") == "FORMAL" for r in out["races"]):
              sys.path.insert(0, str(Path(".g11-private").resolve()))
              from g11.canonical import public_app_feed as _g11_feed
              out["three_engine_comparison"] = _g11_feed._attach_three_engine_comparison(
                  out["races"], out.get("true_ai")
              )
              if stable(out) != stable_before:
                  raise SystemExit("NIGHT_STORED_SCHEMA_SCORE_RECOMPUTE_MUTATED_LOCK")
              if (
                  out["three_engine_comparison"].get("status") != "SCORED"
                  or out["three_engine_comparison"].get("classifications", {}).get("PENDING") != 0
              ):
                  raise SystemExit("NIGHT_STORED_SCHEMA_SCORE_RECOMPUTE_INCOMPLETE")

          Path(sys.argv[3]).write_text(
              json.dumps(out, ensure_ascii=False, sort_keys=True, separators=(",", ":")) + "\n",
              encoding="utf-8",
          )
          size = Path(sys.argv[3]).stat().st_size
          if size > 2_000_000:
              raise SystemExit("NIGHT_STORED_SCHEMA_OVER_LIMIT:" + str(size))
          print("G11_NIGHT_STORED_SCHEMA_OVERLAY=READY BYTES=" + str(size))
          PY
              mv .relay-output/feed-night-stored-schema.json "${FEED}"
              feed_sha="$(sha256sum "${FEED}" | cut -d' ' -f1)"
              http_status="$(curl --silent --show-error \
                --location \
                --output .relay-output/publish-result-stored-schema.json \
                --write-out '%{http_code}' \
                -X POST "${G11_APP_ORIGIN}/api/g11-sync" \
                -H "Authorization: Bearer ${token}" \
                -H 'Content-Type: application/json' \
                -H "x-g11-feed-sha256: ${feed_sha}" \
                --data-binary "@${FEED}")"
              if [[ "${http_status}" =~ ^2[0-9][0-9]$ ]]; then
                echo 'G11_NIGHT_STORED_SCHEMA_OVERLAY=ACCEPTED'
                printf 'feed_sha=%s\n' "${feed_sha}" >> "${GITHUB_OUTPUT}"
                exit 0
              fi
              echo "G11_NIGHT_STORED_SCHEMA_OVERLAY=REJECTED HTTP=${http_status}" >&2
              cat .relay-output/publish-result-stored-schema.json >&2 || true
              cp .relay-output/publish-result-stored-schema.json .relay-output/publish-result.json
            fi
            printf 'G11 sync rejected the verified feed (HTTP %s):\n' "${http_status}" >&2
            jq -c . .relay-output/publish-result.json >&2 || \
              sed -n '1,40p' .relay-output/publish-result.json >&2
            if [ "${http_status}" = "409" ] && \
               [ "${RELAY_PHASE}" = "night" ] && \
               jq -e '.error == "NIGHT_IMMUTABLE_CONFLICT"' \
                 .relay-output/publish-result.json >/dev/null 2>&1; then
              echo 'immutable_night=true' >> "${GITHUB_OUTPUT}"
              exit 0
            fi
            if [ "${http_status}" = "409" ] && \
               jq -e '.error == "ODDS_IMMUTABLE_CONFLICT"' \
                 .relay-output/publish-result.json >/dev/null 2>&1; then
              curl --fail-with-body --silent --show-error --location \
                "${G11_APP_ORIGIN}/api/g11-feed?date=${OPERATIONAL_DATE}" \
                -o .relay-output/stored-feed.json
              jq -cn \
                --slurpfile stored .relay-output/stored-feed.json \
                --slurpfile incoming "${FEED}" '
                  def odds: {
                    odds_merit, best_ev_bet, best_ev, value_bets,
                    odds_captured_at_jst
                  };
                  ($stored[0].races | map({key: .key, value: odds}) | from_entries) as $old
                  | $incoming[0].races
                  | map(select(.odds_captured_at_jst != null and $old[.key] != odds)
                      | {key, stored: $old[.key], incoming: odds})
                ' >&2
            fi
            exit 1
          fi
          printf 'feed_sha=%s\n' "${feed_sha}" >> "${GITHUB_OUTPUT}"

      - name: Verify source identity and projected app readback
        id: readback
        if: steps.publish.outcome == 'success' && steps.publish.outputs.immutable_night != 'true'
        env:
          FEED: .relay-output/feed.json
          OPERATIONAL_DATE: ${{ steps.due.outputs.operational_date }}
        run: |
          set -euo pipefail
          curl --fail-with-body --silent --show-error --location \
            "${G11_APP_ORIGIN}/api/g11-feed?date=${{ steps.due.outputs.operational_date }}" \
            --dump-header .relay-output/readback.headers \
            -o .relay-output/readback.json

          header() {
            awk -F ': *' -v wanted="$1" '
              tolower($1) == tolower(wanted) {
                value=$2
                sub(/\r$/, "", value)
              }
              END { print value }
            ' .relay-output/readback.headers
          }

          source_sha="$(header x-g11-source-feed-sha256)"
          readback_sha="$(header x-g11-feed-sha256)"
          authority_source="$(header x-g11-authority-readback-source)"
          expected_source_sha="$(sha256sum "${FEED}" | cut -d' ' -f1)"
          actual_readback_sha="$(sha256sum .relay-output/readback.json | cut -d' ' -f1)"

          printf 'G11_READBACK_SOURCE_SHA=%s\n' "${source_sha}"
          printf 'G11_READBACK_EXPECTED_SOURCE_SHA=%s\n' "${expected_source_sha}"
          printf 'G11_READBACK_FEED_SHA=%s\n' "${readback_sha}"
          printf 'G11_READBACK_ACTUAL_FEED_SHA=%s\n' "${actual_readback_sha}"
          printf 'G11_READBACK_AUTHORITY_SOURCE=%s\n' "${authority_source}"
          jq -c '{
            operational_date_jst,
            stage,
            growth_p3: .canonical_authorities.growth_p3,
            wild_pack_present: (.canonical_authorities.wild_pack | type == "object"),
            canonical_capability: .capabilities.canonical_authorities
          }' .relay-output/readback.json

          test -n "${source_sha}"
          test -n "${readback_sha}"
          test "${source_sha}" = "${expected_source_sha}"
          test "${readback_sha}" = "${actual_readback_sha}"
          case "${authority_source}" in
            UPSTREAM|FAIL_CLOSED_SITE_ADAPTER) ;;
            *)
              printf 'G11_READBACK_AUTHORITY_SOURCE_INVALID: %s\n' "${authority_source}" >&2
              exit 1
              ;;
          esac

          jq -e --arg operational_date "${{ steps.due.outputs.operational_date }}" --slurpfile sent "${FEED}" '
            .operational_date_jst == $operational_date
            and (.canonical_authorities | type == "object")
            and (.canonical_authorities.growth_p3 | type == "object")
            and (.canonical_authorities.wild_pack | type == "object")
            and .capabilities.canonical_authorities
            and .capabilities.wild_pack == $sent[0].capabilities.wild_pack
            and .wild_pack == $sent[0].wild_pack
            and (.races | map({
              key, three_engine_score, three_engine_classification,
              trifecta_confidence, special_case_id, special_strength,
              strong_mark, predeadline, wild_pack, abeken_shadow
            })) == ($sent[0].races | map({
              key, three_engine_score, three_engine_classification,
              trifecta_confidence, special_case_id, special_strength,
              strong_mark, predeadline, wild_pack, abeken_shadow
            }))
          ' .relay-output/readback.json >/dev/null
          echo 'G11_CURRENT_PRE_RACE_TRANSPORT_READBACK=PASS'
          if [ "${{ steps.due.outputs.phase }}" = "night" ]; then
            if jq -e '.counts.formal==0 and .counts.excluded==.counts.races and .research_db.available==false' .relay-output/readback.json >/dev/null; then
              echo G11_RESCUE_NIGHT_READBACK=PASS
            else
              python3 scripts/audit_three_phase_runtime_contract.py \
                --night-ready .relay-output/readback.json --day "${{ steps.due.outputs.operational_date }}"
            fi
          fi

      - name: Prove first formal V53 race from official snapshots and deployed readback
        if: steps.publish.outcome == 'success' && steps.publish.outputs.immutable_night != 'true' && steps.due.outputs.phase != 'night' && steps.readback.outcome == 'success'
        env:
          OPERATIONAL_DATE: ${{ steps.due.outputs.operational_date }}
        run: |
          set -euo pipefail
          PYTHONPATH=".g11-private" python3 - "${OPERATIONAL_DATE}" ".relay-state/store" ".relay-output/readback.json" <<'PY'
          """Read-only V53 first-event proof for the public relay's verified readback step."""
          import json
          import sys
          from datetime import datetime
          from pathlib import Path
          
          from g11.abeken.v53 import abeken_shadow_v53_runtime as v53_runtime
          from g11.canonical.official_pipeline import OfficialArtifactStore
          
          
          def require(condition, code):
              if not condition:
                  raise ValueError(code)
          
          
          def main(day, store_root, readback_path):
              print("PRE_MORNING_ARM_STATUS=PASS")
              print("V53_PROVISIONAL_ACTIVE_STATUS=PROVISIONAL_ACTIVE")
              if day < "2026-09-29":
                  print("V53_FIRST_EVENT_PROOF=WAITING_FIRST_FORMAL_DAY")
                  return
          
              feed = json.loads(Path(readback_path).read_text())
              races = sorted(
                  (row for row in feed.get("races", [])
                   if row.get("date_jst") == day
                   and isinstance(row.get("abeken_shadow"), dict)
                   and isinstance(row["abeken_shadow"].get("v53"), dict)
                   and row["abeken_shadow"]["v53"].get("formal_use") is True),
                  key=lambda row: (row["deadline_jst"], row["key"]),
              )
              if not races:
                  print("V53_MORNING_LIVE_PROOF=FAIL TECHNICAL_BLOCKER=NO_FORMAL_V53_MORNING_IN_APP_READBACK")
                  return
          
              first = races[0]
              race_key = first["key"]
              public = first["abeken_shadow"]["v53"]
              root = Path(store_root).resolve(strict=True)
              store = OfficialArtifactStore(root)
              print(f"FIRST_LIVE_MORNING_RACE_ID={race_key}")
              try:
                  morning = store.load_verified_snapshot("morning", f"abeken-v53-shadow-morning-{race_key.lower()}")
                  payload = morning["SNAPSHOT"]["PAYLOAD"]
                  decision = v53_runtime.validate_decision(payload["RESULT"]["DECISION"])
                  version = v53_runtime.RUNTIME_LOGIC_VERSION
                  pin = json.loads((root / "abeken-v53-daily-version" / f"{day}.json").read_text())
                  require(
                      payload.get("FORMAL_USE") is True
                      and payload.get("RACE_KEY") == race_key
                      and payload.get("RESULT_FEEDBACK_TO_MODEL") is False
                      and payload.get("P3_INPUT_USED") is False
                      and payload.get("WILD_INPUT_USED") is False
                      and payload["RESULT"].get("STATUS") == "READY"
                      and payload["RESULT"].get("LEGACY45_MORNING_SEED") is True
                      and payload["RESULT"].get("LEGACY_45_FALLBACK") is False
                      and payload["RESULT"].get("RUNTIME_LOGIC_VERSION") == version
                      and pin.get("DAILY_ABEKEN_SHADOW_VERSION") == version
                      and public.get("runtime_logic_version") == version
                      and public["morning"]["practical_bets"] == decision["BUY_SET"]
                      and public["morning"]["buy_count"] == decision["BUY_COUNT"]
                      and public["morning"]["main_head"] == decision["MAIN_HEAD"],
                      "MORNING_PIN_SEED_RIGHTS_OR_APP_READBACK_MISMATCH",
                  )
                  print(f"V53_MORNING_LIVE_PROOF=PASS RACE_ID={race_key} "
                        f"VERSION={version} SNAPSHOT_SHA256={morning['SNAPSHOT_SHA256']}")
                  print(f"APP_V53_MORNING_READBACK=PASS RACE_ID={race_key}")
              except Exception as exc:
                  print(f"V53_MORNING_LIVE_PROOF=FAIL RACE_ID={race_key} "
                        f"TECHNICAL_BLOCKER={type(exc).__name__}:{exc}")
                  return
          
              print(f"FIRST_LIVE_PRE_RACE_RACE_ID={race_key}")
              if not isinstance(public.get("live"), dict):
                  deadline = datetime.fromisoformat(first["deadline_jst"])
                  status = "WAITING_T7" if datetime.now(deadline.tzinfo) < deadline else "FAIL"
                  print(f"V53_PRE_RACE_LIVE_PROOF={status} RACE_ID={race_key}")
                  if status == "FAIL":
                      print("TECHNICAL_BLOCKER=FIRST_V53_RACE_MISSING_PRE_RACE_AFTER_DEADLINE")
                  return
          
              try:
                  live = store.load_verified_snapshot("predeadline", f"abeken-v53-shadow-live-{race_key.lower()}")
                  source = store.load_verified_snapshot("predeadline", f"beforeinfo-{race_key.lower()}")
                  live_payload = live["SNAPSHOT"]["PAYLOAD"]
                  source_payload = source["SNAPSHOT"]["PAYLOAD"]
                  result = live_payload["RESULT"]
                  decision = v53_runtime.validate_decision(result["DECISION"])
                  morning_bets = set(public["morning"]["practical_bets"])
                  live_bets = set(decision["BUY_SET"])
                  require(
                      source_payload.get("STATUS") == "PREDEADLINE_SOURCE_COMPLETE"
                      and source_payload.get("KIND") == "BEFOREINFO"
                      and source_payload.get("RACE_KEY") == race_key
                      and live_payload.get("FORMAL_USE") is True
                      and live_payload.get("MORNING_V53_SNAPSHOT_SHA256") == morning["SNAPSHOT_SHA256"]
                      and live_payload.get("BEFOREINFO_SNAPSHOT_SHA256") == source["SNAPSHOT_SHA256"]
                      and live_payload.get("P3_INPUT_USED") is False
                      and live_payload.get("WILD_INPUT_USED") is False
                      and live_payload.get("RESULT_FEEDBACK_TO_MODEL") is False
                      and result.get("STATUS") == "READY"
                      and result.get("RUNTIME_LOGIC_VERSION") == version
                      and result.get("LEGACY_45_FALLBACK") is False
                      and result.get("PRE_RACE_DATA_CAPTURED_AT") == source_payload.get("CAPTURED_AT_JST")
                      and datetime.fromisoformat(result["PRE_RACE_DATA_CAPTURED_AT"])
                          <= datetime.fromisoformat(first["deadline_jst"])
                      and public["live"].get("captured_at_jst") == result["PRE_RACE_DATA_CAPTURED_AT"]
                      and public["live"]["practical_bets"] == decision["BUY_SET"]
                      and public["live"]["buy_count"] == decision["BUY_COUNT"]
                      and public["live"]["main_head"] == decision["MAIN_HEAD"]
                      and public["live"]["added_bets"] == sorted(live_bets - morning_bets)
                      and public["live"]["removed_bets"] == sorted(morning_bets - live_bets),
                      "PRE_RACE_OFFICIAL_SOURCE_VERSION_RIGHTS_DIFF_OR_APP_READBACK_MISMATCH",
                  )
                  print(f"V53_PRE_RACE_LIVE_PROOF=PASS RACE_ID={race_key} "
                        f"CAPTURED_AT_JST={result['PRE_RACE_DATA_CAPTURED_AT']} "
                        f"SNAPSHOT_SHA256={live['SNAPSHOT_SHA256']}")
                  print(f"APP_V53_PRE_RACE_READBACK=PASS RACE_ID={race_key}")
                  print("FORMAL_V53_OPERATION_READY=PASS")
              except Exception as exc:
                  print(f"V53_PRE_RACE_LIVE_PROOF=FAIL RACE_ID={race_key} "
                        f"TECHNICAL_BLOCKER={type(exc).__name__}:{exc}")
          
          
          if __name__ == "__main__":
              main(*sys.argv[1:])
          PY

      - name: Verify existing immutable night readback
        if: steps.publish.outcome == 'success' && steps.publish.outputs.immutable_night == 'true'
        env:
          OPERATIONAL_DATE: ${{ steps.due.outputs.operational_date }}
        run: |
          set -euo pipefail
          curl --fail-with-body --silent --show-error --location \
            "${G11_APP_ORIGIN}/api/g11-feed?date=${{ steps.due.outputs.operational_date }}" \
            -o .relay-output/readback-existing-night.json
          jq -e --arg operational_date "${{ steps.due.outputs.operational_date }}" '
            .operational_date_jst == $operational_date
            and .stage == "NIGHT"
            and .status == "PASS"
            and (.canonical_authorities | type == "object")
            and (.races | type == "array")
            and (.counts.results > 0)
          ' .relay-output/readback-existing-night.json >/dev/null
          if jq -e '.counts.formal==0 and .counts.excluded==.counts.races and .research_db.available==false' .relay-output/readback-existing-night.json >/dev/null; then
            echo G11_RESCUE_NIGHT_READBACK=PASS
          else
            python3 scripts/audit_three_phase_runtime_contract.py \
              --night-ready .relay-output/readback-existing-night.json --day "${{ steps.due.outputs.operational_date }}"
          fi

      - name: Keep the predeadline relay alive between delayed cron starts
        if: always() && !cancelled() && steps.runtime.outcome == 'success' && steps.encrypt-state.outputs.ready == 'true' && steps.due.outputs.phase == 'predeadline'
        env:
          GH_TOKEN: ${{ github.token }}
          OPERATIONAL_DATE: ${{ steps.due.outputs.operational_date }}
        run: |
          set -euo pipefail
          heartbeat="$(python3 scripts/dynamic_last_race_heartbeat.py \
            --result .relay-output/result.json --operational-date "${OPERATIONAL_DATE}")"
          if [ "${heartbeat}" = HANDOFF ]; then
            echo 'G11_PREDEADLINE_CHAIN=NIGHT_HANDOFF'
            exit 0
          fi
          if [ "${heartbeat}" = RESCUE_HANDOFF ]; then
            echo 'G11_PREDEADLINE_CHAIN=RESCUE_NIGHT_HANDOFF'
            exit 0
          fi
          if [ "${heartbeat}" != CONTINUE ] && [ "${heartbeat}" != CHECK_HANDOFF ]; then
            echo "G11_PREDEADLINE_CHAIN=${heartbeat}"
            exit 0
          fi

          sleep 45
          heartbeat="$(python3 scripts/dynamic_last_race_heartbeat.py \
            --result .relay-output/result.json --operational-date "${OPERATIONAL_DATE}")"
          if [ "${heartbeat}" = RESCUE_HANDOFF ]; then
            echo 'G11_PREDEADLINE_CHAIN=RESCUE_NIGHT_HANDOFF'
            exit 0
          fi
          if [ "${heartbeat}" != CONTINUE ] && [ "${heartbeat}" != CHECK_HANDOFF ]; then
            echo "G11_PREDEADLINE_CHAIN=${heartbeat}"
            exit 0
          fi
          runs="$(curl --fail-with-body --silent --show-error \
            --retry 3 --retry-delay 2 \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/g11-free-runner.yml/runs?per_page=100")"
          active_ids="$(printf '%s' "${runs}" | jq -r --argjson current "${GITHUB_RUN_ID}" \
            '.workflow_runs[] | select(.id != $current and .event == "workflow_dispatch" and (.status == "queued" or .status == "in_progress" or .status == "requested" or .status == "waiting" or .status == "pending")) | .id')"
          for active_id in ${active_ids}; do
            active_title="$(printf '%s' "${runs}" | jq -r --argjson id "${active_id}" \
              '.workflow_runs[] | select(.id == $id) | .display_title')"
            jobs="$(curl --fail-with-body --silent --show-error \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H 'Accept: application/vnd.github+json' \
              -H 'X-GitHub-Api-Version: 2022-11-28' \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/runs/${active_id}/jobs?per_page=100")"
            if printf '%s' "${jobs}" | jq -e --arg target "LIVE-predeadline-${OPERATIONAL_DATE}" \
              'any(.jobs[]; .name == $target and (.status == "queued" or .status == "in_progress" or .status == "waiting" or .status == "pending"))' >/dev/null; then
              echo "G11_PREDEADLINE_CHAIN=DEFER_ACTIVE_LIVE run=${active_id}"
              exit 0
            fi
            # GitHub can queue a run under concurrency before materializing
            # any jobs. Its phase/day run-name is authoritative until then.
            if [ "$(printf '%s' "${jobs}" | jq '.jobs | length')" -eq 0 ] && \
               [ "${active_title}" = "LIVE-predeadline-${OPERATIONAL_DATE}" ]; then
              echo "G11_PREDEADLINE_CHAIN=DEFER_QUEUED_LIVE run=${active_id}"
              exit 0
            fi
          done
          payload="$(jq -cn --arg day "${OPERATIONAL_DATE}" \
            '{ref:"main",inputs:{phase:"predeadline",operational_date:$day}}')"
          curl --fail-with-body --silent --show-error \
            -X POST \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/g11-free-runner.yml/dispatches" \
            -d "${payload}"

      - name: Continue bounded NIGHT after official last-race handoff
        if: >-
          always() && !cancelled() &&
          steps.runtime.outcome == 'success' &&
          steps.encrypt-state.outputs.ready == 'true' &&
          (steps.due.outputs.phase == 'predeadline' || steps.due.outputs.phase == 'night')
        env:
          GH_TOKEN: ${{ github.token }}
          OPERATIONAL_DATE: ${{ steps.due.outputs.operational_date }}
        run: |
          set -euo pipefail
          result=.relay-output/result.json
          if jq -e '.STATUS == "NIGHT_HANDOFF_READY" and .NIGHT_HANDOFF == true' "${result}" >/dev/null; then
            echo 'G11_NIGHT_HANDOFF=LAST_RACE_DEADLINE_REACHED'
          elif jq -e '
              .STATUS == "SAME_DAY_RESCUE_COMPLETE"
              and .PHASE == "PREDEADLINE_RESCUE"
              and .CANONICAL_MORNING_PROMOTED == false
              and .NIGHT_RESEARCH_CONNECTED == false
              and (.LAST_RACE_DEADLINE_JST | type) == "string"
            ' "${result}" >/dev/null; then
            rescue_deadline="$(jq -er '.LAST_RACE_DEADLINE_JST' "${result}")"
            if [ "$(date -d "${rescue_deadline}" +%s)" -gt "$(date +%s)" ]; then
              exit 0
            fi
            echo 'G11_NIGHT_HANDOFF=RESCUE_LAST_RACE_DEADLINE_REACHED'
          elif jq -e '.STATUS == "NIGHT_WAITING_OFFICIAL_RESULTS" and .RETRY_SCHEDULED == true' "${result}" >/dev/null; then
            sleep 180
          else
            exit 0
          fi
          now_day="$(date +%F)"
          now_hhmm="$(date +%H%M)"
          if [ "${now_day}" != "${OPERATIONAL_DATE}" ]; then
            if [ "${now_hhmm}" -ge 0200 ] || [ "${now_day}" != "$(date -d "${OPERATIONAL_DATE} + 1 day" +%F)" ]; then
              echo 'G11_NIGHT_HANDOFF=ROLLOVER_CLOSED'
              exit 0
            fi
          fi
          if curl --fail-with-body --silent --show-error --location \
            --connect-timeout 10 --max-time 20 \
            "${G11_APP_ORIGIN}/api/g11-feed?date=${OPERATIONAL_DATE}" \
            -o .relay-output/night-handoff-readback.json; then
            if python3 scripts/audit_three_phase_runtime_contract.py \
              --night-ready .relay-output/night-handoff-readback.json \
              --day "${OPERATIONAL_DATE}"; then
              echo 'G11_NIGHT_HANDOFF=APP_ALREADY_COMPLETE'
              exit 0
            fi
          fi
          runs="$(curl --fail-with-body --silent --show-error \
            --retry 3 --retry-delay 2 \
            --connect-timeout 10 --max-time 20 \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/g11-free-runner.yml/runs?per_page=50")"
          active_ids="$(printf '%s' "${runs}" | jq -r --argjson current "${GITHUB_RUN_ID}" \
            '.workflow_runs[] | select(.id != $current and .event == "workflow_dispatch" and (.status == "queued" or .status == "in_progress" or .status == "requested" or .status == "waiting" or .status == "pending")) | .id')"
          for active_id in ${active_ids}; do
            active_title="$(printf '%s' "${runs}" | jq -r --argjson id "${active_id}" \
              '.workflow_runs[] | select(.id == $id) | .display_title')"
            jobs="$(curl --fail-with-body --silent --show-error \
              --connect-timeout 10 --max-time 20 \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H 'Accept: application/vnd.github+json' \
              -H 'X-GitHub-Api-Version: 2022-11-28' \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/runs/${active_id}/jobs?per_page=100")"
            if printf '%s' "${jobs}" | jq -e --arg target "LIVE-night-${OPERATIONAL_DATE}" \
              'any(.jobs[]; .name == $target and (.status == "queued" or .status == "in_progress" or .status == "waiting" or .status == "pending"))' >/dev/null; then
              echo "G11_NIGHT_HANDOFF=DEFER_ACTIVE_LIVE run=${active_id}"
              exit 0
            fi
            if [ "$(printf '%s' "${jobs}" | jq '.jobs | length')" -eq 0 ] && \
               [ "${active_title}" = "LIVE-night-${OPERATIONAL_DATE}" ]; then
              echo "G11_NIGHT_HANDOFF=DEFER_QUEUED_LIVE run=${active_id}"
              exit 0
            fi
          done
          payload="$(jq -cn --arg day "${OPERATIONAL_DATE}" \
            '{ref:"main",inputs:{phase:"night",operational_date:$day}}')"
          curl --fail-with-body --silent --show-error \
            --connect-timeout 10 --max-time 20 -X POST \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/g11-free-runner.yml/dispatches" -d "${payload}"
          echo "G11_NIGHT_HANDOFF=DISPATCHED day=${OPERATIONAL_DATE}"

      - name: Bootstrap PREDEADLINE after a verified public MORNING
        if: >-
          always() && !cancelled() &&
          steps.runtime.outcome == 'success' &&
          steps.encrypt-state.outputs.ready == 'true' &&
          steps.due.outputs.phase == 'morning'
        env:
          GH_TOKEN: ${{ github.token }}
          OPERATIONAL_DATE: ${{ steps.due.outputs.operational_date }}
        run: |
          set -euo pipefail
          now_hhmm="$(date +%H%M)"
          if [ "${now_hhmm}" -lt 0700 ] || [ "${now_hhmm}" -gt 2055 ]; then
            echo "G11_PUBLIC_PREDEADLINE_BOOTSTRAP=OUTSIDE_WINDOW"
            exit 0
          fi
          test "${OPERATIONAL_DATE}" = "$(date +%F)"
          curl --fail-with-body --silent --show-error --location \
            "${G11_APP_ORIGIN}/api/g11-feed?date=${OPERATIONAL_DATE}" \
            -o .relay-output/bootstrap-morning-readback.json
          jq -e --arg day "${OPERATIONAL_DATE}" '
            .operational_date_jst == $day and .status == "PASS"
            and (.stage == "MORNING" or .stage == "PREDEADLINE")
            and .canonical_authorities.growth_p3.status == "LOCKED"
            and .canonical_authorities.growth_p3.app_readback_status == "PASS"
          ' .relay-output/bootstrap-morning-readback.json >/dev/null

          for status in queued in_progress waiting pending requested; do
            runs="$(curl --fail-with-body --silent --show-error \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H 'Accept: application/vnd.github+json' \
              -H 'X-GitHub-Api-Version: 2022-11-28' \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/g11-free-runner.yml/runs?status=${status}&per_page=100")"
            active="$(printf '%s' "${runs}" | jq --argjson current "${GITHUB_RUN_ID}" \
              '[.workflow_runs[] | select(.id != $current)] | length')"
            if [ "${active}" -gt 0 ]; then
              echo "G11_PUBLIC_PREDEADLINE_BOOTSTRAP=ACTIVE_${status}"
              exit 0
            fi
          done
          curl --fail-with-body --silent --show-error \
            -X POST \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/g11-free-runner.yml/dispatches" \
            -d '{"ref":"main","inputs":{"phase":"predeadline"}}'
          echo "G11_PUBLIC_PREDEADLINE_BOOTSTRAP=DISPATCHED_ONCE"

      - name: Propagate private runtime failure after state checkpoint
        if: always() && steps.runtime.outcome == 'failure'
        run: exit 1

# operator-night-current-20260928

  repair-20260928-final:
    name: Restore historical FINAL using accepted result overlay
    if: >-
      github.repository_id == '1367703708' &&
      github.ref == 'refs/heads/main' &&
      github.event_name == 'workflow_dispatch' &&
      inputs.phase == 'repair-20260928' &&
      vars.G11_RELAY_ENABLED == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      G11_APP_ORIGIN: ${{ secrets.APP_ENDPOINT }}
      G11_OIDC_AUDIENCE: ${{ secrets.OIDC_AUD }}
    steps:
      - name: Checkout public relay
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Audit public surface
        run: python3 scripts/audit_public_surface.py
      - name: Overlay result fields onto accepted 9/28 feed
        run: |
          set -euo pipefail
          mkdir -p .relay-output
          curl --fail-with-body --silent --show-error --location \
            "${G11_APP_ORIGIN}/api/g11-feed?date=2026-09-28" \
            --output .relay-output/accepted-night.json
          python3 scripts/overlay_20260928_accepted_feed_final.py \
            .relay-output/accepted-night.json scripts/official_20260928_results.txt \
            .relay-output/result-overlay.json
      - name: Send stored-schema result overlay and verify 144 races
        run: |
          set -euo pipefail
          oidc="$(curl --fail-with-body --silent --show-error \
            -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            -H 'Accept: application/json' \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=${G11_OIDC_AUDIENCE}")"
          token="$(printf '%s' "${oidc}" | jq -er '.value')"
          sha="$(sha256sum .relay-output/result-overlay.json | cut -d' ' -f1)"
          status="$(curl --silent --show-error --location \
            -X POST "${G11_APP_ORIGIN}/api/g11-sync" \
            -H "Authorization: Bearer ${token}" \
            -H 'Content-Type: application/json' \
            -H "x-g11-feed-sha256: ${sha}" \
            --data-binary @.relay-output/result-overlay.json \
            --output .relay-output/overlay-response.json \
            --write-out '%{http_code}')"
          if [[ ! "${status}" =~ ^2[0-9][0-9]$ ]]; then
            echo "HISTORICAL_RESULT_OVERLAY_HTTP=${status}" >&2
            jq -c . .relay-output/overlay-response.json >&2
            exit 1
          fi
          curl --fail-with-body --silent --show-error --location \
            "${G11_APP_ORIGIN}/api/g11-feed?date=2026-09-28" \
            --output .relay-output/overlay-readback.json
          python3 - <<'CHECK'
          import copy, json
          from pathlib import Path
          before=json.loads(Path('.relay-output/accepted-night.json').read_text())
          sent=json.loads(Path('.relay-output/result-overlay.json').read_text())
          after=json.loads(Path('.relay-output/overlay-readback.json').read_text())
          if after != sent or after['schema'] != before['schema'] or (
              after['source'] != before['source'] or
              len(after['final_accounting']['by_race']) != 144):
              raise SystemExit('HISTORICAL_RESULT_OVERLAY_READBACK_MISMATCH')
          stable=copy.deepcopy(after)
          stable.pop('final_accounting')
          stable['capabilities'].pop('final_accounting')
          for race in stable['races']:
              for field in ('result_status','dead_heat','trifecta_settlements'):
                  race['result_meta'].pop(field)
          if stable != before:
              raise SystemExit('HISTORICAL_PRE_RACE_OR_SCHEMA_MUTATION')
          print('HISTORICAL_RESULT_OVERLAY_READBACK=PASS:2026-09-28:144')
          CHECK
