name: P3 confidence historical backtest
on:
  push:
    branches: [research/p3-confidence-backtest-20261026]
    paths: [.github/workflows/research-p3-confidence-backtest.yml]
permissions:
  contents: read
  actions: read
concurrency:
  group: p3-confidence-backtest-20261026
  cancel-in-progress: false
jobs:
  backtest:
    if: github.ref == 'refs/heads/research/p3-confidence-backtest-20261026'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        day: ['2026-10-26']
    steps:
      - name: Checkout pinned evaluation source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: tatsuuut/boat-brain-lab
          ref: d0b55e3a3aafb26fa0a125c0121510ee022b8f92
          token: ${{secrets.G11_PRIVATE_REPO_TOKEN}}
          persist-credentials: false
          path: source
      - name: List retained cache metadata only
        env:
          GH_TOKEN: ${{github.token}}
        run: |
          gh api --paginate 'repos/tatsuuut/-g11-official-data-relay/actions/caches?per_page=100' --jq '.actions_caches[] | {id,key,ref,size_in_bytes,last_accessed_at}' > "${RUNNER_TEMP}/cache-list.jsonl"
          python3 - <<'PY'
          import json,os
          from pathlib import Path
          rows=[json.loads(l) for l in (Path(os.environ["RUNNER_TEMP"])/"cache-list.jsonl").read_text().splitlines()]
          print("P3_CACHE_METADATA_JSON="+json.dumps(rows, separators=(",",":")))
          PY
      - name: Restore existing encrypted history read only
        id: archive
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: .relay-cache/state.tgz.gpg
          key: p3-backtest-readonly-${{matrix.day}}-20261026
          restore-keys: |
            g11-state-v4-published-${{matrix.day}}-
            g11-state-v4-critical-${{matrix.day}}-
            g11-state-v4-${{matrix.day}}-
            g11-state-v3-${{matrix.day}}-
            g11-state-v2-${{matrix.day}}-
      - name: Decrypt in isolated temporary workspace
        env:
          ARCHIVE_PASSPHRASE: ${{secrets.G11_PRIVATE_REPO_TOKEN}}
        run: |
          set -euo pipefail
          umask 077
          if [ -s .relay-cache/state.tgz.gpg ]; then
            exec 3<<<"${ARCHIVE_PASSPHRASE}"
            gpg --batch --yes --pinentry-mode loopback --passphrase-fd 3 --decrypt --output "${RUNNER_TEMP}/source.tgz" .relay-cache/state.tgz.gpg
            exec 3<&-
          fi
      - name: Verify tests and backtest immutable P3 history
        env:
          PYTHONPATH: source
          MATCHED_CACHE_KEY: ${{steps.archive.outputs.cache-matched-key}}
        run: |
          python3 -m unittest g11.growth_p3.v1_1.test_confidence_historical_backtest_v1 g11.canonical.test_p3_confidence_daily_evidence g11.growth_p3.v1_1.test_confidence_current_v2 -q
          python3 - <<'PY'
          import hashlib,json,os,tarfile
          from pathlib import Path,PurePosixPath
          from g11.growth_p3.v1_1 import confidence_historical_backtest_v1 as B
          root=Path(".audit/state")
          root.mkdir(parents=True,exist_ok=True)
          archive=Path(os.environ["RUNNER_TEMP"])/"source.tgz"
          if not archive.is_file(): raise RuntimeError("RETAINED_CACHE_REQUIRED")
          with tarfile.open(archive,"r|gz") as tf:
              for m in tf:
                  p=PurePosixPath(m.name)
                  if p.is_absolute() or ".." in p.parts or m.issym() or m.islnk(): raise RuntimeError("UNSAFE_ARCHIVE")
                  n="/".join(p.parts)
                  if not m.isfile() or not n.startswith("store/archives/daily-research-"): continue
                  if m.size>100_000_000: raise RuntimeError("MEMBER_SIZE_LIMIT")
                  out=root/n
                  out.parent.mkdir(parents=True,exist_ok=True)
                  out.write_bytes(tf.extractfile(m).read())
          report=B.run(root,"2026-10-26")
          report["SOURCE_CACHE_KEY"]=os.environ.get("MATCHED_CACHE_KEY")
          report["SOURCE_ARCHIVE_SHA256"]=hashlib.sha256(archive.read_bytes()).hexdigest()
          report["REPORT_SHA256"]=hashlib.sha256(json.dumps(report,ensure_ascii=False,sort_keys=True,separators=(",",":"),allow_nan=False).encode()).hexdigest()
          print("P3_BACKTEST_JSON="+json.dumps(report,ensure_ascii=False,separators=(",",":")))
          PY
      - name: Remove temporary plaintext
        if: always()
        run: rm -rf .audit "${RUNNER_TEMP}/source.tgz"
