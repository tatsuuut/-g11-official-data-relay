name: P3 saved probability read-only export 20261110
on:
  pull_request:
    branches: [main]
    paths: ['.github/workflows/g11-p3-probability-readonly-20261110.yml']
permissions:
  contents: read
  actions: read
jobs:
  saved-probabilities:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'codex/p3-position-audit-20261110'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - day: '2026-11-09'
            key: g11-state-v4-published-2026-11-09
    steps:
      - name: Locate retained published state without changing it
        id: retained
        env:
          GH_TOKEN: ${{github.token}}
          GH_REPOSITORY: ${{github.repository}}
          REQUESTED_KEY: ${{matrix.key}}
          TARGET_DAY: ${{matrix.day}}
        run: |
          python3 - <<'PY'
          import json,os,urllib.request
          base='https://api.github.com/repos/'+os.environ['GH_REPOSITORY']+'/actions/caches?ref=refs%2Fheads%2Fmain&key=g11-state-v4-&sort=created_at&direction=desc&per_page=100'
          request=urllib.request.Request(base,headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'})
          with urllib.request.urlopen(request,timeout=60) as response: data=json.load(response)
          caches=[c for c in data['actions_caches'] if c['ref']=='refs/heads/main' and c['key'].startswith('g11-state-v4-')]
          if not caches: raise RuntimeError('No retained published main-branch cache')
          exact=[c for c in caches if c['key']==os.environ['REQUESTED_KEY']]
          same_day=[c for c in caches if os.environ['TARGET_DAY'] in c['key']]
          published=[c for c in caches if c['key'].startswith('g11-state-v4-published-')]
          day_published=[c for c in same_day if c['key'].startswith('g11-state-v4-published-')]
          selected=(exact or day_published or same_day or published)[0]
          print(json.dumps({'requested_key':os.environ['REQUESTED_KEY'],'exact_retained':bool(exact),'retained_count':data['total_count'],'retained_keys':[c['key'] for c in caches],'selected':{k:selected[k] for k in ['id','ref','key','version','created_at','size_in_bytes']}}))
          with open(os.environ['GITHUB_OUTPUT'],'a') as f: print('key='+selected['key'],file=f)
          PY
      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        id: saved
        with:
          path: .relay-cache/state.tgz.gpg
          key: ${{steps.retained.outputs.key}}
          fail-on-cache-miss: true
      - name: Require the exact selected retained archive
        env:
          EXPECTED_KEY: ${{steps.retained.outputs.key}}
          ACTUAL_KEY: ${{steps.saved.outputs.cache-matched-key}}
        run: test "${EXPECTED_KEY}" = "${ACTUAL_KEY}"
      - name: Decrypt into temporary isolated storage
        env:
          G11_PRIVATE_REPO_TOKEN: ${{secrets.G11_PRIVATE_REPO_TOKEN}}
        run: |
          set -euo pipefail
          umask 077
          sha256sum .relay-cache/state.tgz.gpg > "${RUNNER_TEMP}/source.sha256"
          exec 3<<<"${G11_PRIVATE_REPO_TOKEN}"
          gpg --batch --yes --pinentry-mode loopback --passphrase-fd 3 --decrypt --output "${RUNNER_TEMP}/saved.tgz" .relay-cache/state.tgz.gpg
          exec 3<&-
      - name: Extract existing target snapshots without executing private code
        env:
          TARGET_DAY: ${{matrix.day}}
        run: |
          set -euo pipefail
          umask 077
          cat > "${RUNNER_TEMP}/extract.py" <<'PY'
          """Read exact existing snapshots from a tar stream. No imports of prediction code."""
          import argparse
          import gzip
          import hashlib
          import json
          from pathlib import Path, PurePosixPath
          import re
          import tarfile
          
          def digest_file(path):
              h=hashlib.sha256()
              with path.open('rb') as f:
                  for b in iter(lambda:f.read(1024*1024),b''):h.update(b)
              return h.hexdigest()
          
          def extract(archive, day, output):
              if day != '2026-11-09':raise ValueError('DAY_OUT_OF_SCOPE')
              before=digest_file(archive)
              pattern=re.compile(r'(?:^|/)snapshots/(morning|predeadline)/(current-growth-p3(?:-live)?-'+day.replace('-','')+r'-[0-9]{2}-[0-9]{2})\.json$')
              support=re.compile(r'(?:^|/)(?:g11/p3-true-only-v2/'+day+r'/(?:manifest|morning-positions)\.json|daily-runtime/'+day+r'/(?:authority\.json|night-checkpoint\.json|night-feed\.json|bindings/(?:MORNING|PREDEADLINE)/[0-9a-f]{64}\.json))$')
              records=[];support_records=[];inventory=[];seen=set();total=0
              with tarfile.open(archive,mode='r|gz') as tar:
                  for member in tar:
                      m=pattern.search(member.name)
                      if member.isfile() and (day in member.name or day.replace('-','') in member.name):
                          inventory.append({'path':member.name,'size':member.size})
                      if m is None and support.search(member.name) is None:continue
                      if not member.isfile() or PurePosixPath(member.name).is_absolute() or '..' in PurePosixPath(member.name).parts:raise ValueError('UNSAFE_SNAPSHOT_MEMBER')
                      if member.name in seen:raise ValueError('DUPLICATE_MEMBER')
                      seen.add(member.name)
                      if member.size>32*1024*1024:raise ValueError('SAVED_RECORD_TOO_LARGE')
                      total+=member.size
                      if total>256*1024*1024:raise ValueError('EXPORT_TOO_LARGE')
                      data=tar.extractfile(member).read()
                      if len(data)!=member.size:raise ValueError('TRUNCATED_MEMBER')
                      value=json.loads(data)
                      if m is not None:
                          if value.get('SCHEMA')!='G11_CANONICAL_PARSED_SNAPSHOT' or value.get('STAGE')!=m[1].upper() or value.get('NAME')!=m[2]:raise ValueError('SNAPSHOT_ENVELOPE')
                          if not isinstance(value.get('PAYLOAD'),dict):raise ValueError('NO_PAYLOAD')
                      target=records if m is not None else support_records
                      target.append({'path':member.name,'sha256':hashlib.sha256(data).hexdigest(),'size':len(data),'content_utf8':data.decode('utf-8')})
              if before!=digest_file(archive):raise ValueError('ARCHIVE_CHANGED')
              if not records and not support_records:raise ValueError('NO_SAVED_SNAPSHOTS_OR_SUPPORT')
              document={'schema':'G11_P3_EXISTING_SNAPSHOT_EXPORT_V1','day':day,'archive_sha256':before,
                        'prediction_inference_executed':False,'state_writeback':False,'snapshot_count':len(records),'records':records,
                        'support_records':support_records,'target_day_inventory':inventory}
              encoded=json.dumps(document,ensure_ascii=False,separators=(',',':')).encode()
              output.write_bytes(gzip.compress(encoded,mtime=0))
              return {'day':day,'snapshot_count':len(records),'support_count':len(support_records),'export_sha256':digest_file(output),'source_unchanged':True}
          
          if __name__=='__main__':
              p=argparse.ArgumentParser();p.add_argument('--archive',type=Path,required=True);p.add_argument('--day',required=True);p.add_argument('--output',type=Path,required=True)
              a=p.parse_args();print(json.dumps(extract(a.archive,a.day,a.output)))
          PY
          python3 "${RUNNER_TEMP}/extract.py" --archive "${RUNNER_TEMP}/saved.tgz" --day "${TARGET_DAY}" --output "${RUNNER_TEMP}/p3-saved.json.gz"
          sha256sum -c "${RUNNER_TEMP}/source.sha256"
      - name: Encrypt research export for the requesting workspace
        run: |
          set -euo pipefail
          umask 077
          cat > "${RUNNER_TEMP}/reader-cert.pem" <<'CERT'
          -----BEGIN CERTIFICATE-----
          MIIERTCCAq2gAwIBAgIUBgmWDKChl/kSl8CYmPbvu5o2gBgwDQYJKoZIhvcNAQEL
          BQAwMjEwMC4GA1UEAwwnRzExIFAzIFBvc2l0aW9uIFJlYWRvbmx5IEF1ZGl0IDIw
          MjYxMTEwMB4XDTI2MTEwOTE1NTc0NFoXDTI2MTExNjE1NTc0NFowMjEwMC4GA1UE
          AwwnRzExIFAzIFBvc2l0aW9uIFJlYWRvbmx5IEF1ZGl0IDIwMjYxMTEwMIIBojAN
          BgkqhkiG9w0BAQEFAAOCAY8AMIIBigKCAYEArN9gzG9r9N6mMDRrsxlnWPXIvyAF
          VX22dVwc7R8oAevFxnw9mdTSMZbYsP9778wGGxjEjvTOvNZyy0V0XOgwF+ZZXZfr
          dPbRV0Q5JovjrUSjpRuA9DBFq3BTJHWWD6ERTCLnkTM5r+38Qi8KNk4gIV6CDq+k
          FCIEGFFBKCrr5CIpAKLYwLUZbtHaO0BdqA5Yzu1QJqh8SvsTuV1jRCB06/Q/m+Z4
          7YI79NlBjUMD2pzkmFtHbAsfufxyRXydgtXuENvFfl2pYTWDsTvG2kjTc1fVsrfK
          0aqd9F4m1L6kUVxfi2GlH2mGybDqaKKCEViSU7LSopK5Jzz0zBCxQd33rydEabaj
          nsmAaVRMgoekHqWw/EmAnD+A0YUk09YzutjcO+hw8gqUsqGsmbce2ELnKNrAQ2Sq
          o5sB5Wg/C/OqgReKiYZI8q+xSsI/dzrDSjoR2d226rX0JxpqNeQ5cduaDosmdyIO
          AVNvgVDmKaEn2rEzqRfWpd6jiuqv0Ev+JKY1AgMBAAGjUzBRMB0GA1UdDgQWBBQO
          ZSw55I7Wtzr9U3/BLBzDXCislTAfBgNVHSMEGDAWgBQOZSw55I7Wtzr9U3/BLBzD
