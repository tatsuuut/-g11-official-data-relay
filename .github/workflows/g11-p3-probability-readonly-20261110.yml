          CyWgxTmTk28KdDw7LAegaTC5dLs61EnTgJJFblUZuX4DLMAoIVE3CHRKUZ2dNZx3
          jMYrTZdJUS1s3Adn5nHggZyJFVmu6XEIF/ZI7ase0dT+26bRNm5IAJm0FNzxQHpC
          tzLxUqe5qex6o4r5yCtTGcEAzZh2QbM64IehKfI8mJmgo7nRrGf4zNI=
          -----END CERTIFICATE-----
          CERT
          openssl cms -encrypt -binary -aes-256-cbc -outform DER -in "${RUNNER_TEMP}/p3-saved.json.gz" -out "${RUNNER_TEMP}/p3-saved.cms" "${RUNNER_TEMP}/reader-cert.pem"
          rm "${RUNNER_TEMP}/p3-saved.json.gz"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: encrypted-p3-saved-${{matrix.day}}
          path: ${{runner.temp}}/p3-saved.cms
          if-no-files-found: error
          retention-days: 3
          compression-level: 0
      - name: Transport encrypted audit bytes through read-only job logs
        env:
          TARGET_DAY: ${{matrix.day}}
        run: |
          python3 - <<'PY'
          import os,base64,hashlib,pathlib
          value=(pathlib.Path(os.environ['RUNNER_TEMP'])/'p3-saved.cms').read_bytes()
          print('G11_ENCRYPTED_AUDIT_BEGIN '+os.environ['TARGET_DAY']+' '+hashlib.sha256(value).hexdigest())
          b=base64.b64encode(value).decode()
          for i in range(0,len(b),2000): print('G11_ENCRYPTED_AUDIT_DATA '+b[i:i+2000])
          print('G11_ENCRYPTED_AUDIT_END')
          PY
      - name: Remove temporary plaintext
        if: always()
        run: rm -f "${RUNNER_TEMP}/saved.tgz" "${RUNNER_TEMP}/p3-saved.json.gz"
