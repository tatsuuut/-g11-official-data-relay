name: G11 rescue fake WILD4 display audit

on:
  pull_request:
    paths:
      - ".github/workflows/g11-rescue-fake-wild4-display-audit.yml"

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout relay
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Checkout private rescue fix branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: tatsuuut/boat-brain-lab
          ref: fix/rescue-fake-wild4-display-v1
          token: ${{ secrets.G11_PRIVATE_REPO_TOKEN }}
          path: .g11-private
          fetch-depth: 1

      - name: Install dependencies
        run: python3 -m pip install --disable-pip-version-check --no-input 'lxml==6.1.1'

      - name: Compile and test rescue display fix
        working-directory: .g11-private
        run: |
          python3 -m compileall -q g11/relay/rescue_v1.py g11/relay/nonresearch_feed_v1.py
          python3 -m unittest -v g11.relay.test_rescue_fake_wild4_display_v1
          python3 -m unittest -v g11.relay.test_v1
