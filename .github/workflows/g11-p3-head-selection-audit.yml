          CERT
          python3 - <<'PY'
          import base64,gzip,hashlib,json,os,pathlib,subprocess
          root=pathlib.Path(os.environ['RUNNER_TEMP'])
          report=root/'p3-head-selection-report.json'
          if not report.is_file():
              print('No completed research observations')
              raise SystemExit(0)
          packed=root/'p3-head-report.json.gz';packed.write_bytes(gzip.compress(report.read_bytes()))
          encrypted=root/'p3-head-report.cms'
          subprocess.run(['openssl','cms','-encrypt','-binary','-aes256','-outform','DER','-in',str(packed),'-out',str(encrypted),str(root/'p3-audit-cert.pem')],check=True)
          data=encrypted.read_bytes()
          print('G11_AUDIT_ENCRYPTED_V1='+json.dumps({'day':os.environ['G11_AUDIT_DAY'],'sha256':hashlib.sha256(data).hexdigest(),'data':base64.b64encode(data).decode()}))
          PY
