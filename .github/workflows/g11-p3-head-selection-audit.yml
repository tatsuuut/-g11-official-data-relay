name: P3 saved head and ticket selection audit
on:
  pull_request:
    branches: [main]
    paths: ['.github/workflows/g11-p3-head-selection-audit.yml']
permissions:
  contents: read
jobs:
  p3-head-selection:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'codex/p3-head-selection-fix-20261110'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: .relay-cache/state.tgz.gpg
          key: g11-state-v4-published-2026-11-10-p3-head-audit
          restore-keys: g11-state-v4-published-2026-11-10-
          fail-on-cache-miss: true
      - name: Extract disposable saved state
        env:
          G11_PRIVATE_REPO_TOKEN: ${{secrets.G11_PRIVATE_REPO_TOKEN}}
        run: |
          set -euo pipefail
          exec 3<<<"${G11_PRIVATE_REPO_TOKEN}"
          gpg --batch --yes --pinentry-mode loopback --passphrase-fd 3 --decrypt --output "${RUNNER_TEMP}/p3-head-state.tgz" .relay-cache/state.tgz.gpg
          exec 3<&-
          python3 - <<'PY'
          import os,pathlib,sys
          sys.path.insert(0,'scripts')
          from extract_runtime_state_v1 import extract_complete_state
          root=pathlib.Path(os.environ['RUNNER_TEMP'])
          extract_complete_state(root/'p3-head-state.tgz',root/'p3-head-audit')
          PY
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: ${{secrets.PRIVATE_SOURCE_REPO}}
          ref: b2b7da07c43ce1d8980cc59995697eaa14255f20
          token: ${{secrets.G11_PRIVATE_REPO_TOKEN}}
          path: candidate
          persist-credentials: false
      - name: Install fixed audit dependencies
        run: python3 -m pip install --disable-pip-version-check --no-input 'catboost==1.2.8' 'lxml==6.1.1'
      - name: Test attribution and existing pinned prediction contracts
        working-directory: candidate
        env:
          PYTHONPATH: .
        run: |
          python3 -m unittest \
            g11.growth_p3.v1_1.test_head_selection_diagnostics_v1 \
            g11.growth_p3.v1_1.test_racer_tactical_outlook_v1 \
            g11.growth_p3.v1_1.test_true_only_models_v2 \
            g11.growth_p3.v1_1.test_p3_racer_runtime_v1 \
            g11.growth_p3.v1_1.test_true_official_missing_st_v1 \
            g11.growth_p3.v1_1.test_current_runtime_v1
      - name: Audit frozen outputs without regenerating predictions
        id: analyze
        working-directory: candidate
        env:
          PYTHONPATH: .
        run: |
          python3 tools/audit_p3_head_selection_v1.py \
            --state "${RUNNER_TEMP}/p3-head-audit" \
            --cohort g11/growth_p3/v1_1/audits/head_selection_20261110/cohort.json \
            --output "${RUNNER_TEMP}/p3-head-selection-report.json"
      - name: Save detailed research only to the isolated private branch
        if: always() && steps.analyze.outcome != 'skipped'
        env:
          G11_PRIVATE_REPO_TOKEN: ${{secrets.G11_PRIVATE_REPO_TOKEN}}
          G11_AUDIT_REPO: tatsuuut/boat-brain-lab
          G11_AUDIT_BRANCH: codex/p3-head-selection-fix-20261110
          G11_EXPECTED_AUDIT_SHA: b2b7da07c43ce1d8980cc59995697eaa14255f20
        run: |
          python3 - <<'PY'
          import json,os,pathlib,urllib.request
          report=pathlib.Path(os.environ['RUNNER_TEMP'])/'p3-head-selection-report.json'
          if not report.is_file():
              print('No completed research report to retain')
              raise SystemExit(0)
          repo=os.environ['G11_AUDIT_REPO'];branch=os.environ['G11_AUDIT_BRANCH']
          expected=os.environ['G11_EXPECTED_AUDIT_SHA']
          base='https://api.github.com/repos/'+repo
          def api(route,data=None,method=None):
              req=urllib.request.Request(base+route,data=None if data is None else json.dumps(data).encode(),method=method,headers={'Authorization':'Bearer '+os.environ['G11_PRIVATE_REPO_TOKEN'],'Accept':'application/vnd.github+json','Content-Type':'application/json'})
              with urllib.request.urlopen(req,timeout=45)as res:return json.load(res)
          head=api('/git/ref/heads/'+branch)['object']['sha']
          if head!=expected:raise SystemExit('Private analysis branch moved; refusing overwrite')
          tree=api('/git/commits/'+head)['tree']['sha']
          target='g11/growth_p3/v1_1/audits/head_selection_20261110/report.json'
          created=api('/git/trees',{'base_tree':tree,'tree':[{'path':target,'mode':'100644','type':'blob','content':report.read_text()}]})
          commit=api('/git/commits',{'message':'Retain read-only saved P3 head selection attribution','tree':created['sha'],'parents':[head]})
          api('/git/refs/heads/'+branch,{'sha':commit['sha'],'force':False},method='PATCH')
          print(json.dumps({'private_report_saved':True,'commit':commit['sha']}))
          PY
