name: P3 saved head and ticket selection audit
on:
  pull_request:
    branches: [main]
    paths: ['.github/workflows/g11-p3-head-selection-audit.yml']
permissions:
  contents: read
jobs:
  p3-head-selection:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'codex/p3-head-selection-fix-20261110'
    strategy:
      fail-fast: false
      matrix:
        day: ['2026-11-10']
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: .relay-cache/state.tgz.gpg
          key: g11-state-v4-published-${{matrix.day}}-p3-head-audit
          restore-keys: |
            g11-state-v4-published-${{matrix.day}}-
            g11-state-v4-critical-${{matrix.day}}-
            g11-state-v3-${{matrix.day}}-
            g11-state-v4-published-2026-11-10-
          fail-on-cache-miss: true
      - name: Extract disposable saved state
        env:
          G11_PRIVATE_REPO_TOKEN: ${{secrets.G11_PRIVATE_REPO_TOKEN}}
        run: |
          set -euo pipefail
          exec 3<<<"${G11_PRIVATE_REPO_TOKEN}"
          gpg --batch --yes --pinentry-mode loopback --passphrase-fd 3 --decrypt --output "${RUNNER_TEMP}/p3-head-state.tgz" .relay-cache/state.tgz.gpg
          exec 3<&-
          python3 - <<'PY'
          import os,pathlib,sys
          sys.path.insert(0,'scripts')
          from extract_runtime_state_v1 import extract_complete_state
          root=pathlib.Path(os.environ['RUNNER_TEMP'])
          extract_complete_state(root/'p3-head-state.tgz',root/'p3-head-audit')
          PY
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: ${{secrets.PRIVATE_SOURCE_REPO}}
          ref: bc4a9f4fb1d21717781ef0f2c8a8a47c882a35ad
          token: ${{secrets.G11_PRIVATE_REPO_TOKEN}}
          path: candidate
          persist-credentials: false
      - name: Install fixed audit dependencies
        run: python3 -m pip install --disable-pip-version-check --no-input 'catboost==1.2.8' 'lxml==6.1.1'
      - name: Test attribution and existing pinned prediction contracts
        working-directory: candidate
        env:
          PYTHONPATH: .
        run: |
          python3 -m unittest \
            g11.growth_p3.v1_1.test_head_selection_diagnostics_v1 \
            g11.growth_p3.v1_1.test_racer_tactical_outlook_v1 \
            g11.growth_p3.v1_1.test_true_only_models_v2 \
            g11.growth_p3.v1_1.test_p3_racer_runtime_v1 \
            g11.growth_p3.v1_1.test_true_official_missing_st_v1 \
            g11.growth_p3.v1_1.test_current_runtime_v1 \
            g11.canonical.test_p3_confidence_daily_evidence \
            g11.growth_p3.v1_1.test_confidence_current_v2 \
            g11.growth_p3.v1_1.test_confidence_night_research_v1
      - name: Audit frozen outputs without regenerating predictions
        id: analyze
        working-directory: candidate
        env:
          PYTHONPATH: .
        run: |
          python3 tools/audit_p3_head_selection_v1.py \
            --state "${RUNNER_TEMP}/p3-head-audit" \
            --day all \
            --capture-retained-day "${{matrix.day}}" \
            --cohort g11/growth_p3/v1_1/audits/head_selection_20261110/cohort.json \
            --output "${RUNNER_TEMP}/p3-head-selection-report.json"
      - name: Encrypt detailed read-only observations for this analysis
        if: always() && steps.analyze.outcome != 'skipped'
        env:
          G11_AUDIT_DAY: ${{matrix.day}}
        run: |
          cat > "${RUNNER_TEMP}/p3-audit-cert.pem" <<'CERT'
          -----BEGIN CERTIFICATE-----
          MIIEGzCCAoOgAwIBAgIUEnfzEu2wr3OkjbMhSysKe8dx5agwDQYJKoZIhvcNAQEL
          BQAwHTEbMBkGA1UEAwwSRzExLWlzb2xhdGVkLWF1ZGl0MB4XDTI2MTExMDA1NTQ1
          NFoXDTI2MTExMTA1NTQ1NFowHTEbMBkGA1UEAwwSRzExLWlzb2xhdGVkLWF1ZGl0
          MIIBojANBgkqhkiG9w0BAQEFAAOCAY8AMIIBigKCAYEAs7glCfEN9G6gtZ1b1Xvw
          X5AhFduMUscCJB6TjR9nrpmUkAyC6ycWlEHY5X+yHpuhNVirkvZs88iAyEqb9toO
          hyxTmiVt9VQuRH/JOadCq+IMR4LldQsrcnp2ohIcrrdsEq1Mm0xIYE/gHSlIeYTq
