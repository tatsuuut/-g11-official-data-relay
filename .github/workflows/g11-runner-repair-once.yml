name: G11 runner repair once

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/g11-runner-repair-once.yml

permissions:
  contents: write

jobs:
  repair:
    if: github.repository == 'tatsuuut/-g11-official-data-relay' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout relay
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 1

      - name: Apply bounded repair and remove one-shot workflow
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('.github/workflows/g11-free-runner.yml')
          text = path.read_text(encoding='utf-8')
          replacements = (
              (
                  '          python3 -m g11.relay.v1 "${args[@]}" | tee ../.relay-output/result.json\n',
                  '          python3 -m g11.relay.bootstrap_v1 "${args[@]}" | tee ../.relay-output/result.json\n',
              ),
              (
                  "        if: success() && steps.due.outputs.phase == 'predeadline'\n",
                  "        if: success() && steps.runtime.outcome == 'success' && steps.due.outputs.phase == 'predeadline'\n",
              ),
          )
          for old, new in replacements:
              if text.count(old) != 1:
                  raise SystemExit(f'bounded replacement precondition failed: {old!r}')
              text = text.replace(old, new, 1)
          path.write_text(text, encoding='utf-8')
          PY
          rm .github/workflows/g11-runner-repair-once.yml
          git config user.name 'g11-runner-repair'
          git config user.email 'g11-runner-repair@users.noreply.github.com'
          git add .github/workflows/g11-free-runner.yml .github/workflows/g11-runner-repair-once.yml
          git diff --cached --check
          git diff --cached -- .github/workflows/g11-free-runner.yml
          git commit -m 'Repair fresh morning bootstrap and failed relay chaining'
          git push origin HEAD:main
