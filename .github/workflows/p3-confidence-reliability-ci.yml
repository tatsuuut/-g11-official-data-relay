name: P3 confidence reliability diagnostics CI

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/p3-confidence-reliability-ci.yml

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout private reliability branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: ${{ secrets.PRIVATE_SOURCE_REPO }}
          ref: research/p3-confidence-reliability-v1
          token: ${{ secrets.G11_PRIVATE_REPO_TOKEN }}
          persist-credentials: false
          fetch-depth: 1
      - name: Compile and test reliability diagnostics
        run: |
          set -euo pipefail
          python3 -m py_compile g11/growth_p3/v1_1/confidence_reliability_diagnostics_v1.py
          python3 -m py_compile g11/growth_p3/v1_1/test_confidence_reliability_diagnostics_v1.py
          python3 -m unittest g11.growth_p3.v1_1.test_confidence_reliability_diagnostics_v1 -v
      - name: Produce real 9/29 descriptive baseline
        run: |
          set -euo pipefail
          python3 -m g11.growth_p3.v1_1.confidence_reliability_diagnostics_v1 \
            --output /tmp/reliability.json | tee /tmp/reliability-summary.txt
          python3 - <<'PY'
          import json
          v=json.load(open("/tmp/reliability.json"))
          assert v["TOTAL_RECORDS"]==238
          assert v["DISTINCT_DAYS"]==["2026-09-29"]
          assert v["STATUS"]=="DESCRIPTIVE_ONLY_NO_CALIBRATION_FIT"
          assert v["CALIBRATION_TABLE_FITTED"] is False
          assert v["CALIBRATION_VERSION_WRITTEN"] is False
          assert v["GRADE_BOUNDARIES_WRITTEN"] is False
          assert v["FORMAL_CERTIFICATION_ISSUED"] is False
          print(json.dumps({
            "POOLED":v["POOLED"],
            "UNITS":v["UNITS"],
          },ensure_ascii=False,sort_keys=True))
          PY
