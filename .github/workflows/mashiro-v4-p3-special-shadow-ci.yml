name: Mashiro V4 P3 special shadow CI

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/mashiro-v4-p3-special-shadow-ci.yml

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout private Mashiro V4 shadow branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: ${{ secrets.PRIVATE_SOURCE_REPO }}
          ref: research/mashiro-v4-p3-special-shadow-20260930
          token: ${{ secrets.G11_PRIVATE_REPO_TOKEN }}
          persist-credentials: false
          fetch-depth: 1
      - name: Compile and run Mashiro V4/P3-special tests
        run: |
          set -euo pipefail
          python3 -m py_compile g11/research/mashiro_giant_kill/v1/prospective_exhibition4_v4.py
          python3 -m py_compile g11/research/mashiro_giant_kill/v1/p3_special_shadow_v1.py
          python3 -m py_compile g11/research/mashiro_giant_kill/v1/test_p3_special_shadow_v1.py
          python3 -m unittest g11.research.mashiro_giant_kill.v1.test_p3_special_shadow_v1 -v
      - name: Prove production authority remains zero
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from g11.research.mashiro_giant_kill.v1 import p3_special_shadow_v1 as S
          r=S.empty_registry()
          assert r["STATUS"]=="UNSET"
          assert r["PRODUCTION_AUTHORITY"] is False
          assert S.SPECIAL_CASE_ID=="G11_P3_SPECIAL_MASHIRO_V1"
          assert "FIXED_BET_SET_OVERRIDE" in S.ALLOWED_MUTATION_MODES
          print("MASHIRO_P3_SPECIAL_SHADOW_CONTRACT=PASS")
          PY
