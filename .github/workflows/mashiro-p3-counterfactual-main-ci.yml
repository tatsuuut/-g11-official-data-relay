name: Mashiro dormant P3 counterfactual CI

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/mashiro-p3-counterfactual-main-ci.yml

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout private counterfactual-main branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: ${{ secrets.PRIVATE_SOURCE_REPO }}
          ref: research/mashiro-p3-counterfactual-main-v1
          token: ${{ secrets.G11_PRIVATE_REPO_TOKEN }}
          persist-credentials: false
          fetch-depth: 1
      - name: Compile and test dormant counterfactual
        run: |
          set -euo pipefail
          python3 -m py_compile g11/growth_p3/v1_1/mashiro_p3_counterfactual_v1.py
          python3 -m py_compile g11/growth_p3/v1_1/test_mashiro_p3_counterfactual_v1.py
          python3 -m unittest g11.growth_p3.v1_1.test_mashiro_p3_counterfactual_v1 -v
      - name: Prove no CURRENT runtime import hook
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          runtime=Path("g11/growth_p3/v1_1/current_runtime_v1.py").read_text()
          cf=Path("g11/growth_p3/v1_1/mashiro_p3_counterfactual_v1.py").read_text()
          assert "mashiro_p3_counterfactual_v1" not in runtime
          assert '"PRODUCTION_AUTHORITY":False' in cf
          assert '"RESULT_INPUT_USED":False' in cf
          print("MASHIRO_COUNTERFACTUAL_DORMANT=PASS")
          PY
