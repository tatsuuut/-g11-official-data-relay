              "SCHEMA":"G11_WILD4_HISTORICAL_FAST_CROSSFIT_MERGE_V1",
              "STATUS":"PASS",
              "MINIMUM_PRIOR_RACES":5000,
              "FOLD_COUNT":9,
              "GENERATED_PACKET_RACES":9136,
              "ARTIFACT_SHA256":hashlib.sha256(data).hexdigest(),
              "DATA_LEAK_COUNT":0,
              "RESULT_USED_AS_PREDICTION_FEATURE":False,
              "ODDS_USED_AS_UPSTREAM_POSITION_FEATURE":False,
              "P3_USED_AS_FEATURE":False,
              "PRODUCTION_MUTATED":False,
          }
          (out/"historical-crossfit-audit.json").write_text(
              json.dumps(summary,ensure_ascii=False,sort_keys=True,separators=(",",":"))+"\n",
              encoding="utf-8",
          )
          print("WILD4_FAST_FINAL_MERGE",len(records))
          PY
          python3 -m g11.wild_pack.v1.wild_bet_bootstrap_v1 build-dataset \
            --public-repo "${PUBLIC}" \
            --upstream "${OUT}/historical-upstream-packets.json.gz" \
            --contract g11/wild_pack/v1/BET_MODEL_CONTRACT_V1.json \
            --output-dir "${OUT}/eligible"
          python3 - "${OUT}" <<'PY'
          import json,pathlib,sys
          out=pathlib.Path(sys.argv[1])
          audit=json.loads((out/"eligible/wild-bet-eligible-readback-audit.json").read_text())
          assert audit["FORMAL_WILD_BET_ELIGIBLE_RACES"] == 9119
          assert audit["DATA_LEAK_COUNT"] == 0
          assert audit["RESULT_USED_AS_PREDICTION_FEATURE"] is False
          assert audit["PAYOUT_USED_AS_PREDICTION_FEATURE"] is False
          assert audit["P3_USED_AS_FEATURE"] is False
          value={
              "SCHEMA":"G11_WILD4_HISTORICAL_FAST_BACKFILL_AUDIT_V1",
              "STATUS":"PASS",
              "MINIMUM_PRIOR_RACES":5000,
              "GENERATED_UPSTREAM_PACKETS":9136,
              "FORMAL_ELIGIBLE_RACES":9119,
              "TARGET_RACES":10000,
              "REMAINING_TO_10000":881,
              "REJECTED":audit["REJECTED"],
              "DATA_LEAK_COUNT":0,
              "RESULT_USED_AS_PREDICTION_FEATURE":False,
              "PAYOUT_USED_AS_PREDICTION_FEATURE":False,
              "P3_USED_AS_FEATURE":False,
              "PRODUCTION_MUTATED":False,
          }
          (out/"fast-backfill-audit.json").write_text(
              json.dumps(value,ensure_ascii=False,sort_keys=True,separators=(",",":"))+"\n",
              encoding="utf-8",
          )
          print("WILD4_FAST_FINAL="+json.dumps(value,ensure_ascii=False,sort_keys=True))
          PY

      - name: Verify historical fast-lane contracts
        working-directory: private
        run: |
          python3 -m unittest \
            g11.wild_pack.v1.test_historical_upstream_crossfit_v1 \
            g11.wild_pack.v1.test_wild_bet_bootstrap_v1 \
            g11.wild_pack.v1.test_bet_oos_collection_v1

      - name: Install expanded bootstrap into encrypted authority
        working-directory: private
        env:
          OUT: ${{ runner.temp }}/wild4-final
          STATE: ${{ github.workspace }}/.relay-state/store
        run: |
          set -euo pipefail
          python3 -m g11.wild_pack.v1.chunked_artifact_v1 \
            "${OUT}/eligible/wild-bet-eligible-dataset.json.gz" \
            "${OUT}/eligible" >/dev/null
          rm "${OUT}/eligible/wild-bet-eligible-dataset.json.gz"
          target="${STATE}/g11/wild-pack-oos/morning/bootstrap"
          mkdir -p "${target}"
          rm -f "${target}"/wild-bet-eligible-dataset.json.gz \
                "${target}"/wild-bet-eligible-dataset.json.gz.part* \
                "${target}"/wild-bet-eligible-dataset.json.gz.parts.json
          cp "${OUT}/eligible"/wild-bet-eligible-dataset.json.gz.part* "${target}/"
          cp "${OUT}/eligible/wild-bet-eligible-dataset.json.gz.parts.json" "${target}/"
          cp "${OUT}/eligible/wild-bet-eligible-dataset.manifest.json" "${target}/"
          cp "${OUT}/eligible/wild-bet-eligible-readback-audit.json" "${target}/"
          cp "${OUT}/historical-crossfit-audit.json" "${target}/"
          mkdir -p "${STATE}/g11/wild-pack-audits"
          cp "${OUT}/fast-backfill-audit.json" \
             "${STATE}/g11/wild-pack-audits/WILD4_HISTORICAL_FAST_BACKFILL_20260921.json"
          python3 - "${STATE}" <<'PY'
          import json,pathlib,sys
          from g11.wild_pack.v1 import bet_oos_collection_v1 as wild_bet
          root=pathlib.Path(sys.argv[1])/"g11/wild-pack-oos/morning"
          status=wild_bet.status(root)
          assert status["HISTORICAL_FULLY_OOS_ELIGIBLE_RACES"] == 9119
          assert status["BET_ELIGIBLE_RACES"] >= 9119
          assert status["TARGET_RACES"] == 10000
          assert status["REMAINING_RACES"] <= 881
          assert status["P3_MUTATED"] is False
          wild_bet._write_json_atomic(root/"bet-status.json",status)
          print("WILD4_ENCRYPTED_AUTHORITY="+json.dumps({
              "BET_ELIGIBLE_RACES":status["BET_ELIGIBLE_RACES"],
              "HISTORICAL_FULLY_OOS_ELIGIBLE_RACES":status["HISTORICAL_FULLY_OOS_ELIGIBLE_RACES"],
              "PROSPECTIVE_FULLY_OOS_ELIGIBLE_RACES":status["PROSPECTIVE_FULLY_OOS_ELIGIBLE_RACES"],
              "REMAINING_RACES":status["REMAINING_RACES"],
          },sort_keys=True))
          PY

      - name: Encrypt expanded production state
        env:
          G11_PRIVATE_REPO_TOKEN: ${{ secrets.G11_PRIVATE_REPO_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p .relay-cache
          temporary=.relay-cache/state.tgz.gpg.tmp
          exec 3<<<"${G11_PRIVATE_REPO_TOKEN}"
          tar -czf - -C .relay-state . | \
            gpg --batch --yes --pinentry-mode loopback --passphrase-fd 3 \
              --symmetric --cipher-algo AES256 --output "${temporary}"
          exec 3<&-
          mv "${temporary}" .relay-cache/state.tgz.gpg
          test -s .relay-cache/state.tgz.gpg

      - name: Save expanded encrypted authority
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: .relay-cache/state.tgz.gpg
          key: g11-state-v2-${{ env.STATE_DATE }}-${{ github.run_id }}-wild4-fast

      - name: Dispatch production readback
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl --fail-with-body --silent --show-error \
            -X POST \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/g11-free-runner.yml/dispatches" \
            -d '{"ref":"main","inputs":{"phase":"predeadline"}}'
