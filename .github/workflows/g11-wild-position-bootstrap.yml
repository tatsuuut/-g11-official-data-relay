name: G11 Wild conditional position bootstrap

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/g11-wild-position-bootstrap.yml
  workflow_dispatch:
    inputs:
      source_state_cache_key:
        description: Existing encrypted Wild position state to verify and rebind; blank trains a new artifact
        required: false
        default: ""
        type: string

permissions:
  actions: write
  contents: read

concurrency:
  group: g11-wild-conditional-position-bootstrap
  cancel-in-progress: false

jobs:
  train-freeze-and-encrypt:
    if: github.repository == 'tatsuuut/-g11-official-data-relay' && github.ref == 'refs/heads/main' && (github.event_name != 'push' || (!contains(github.event.head_commit.message, '[wild4-fast]') && !contains(github.event.head_commit.message, '[wild-head-repair]')))
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      G11_PRIVATE_REPOSITORY: tatsuuut/boat-brain-lab
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUNBUFFERED: "1"
      TZ: Asia/Tokyo

    steps:
      - name: Checkout relay authority
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false

      - name: Resolve the encrypted state date
        id: state-date
        run: |
          set -euo pipefail
          if [ "$(date +%H)" -lt 5 ]; then
            state_date="$(date --date='yesterday' +%F)"
          else
            state_date="$(date +%F)"
          fi
          printf 'state_date=%s\n' "${state_date}" >> "${GITHUB_OUTPUT}"

      - name: Restore latest encrypted runtime state
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: .relay-cache/state.tgz.gpg
          key: ${{ inputs.source_state_cache_key || format('g11-state-v2-{0}-{1}-wild-position', steps.state-date.outputs.state_date, github.run_id) }}
          restore-keys: |
            g11-state-v2-${{ steps.state-date.outputs.state_date }}-
            g11-state-v2-

      - name: Require the existing private read credential
        env:
          G11_PRIVATE_REPO_TOKEN: ${{ secrets.G11_PRIVATE_REPO_TOKEN }}
        run: test -n "${G11_PRIVATE_REPO_TOKEN}"

      - name: Decrypt and validate inherited state
        env:
          G11_PRIVATE_REPO_TOKEN: ${{ secrets.G11_PRIVATE_REPO_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p .relay-state
          encrypted=.relay-cache/state.tgz.gpg
          if [ ! -f "${encrypted}" ]; then
            exit 0
          fi
          archive="${RUNNER_TEMP}/g11-relay-state.tgz"
          exec 3<<<"${G11_PRIVATE_REPO_TOKEN}"
          gpg --batch --yes --pinentry-mode loopback --passphrase-fd 3 \
            --decrypt --output "${archive}" "${encrypted}"
          exec 3<&-
          python3 - "${archive}" <<'PY'
          import pathlib
          import sys
          import tarfile

          archive = pathlib.Path(sys.argv[1])
          with tarfile.open(archive, "r:gz") as handle:
              members = handle.getmembers()
              if not members:
                  raise SystemExit("G11_RELAY_EMPTY_STATE_ARCHIVE")
              for member in members:
                  path = pathlib.PurePosixPath(member.name)
                  if path.is_absolute() or ".." in path.parts or member.issym() or member.islnk():
                      raise SystemExit("G11_RELAY_UNSAFE_STATE_ARCHIVE")
              handle.extractall(".relay-state", filter="data")
          PY

      - name: Checkout private model authority
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: ${{ env.G11_PRIVATE_REPOSITORY }}
          ref: main
          token: ${{ secrets.G11_PRIVATE_REPO_TOKEN }}
          path: .g11-private
          persist-credentials: false
          fetch-depth: 1

      - name: Checkout public official-source history
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: BoatraceCSV/boatracecsv.github.io
          ref: fea7ba7d5c09ff2019adb0461bb91081fe57144f
          path: .public-data
          persist-credentials: false
          fetch-depth: 0

      - name: Checkout reusable runtime model assets
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: ${{ env.G11_PRIVATE_REPOSITORY }}
          ref: g11-runtime
          token: ${{ secrets.G11_PRIVATE_REPO_TOKEN }}
          path: .g11-runtime-source
          persist-credentials: false
          fetch-depth: 1

      - name: Align reusable MORNING model bytes with their frozen registries
        run: |
          set -euo pipefail
          source_root="${GITHUB_WORKSPACE}/.g11-runtime-source/g11/wild-pack-models/morning"
          state_root="${GITHUB_WORKSPACE}/.relay-state/store/g11/wild-pack-models/morning"
          for wild_id in WILD_SECOND WILD_THIRD; do
            if [ -d "${source_root}/${wild_id}" ] && [ -d "${state_root}/${wild_id}" ]; then
              rsync -a "${source_root}/${wild_id}/" "${state_root}/${wild_id}/"
            fi
          done

      - name: Install the pinned existing backend
        run: python3 -m pip install --disable-pip-version-check --no-input 'catboost==1.2.8'

      - name: Verify conditional model contracts
        working-directory: .g11-private
        run: |
          python3 -m unittest \
            g11.wild_pack.v1.test_governance_v1 \
            g11.wild_pack.v1.test_public_position_bootstrap_v1 \
            g11.wild_pack.v1.test_runtime_collection_v1 \
            g11.wild_pack.v1.test_conditional_position_model_v1

      - name: Detect reusable MORNING model state
        id: existing
        shell: bash
        run: |
          root=.relay-state/store/g11/wild-pack-models/morning
          reusable=false
          if [ -s "${root}/manifest.json" ] \
            && [ -s "${root}/WILD_SECOND/model.cbm" ] \
            && [ -s "${root}/WILD_THIRD/model.cbm" ]; then
            reusable=true
          fi
          echo "morning=${reusable}" >> "${GITHUB_OUTPUT}"

      - name: Rebuild the hash-bound factual dataset
        if: steps.existing.outputs.morning != 'true'
        working-directory: .g11-private
        env:
          BOOTSTRAP_ROOT: ${{ runner.temp }}/g11-wild-position
        run: |
          set -euo pipefail
          mkdir -p "${BOOTSTRAP_ROOT}"
          python3 -m g11.true_ai.v1.src.public_backfill_v1 \
            --public-repo "${GITHUB_WORKSPACE}/.public-data" \
            --dataset-output "${BOOTSTRAP_ROOT}/head-dataset.json" \
            --audit-output "${BOOTSTRAP_ROOT}/head-audit.json" \
            --end 2026-09-19
          python3 -m g11.wild_pack.v1.public_position_bootstrap_v1 \
            --head-dataset "${BOOTSTRAP_ROOT}/head-dataset.json" \
            --public-repo "${GITHUB_WORKSPACE}/.public-data" \
            --overlay-output "${BOOTSTRAP_ROOT}/position-overlay.json" \
            --audit-output "${BOOTSTRAP_ROOT}/position-audit.json"
          python3 -m g11.wild_pack.v1.conditional_position_model_v1 verify \
            --dataset "${BOOTSTRAP_ROOT}/head-dataset.json" \
            --overlay "${BOOTSTRAP_ROOT}/position-overlay.json" \
            --contract g11/wild_pack/v1/POSITION_MODEL_CONTRACT_V1.json

      - name: Train and freeze WILD SECOND and THIRD
        if: steps.existing.outputs.morning != 'true'
        working-directory: .g11-private
        env:
          BOOTSTRAP_ROOT: ${{ runner.temp }}/g11-wild-position
          MODEL_ROOT: ${{ github.workspace }}/.relay-state/store/g11/wild-pack-models/morning
        run: |
          set -euo pipefail
          source_sha="$(git rev-parse HEAD)"
          rm -rf "${MODEL_ROOT}.candidate"
          mkdir -p "${MODEL_ROOT}.candidate/WILD_SECOND" "${MODEL_ROOT}.candidate/WILD_THIRD"
          for wild_id in WILD_SECOND WILD_THIRD; do
            python3 -m g11.wild_pack.v1.conditional_position_model_v1 train \
              --dataset "${BOOTSTRAP_ROOT}/head-dataset.json" \
              --overlay "${BOOTSTRAP_ROOT}/position-overlay.json" \
              --contract g11/wild_pack/v1/POSITION_MODEL_CONTRACT_V1.json \
              --wild-id "${wild_id}" \
              --output-dir "${MODEL_ROOT}.candidate/${wild_id}" \
              --code-commit "${source_sha}"
          done
          cp g11/wild_pack/v1/POSITION_MODEL_CONTRACT_V1.json "${MODEL_ROOT}.candidate/"
          cp "${BOOTSTRAP_ROOT}/head-audit.json" "${MODEL_ROOT}.candidate/"
          cp "${BOOTSTRAP_ROOT}/position-audit.json" "${MODEL_ROOT}.candidate/"

      - name: Prove full 30 and 120 path inference
        if: steps.existing.outputs.morning != 'true'
        working-directory: .g11-private
        env:
          BOOTSTRAP_ROOT: ${{ runner.temp }}/g11-wild-position
          MODEL_ROOT: ${{ github.workspace }}/.relay-state/store/g11/wild-pack-models/morning.candidate
        run: |
          set -euo pipefail
          race_id="$(jq -r '.SPLIT_RACE_IDS.FUTURE_HOLDOUT[0]' "${BOOTSTRAP_ROOT}/position-overlay.json")"
          for wild_id in WILD_SECOND WILD_THIRD; do
            python3 -m g11.wild_pack.v1.conditional_position_model_v1 predict \
              --dataset "${BOOTSTRAP_ROOT}/head-dataset.json" \
              --overlay "${BOOTSTRAP_ROOT}/position-overlay.json" \
              --contract g11/wild_pack/v1/POSITION_MODEL_CONTRACT_V1.json \
              --wild-id "${wild_id}" \
              --model-dir "${MODEL_ROOT}/${wild_id}" \
              --registry "${MODEL_ROOT}/${wild_id}/registry-entry.json" \
              --race-id "${race_id}" \
              --output "${MODEL_ROOT}/${wild_id}/inference-readback.json"
          done
          jq -e '.STATUS == "SHADOW_PREDICTION_LOCKED" and .GROUP_COUNT == 6 and .PATH_COUNT == 30 and .MID_PATH_PRUNING_COUNT == 0 and .PRODUCTION_MUTATED == false' \
            "${MODEL_ROOT}/WILD_SECOND/inference-readback.json" >/dev/null
          jq -e '.STATUS == "SHADOW_PREDICTION_LOCKED" and .GROUP_COUNT == 30 and .PATH_COUNT == 120 and .MID_PATH_PRUNING_COUNT == 0 and .PRODUCTION_MUTATED == false' \
            "${MODEL_ROOT}/WILD_THIRD/inference-readback.json" >/dev/null

      - name: Build and verify the immutable model manifest
        if: steps.existing.outputs.morning != 'true'
        working-directory: .g11-private
        env:
          MODEL_ROOT: ${{ github.workspace }}/.relay-state/store/g11/wild-pack-models/morning.candidate
        run: |
          set -euo pipefail
          python3 - "${MODEL_ROOT}" "$(git rev-parse HEAD)" <<'PY'
          import hashlib
          import json
          import pathlib
          import sys

          root = pathlib.Path(sys.argv[1])
          source_sha = sys.argv[2]
          def load(path):
              return json.loads(path.read_text(encoding="utf-8"))
          def file_sha(path):
              digest = hashlib.sha256()
              with path.open("rb") as handle:
                  for chunk in iter(lambda: handle.read(1024 * 1024), b""):
                      digest.update(chunk)
              return digest.hexdigest()
          second = load(root / "WILD_SECOND/registry-entry.json")
          third = load(root / "WILD_THIRD/registry-entry.json")
          for name, registry in (("WILD_SECOND", second), ("WILD_THIRD", third)):
              if file_sha(root / name / "model.cbm") != registry["MODEL_SHA256"]:
                  raise SystemExit(f"{name}_MODEL_HASH")
          manifest = {
              "SCHEMA": "G11_WILD_POSITION_MODEL_PACK_MANIFEST_V1",
              "STATUS": "HISTORICAL_SHADOW_ARTIFACTS_FROZEN",
              "SOURCE_COMMIT": source_sha,
              "PREDICTION_STAGE": "MORNING",
              "SECOND": second,
              "THIRD": third,
              "FULL_PATH_READBACK": {"SECOND": 30, "THIRD": 120},
              "P3_MUTATED": False,
              "APP_PUBLISHED": False,
              "FULL_PACK_READY": False,
          }
          payload = json.dumps(manifest, ensure_ascii=False, sort_keys=True, separators=(",", ":"), allow_nan=False) + "\n"
          (root / "manifest.json").write_text(payload, encoding="utf-8")
          print(json.dumps({
              "STATUS": manifest["STATUS"],
              "SECOND_MODEL_SHA256": second["MODEL_SHA256"],
              "SECOND_HOLDOUT_TOP1": second["FUTURE_HOLDOUT_EVALUATION"]["TOP1_HIT_RATE"],
              "THIRD_MODEL_SHA256": third["MODEL_SHA256"],
              "THIRD_HOLDOUT_TOP1": third["FUTURE_HOLDOUT_EVALUATION"]["TOP1_HIT_RATE"],
              "FULL_PATH_READBACK": manifest["FULL_PATH_READBACK"],
              "FULL_PACK_READY": False,
          }, sort_keys=True))
          PY
          test -s "${MODEL_ROOT}/manifest.json"
          final_root="${MODEL_ROOT%.candidate}"
          rm -rf "${final_root}.previous"
          if [ -d "${final_root}" ]; then
            mv "${final_root}" "${final_root}.previous"
          fi
          mv "${MODEL_ROOT}" "${final_root}"
          rm -rf "${final_root}.previous"

      - name: Verify reusable frozen model state
        if: steps.existing.outputs.morning == 'true'
        working-directory: .g11-private
        env:
          SOURCE_STATE_CACHE_KEY: ${{ inputs.source_state_cache_key }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          import pathlib
          from g11.wild_pack.v1 import chunked_artifact_v1 as chunked
          from g11.wild_pack.v1 import conditional_position_model_v1 as position

          root = pathlib.Path(os.environ["GITHUB_WORKSPACE"]) / ".relay-state/store/g11/wild-pack-models/morning"
          manifest = json.loads((root / "manifest.json").read_text(encoding="utf-8"))
          contract = position.load_json(pathlib.Path("g11/wild_pack/v1/POSITION_MODEL_CONTRACT_V1.json"))
          if manifest.get("STATUS") != "HISTORICAL_SHADOW_ARTIFACTS_FROZEN":
              raise SystemExit("WILD_POSITION_REUSE_STATUS")
          if manifest.get("FULL_PATH_READBACK") != {"SECOND": 30, "THIRD": 120}:
              raise SystemExit("WILD_POSITION_REUSE_PATHS")
          if manifest.get("P3_MUTATED") is not False or manifest.get("APP_PUBLISHED") is not False:
              raise SystemExit("WILD_POSITION_REUSE_BACKFLOW")
          for name in ("WILD_SECOND", "WILD_THIRD"):
              registry = position.load_json(root / name / "registry-entry.json")
              position.validate_registry(registry, contract, name)
              model = root / name / "model.cbm"
              with chunked.materialize_verified(model, registry["MODEL_SHA256"]):
                  pass
              readback = json.loads((root / name / "inference-readback.json").read_text(encoding="utf-8"))
              expected = 30 if name == "WILD_SECOND" else 120
              if readback.get("STATUS") != "SHADOW_PREDICTION_LOCKED" or readback.get("PATH_COUNT") != expected:
                  raise SystemExit(f"{name}_REUSE_READBACK")
              if readback.get("MID_PATH_PRUNING_COUNT") != 0 or readback.get("PRODUCTION_MUTATED") is not False:
                  raise SystemExit(f"{name}_REUSE_INTEGRITY")
          print(json.dumps({
              "STATUS": "REUSABLE_FROZEN_MODEL_STATE_PASS",
              "SOURCE_STATE_CACHE_KEY": os.environ["SOURCE_STATE_CACHE_KEY"],
              "SECOND_MODEL_SHA256": manifest["SECOND"]["MODEL_SHA256"],
              "THIRD_MODEL_SHA256": manifest["THIRD"]["MODEL_SHA256"],
          }, sort_keys=True))
          PY

      - name: Register proven MORNING WILD1 2 3 as FIRST CURRENT
        working-directory: .g11-private
        env:
          STORE: ${{ github.workspace }}/.relay-state/store
        run: |
          set -euo pipefail
          python3 -m g11.wild_pack.v1.pre_race_position_v1 \
            register-morning-current \
            --store "${STORE}" \
            --code-commit "$(git rev-parse HEAD)" \
            > "${RUNNER_TEMP}/wild-morning-current.json"
          jq -e '.STATUS == "CURRENT" and (.MODELS | length) == 3' \
            "${STORE}/g11/wild-pack-models/morning/current-pack.json" >/dev/null

      - name: Detect existing PRE_RACE FIRST CURRENT
        id: pre-current
        shell: bash
        run: |
          manifest=.relay-state/store/g11/wild-pack-models/pre_race/manifest.json
          ready=false
          if [ -s "${manifest}" ] \
            && jq -e '.STATUS == "CURRENT" and .ELIGIBLE_RACES >= 10000' "${manifest}" >/dev/null; then
            ready=true
          fi
          echo "ready=${ready}" >> "${GITHUB_OUTPUT}"

      - name: Build time-safe PRE_RACE historical bootstrap
        if: steps.pre-current.outputs.ready != 'true'
        working-directory: .g11-private
        env:
          BOOTSTRAP_ROOT: ${{ runner.temp }}/g11-wild-pre-race
        run: |
          set -euo pipefail
          mkdir -p "${BOOTSTRAP_ROOT}"
          python3 -m g11.wild_pack.v1.pre_race_position_v1 build-dataset \
            --public-repo "${GITHUB_WORKSPACE}/.public-data" \
            --dataset-output "${BOOTSTRAP_ROOT}/dataset.json" \
            --audit-output "${BOOTSTRAP_ROOT}/audit.json"
          jq -e '.STATUS == "PASS_INITIAL_10000_AVAILABLE" and .PRE_RACE_ELIGIBLE_RACES >= 10000 and .PRE_RACE_MISSING_TO_10000 == 0 and .COUNTER_RESET == false and .P3_AS_WILD_FEATURE == false and .ABEKEN_AS_WILD_FEATURE == false' \
            "${BOOTSTRAP_ROOT}/audit.json" >/dev/null

      - name: Train and freeze independent PRE_RACE WILD1 2 3 FIRST CURRENT
        if: steps.pre-current.outputs.ready != 'true'
        working-directory: .g11-private
        env:
          BOOTSTRAP_ROOT: ${{ runner.temp }}/g11-wild-pre-race
          FINAL_ROOT: ${{ github.workspace }}/.relay-state/store/g11/wild-pack-models/pre_race
        run: |
          set -euo pipefail
          candidate="${FINAL_ROOT}.candidate"
          rm -rf "${candidate}"
          python3 -m g11.wild_pack.v1.pre_race_position_v1 train-pack \
            --dataset "${BOOTSTRAP_ROOT}/dataset.json" \
            --model-root "${candidate}" \
            --code-commit "$(git rev-parse HEAD)"
          python3 -m g11.wild_pack.v1.pre_race_position_v1 verify-current \
            --model-root "${candidate}"
          cp "${BOOTSTRAP_ROOT}/audit.json" "${candidate}/historical-bootstrap-audit.json"
          rm -rf "${FINAL_ROOT}.previous"
          if [ -d "${FINAL_ROOT}" ]; then mv "${FINAL_ROOT}" "${FINAL_ROOT}.previous"; fi
          mv "${candidate}" "${FINAL_ROOT}"
          rm -rf "${FINAL_ROOT}.previous"

      - name: Smoke full PRE_RACE 6 30 120 path runtime readback
        working-directory: .g11-private
        env:
          MODEL_ROOT: ${{ github.workspace }}/.relay-state/store/g11/wild-pack-models/pre_race
          DATASET: ${{ runner.temp }}/g11-wild-pre-race/dataset.json
        run: |
          set -euo pipefail
          python3 -m g11.wild_pack.v1.pre_race_position_v1 verify-current \
            --model-root "${MODEL_ROOT}"
          if [ -s "${DATASET}" ]; then
            python3 - "${DATASET}" "${MODEL_ROOT}" <<'PY'
          import json,pathlib,sys
          from g11.wild_pack.v1.pre_race_position_v1 import predict_live
          dataset=json.loads(pathlib.Path(sys.argv[1]).read_text(encoding='utf-8'))
          race_id=dataset['SPLIT_RACE_IDS']['HISTORICAL_HOLDOUT'][0]
          record=next(row for row in dataset['RECORDS'] if row['RACE_ID']==race_id)
          boats={row['BOAT']:row['FEATURES'] for row in record['BOATS']}; first=boats[1]
          parsed={
              'RACERS':[{
                  'BOAT':boat,'COURSE':boats[boat]['course'],
                  'START_TIMING':boats[boat]['start_timing'],
                  'WEIGHT':boats[boat]['weight'],
                  'EXHIBITION_TIME':boats[boat]['exhibition_time'],
                  'TILT':boats[boat]['tilt'],
              } for boat in range(1,7)],
              'WEATHER':first['weather'],'AIR_TEMPERATURE':first['air_temperature'],
              'WIND_SPEED':first['wind_speed'],
              'WIND_DIRECTION_CODE':first['wind_direction_code'],
              'WATER_TEMPERATURE':first['water_temperature'],
              'WAVE_HEIGHT':first['wave_height'],
          }
          output=predict_live(parsed,race_id,record['FEATURE_ASOF_TIME'],record['DEADLINE_JST'],pathlib.Path(sys.argv[2]))
          assert output['STATUS']=='CURRENT'
          assert output['FULL_PATH_COUNTS']=={'HEAD':6,'SECOND':30,'THIRD':120}
          assert output['MORNING_MODEL_REUSED'] is False
          assert output['RESULT_USED_AS_PREDICTION_FEATURE'] is False
          assert output['P3_USED_AS_FEATURE'] is False
          pathlib.Path(sys.argv[2],'runtime-readback.json').write_text(
              json.dumps(output,ensure_ascii=False,sort_keys=True,separators=(',',':'))+'\n',
              encoding='utf-8')
          PY
          fi

      - name: Persist compact WILD acceptance readback
        working-directory: .g11-private
        env:
          STORE: ${{ github.workspace }}/.relay-state/store
        run: |
          python3 - "${STORE}" <<'PY'
          import json,pathlib,sys
          root=pathlib.Path(sys.argv[1])
          morning=json.loads((root/'g11/wild-pack-models/morning/current-pack.json').read_text())
          pre=json.loads((root/'g11/wild-pack-models/pre_race/manifest.json').read_text())
          bet=json.loads(pathlib.Path('g11/wild_pack/v1/audits/WILD_BET_ELIGIBLE_READBACK_AUDIT_20260920.json').read_text())
          value={
              'SCHEMA':'G11_WILD_PACK_ACCEPTANCE_READBACK_V1','STATUS':'PASS',
              'MORNING':morning,'PRE_RACE':pre,
              'WILD4_CANDIDATES':bet['GENERATED_UPSTREAM_PACKETS'],
              'WILD4_FORMAL_ELIGIBLE':bet['FORMAL_WILD_BET_ELIGIBLE_RACES'],
              'WILD4_REJECTED':sum(bet['REJECTED'].values()),
              'WILD4_REJECTION_REASONS':bet['REJECTED'],
              'WILD4_CURRENT':False,'COUNTER_RESET':False,
              'P3_MUTATED':False,'OLD_P3_USED':False,'ABEKEN_USED':False,
          }
          path=root/'g11/wild-pack-models/acceptance-readback.json'
          path.parent.mkdir(parents=True,exist_ok=True)
          path.write_text(json.dumps(value,ensure_ascii=False,sort_keys=True,separators=(',',':'))+'\n',encoding='utf-8')
          PY

      - name: Encrypt completed WILD state before private publish
        env:
          G11_PRIVATE_REPO_TOKEN: ${{ secrets.G11_PRIVATE_REPO_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p .relay-cache
          encrypted=.relay-cache/state.tgz.gpg
          temporary="${encrypted}.tmp"
          exec 3<<<"${G11_PRIVATE_REPO_TOKEN}"
          tar -czf - -C .relay-state . | \
            gpg --batch --yes --pinentry-mode loopback --passphrase-fd 3 \
              --symmetric --cipher-algo AES256 --output "${temporary}"
          exec 3<&-
          mv "${temporary}" "${encrypted}"
          test -s "${encrypted}"

      - name: Save encrypted WILD state before private publish
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: .relay-cache/state.tgz.gpg
          key: g11-state-v2-${{ steps.state-date.outputs.state_date }}-${{ github.run_id }}-wild-position

      - name: Checkout private runtime branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: ${{ env.G11_PRIVATE_REPOSITORY }}
          ref: g11-runtime
          token: ${{ secrets.G11_PRIVATE_REPO_TOKEN }}
          path: .g11-runtime
          persist-credentials: true
          fetch-depth: 1

      - name: Publish verified WILD model state to runtime
        continue-on-error: true
        env:
          SOURCE: ${{ github.workspace }}/.relay-state/store/g11/wild-pack-models
          RUNTIME: ${{ github.workspace }}/.g11-runtime
        run: |
          set -euo pipefail
          mkdir -p "${RUNTIME}/g11/wild-pack-models"
          rsync -a --delete "${SOURCE}/" "${RUNTIME}/g11/wild-pack-models/"
          git -C "${RUNTIME}" add g11/wild-pack-models
          if ! git -C "${RUNTIME}" diff --cached --quiet; then
            git -C "${RUNTIME}" -c user.name='github-actions[bot]' \
              -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
              commit -m 'wild-pack: publish MORNING and PRE_RACE first CURRENT'
            git -C "${RUNTIME}" push origin HEAD:g11-runtime
          fi

      - name: Publish CURRENT WILD app feed
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.G11_PRIVATE_REPO_TOKEN }}
        run: |
          set -euo pipefail
          gh workflow run g11-app-feed-publish.yml \
            --repo "${G11_PRIVATE_REPOSITORY}" \
            --ref main







  # PRE_RACE V2 rerun binds the latest private authority.
  wild-head-repair:
    if: github.repository == 'tatsuuut/-g11-official-data-relay' && github.ref == 'refs/heads/main' && github.event_name == 'push' && contains(github.event.head_commit.message, '[wild-head-repair]')
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    concurrency:
      group: g11-free-official-data-runner
      cancel-in-progress: false
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUNBUFFERED: "1"
      TZ: Asia/Tokyo
      STATE_DATE: "2026-09-21"
    steps:
      - name: Checkout private authority
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: tatsuuut/boat-brain-lab
          ref: main
          token: ${{ secrets.G11_PRIVATE_REPO_TOKEN }}
          path: private
          persist-credentials: false
          fetch-depth: 1

      - name: Checkout pinned official-source history
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: BoatraceCSV/boatracecsv.github.io
          ref: fea7ba7d5c09ff2019adb0461bb91081fe57144f
          path: public-data
          persist-credentials: false
          fetch-depth: 0

      - name: Restore latest encrypted runtime state
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: .relay-cache/state.tgz.gpg
          key: g11-state-v2-${{ env.STATE_DATE }}-${{ github.run_id }}-wild-head-repair
          restore-keys: |
            g11-state-v2-${{ env.STATE_DATE }}-
            g11-state-v2-

      - name: Decrypt runtime state
        env:
          G11_PRIVATE_REPO_TOKEN: ${{ secrets.G11_PRIVATE_REPO_TOKEN }}
        run: |
          set -euo pipefail
          test -s .relay-cache/state.tgz.gpg
          rm -rf .relay-state
          mkdir -p .relay-state
          archive="${RUNNER_TEMP}/state.tgz"
          exec 3<<<"${G11_PRIVATE_REPO_TOKEN}"
          gpg --batch --yes --pinentry-mode loopback --passphrase-fd 3             --decrypt --output "${archive}" .relay-cache/state.tgz.gpg
          exec 3<&-
          tar -xzf "${archive}" -C .relay-state

      - name: Install pinned backend
        run: python3 -m pip install --disable-pip-version-check --no-input 'catboost==1.2.8'

      - name: Run focused PRE_RACE tests
        working-directory: private
        run: |
          set -euo pipefail
          python3 -m unittest             g11.wild_pack.v1.test_pre_race_position_v1             g11.wild_pack.v1.test_runtime_orchestrator_v1

      - name: Build rich PRE_RACE V2 dataset
        working-directory: private
        env:
          PYTHONPATH: .
          OUT: ${{ runner.temp }}/wild-head-repair
          PUBLIC: ${{ github.workspace }}/public-data
        run: |
          set -euo pipefail
          mkdir -p "${OUT}"
          python3 -m g11.wild_pack.v1.pre_race_position_v1 build-dataset             --public-repo "${PUBLIC}"             --dataset-output "${OUT}/dataset.json"             --audit-output "${OUT}/audit.json"
          jq -e '
            .STATUS == "PASS_INITIAL_10000_AVAILABLE"
            and .PRE_RACE_ELIGIBLE_RACES >= 10000
            and .COUNTER_RESET == false
            and .P3_AS_WILD_FEATURE == false
            and .ABEKEN_AS_WILD_FEATURE == false
            and .FEATURE_SCHEMA_VERSION == "WILD_PRE_RACE_OFFICIAL_BEFOREINFO_PLUS_MORNING_STATIC_V2"
          ' "${OUT}/audit.json" >/dev/null

      - name: Train candidate PRE_RACE V2 pack
        working-directory: private
        env:
          PYTHONPATH: .
          OUT: ${{ runner.temp }}/wild-head-repair
        run: |
          set -euo pipefail
          candidate="${OUT}/candidate"
          python3 -m g11.wild_pack.v1.pre_race_position_v1 train-pack             --dataset "${OUT}/dataset.json"             --model-root "${candidate}"             --code-commit "$(git rev-parse HEAD)"
          python3 -m g11.wild_pack.v1.pre_race_position_v1 verify-current             --model-root "${candidate}"
          python3 - "${candidate}" <<'PY'
          import json,pathlib,sys
          root=pathlib.Path(sys.argv[1])
          h=json.loads((root/"WILD_HEAD/registry-entry.json").read_text())
          gate=h.get("COURSE1_BASELINE_GATE")
          assert gate and gate["PASS"] is True
          v=gate["VALIDATION"]; o=gate["HISTORICAL_HOLDOUT"]
          assert v["NET_UPLIFT_HITS"] > 0
          assert o["NET_UPLIFT_HITS"] > 0
          assert o["MODEL_COURSE1_SELECTION_RATE"] < 1.0
          print("WILD_HEAD_REPAIR_METRICS="+json.dumps({
              "MODEL_VERSION":h["MODEL_VERSION"],
              "VALIDATION_EVALUATION":h["VALIDATION_EVALUATION"],
              "HOLDOUT_EVALUATION":h["HOLDOUT_EVALUATION"],
              "COURSE1_BASELINE_GATE":gate,
              "ELIGIBLE_RACES":h["ELIGIBLE_RACES"],
          },ensure_ascii=False,sort_keys=True))
          PY

      - name: Install candidate into encrypted CURRENT state
        env:
          OUT: ${{ runner.temp }}/wild-head-repair
          STATE: ${{ github.workspace }}/.relay-state/store
        run: |
          set -euo pipefail
          target="${STATE}/g11/wild-pack-models/pre_race"
          candidate="${OUT}/candidate"
          test -s "${candidate}/manifest.json"
          rm -rf "${target}.previous"
          if [ -d "${target}" ]; then mv "${target}" "${target}.previous"; fi
          mv "${candidate}" "${target}"
          python3 - "${target}" <<'PY'
          import json,pathlib,sys
          root=pathlib.Path(sys.argv[1])
          m=json.loads((root/"manifest.json").read_text())
          assert m["STATUS"]=="CURRENT"
          assert m["MORNING_MODEL_REUSED_AS_PRE_RACE_MODEL"] is False
          h=json.loads((root/"WILD_HEAD/registry-entry.json").read_text())
          assert h["COURSE1_BASELINE_GATE"]["PASS"] is True
          assert "PRE_RACE_FACTUAL_CATBOOST_V2" in h["MODEL_VERSION"]
          print("WILD_PRE_RACE_V2_INSTALL_PASS",h["MODEL_VERSION"])
          PY
          rm -rf "${target}.previous"

      - name: Verify public WILD projection sees V2 CURRENT
        working-directory: private
        env:
          PYTHONPATH: .
          STATE: ${{ github.workspace }}/.relay-state/store
        run: |
          python3 - "${STATE}" <<'PY'
          import pathlib,sys
          from g11.canonical import public_app_feed
          root=pathlib.Path(sys.argv[1])
          projection,_=public_app_feed._wild_pack_public_projection(root,"2026-09-21",None)
          assert projection["pre_race"]["STATUS"]=="CURRENT"
          versions={
              k:v["MODEL_VERSION"]
              for k,v in projection["pre_race"]["MODELS"].items()
          }
          assert all("PRE_RACE_FACTUAL_CATBOOST_V2" in value for value in versions.values())
          assert projection["wild4"]["formal_eligible"] >= 9119
          print("WILD_PRE_RACE_V2_PUBLIC_PROJECTION_PASS",versions,projection["wild4"]["formal_eligible"])
          PY

      - name: Encrypt repaired runtime state
        env:
          G11_PRIVATE_REPO_TOKEN: ${{ secrets.G11_PRIVATE_REPO_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p .relay-cache
          temporary=.relay-cache/state.tgz.gpg.tmp
          exec 3<<<"${G11_PRIVATE_REPO_TOKEN}"
          tar -czf - -C .relay-state . |             gpg --batch --yes --pinentry-mode loopback --passphrase-fd 3               --symmetric --cipher-algo AES256 --output "${temporary}"
          exec 3<&-
          mv "${temporary}" .relay-cache/state.tgz.gpg
          test -s .relay-cache/state.tgz.gpg

      - name: Save repaired encrypted CURRENT
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: .relay-cache/state.tgz.gpg
          key: g11-state-v2-${{ env.STATE_DATE }}-${{ github.run_id }}-wild-head-v2
