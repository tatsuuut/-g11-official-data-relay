        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: .fold-cache/fold${{ matrix.fold }}
          key: g11-wild4-fast-${{ github.run_id }}-fold-${{ matrix.fold }}

