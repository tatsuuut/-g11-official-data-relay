          ref: fea7ba7d5c09ff2019adb0461bb91081fe57144f
          path: public-data
          persist-credentials: false
          fetch-depth: 0

      - name: Install pinned model backend
        run: python3 -m pip install --disable-pip-version-check --no-input 'catboost==1.2.8'

      - name: Build one 5000-prior historical fold
        working-directory: private
        env:
          PYTHONPATH: .
          OUT: ${{ runner.temp }}/wild4-fold
          PUBLIC: ${{ github.workspace }}/public-data
          FOLD: ${{ matrix.fold }}
        run: |
          set -euo pipefail
          mkdir -p "${OUT}/crossfit"
          python3 -m g11.true_ai.v1.src.public_backfill_v1 \
            --public-repo "${PUBLIC}" \
            --dataset-output "${OUT}/head-dataset.json" \
            --audit-output "${OUT}/head-audit.json" \
            --end 2026-09-19
          python3 -m g11.wild_pack.v1.public_position_bootstrap_v1 \
            --head-dataset "${OUT}/head-dataset.json" \
            --public-repo "${PUBLIC}" \
            --overlay-output "${OUT}/position-overlay.json" \
            --audit-output "${OUT}/position-audit.json"
          python3 - "${OUT}" "${PUBLIC}" "${FOLD}" <<'PY'
          import json,pathlib,sys
          from g11.wild_pack.v1 import wild_bet_bootstrap_v1 as bet
          out=pathlib.Path(sys.argv[1]); public=pathlib.Path(sys.argv[2]); fold_no=int(sys.argv[3])
          dataset=json.loads((out/"head-dataset.json").read_text())
          odds=bet.public_odds_candidates(public)
          targets=sorted({r["RACE_ID"] for r in dataset["RECORDS"]} & set(odds["RECORDS"]))
          contract=bet.load_json(pathlib.Path("g11/wild_pack/v1/BET_MODEL_CONTRACT_V1.json"))
          full=bet.walk_forward_plan(
              dataset["RECORDS"], targets,
              fold_days=int(contract["BOOTSTRAP"]["FOLD_LENGTH_DAYS"]),
              minimum_prior_races=5000,
          )
          assert len(full["FOLDS"]) == 9
          fold=full["FOLDS"][fold_no-1]
          assert fold["STATUS"] == "READY"
          plan=dict(full)
          plan["FOLDS"]=[fold]
          plan["FOLD_COUNT"]=1
          plan["TARGET_RACE_COUNT"]=len(fold["TARGET_RACE_IDS"])
          plan["READY_TARGET_RACE_COUNT"]=len(fold["TARGET_RACE_IDS"])
