          python3 -m g11.wild_pack.v1.historical_upstream_crossfit_v1 \
            --dataset "${OUT}/head-dataset.json" \
            --overlay "${OUT}/position-overlay.json" \
            --plan "${OUT}/plan.json" \
            --contract g11/wild_pack/v1/POSITION_MODEL_CONTRACT_V1.json \
            --output-dir "${OUT}/crossfit" \
            --code-commit "$(git rev-parse HEAD)"
          mkdir -p "${GITHUB_WORKSPACE}/.fold-cache/fold${FOLD}"
          cp "${OUT}/crossfit/historical-upstream-packets.json.gz" "${GITHUB_WORKSPACE}/.fold-cache/fold${FOLD}/"
          cp "${OUT}/crossfit/historical-crossfit-audit.json" "${GITHUB_WORKSPACE}/.fold-cache/fold${FOLD}/"
          cp "${OUT}/crossfit/historical-upstream-packets.manifest.json" "${GITHUB_WORKSPACE}/.fold-cache/fold${FOLD}/"

