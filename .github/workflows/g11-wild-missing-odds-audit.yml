name: G11 WILD missing-odds audit

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/g11-wild-missing-odds-audit.yml

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: .relay-cache/state.tgz.gpg
          key: g11-state-v2-2026-09-21-${{ github.run_id }}
          restore-keys: |
            g11-state-v2-2026-09-21-
            g11-state-v2-
      - name: Classify missing WILD odds
        env:
          G11_PRIVATE_REPO_TOKEN: ${{ secrets.G11_PRIVATE_REPO_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p .relay-state
          archive="${RUNNER_TEMP}/state.tgz"
          exec 3<<<"${G11_PRIVATE_REPO_TOKEN}"
          gpg --batch --yes --pinentry-mode loopback --passphrase-fd 3             --decrypt --output "${archive}" .relay-cache/state.tgz.gpg
          exec 3<&-
          tar -xzf "${archive}" -C .relay-state
          python3 - <<'PY'
          import gzip,json
          from pathlib import Path
          from datetime import datetime,timezone
          root=Path(".relay-state/store")
          d=root/"g11/wild-pack-oos/morning/2026-09-21"
          up=json.loads(gzip.decompress((d/"bet-upstream.json.gz").read_bytes()))
          od=json.loads(gzip.decompress((d/"bet-prediction-time-odds.json.gz").read_bytes()))
          up_by={r["PAYLOAD"]["STANDARD_RACE_KEY"]:r["PAYLOAD"] for r in up["RECORDS"]}
          got={r["STANDARD_RACE_KEY"] for r in od["RECORDS"]}
          now=datetime.now(timezone.utc)
          past=[]
          for k,payload in up_by.items():
              if k in got: continue
              dl=datetime.fromisoformat(payload["RACE_DEADLINE_AT"])
              if dl.astimezone(timezone.utc) <= now: past.append(k)
          stats={"beforeinfo":0,"odds3t":0,"predeadline_prediction":0,"current_p3_live":0}
          rows=[]
          for k in sorted(past):
              snap=root/"snapshots/predeadline"
              flags={
                "beforeinfo":(snap/f"beforeinfo-{k.lower()}.json").is_file(),
                "odds3t":(snap/f"odds3t-{k.lower()}.json").is_file(),
                "predeadline_prediction":(snap/f"predeadline-prediction-{k.lower()}.json").is_file(),
                "current_p3_live":(snap/f"current-growth-p3-{k.lower()}.json").is_file(),
              }
              for key,val in flags.items(): stats[key]+=int(val)
              rows.append([k,flags])
          print("PAST_MISSING",len(past))
          print("ARTIFACT_COUNTS",json.dumps(stats,sort_keys=True))
          print("ROWS",json.dumps(rows,ensure_ascii=False))
          PY
