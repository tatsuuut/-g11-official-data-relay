name: G11 WILD missing-odds audit

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/g11-wild-missing-odds-audit.yml

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: .relay-cache/state.tgz.gpg
          key: g11-state-v2-2026-09-21-${{ github.run_id }}
          restore-keys: |
            g11-state-v2-2026-09-21-
            g11-state-v2-
      - name: Inspect missing WILD odds
        env:
          G11_PRIVATE_REPO_TOKEN: ${{ secrets.G11_PRIVATE_REPO_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p .relay-state
          archive="${RUNNER_TEMP}/state.tgz"
          exec 3<<<"${G11_PRIVATE_REPO_TOKEN}"
          gpg --batch --yes --pinentry-mode loopback --passphrase-fd 3             --decrypt --output "${archive}" .relay-cache/state.tgz.gpg
          exec 3<&-
          tar -xzf "${archive}" -C .relay-state
          python3 - <<'PY'
          import gzip, json
          from pathlib import Path
          from datetime import datetime
          root=Path(".relay-state/store")
          d=root/"g11/wild-pack-oos/morning/2026-09-21"
          up=json.loads(gzip.decompress((d/"bet-upstream.json.gz").read_bytes()))
          od=json.loads(gzip.decompress((d/"bet-prediction-time-odds.json.gz").read_bytes()))
          up_by={r["PAYLOAD"]["STANDARD_RACE_KEY"]:r["PAYLOAD"] for r in up["RECORDS"]}
          got={r["STANDARD_RACE_KEY"] for r in od["RECORDS"]}
          missing=sorted(set(up_by)-got)
          now=datetime.now().astimezone()
          past=[]; future=[]; snapshot_exists=[]
          for k in missing:
              deadline=datetime.fromisoformat(up_by[k]["RACE_DEADLINE_AT"])
              item=(k,deadline.isoformat())
              (past if deadline<=now else future).append(item)
              p=root/"snapshots/predeadline"/f"odds3t-{k.lower()}.json"
              if p.is_file(): snapshot_exists.append(item)
          print("NOW",now.isoformat())
          print("UPSTREAM",len(up_by))
          print("ODDS",len(got))
          print("MISSING",len(missing))
          print("MISSING_PAST_DEADLINE",len(past))
          print("MISSING_FUTURE",len(future))
          print("MISSING_WITH_OFFICIAL_ODDS_SNAPSHOT_ALREADY_PRESENT",len(snapshot_exists))
          print("PAST_KEYS",json.dumps(past,ensure_ascii=False))
          print("FUTURE_KEYS",json.dumps(future,ensure_ascii=False))
          print("SNAPSHOT_PRESENT_KEYS",json.dumps(snapshot_exists,ensure_ascii=False))
          PY
