name: P3 saved weather parity audit
on:
  pull_request:
    branches: [main]
    paths: ['.github/workflows/g11-p3-weather-audit.yml']
permissions:
  contents: read
jobs:
  saved-p3-weather:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'codex/p3-weather-parity'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: .relay-cache/state.tgz.gpg
          key: p3-weather-readonly-20261106-587caa61
          restore-keys: |
            g11-state-v4-published-2026-11-06-
      - name: Restore isolated saved state
        env:
          G11_PRIVATE_REPO_TOKEN: ${{secrets.G11_PRIVATE_REPO_TOKEN}}
        run: |
          set -euo pipefail
          exec 3<<<"${G11_PRIVATE_REPO_TOKEN}"
          gpg --batch --yes --pinentry-mode loopback --passphrase-fd 3 --decrypt \
            --output "${RUNNER_TEMP}/p3-weather.tgz" .relay-cache/state.tgz.gpg
          exec 3<&-
          python3 - <<'PY'
          import os,pathlib,tarfile
          root=pathlib.Path(os.environ['RUNNER_TEMP'])/'p3-weather'
          root.mkdir()
          with tarfile.open(pathlib.Path(os.environ['RUNNER_TEMP'])/'p3-weather.tgz','r:gz') as a:
              assert all(not pathlib.PurePosixPath(m.name).is_absolute() and '..' not in pathlib.PurePosixPath(m.name).parts and not m.issym() and not m.islnk() for m in a.getmembers())
              a.extractall(root,filter='data')
          PY
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: ${{secrets.PRIVATE_SOURCE_REPO}}
          ref: 587caa61b756aeb0ffee1ffd0431b042b369b77a
          token: ${{secrets.G11_PRIVATE_REPO_TOKEN}}
          path: candidate
          persist-credentials: false
      - run: python3 -m pip install --disable-pip-version-check --no-input 'catboost==1.2.8'
      - name: Verify actual saved inputs and read-only model use
        working-directory: candidate
        env:
          PYTHONPATH: .
        run: python3 tools/audit_p3_live_weather_v1.py --state "${RUNNER_TEMP}/p3-weather" --day 2026-11-06


  retained-stadium-diagrams:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'codex/retained-stadium-layout-nov19'
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Restore the last November 19 authenticated publication
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: .relay-cache/state.tgz.gpg
          key: stadium-diagram-original-20261119-readonly
          restore-keys: |
            g11-state-v4-published-2026-11-20-44696295379-
            g11-state-v4-published-2026-11-20-
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: tatsuuut/boat-brain-lab
          ref: 845eea35405dc81447b71a699c9a14c93fe22f2a
          token: ${{secrets.G11_PRIVATE_REPO_TOKEN}}
          path: layout-verifier
          persist-credentials: false
          sparse-checkout: |
            g11
            p3
      - name: Verify retained stadium diagrams and public race identities
        env:
          STATE_KEY: ${{secrets.G11_PRIVATE_REPO_TOKEN}}
        run: |
          set -euo pipefail
          exec 3<<<"${STATE_KEY}"
          gpg --batch --yes --pinentry-mode loopback --passphrase-fd 3 --decrypt --output "${RUNNER_TEMP}/state.tgz" .relay-cache/state.tgz.gpg
          exec 3<&-
          unset STATE_KEY
          python3 - <<'PY'
          from collections import defaultdict
          from datetime import datetime
          from hashlib import sha256
          import json, os, pathlib, re, tarfile
          from urllib.parse import urlsplit, parse_qs
          source=pathlib.Path(os.environ['RUNNER_TEMP'])/'state.tgz'
          import base64,sys
          sys.path.insert(0,str(pathlib.Path('layout-verifier').resolve()))
          from g11.growth_p3.v1_1 import original_live_input_capture_v1 as verifier
          marks=defaultdict(dict)
          originals={}
          current={}
          catalogs={}
          with tarfile.open(source, 'r|gz') as archive:
              for member in archive:
                  from pathlib import PurePosixPath
                  filename=PurePosixPath(member.name).as_posix().removeprefix('.relay-state/')
                  fan=re.fullmatch(r'store/responses/(racer-period-fan[0-9]{4})/response.bin',filename)
                  if fan:
                      if not member.isfile() or member.size>16000000:raise ValueError('CATALOG_BOUND')
                      catalogs[fan[1]]=archive.extractfile(member).read()
                  if filename=='store/snapshots/morning/official-day-input.json' or filename.startswith('store/g11/published-preview-state/') and filename.endswith('host.json') or filename.startswith('store/responses/published-preview-20261120-') and filename.endswith('/response.bin'):
                      if not member.isfile() or member.size>18000000: raise ValueError('CURRENT_MEMBER')
                      current[filename]=json.loads(archive.extractfile(member).read())
                  original=re.search(r'(?:^|/)store/g11/p3-original-live-inputs/2026-11-19/(20261119-(?:01|15|22|24)-\d\d)\.input\.json$',member.name)
                  if original:
                      if not member.isfile() or member.size>verifier.MAX_RECORD_BYTES: raise ValueError('ORIGINAL_SIZE')
                      value=verifier.validate(verifier.decode(archive.extractfile(member).read()))
                      key=original[1]
                      if key != value['RACE_ID']: raise ValueError('ORIGINAL_KEY')
                      response=base64.b64decode(value['BEFOREINFO_RESPONSE_BASE64'],validate=True)
                      north=re.findall(rb'\bis-direction(\d+)\b',response);wind=re.findall(rb'\bis-wind(\d+)\b',response)
                      if len(north)!=1 or len(wind)!=1: raise ValueError('ORIGINAL_DIRECTION')
                      packet=value['PREDICTION']; codes=packet['DIRECTION_ENCODING']
                      if (int(north[0]),int(wind[0])) != (codes['NORTH_DIAGRAM_CODE'],codes['WIND_DIAGRAM_CODE']): raise ValueError('NATIVE_CODE_BINDING')
                      history=packet.get('RACER_HISTORY_EVIDENCE',{}).get('BOATS',{})
                      previous={n:{k:r['PREVIOUS_RACE'][k] for k in ('race_id','racer_id','course','finish','st')} for n,r in history.items() if r['PREVIOUS_RACE']}
                      parity=sha256(json.dumps(previous,separators=(',',':'),sort_keys=True).encode()).hexdigest()
                      originals[key]=[key,int(north[0]),int(wind[0]),sha256(response).hexdigest(),packet['CAPTURED_AT'],len(previous),parity]
                      continue
                  match=re.fullmatch(r'(?:\./)?(?:\.relay-state/)?store/responses/beforeinfo-(20261119-(?:01|15|22|24)-\d\d)/(response\.bin|receipt\.json)',member.name)
                  if not match: continue
                  key, part=match.groups()
                  if not member.isfile() or member.size>550000 or part in marks[key]: raise ValueError('MEMBER')
                  raw=archive.extractfile(member).read(member.size+1)
                  if part=='receipt.json':
                      marks[key][part]=json.loads(raw)
                  else:
                      north=re.findall(rb'\bis-direction(\d+)\b', raw)
                      wind=re.findall(rb'\bis-wind(\d+)\b', raw)
                      if len(north)!=1 or len(wind)!=1: raise ValueError('DIAGRAM')
                      marks[key][part]=(int(north[0]),int(wind[0]),sha256(raw).hexdigest())
          evidence={}
          for key, record in sorted(marks.items()):
              north, wind, digest=record['response.bin']
              rc=record['receipt.json']
              url='https://www.boatrace.jp/owpc/pc/race/beforeinfo?hd='+key[:8]+'&jcd='+key[9:11]+'&rno='+str(int(key[-2:]))
              if not (rc['SOURCE_ID']=='beforeinfo-'+key and rc['URL']==rc['FINAL_URL']==url and rc['HOST']=='www.boatrace.jp' and rc['STATUS']=='HTTP_200_BYTE_EXACT_READBACK' and rc['SHA256']==digest and 1<=north<=16 and 1<=wind<=17 and datetime.fromisoformat(rc['CAPTURED_AT_JST']).strftime('%Y%m%d')==key[:8]): raise ValueError('RECEIPT')
              evidence.setdefault(key[9:11],[]).append([key,north,wind,digest,rc['CAPTURED_AT_JST']])
          for key, row in originals.items():
              rows=evidence.setdefault(key[9:11],[])
              if not any(r[0]==key for r in rows): rows.append(row)
          for venue,rows in evidence.items():
              print('RETAINED_STADIUM_LAYOUT='+json.dumps({'venue':venue,'codes':sorted({r[1] for r in rows}),'samples':len(rows),'receipts':rows}))
          if not evidence: raise ValueError('NO_ARCHIVED_STADIUM_DIAGRAMS')
          from g11.canonical import published_preview_v1 as preview
          morning=current['store/snapshots/morning/official-day-input.json']['PAYLOAD']
          from g11.canonical import official_pipeline as core
          envelope=current['store/snapshots/morning/official-day-input.json']
          names={}
          for rc in envelope['SOURCE_RECEIPTS']:
              if rc['SOURCE_ID'] not in catalogs: continue
              raw=catalogs[rc['SOURCE_ID']]
              if sha256(raw).hexdigest()!=rc['SHA256']: raise ValueError('CATALOG_HASH')
              contents=core.LzhExtractor().extract_one(raw,core.CanonicalRunner._archive_member(rc['URL']))
              names={r:preview.normal_name(p.name) for r,p in core.parse_racer_period_bytes(contents).items()}
          state=current.get('store/g11/published-preview-state/host.json',{})
          source=current.get('store/responses/'+str(state.get('source'))+'/response.bin')
          if source:
              for rno in range(4,13):
                  key=f'20261120-24-{rno:02}'
                  native=preview.race_roster(morning,key)
                  program=source['programs']['stadiums']['24']['races'][str(rno)]
                  wrong=[]
                  for boat,(racer,motor,name) in native.items():
                      row=program['racers'][str(boat)]
                      if (racer,motor,preview.normal_name(name))!=(row['number'],row['motor_number'],preview.normal_name(row['name'])):
                          wrong.append([boat,racer,row['number'],motor,row['motor_number'],name,row['name'],names.get(racer),names.get(racer)==preview.normal_name(row['name'])])
                  print('OMURA_BOARD_ROSTER='+json.dumps([key,wrong],ensure_ascii=False))
          for name,s in current.items():
              if name.endswith('host.json'): print('VENUE_ORIGIN_STATUS='+json.dumps(s,sort_keys=True))
          PY
