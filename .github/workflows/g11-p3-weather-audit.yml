name: P3 saved weather parity audit
on:
  pull_request:
    branches: [main]
    paths: ['.github/workflows/g11-p3-weather-audit.yml']
permissions:
  contents: read
jobs:
  saved-p3-weather:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'codex/p3-weather-parity'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: .relay-cache/state.tgz.gpg
          key: p3-weather-readonly-20261106-587caa61
          restore-keys: |
            g11-state-v4-published-2026-11-06-
      - name: Restore isolated saved state
        env:
          G11_PRIVATE_REPO_TOKEN: ${{secrets.G11_PRIVATE_REPO_TOKEN}}
        run: |
          set -euo pipefail
          exec 3<<<"${G11_PRIVATE_REPO_TOKEN}"
          gpg --batch --yes --pinentry-mode loopback --passphrase-fd 3 --decrypt \
            --output "${RUNNER_TEMP}/p3-weather.tgz" .relay-cache/state.tgz.gpg
          exec 3<&-
          python3 - <<'PY'
          import os,pathlib,tarfile
          root=pathlib.Path(os.environ['RUNNER_TEMP'])/'p3-weather'
          root.mkdir()
          with tarfile.open(pathlib.Path(os.environ['RUNNER_TEMP'])/'p3-weather.tgz','r:gz') as a:
              assert all(not pathlib.PurePosixPath(m.name).is_absolute() and '..' not in pathlib.PurePosixPath(m.name).parts and not m.issym() and not m.islnk() for m in a.getmembers())
              a.extractall(root,filter='data')
          PY
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: ${{secrets.PRIVATE_SOURCE_REPO}}
          ref: 587caa61b756aeb0ffee1ffd0431b042b369b77a
          token: ${{secrets.G11_PRIVATE_REPO_TOKEN}}
          path: candidate
          persist-credentials: false
      - run: python3 -m pip install --disable-pip-version-check --no-input 'catboost==1.2.8'
      - name: Verify actual saved inputs and read-only model use
        working-directory: candidate
        env:
          PYTHONPATH: .
        run: python3 tools/audit_p3_live_weather_v1.py --state "${RUNNER_TEMP}/p3-weather" --day 2026-11-06

