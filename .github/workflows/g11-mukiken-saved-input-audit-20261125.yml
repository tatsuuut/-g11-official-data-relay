name: Fixed 16 Muki original input read-only audit
on:
  push:
    branches: [codex/mukiken-input-audit-20261125]
    paths:
      - '.github/workflows/g11-mukiken-saved-input-audit-20261125.yml'
      - 'scripts/mukiken_saved_input_audit_20261125*'
permissions:
  contents: read
  actions: read
concurrency:
  group: g11-fixed16-input-audit-20261125
  cancel-in-progress: false
jobs:
  saved-inputs:
    if: contains(github.event.head_commit.message, '[audit-16-inputs]')
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          sparse-checkout: |
            scripts/mukiken_saved_input_audit_20261125.py
            scripts/mukiken_saved_input_audit_20261125_targets.json
            scripts/mukiken_saved_input_audit_20261125_recipient.pem
          sparse-checkout-cone-mode: false
      - name: Verify fixed recipient and plan metadata only
        id: plan
        env:
          GH_TOKEN: ${{github.token}}
        run: |
          set -euo pipefail
          test "$(openssl x509 -in scripts/mukiken_saved_input_audit_20261125_recipient.pem -noout -fingerprint -sha256 | cut -d= -f2 | tr -d :)" = '39421FFB648CEE3B554C248A6F8A4A1890DF2E80C80CAF0DF5780C05C3E0F87E'
          python3 scripts/mukiken_saved_input_audit_20261125.py plan
      - name: Check whether latest is still needed
        id: need-latest
        run: python3 scripts/mukiken_saved_input_audit_20261125.py needed --label latest
      - name: Restore exact saved latest checkpoint read-only
        if: steps.need-latest.outputs.needed == 'true'
        id: restore-latest
        continue-on-error: true
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: .relay-cache/state.tgz.gpg
          key: ${{steps.plan.outputs.key_latest}}
          fail-on-cache-miss: true
      - name: Authenticate and selectively scan latest
        if: steps.need-latest.outputs.needed == 'true'
        env:
          G11_PRIVATE_REPO_TOKEN: ${{secrets.G11_PRIVATE_REPO_TOKEN}}
          EXPECTED_KEY: ${{steps.plan.outputs.key_latest}}
          RESTORED_KEY: ${{steps.restore-latest.outputs.cache-matched-key}}
        shell: bash
        run: |
          set -euo pipefail
          if test "${EXPECTED_KEY}" != "${RESTORED_KEY}" || ! test -f .relay-cache/state.tgz.gpg; then
            env -u G11_PRIVATE_REPO_TOKEN python3 scripts/mukiken_saved_input_audit_20261125.py failed --label latest
          else
            exec 3<<<"${G11_PRIVATE_REPO_TOKEN}"
            if (exec 3<&-; env -u G11_PRIVATE_REPO_TOKEN python3 scripts/mukiken_saved_input_audit_20261125.py cipher --label latest) && gpg --batch --yes --pinentry-mode loopback --passphrase-fd 3 --decrypt .relay-cache/state.tgz.gpg 2>.audit/gpg-status.txt | (exec 3<&-; env -u G11_PRIVATE_REPO_TOKEN python3 scripts/mukiken_saved_input_audit_20261125.py scan --label latest); then
              exec 3<&-
              env -u G11_PRIVATE_REPO_TOKEN python3 scripts/mukiken_saved_input_audit_20261125.py commit --label latest
            else
              exec 3<&-
              env -u G11_PRIVATE_REPO_TOKEN python3 scripts/mukiken_saved_input_audit_20261125.py failed --label latest
            fi
          fi
          rm -f .relay-cache/state.tgz.gpg .audit/gpg-status.txt .audit/cipher_failure.json
      - name: Check whether 20261113 is still needed
        id: need-20261113
        run: python3 scripts/mukiken_saved_input_audit_20261125.py needed --label 20261113
