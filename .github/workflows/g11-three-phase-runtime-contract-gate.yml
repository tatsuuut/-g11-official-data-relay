name: G11 three-phase runtime contract gate

on:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/g11-free-runner.yml"
      - ".github/workflows/g11-explicit-night-dispatcher.yml"
      - ".github/workflows/g11-three-phase-runtime-contract-gate.yml"
      - "scripts/audit_public_surface.py"
      - "scripts/audit_three_phase_runtime_contract.py"
  push:
    branches:
      - main
      - fix/night-wait-publication-20260925
    paths:
      - ".github/workflows/g11-free-runner.yml"
      - ".github/workflows/g11-explicit-night-dispatcher.yml"
      - ".github/workflows/g11-three-phase-runtime-contract-gate.yml"
      - "scripts/audit_public_surface.py"
      - "scripts/audit_three_phase_runtime_contract.py"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: g11-three-phase-runtime-contract-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contract-gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout public relay
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 1

      - name: Audit public surface before private checkout
        run: python3 scripts/audit_public_surface.py

      - name: Checkout private G11 main
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: tatsuuut/boat-brain-lab
          ref: main
          token: ${{ secrets.G11_PRIVATE_REPO_TOKEN }}
          path: .g11-private
          fetch-depth: 1

      - name: Install audit dependencies
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check --no-input 'lxml==6.1.1' 'catboost==1.2.8'
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.7

      - name: Lint runtime workflows
        run: |
          set -euo pipefail
          "$(go env GOPATH)/bin/actionlint" \
            .github/workflows/g11-free-runner.yml \
            .github/workflows/g11-explicit-night-dispatcher.yml \
            .github/workflows/g11-three-phase-runtime-contract-gate.yml

      - name: Audit three runtime phases
        run: python3 scripts/audit_three_phase_runtime_contract.py --private-root .g11-private

      - name: Run bounded private regression
        working-directory: .g11-private
        run: |
          set -euo pipefail
          for module in \
            g11.relay.test_v1 \
            g11.relay.test_night_transport_finance_v1 \
            g11.wild_pack.v1.test_runtime_orchestrator_v1 \
            g11.growth_p3.v1_1.test_current_runtime_v1
          do
            python3 -m unittest -v "${module}"
          done

      - name: Gate summary
        run: |
          echo 'G11_THREE_PHASE_GATE=STATIC_CONTRACT_AND_BOUNDED_REGRESSION_PASS'
          echo 'G11_LIVE_ACQUISITION_PUBLICATION_UI=NOT_TESTED_BY_THIS_GATE'
          echo 'MERGE_POLICY=DO_NOT_MERGE_RUNTIME_CHANGES_UNLESS_THIS_GATE_PASSES'

  prepare-night-public-candidate:
    if: github.event_name == 'push' && github.ref == 'refs/heads/fix/night-wait-publication-20260925' && github.repository == 'tatsuuut/-g11-official-data-relay'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      TZ: Asia/Tokyo
    steps:
      - name: Checkout public candidate only
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          persist-credentials: true
      - name: Verify public allowlist
        run: python3 scripts/audit_public_surface.py
      - name: Prepare previously tested public NIGHT guards only
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          p=Path('.github/workflows/g11-free-runner.yml')
          b=p.read_bytes()
          if hashlib.sha1(f'blob {len(b)}\0'.encode()+b).hexdigest() != '7f68bd1980f1ae580a49899d02e13a5a3cd6dc62':
              raise SystemExit('REFUSED_UNREVIEWED_RUNNER')
          s=b.decode()
          def one(old,new):
              global s
              if s.count(old)!=1: raise SystemExit('REFUSED_RUNNER_ANCHOR:'+repr(old[:70]))
              s=s.replace(old,new,1)
          one('''          # A same-day rescue NIGHT is intentionally nonresearch. It can attach
          ''','''          # Official-result waiting is checkpoint-only, not completed NIGHT.
                    if [ -f ../.relay-output/result.json ] && \\
                       jq -e --arg day "${OPERATIONAL_DATE}" '
                         .STATUS == "NIGHT_WAITING_OFFICIAL_RESULTS"
                         and .PHASE == "NIGHT" and .OPERATIONAL_DATE_JST == $day
                         and .FEED_EMITTED == false
                       ' ../.relay-output/result.json >/dev/null 2>&1; then
                      echo 'G11_NIGHT_RESEARCH_LEDGER_CHECK=DEFER_OFFICIAL_RESULTS'
                      exit 0
                    fi
                    # A same-day rescue NIGHT is intentionally nonresearch. It can attach
          ''')
          one('''            and .counts.results == .counts.formal
          ''','''            and .counts.races > 0
                      and .counts.results == .counts.races
                      and .counts.races == (.races | length)
          ''')
          one('''          ' .relay-output/readback.json >/dev/null

                - name: Verify existing immutable night readback
          ''','''          ' .relay-output/readback.json >/dev/null
                    if [ "__RUNTIME_NIGHT_PHASE__" = "night" ]; then
                      python3 scripts/audit_three_phase_runtime_contract.py \\
                        --night-ready .relay-output/readback.json --day "${OPERATIONAL_DATE}"
                    fi

                - name: Verify existing immutable night readback
          ''')
          one('''          ' .relay-output/readback-existing-night.json >/dev/null

                - name: Keep the predeadline relay alive between delayed cron starts
          ''','''          ' .relay-output/readback-existing-night.json >/dev/null
                    python3 scripts/audit_three_phase_runtime_contract.py \\
                      --night-ready .relay-output/readback-existing-night.json --day "${OPERATIONAL_DATE}"

                - name: Keep the predeadline relay alive between delayed cron starts
          ''')
          s=s.replace('__RUNTIME_NIGHT_PHASE__', '$' + '{{ steps.due.outputs.phase }}')
          p.write_text(s)
          gate=Path('.github/workflows/g11-three-phase-runtime-contract-gate.yml')
          s=gate.read_text().split('\n  prepare-night-public-candidate:\n',1)[0].rstrip()+'\n'
          s=s.replace('      - fix/night-wait-publication-20260925\n','')
          gate.write_text(s)
          print('NIGHT_PUBLIC_CANDIDATE=PREPARED_PRIVATE_MAIN_UNCHANGED')
          PY
      - name: Test final public files without official acquisition or sync
        run: |
          set -euo pipefail
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.7
          "$(go env GOPATH)/bin/actionlint" .github/workflows/g11-free-runner.yml .github/workflows/g11-explicit-night-dispatcher.yml .github/workflows/g11-three-phase-runtime-contract-gate.yml
          python3 scripts/audit_public_surface.py
          python3 scripts/audit_three_phase_runtime_contract.py
          git diff --check
          git diff --stat
      - name: Commit tested public candidate only
        run: |
          set -euo pipefail
          test "${GITHUB_REF_NAME}" = 'fix/night-wait-publication-20260925'
          remote="$(git ls-remote origin "refs/heads/${GITHUB_REF_NAME}" | cut -f1)"
          test "${remote}" = "${GITHUB_SHA}"
          git add .github/workflows/g11-free-runner.yml .github/workflows/g11-three-phase-runtime-contract-gate.yml
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'NIGHT: checkpoint official waits and require complete publication readback'
          git push origin "HEAD:refs/heads/${GITHUB_REF_NAME}"
          echo "NIGHT_PUBLIC_TESTED_CANDIDATE_SHA=$(git rev-parse HEAD)"
          echo 'NIGHT_ACQUISITION_CORE=NOT_DEPLOYED_PRIVATE_CI_WRITE_BLOCKED'
          echo 'NIGHT_PRODUCTION_CHANGED=NO'
