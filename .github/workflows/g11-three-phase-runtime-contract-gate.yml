name: runtime contract gate

on:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/g11-free-runner.yml"
      - ".github/workflows/g11-explicit-night-dispatcher.yml"
      - ".github/workflows/g11-three-phase-runtime-contract-gate.yml"
      - "scripts/audit_public_surface.py"
      - "scripts/audit_three_phase_runtime_contract.py"
  push:
    branches:
      - main
      - codex/g11-morning-state-audit-20261018
    paths:
      - ".github/workflows/g11-free-runner.yml"
      - ".github/workflows/g11-explicit-night-dispatcher.yml"
      - ".github/workflows/g11-three-phase-runtime-contract-gate.yml"
      - "scripts/audit_public_surface.py"
      - "scripts/audit_three_phase_runtime_contract.py"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: g11-three-phase-runtime-contract-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contract-gate:
    name: contract
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout public relay
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 1

      - name: Audit public surface before private checkout
        run: python3 scripts/audit_public_surface.py

      - name: Checkout private G11 main
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: ${{ secrets.PRIVATE_SOURCE_REPO }}
          ref: main
          token: ${{ secrets.G11_PRIVATE_REPO_TOKEN }}
          path: .g11-private
          fetch-depth: 1

      - name: Install audit dependencies
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check --no-input 'lxml==6.1.1' 'catboost==1.2.8'
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.7

      - name: Lint runtime workflows
        run: |
          set -euo pipefail
          "$(go env GOPATH)/bin/actionlint" \
            .github/workflows/g11-free-runner.yml \
            .github/workflows/g11-explicit-night-dispatcher.yml \
            .github/workflows/g11-three-phase-runtime-contract-gate.yml

      - name: Audit three runtime phases
        run: python3 scripts/audit_three_phase_runtime_contract.py --private-root .g11-private

      - name: Run bounded private regression
        working-directory: .g11-private
        run: |
          set -euo pipefail
          for module in \
            g11.relay.test_v1 \
            g11.relay.test_bootstrap_v1 \
            g11.relay.test_predeadline_nowait_v1 \
            g11.relay.test_last_race_night_v1 \
            g11.relay.test_night_transport_finance_v1 \
            g11.wild_pack.v1.test_runtime_orchestrator_v1 \
            g11.growth_p3.v1_1.test_current_runtime_v1
          do
            python3 -m unittest -v "${module}"
          done

      - name: Gate summary
        run: |
          echo 'G11_THREE_PHASE_GATE=STATIC_CONTRACT_AND_BOUNDED_REGRESSION_PASS'
          echo 'G11_LIVE_ACQUISITION_PUBLICATION_UI=NOT_TESTED_BY_THIS_GATE'
          echo 'MERGE_POLICY=DO_NOT_MERGE_RUNTIME_CHANGES_UNLESS_THIS_GATE_PASSES'

  saved-state-audit:
    if: github.ref == 'refs/heads/codex/g11-morning-state-audit-20261018'
    needs: contract-gate
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Restore exact existing encrypted checkpoint read only
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: .relay-cache/state.tgz.gpg
          key: g11-state-v4-published-2026-10-18-39077934262
          fail-on-cache-miss: true
      - name: Inspect saved state without prediction imports or writes
        env:
          STATE_PASSPHRASE: ${{ secrets.G11_PRIVATE_REPO_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          exec 3<<<"$STATE_PASSPHRASE"
          gpg --batch --yes --pinentry-mode loopback --passphrase-fd 3 --decrypt --output "$RUNNER_TEMP/audit-state.tgz" .relay-cache/state.tgz.gpg
          exec 3<&-
          python3 - <<'PY'
          import hashlib,json,os,tarfile
          from pathlib import PurePosixPath
          with tarfile.open(os.environ['RUNNER_TEMP']+'/audit-state.tgz','r:gz') as tf:
              members=tf.getmembers()
              assert all(not PurePosixPath(m.name).is_absolute() and '..' not in PurePosixPath(m.name).parts and not m.issym() and not m.islnk() for m in members)
              files={m.name.removeprefix('./'):m for m in members if m.isfile()}
              def data(name):
                  return tf.extractfile(files[name]).read() if name in files else None
              def obj(name):
                  raw=data(name)
                  return json.loads(raw) if raw is not None else {}
              meta=obj('relay-state.json')
              authority=obj('daily-runtime/2026-10-18/authority.json')
              morning=[p for p in files if p.startswith('store/snapshots/morning/') and p.endswith('.json')]
              manifests=[p for p in files if '/2026-10-18/' in p and any(x in p for x in ['morning-predictions','bet-upstream','position-oos-admission'])]
              bind=[p for p in files if p.startswith('daily-runtime/2026-10-18/bindings/MORNING/') and p.endswith('.json')]
              raw=data('store/responses/schedule-b-20261018/response.bin')
              receipt=obj('store/responses/schedule-b-20261018/receipt.json')
              print('G11_SAVED_MORNING_AUDIT='+json.dumps({
                  'day':meta.get('OPERATIONAL_DATE_JST'),'morning_complete':meta.get('MORNING_COMPLETE'),
                  'authority_present':bool(authority),'authority_sha256':authority.get('authority_sha256'),
                  'runtime_source_sha':authority.get('runtime_source_sha'),
                  'morning_snapshot_count':len(morning),'independent_prediction_manifest_count':len(manifests),
                  'morning_binding_count':len(bind),'morning_binding_executed':[obj(p).get('executed') for p in bind],
                  'official_input_present':'store/snapshots/morning/official-day-input.json' in files,
                  'rescue_feed_present':'rescue/feed.json' in files,
                  'saved_b_archive_sha256':hashlib.sha256(raw).hexdigest() if raw else None,
                  'saved_b_receipt_present':bool(receipt),
                  'production_state_writes':0,'prediction_calls':0
              },sort_keys=True))

              cert=obj('rescue/boundary.json')
              feed=obj('rescue/feed.json')
              evidence=obj('rescue/generation-evidence.json')
              rows=[r for r in feed.get('races',[]) if r.get('same_day_rescue_lock')]
              from datetime import datetime
              canonical={p.removeprefix('store/snapshots/'):hashlib.sha256(data(p)).hexdigest() for p in files if p.startswith('store/snapshots/')}
              models=authority.get('model_files',{})
              model_match=bool(models) and cert.get('model_files')==models and all(hashlib.sha256(data('store/'+p) or b'').hexdigest()==h and hashlib.sha256(data('rescue/store/'+p) or b'').hexdigest()==h for p,h in models.items())
              timely=all(max(datetime.fromisoformat(r['same_day_rescue_lock'][k]) for k in ('p3_locked_at_jst','v4_locked_at_jst')) < datetime.fromisoformat(r['deadline_jst']) for r in rows)
              receipt=obj('rescue/delivery.json')
              assert cert and feed and rows and model_match and timely
              assert canonical==cert['preserved_canonical_lock_files']
              assert authority['authority_sha256']=='74e0837747328847c7059d499be7197b2ba07a9a92b10f1940707c800d8c4fe8'
              assert cert['source_delta']==['g11/canonical/official_pipeline.py']
              assert cert['canonical_morning_promoted'] is False and cert['same_day_results_used'] is False
              assert receipt.get('status')=='PASS' and receipt.get('site_get_readback')=='PASS'
              print('G11_POST_RECOVERY_STATE_AUDIT='+json.dumps({
                  'status':'PASS','canonical_morning_snapshot_count':len(morning),
                  'canonical_snapshots_unchanged':True,'parent_authority_unchanged':True,
                  'models_unchanged':model_match,'source_delta':cert['source_delta'],
                  'rescue_source_sha':cert['runtime_source_sha'],
                  'rescued_races':len(rows),'all_saves_before_deadline':timely,
                  'first_p3_save':min(r['same_day_rescue_lock']['p3_locked_at_jst'] for r in rows),
                  'last_p3_save':max(r['same_day_rescue_lock']['p3_locked_at_jst'] for r in rows),
                  'first_v4_save':min(r['same_day_rescue_lock']['v4_locked_at_jst'] for r in rows),
                  'last_v4_save':max(r['same_day_rescue_lock']['v4_locked_at_jst'] for r in rows),
                  'first_deadline':min(r['deadline_jst'] for r in rows),
                  'morning_authority':feed.get('same_day_rescue',{}).get('morning_authority'),
                  'wild4_shadow':feed.get('same_day_rescue',{}).get('wild4_shadow'),
                  'generation_failure_count':len(evidence.get('failures',[])),
                  'canonical_morning_promoted':False,'same_day_results_used':False,
                  'delivery':receipt,'production_state_writes':0,'prediction_calls':0
              },sort_keys=True))
          PY
