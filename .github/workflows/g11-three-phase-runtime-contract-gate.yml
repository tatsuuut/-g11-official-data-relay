name: runtime contract gate

on:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/**"
      - ".github/actions/**"
      - "scripts/**"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/**"
      - ".github/actions/**"
      - "scripts/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: g11-three-phase-runtime-contract-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contract-gate:
    name: contract
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout public relay
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 1

      - name: Audit public surface before private checkout
        run: python3 scripts/audit_public_surface.py

      - name: Verify rescue transport with distinct stored and display responses
        run: python3 -m unittest discover -s scripts -p test_rescue_transport_contract_v1.py -q

      - name: Verify saved notification input transport
        run: python3 -m unittest discover -s scripts -p test_selective_alert_input_v1.py -q

      - name: Verify C1 saved-record diagnostics
        run: python3 -m unittest discover -s scripts -p test_verify_v53_readback.py -q

      - name: Checkout private G11 main
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: ${{ secrets.PRIVATE_SOURCE_REPO }}
          ref: main
          token: ${{ secrets.G11_PRIVATE_REPO_TOKEN }}
          path: .g11-private
          fetch-depth: 1

      - name: Install audit dependencies
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check --no-input 'lxml==6.1.1' 'catboost==1.2.8'
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.7

      - name: Lint runtime workflows
        run: |
          set -euo pipefail
          "$(go env GOPATH)/bin/actionlint" \
            .github/workflows/g11-free-runner.yml \
            .github/workflows/g11-explicit-night-dispatcher.yml \
            .github/workflows/g11-three-phase-runtime-contract-gate.yml

      - name: Audit three runtime phases
        run: python3 scripts/audit_three_phase_runtime_contract.py --private-root .g11-private

      - name: Verify one-race input isolation through saved morning admission
        env:
          PYTHONPATH: .g11-private:scripts
        run: python3 -m unittest discover -s scripts -p test_morning_race_isolation_v1.py -v

      - name: Verify bounded content retry with the reviewed collector
        run: python3 -m unittest discover -s scripts -p test_predeadline_content_retry_v1.py -v

      - name: Run bounded private regression
        working-directory: .g11-private
        run: |
          set -euo pipefail
          for module in \
            g11.relay.test_v1 \
            g11.relay.test_bootstrap_v1 \
            g11.relay.test_predeadline_nowait_v1 \
            g11.relay.test_last_race_night_v1 \
            g11.relay.test_night_transport_finance_v1 \
            g11.wild_pack.v1.test_runtime_orchestrator_v1 \
            g11.growth_p3.v1_1.test_current_runtime_v1
          do
            python3 -m unittest -v "${module}"
          done
          python3 -m unittest discover -s ../scripts -p test_predeadline_race_isolation_v1.py -q

      - name: Verify isolated continuation and delivery guards
        env:
          PYTHONPATH: .g11-private
        run: |
          python3 -m unittest discover -s scripts -p test_daily_predeadline_authority_recovery_v1.py -q
          python3 -m unittest discover -s scripts -p test_predeadline_watchdog_v1.py -q
          python3 -m unittest discover -s scripts -p test_daily_runtime_delivery_v1.py -q
          python3 -m unittest discover -s scripts -p test_critical_saved_publication_v1.py -q

      - name: Checkout pinned rescue settlement source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: ${{ secrets.PRIVATE_SOURCE_REPO }}
          ref: 4cccd89537ea98fc41ddbe55ff204ac7c0f6c02e
          token: ${{ secrets.G11_PRIVATE_REPO_TOKEN }}
          path: .g11-rescue-settlement
          persist-credentials: false

      - name: Verify rescue joins and unchanged canonical settlement
        working-directory: .g11-rescue-settlement
        run: >-
          python3 -m unittest
          g11.wild_pack.v1.test_wild4_rescue_settlement_v1
          g11.wild_pack.v1.test_wild4_official_settlement_v1

      - name: Checkout pinned isolated WILD4 guard
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: 1dc572db2bf47087ea1ef2549687eae667600440
          path: .g11-isolated-guard
          persist-credentials: false

      - name: Verify early WILD4 checkpoint handoff and protected logic
        env:
          WILD4_WORKFLOW_PATH: .g11-isolated-guard/.github/workflows/g11-wild4-shadow-lock-only.yml
        run: |
          "$(go env GOPATH)/bin/actionlint" .github/workflows/g11-morning-odds-footprint-4bet-shadow-v1.yml "$WILD4_WORKFLOW_PATH"
          python3 -m unittest discover -s scripts -p test_wild4_checkpoint_handoff_v1.py -v

      - name: Verify isolated future boundary uses the tested contract
        run: |
          python3 - <<'PYGUARD'
          import ast,pathlib,sys,unittest
          sys.path.insert(0,'scripts')
          import test_daily_predeadline_authority_recovery_v1 as t
          lines=pathlib.Path('.g11-isolated-guard/.github/workflows/g11-wild4-shadow-lock-only.yml').read_text().splitlines()
          start=next(i for i,s in enumerate(lines) if s.strip().startswith('def validate_future_boundary('))
          end=next(i for i in range(start+1,len(lines)) if lines[i].startswith('          if '))
          code='\n'.join(s[10:] for s in lines[start:end])
          scope=dict(vars(t.live));exec(compile(ast.parse(code),'<pinned-reusable-guard>','exec'),scope)
          with t.patch.object(t.live,'validate_future_boundary',scope['validate_future_boundary']):
              result=unittest.TextTestRunner().run(unittest.defaultTestLoader.loadTestsFromTestCase(t.FuturePinnedRescueTests))
          if not result.wasSuccessful(): raise SystemExit(1)
          PYGUARD

      - name: Gate summary
        run: |
          echo 'G11_THREE_PHASE_GATE=STATIC_CONTRACT_AND_BOUNDED_REGRESSION_PASS'
          echo 'G11_LIVE_ACQUISITION_PUBLICATION_UI=NOT_TESTED_BY_THIS_GATE'
          echo 'MERGE_POLICY=DO_NOT_MERGE_RUNTIME_CHANGES_UNLESS_THIS_GATE_PASSES'







      - name: Checkout reviewed retained LOCK guard
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: 2e783dbc904244990f1a85c7fe598d90a408d763
          path: .g11-retained-guard
          persist-credentials: false

      - name: Verify retained WILD4 locks with advanced rolling input
        run: |
          python3 -m unittest discover -s scripts -p test_wild4_retained_lock_v1.py -v
        env:
          WILD4_WORKFLOW_PATH: .g11-retained-guard/.github/workflows/g11-wild4-shadow-lock-only.yml
