name: runtime contract gate

on:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/**"
      - ".github/actions/**"
      - "scripts/**"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/**"
      - ".github/actions/**"
      - "scripts/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: g11-three-phase-runtime-contract-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  public-runtime-preparation:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Verify complete restoration and public cache failure boundaries
        run: python3 -m unittest discover -s scripts -p test_runtime_preparation_v1.py -v
      - name: Prepare public packages on the real runner
        uses: ./.github/actions/g11-public-python
      - name: Require a verified second preparation without pip
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/public_python_runtime_v1.py prepare --profile runtime > "${RUNNER_TEMP}/public-python-repeat.txt"
          cat "${RUNNER_TEMP}/public-python-repeat.txt"
          grep -q '^G11_PUBLIC_PYTHON_ACTION=REUSED_VERIFIED$' "${RUNNER_TEMP}/public-python-repeat.txt"
          python3 - <<'PY'
          import importlib.metadata as m
          from catboost import CatBoostClassifier
          from lxml import etree
          assert m.version('catboost') == '1.2.8' and m.version('lxml') == '6.1.1'
          assert etree.fromstring(b'<saved/>').tag == 'saved'
          print('G11_PUBLIC_RUNTIME_IMPORTS=PASS')
          PY
  nov7-saved-morning-audit:
    if: github.event_name == 'pull_request' && github.head_ref == 'codex/nov7-yotsuba-time'
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: .relay-cache/state.tgz.gpg
          key: g11-state-v4-published-2026-11-07-42298623458
          fail-on-cache-miss: true
      - name: Extract a read-only audit copy of saved morning evidence
        env:
          G11_PRIVATE_REPO_TOKEN: ${{secrets.G11_PRIVATE_REPO_TOKEN}}
        run: |
          set -euo pipefail
          exec 3<<<"${G11_PRIVATE_REPO_TOKEN}"
          gpg --batch --yes --pinentry-mode loopback --passphrase-fd 3 --decrypt \
            --output "${RUNNER_TEMP}/morning-audit.tgz" .relay-cache/state.tgz.gpg
          exec 3<&-
          python3 - <<'PY'
          import os,pathlib,tarfile
          root=pathlib.Path(os.environ['RUNNER_TEMP'])/'morning-audit'
          root.mkdir()
          with tarfile.open(pathlib.Path(os.environ['RUNNER_TEMP'])/'morning-audit.tgz','r:gz') as a:
              assert all(not pathlib.PurePosixPath(m.name).is_absolute() and '..' not in pathlib.PurePosixPath(m.name).parts and not m.issym() and not m.islnk() for m in a.getmembers())
              a.extractall(root,filter='data')
          PY
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: ${{secrets.PRIVATE_SOURCE_REPO}}
          ref: 7433740d794afc7e221bf0c75be9e3240c3c33a9
          token: ${{secrets.G11_PRIVATE_REPO_TOKEN}}
          path: .g11-private
          persist-credentials: false
      - name: Verify frozen models, daily history and saved rejection reasons
        env:
          PYTHONPATH: .g11-private
        run: |
          python3 - "${RUNNER_TEMP}/morning-audit" <<'PY'
          import hashlib,json,pathlib,sys
          root=pathlib.Path(sys.argv[1]);store=root/'store';day='2026-11-07'
          from g11.relay import daily_runtime_authority_v1 as daily
          daily.verify_runtime(root,day,pathlib.Path('.g11-private').resolve())
          daily.verify_locks(root,day,'MORNING',exact=True)
          before={str(p):hashlib.sha256(p.read_bytes()).hexdigest() for p in (store/'snapshots/morning').glob('*.json')}
          sys.path.insert(0,'scripts')
          from rescue_night_result_parser_v1 import official_input_compatibility
          from g11.canonical import official_pipeline as official
          saved=official.OfficialArtifactStore(store).load_verified_snapshot('morning','official-day-input')
          missing=['20261107-02-03','20261107-02-07','20261107-10-01','20261107-10-07','20261107-11-03','20261107-11-07','20261107-23-01','20261107-23-04','20261107-23-08','20261107-23-09']
          with official_input_compatibility():
           for key in missing:
            try:
             invocation=official.FORMAL_ADAPTER.prepare_canonical_official_morning_invocation(saved,key)
             official.FORMAL_ENGINE.run_canonical_morning_prediction(invocation,saved['SNAPSHOT_SHA256'],key)
             print('ISOLATED_PRODUCER_DIAGNOSIS',key,'PASS')
            except Exception as exc:
             print('ISOLATED_PRODUCER_DIAGNOSIS',key,type(exc).__name__,str(exc))
          after={str(p):hashlib.sha256(p.read_bytes()).hexdigest() for p in (store/'snapshots/morning').glob('*.json')}
          assert before==after
          print('SAVED_LOCKS_UNCHANGED',len(after),'PUBLICATION',False)
          PY
  saved-rescue-publication-audit:
    if: github.event_name == 'pull_request' && github.head_ref == 'codex/nov6-saved-rescue-publication'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: .relay-cache/state.tgz.gpg
          key: g11-state-v4-published-2026-11-06-42135754958
          fail-on-cache-miss: true
      - name: Prepare an isolated saved-feed copy
        env:
          G11_PRIVATE_REPO_TOKEN: ${{secrets.G11_PRIVATE_REPO_TOKEN}}
        run: |
          set -euo pipefail
          exec 3<<<"${G11_PRIVATE_REPO_TOKEN}"
          gpg --batch --yes --pinentry-mode loopback --passphrase-fd 3 --decrypt \
            --output "${RUNNER_TEMP}/g11-saved-publication.tgz" .relay-cache/state.tgz.gpg
          python3 - <<'PY'
          import os,pathlib,tarfile
          root=pathlib.Path(os.environ['RUNNER_TEMP'])/'g11-saved-publication'
          root.mkdir()
          with tarfile.open(pathlib.Path(os.environ['RUNNER_TEMP'])/'g11-saved-publication.tgz','r:gz') as archive:
              assert all(not pathlib.PurePosixPath(m.name).is_absolute() and '..' not in pathlib.PurePosixPath(m.name).parts
                  and not m.issym() and not m.islnk() for m in archive.getmembers())
              archive.extractall(root,filter='data')
          PY
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: ${{secrets.PRIVATE_SOURCE_REPO}}
          ref: 40dd169569bd0bea8049d92e1b61d05da4d38839
          token: ${{secrets.G11_PRIVATE_REPO_TOKEN}}
          path: .g11-frozen
          persist-credentials: false
      - name: Install pinned test dependencies
        run: python3 -m pip install --disable-pip-version-check --no-input 'lxml==6.1.1' 'catboost==1.2.8'
      - name: Verify byte-identical replay and projected summary without publication
        working-directory: .g11-frozen
        env:
          PYTHONPATH: .:../scripts
        run: |
          python3 ../scripts/audit_saved_rescue_publication_v1.py \
            --state "${RUNNER_TEMP}/g11-saved-publication" \
            --output "${RUNNER_TEMP}/g11-saved-publication-output.json"
  saved-receipt-audit:
    if: github.event_name == 'pull_request' && github.head_ref == 'codex/nov6-saved-receipt-audit'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: .relay-cache/state.tgz.gpg
          key: g11-state-v4-published-2026-11-06-42130300335
          fail-on-cache-miss: true
      - name: Read only the saved official input provenance
        env:
          G11_PRIVATE_REPO_TOKEN: ${{secrets.G11_PRIVATE_REPO_TOKEN}}
        run: |
          set -euo pipefail
          archive="${RUNNER_TEMP}/g11-receipt-audit.tgz"
          exec 3<<<"${G11_PRIVATE_REPO_TOKEN}"
          gpg --batch --yes --pinentry-mode loopback --passphrase-fd 3 \
            --decrypt --output "${archive}" .relay-cache/state.tgz.gpg
          exec 3<&-
          python3 - "${archive}" <<'PY'
          import hashlib,inspect,json,pathlib,sys,tarfile
          sys.path.insert(0,'scripts')
          from morning_source_receipt_limit_v1 import receipt_limit
          from repair_saved_morning_receipts_v1 import verify_saved_provenance
          with tarfile.open(sys.argv[1],'r:gz') as archive:
              matches=[m for m in archive.getmembers() if m.name.removeprefix('./') == 'rescue/store/snapshots/morning/official-day-input.json']
              assert len(matches)==1 and matches[0].isfile()
              raw=archive.extractfile(matches[0]).read()
          snapshot=json.loads(raw)
          assert snapshot['PAYLOAD']['OPERATIONAL_DATE_JST']=='2026-11-06'
          reasons=[]
          def trace(frame,event,arg):
              if frame.f_code is receipt_limit.__code__ and event=='return':
                  reasons.append({'limit':arg,'line':frame.f_lineno,'source':frame.f_locals.get('source')})
              return trace
          sys.settrace(trace)
          limit=receipt_limit({'SNAPSHOT':snapshot})
          sys.settrace(None)
          verify_saved_provenance({'SNAPSHOT':snapshot,'SNAPSHOT_SHA256':hashlib.sha256(raw).hexdigest()})
          print(json.dumps({'saved_official_input_sha256':hashlib.sha256(raw).hexdigest(),
              'receipt_count':len(snapshot['SOURCE_RECEIPTS']),'scope':snapshot['PAYLOAD']['SCOPE'],
              'race_count':len(snapshot['PAYLOAD']['RACES']),'admission':reasons,
              'receipts':[{k:r.get(k) for k in ('SOURCE_ID','URL','FINAL_URL')} for r in snapshot['SOURCE_RECEIPTS']]},sort_keys=True))
          PY
      - name: Checkout the frozen source for an offline disposable-copy test
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: ${{secrets.PRIVATE_SOURCE_REPO}}
          ref: 40dd169569bd0bea8049d92e1b61d05da4d38839
          token: ${{secrets.G11_PRIVATE_REPO_TOKEN}}
          path: .g11-frozen
          persist-credentials: false
      - name: Install pinned test dependencies
        run: python3 -m pip install --disable-pip-version-check --no-input 'lxml==6.1.1' 'catboost==1.2.8'
      - name: Verify saved-input recovery on a disposable copy without publication
        working-directory: .g11-frozen
        env:
          PYTHONPATH: .:../scripts
        run: |
          python3 - <<'PY'
          import json,os,pathlib,sys,tarfile
          from unittest.mock import patch
          root=pathlib.Path(os.environ['RUNNER_TEMP'])/'g11-receipt-audit-copy'
          root.mkdir()
          with tarfile.open(pathlib.Path(os.environ['RUNNER_TEMP'])/'g11-receipt-audit.tgz','r:gz') as archive:
              members=archive.getmembers()
              assert all(not pathlib.PurePosixPath(m.name).is_absolute() and '..' not in pathlib.PurePosixPath(m.name).parts
                  and not m.issym() and not m.islnk() for m in members)
              archive.extractall(root,filter='data')
          from repair_saved_morning_receipts_v1 import SOURCE
          import rescue_night_result_parser_v1 as entry
          output=pathlib.Path(os.environ['RUNNER_TEMP'])/'g11-receipt-audit-feed.json'
          sys.argv=['test','--delayed-recovery','--date','2026-11-06','--state',str(root),
              '--source-sha',SOURCE,'--output',str(output),'--run-id',os.environ['GITHUB_RUN_ID']]
          with patch.dict(os.environ,{'GITHUB_EVENT_NAME':'workflow_dispatch'}):
              entry.run_relay()
          feed=json.loads(output.read_bytes())
          assert feed['SNAPSHOT_CLASS']=='SAME_DAY_RESCUE_BOUNDARY'
          assert feed['counts']['formal']==0 and feed['same_day_rescue']['research_eligible'] is False
          print(json.dumps({'OFFLINE_SAVED_INPUT_RECOVERY':'PASS',
              'saved':feed['same_day_rescue']['rescued_race_count'],'formal':0,'published':False},sort_keys=True))
          PY
  contract-gate:
    name: contract
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout public relay
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 1

      - name: Audit public surface before private checkout
        run: python3 scripts/audit_public_surface.py

      - name: Verify delayed schedules use the current execution phase
        run: |
          python3 -m unittest discover -s scripts -p test_scheduled_phase_routing.py -v
          python3 -m unittest discover -s scripts -p test_predeadline_dispatch_v1.py -v

      - name: Verify rescue transport with distinct stored and display responses
        run: python3 -m unittest discover -s scripts -p test_rescue_transport_contract_v1.py -q

      - name: Verify saved notification input transport
        run: python3 -m unittest discover -s scripts -p test_selective_alert_input_v1.py -q

      - name: Verify C1 saved-record diagnostics
        run: python3 -m unittest discover -s scripts -p test_verify_v53_readback.py -q

      - name: Verify UTF-8 NIGHT transport and original published LOCK result join
        run: python3 -m unittest discover -s scripts -p test_night_transport_utf8_v1.py -v

      - name: Checkout private G11 main
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: ${{ secrets.PRIVATE_SOURCE_REPO }}
          ref: main
          token: ${{ secrets.G11_PRIVATE_REPO_TOKEN }}
          path: .g11-private
          fetch-depth: 1

      - name: Install audit dependencies
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check --no-input 'lxml==6.1.1' 'catboost==1.2.8'
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.7

      - name: Lint runtime workflows
        run: |
          set -euo pipefail
          "$(go env GOPATH)/bin/actionlint" \
            .github/workflows/g11-free-runner.yml \
            .github/workflows/g11-explicit-night-dispatcher.yml \
            .github/workflows/g11-three-phase-runtime-contract-gate.yml

      - name: Verify complete encrypted checkpoints and LIVE publication priority
        env:
          G11_REQUIRE_ENCRYPTION_TESTS: "1"
        run: python3 -m unittest discover -s scripts -p test_predeadline_latency_v1.py -v

      - name: Verify November 8 short LIVE cycle and saved-only retries
        run: python3 -m unittest discover -s scripts -p test_predeadline_fast_lane_v1.py -v

      - name: Audit three runtime phases
        run: python3 scripts/audit_three_phase_runtime_contract.py --private-root .g11-private

      - name: Verify one-race input isolation through saved morning admission
        env:
          PYTHONPATH: .g11-private:scripts
        run: |
          python3 -m unittest discover -s scripts -p test_morning_source_receipt_limit_v1.py -v
          python3 -m unittest discover -s scripts -p test_morning_race_isolation_v1.py -v

      - name: Verify official application period without changing retained authority
        env:
          PYTHONPATH: .g11-private:scripts
          G11_REQUIRE_PRIVATE_PERIOD_TESTS: "1"
        run: python3 -m unittest discover -s scripts -p test_racer_period_source_v1.py -v

      - name: Verify bounded content retry with the reviewed collector
        run: python3 -m unittest discover -s scripts -p test_predeadline_content_retry_v1.py -v

      - name: Verify excluded rows cannot block the frozen critical lane
        env:
          PYTHONPATH: .g11-private:scripts
          G11_REQUIRE_PRIVATE_CRITICAL_TESTS: "1"
        run: python3 -m unittest discover -s scripts -p test_critical_formal_lock_scope_v1.py -v

      - name: Run bounded private regression
        working-directory: .g11-private
        run: |
          set -euo pipefail
          for module in \
            g11.relay.test_v1 \
            g11.relay.test_bootstrap_v1 \
            g11.relay.test_predeadline_nowait_v1 \
            g11.relay.test_last_race_night_v1 \
            g11.relay.test_night_transport_finance_v1 \
            g11.wild_pack.v1.test_runtime_orchestrator_v1 \
            g11.growth_p3.v1_1.test_current_runtime_v1
          do
            python3 -m unittest -v "${module}"
          done
          python3 -m unittest discover -s ../scripts -p test_predeadline_race_isolation_v1.py -q

      - name: Verify isolated continuation and delivery guards
        env:
          G11_PRIVATE_INTEGRATION_TESTS: "true"
          PYTHONPATH: .g11-private
        run: |
          python3 -m unittest discover -s scripts -p test_daily_predeadline_authority_recovery_v1.py -q
          python3 -m unittest discover -s scripts -p test_predeadline_watchdog_v1.py -q
          python3 -m unittest discover -s scripts -p test_daily_runtime_delivery_v1.py -q
          python3 -m unittest discover -s scripts -p test_critical_saved_publication_v1.py -q
          python3 -m unittest discover -s scripts -p test_saved_rescue_publication_v1.py -v

      - name: Checkout pinned rescue settlement source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: ${{ secrets.PRIVATE_SOURCE_REPO }}
          ref: 4cccd89537ea98fc41ddbe55ff204ac7c0f6c02e
          token: ${{ secrets.G11_PRIVATE_REPO_TOKEN }}
          path: .g11-rescue-settlement
          persist-credentials: false

      - name: Verify rescue joins and unchanged canonical settlement
        working-directory: .g11-rescue-settlement
        run: >-
          python3 -m unittest
          g11.wild_pack.v1.test_wild4_rescue_settlement_v1
          g11.wild_pack.v1.test_wild4_official_settlement_v1

      - name: Verify exact saved Nov 3 settlement republication
        env:
          WILD4_SETTLEMENT_SOURCE: .g11-rescue-settlement/g11/wild_pack/v1/wild4_official_settlement_v1.py
        run: python3 -m unittest discover -s scripts -p test_wild4_republish_20261103.py -v

      - name: Checkout pinned isolated WILD4 guard
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: 1dc572db2bf47087ea1ef2549687eae667600440
          path: .g11-isolated-guard
          persist-credentials: false

      - name: Verify early WILD4 checkpoint handoff and protected logic
        env:
          WILD4_WORKFLOW_PATH: .g11-isolated-guard/.github/workflows/g11-wild4-shadow-lock-only.yml
        run: |
          "$(go env GOPATH)/bin/actionlint" .github/workflows/g11-morning-odds-footprint-4bet-shadow-v1.yml "$WILD4_WORKFLOW_PATH"
          python3 -m unittest discover -s scripts -p test_wild4_checkpoint_handoff_v1.py -v

      - name: Verify isolated future boundary uses the tested contract
        run: |
          python3 - <<'PYGUARD'
          import ast,pathlib,sys,unittest
          sys.path.insert(0,'scripts')
          import test_daily_predeadline_authority_recovery_v1 as t
          lines=pathlib.Path('.g11-isolated-guard/.github/workflows/g11-wild4-shadow-lock-only.yml').read_text().splitlines()
          start=next(i for i,s in enumerate(lines) if s.strip().startswith('def validate_future_boundary('))
          end=next(i for i in range(start+1,len(lines)) if lines[i].startswith('          if '))
          code='\n'.join(s[10:] for s in lines[start:end])
          scope=dict(vars(t.live));exec(compile(ast.parse(code),'<pinned-reusable-guard>','exec'),scope)
          with t.patch.object(t.live,'validate_future_boundary',scope['validate_future_boundary']):
              result=unittest.TextTestRunner().run(unittest.defaultTestLoader.loadTestsFromTestCase(t.FuturePinnedRescueTests))
          if not result.wasSuccessful(): raise SystemExit(1)
          PYGUARD

      - name: Verify newest critical and full checkpoint selection
        run: python3 -m unittest discover -s scripts -p test_published_checkpoint_continuity_v1.py -v

      - name: Gate summary
        run: |
          echo 'G11_THREE_PHASE_GATE=STATIC_CONTRACT_AND_BOUNDED_REGRESSION_PASS'
          echo 'G11_LIVE_ACQUISITION_PUBLICATION_UI=NOT_TESTED_BY_THIS_GATE'
          echo 'MERGE_POLICY=DO_NOT_MERGE_RUNTIME_CHANGES_UNLESS_THIS_GATE_PASSES'







      - name: Checkout reviewed retained LOCK guard
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: 94e0de64725df5014addd6724cac7a3e5935480e
          path: .g11-retained-guard
          persist-credentials: false

      - name: Verify retained WILD4 locks with advanced rolling input
        run: |
          "$(go env GOPATH)/bin/actionlint" "$WILD4_WORKFLOW_PATH"
          python3 -m unittest discover -s scripts -p test_runtime_preparation_v1.py -v
          python3 -m unittest discover -s scripts -p test_wild4_retained_lock_v1.py -v
          python3 -m unittest discover -s scripts -p test_wild4_public_feed_budget_v1.py -v
          python3 -m unittest discover -s scripts -p test_wild4_night_recovery_date_v1.py -v
        env:
          WILD4_WORKFLOW_PATH: .g11-retained-guard/.github/workflows/g11-wild4-shadow-lock-only.yml


      - name: Checkout read-only retained public LOCK projection
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: ${{ secrets.PRIVATE_SOURCE_REPO }}
          ref: da010812e0d4e94738161b1fe810c2fa4e21a268
          token: ${{ secrets.G11_PRIVATE_REPO_TOKEN }}
          path: .g11-retained-projection
          persist-credentials: false

      - name: Verify immutable public LOCK settlement projection
        working-directory: .g11-retained-projection
        run: python3 -m unittest -v g11.wild_pack.v1.test_goripan_public_projection_v1

      - name: Verify original WILD4 ledger union and publication completion
        env:
          PYTHONPATH: .g11-retained-projection
          WILD4_WORKFLOW_PATH: .g11-retained-guard/.github/workflows/g11-wild4-shadow-lock-only.yml
          G11_REQUIRE_PRIVATE_WILD4_UNION: "1"
          WILD4_SETTLEMENT_SOURCE_PATH: .g11-rescue-settlement/g11/wild_pack/v1/wild4_official_settlement_v1.py
        run: python3 -m unittest discover -s scripts -p test_wild4_saved_ledger_union_v1.py -v

      - name: Checkout bounded 30x research projection
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: ${{ secrets.PRIVATE_SOURCE_REPO }}
          ref: f8c02e1d1068efec21b575f424026ffec73e6cfc
          token: ${{ secrets.G11_PRIVATE_REPO_TOKEN }}
          path: .g11-thirty-budget
          persist-credentials: false

      - name: Verify retained history and all three current research cohorts
        working-directory: .g11-thirty-budget/g11/canonical
        run: python3 -m unittest -v test_deme_discovery_thirty test_deme_discovery_sunburst test_deme_discovery_nikoshi test_deme_discovery_thirty_budget test_deme_discovery_yotsuba test_deme_discovery_standard_preview test_deme_discovery_v5 test_deme_discovery_adoptions


